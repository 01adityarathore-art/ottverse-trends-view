      table: ui.table({ id: 'title-picker', rows, pageSize: 25, chooser: false, csvName: 'titles', toolbar: '<span><b>Top 24</b> now</span>',
        columns: [{ id: 'rank', label: '#', num: true, cls: 'rk', render: it => esc(it.rank) }, { id: 'name', label: 'Title', render: it => titleCell(it) }, { id: 'heat', label: 'Heat', num: true, render: it => ui.heat(it.heat) },
          { id: 'platform', label: 'Streams on', value: it => it.platform && it.platform.name, render: platformOf }, { id: 'verdict', label: 'Verdict', value: it => vIndex(it.verdict), render: it => ui.verdict(it.verdict), csv: it => it.verdict && it.verdict.label }] }) });
  }
  OV.actions.focusSearch = () => { const q = document.getElementById('ov-q'); if (q) q.focus(); };
})();

</script>
<script>
/* ---- pages_trust.js ---- */
/* =====================================================================================================
   OTTVerse Trends — Stage 1 "Trust" components (docs/OTTVERSE_SPEC.md §7). Shared by Search Trends and Today.
   * ui.freshTag(tag) / ui.freshTags(tags, {row}) — "Search: 40 min ago", "Reading: through 2 Oct", "Volume: Sep
     estimate", "Rights: verified 3 Oct / unverified", "State feeds: 25 of 36 reporting" (grey · amber · red by age)
   * ui.rankHeader(header) — what a ranking is: source · geography · period
   * ui.newlyStrip(items) — "Newly detected": first seen, source, type, heat and what is still unknown
   * OV.trust.openRow(row) / OV.trust.openAction(action) — the row drawer: "Why this recommendation?" (every number
     in it is the row's own), the "Earlier" comparison (scan vs now; "Different measurement" instead of an arrow
     when two figures were measured differently), the stage, freshness and the observation / decision records.
   Every server string goes through esc / ui.*. The numbers come from the server's own display strings.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const T = OV.trust = {};
  const STAGE_TONE = { new: 'new', building: 'info', rising: 'up', sustained: 'teal', cooling: 'muted' };
  const TAG_TIP = {
    search: 'Age of the Google read this row was decided on (search limit 3 h; 30 min in a live match window)',
    reading: 'Wikipedia page views are complete through this day (Wikimedia publishes a day late) · reads, not viewing',
    volume: 'Google Ads monthly searches: the latest month Google has published (an estimate)',
    rights: 'Where it streams: Airtel’s partner pages, checked on this day · unverified = the calendar, a headline or the TV network only',
    states: 'State trending feeds that returned data in this read (an empty or failed feed is no data, not zero demand)',
    match: 'Fixture calendar',
  };

  // {short: true} (table rows): "2 h 55 min ago" → "2h 55m" with the full "Search: 2 h 55 min ago" on hover
  const shortTag = x => String(x || '').replace(/^[^:]{1,20}:\s*/, '').replace(/(\d+) h\b/g, '$1h').replace(/(\d+) min\b/g, '$1m').replace(/\s+ago$/, '');
  ui.freshTag = (t, o) => t ? `<span class="ov-ft ${esc(t.level || 'off')}${o && o.short ? ' sh' : ''}" data-tip="${esc([o && o.short ? t.text : '', TAG_TIP[t.kind] || '', t.at ? 'As of ' + fmt.ist(t.at) : '', arr(t.empty).length ? 'Empty feeds: ' + t.empty.map(fmt.geo).join(', ') : '', arr(t.failed).length ? 'Failed feeds: ' + t.failed.map(fmt.geo).join(', ') : ''].filter(Boolean).join('\n'))}"><i></i>${esc(o && o.short ? shortTag(t.text) : t.text)}</span>` : '';
  /** {row: true} = only the tags whose value is older than the table's main observation (compact rows). */
  ui.freshTags = (tags, o) => arr(tags).filter(t => !(o && o.row) || t.row).map(t => ui.freshTag(t, { short: !!(o && o.row) })).join('');
  /** The same row tags as coloured TEXT for a row's meta line ("search 2h 55m"): the honesty stays, the chip goes. */
  ui.freshText = tags => arr(tags).filter(t => t.row).map(t => `<span class="ov-ftx ${esc(t.level || 'off')}" data-tip="${esc([t.text, TAG_TIP[t.kind] || '', t.at ? 'As of ' + fmt.ist(t.at) : ''].filter(Boolean).join('\n'))}">${OV.icon('clock')}${esc(shortTag(t.text))}</span>`).join(' ');
  ui.rankHeader = (h, o) => {
    if (!h || !h.source) return '';
    const off = h.official ? ` <span class="sep">|</span> <b>${esc(h.official.source)}</b> · ${esc(h.official.geo)} · ${esc(h.official.period)}` : '';
    const per = String(h.period || '').replace(/^searches in the /i, '');
    return `<span class="ov-rh${o && o.block ? ' blk' : ''}" data-tip="${esc('What this ranking is: source · geography · period' + '\n' + h.source + ' · ' + h.geo + ' · ' + h.period + (h.measure ? '\nMeasure: ' + h.measure : '') + (h.detail ? '\nReads: ' + h.detail : ''))}">${OV.icon((o && o.icon) || 'search')}<b>${esc(h.source)}</b> · ${esc(h.geo)} · ${esc(per)}${off}</span>`;
  };
  ui.stageTag = s => s && s.stage ? ui.tag(s.label || s.stage, STAGE_TONE[s.stage] || 'muted', `Stage: ${s.label || s.stage}\n${s.why || ''}${isNum(s.n_obs) ? '\n' + s.n_obs + ' Google observation(s) in 48 h' : ''}${arr(s.families).length ? ' · families: ' + s.families.join(', ') : ''}`) : '';

  /* ---------------- Newly detected */
  ui.newlyStrip = (items, o) => {
    o = o || {};
    const L = arr(items).slice(0, o.max || 8);
    if (!L.length) return '';
    const chip = v => `<button class="ov-nd-i" ${v.key ? `data-act="trustNewly" data-arg="${esc(v.key)}"` : ''} data-tip="${esc([v.display_title || v.query || v.key, 'First seen ' + (v.first_seen ? fmt.ist(v.first_seen) : '—') + ' · ' + (v.source_word || 'Google RSS'), 'Heat ' + fmt.heat(v.heat) + ' (heat-v2, no growth figure)', 'Unknown: ' + arr(v.unknowns).join(', '), (v.verdict && v.verdict.label) ? 'Verdict on this read: ' + v.verdict.label : ''].filter(Boolean).join('\n'))}">`
      + `${ui.thumb(Object.assign({ name: v.display_title || v.title || v.query || v.key }, v), { size: 28, tip: false })}<span class="nm">${esc(v.display_title || v.title || v.query || v.key)}</span>`
      + `<span class="ht">${esc(fmt.heat(v.heat))}</span><span class="fs">${esc(v.first_seen_hhmm || '—')} · ${esc(v.source_word === 'Google RSS' || !v.source_word ? 'RSS' : v.source_word)}</span>`
      + `</button>`;
    return `<div class="ov-nd" role="list"><span class="ov-nd-h" data-tip="${esc(o.rule || 'First seen on Google’s free Trending-now RSS: fewer than 2 observations and no second source. Not ranked yet — they join the ranking at stage Building, on the same formula.')}">${OV.icon('bolt')}Newly detected <b>${esc(fmt.num(arr(items).length))}</b></span>${L.map(chip).join('')}${arr(items).length > L.length ? `<span class="ov-note1">+${esc(arr(items).length - L.length)}</span>` : ''}</div>`;
  };

  /* ---------------- the row drawer */
  const CMP = { up: ['▲', 'up', 'Up'], down: ['▼', 'down', 'Down'], same: ['=', 'muted', 'Same'], unknown: ['—', 'muted', 'Unknown'] };
  const cmpCell = c => c === 'different' ? `<span class="ov-dm" aria-label="Different measurement" data-tip="Different measurement: the two figures were measured differently (Google’s RSS gives no growth; another set of state feeds answered; the rank is among other rows) — no arrow">≠ diff.</span>`
    : CMP[c] ? `<span class="ov-d ${CMP[c][1]}">${CMP[c][0]}</span>` : ui.unk();
  function earlierHtml(d) {
    const e = d.earlier;
    if (!e) return '';
    const n = d.numbers || {}, disp = d.display || {};
    const rows = [
      ['Heat', e.heat_display, disp.heat, (e.cmp || {}).heat],
      ['Searches', e.volume_display, disp.volume, (e.cmp || {}).volume],
      ['Growth', e.growth_display, disp.growth, (e.cmp || {}).growth],
      ['States', isNum(e.breadth) ? `${e.breadth} of ${isNum(e.reporting) ? e.reporting : '—'}` : '—', isNum(n.breadth) ? `${n.breadth} of ${isNum(n.reporting) ? n.reporting : '—'}` : '—', (e.cmp || {}).breadth],
      ['Rank', isNum(e.rank) ? '#' + e.rank : '—', isNum(d.rank) ? '#' + d.rank : '—', (e.cmp || {}).rank],
      ['Verdict', (e.verdict || {}).label || '—', d.verdict_label || '—', null],
    ];
    return `<div class="ov-sub-h">Earlier${ui.tip('The ' + OV.scanWord() + '’s figures vs the newest read. An arrow only when both were measured the same way.')}</div>
      <table class="ov-mini ov-ear"><thead><tr><th></th><th>${esc('Scan #' + String(e.run || '').replace('scan:', '') + ' · ' + (e.hhmm || '—'))}</th><th>${esc((d.basis_word || 'Now') + ' · ' + (d.basis_hhmm || '—'))}</th><th></th></tr></thead><tbody>`
      + rows.map(r => `<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1] == null ? '—' : r[1])}</td><td class="n"><b>${esc(r[2] == null ? '—' : r[2])}</b></td><td>${r[3] ? cmpCell(r[3]) : ''}</td></tr>`).join('')
      + `</tbody></table>`;
  }
  function recordsSlot(d) {
    const ids = arr(d.obs_ids);
    return `<div class="ov-sub-h">Records${ui.tip('Every decision is stored with the formula version, the observation ids it used, when it was made and when it expires (pulse/observe.py)')}</div>
      <div class="ov-rec"><span>${esc(d.formula || '—')}</span><span>basis <b>${esc(d.basis || '—')}</b></span><span>${esc(fmt.num(ids.length))} observation${ids.length === 1 ? '' : 's'}${ids.length ? ' <small>#' + esc(ids.slice(0, 6).join(' #')) + (ids.length > 6 ? ' …' : '') + '</small>' : ''}</span><span>evaluated ${esc(fmt.time(d.evaluated_at))}</span><span>${d.expires_at ? (d.expired ? '<b class="ov-exp">expired</b> ' : 'valid to ') + esc(fmt.time(d.expires_at)) : 'no expiry'}</span></div>
      <div class="ov-rec-h" id="ov-rec-h"></div>`;
  }
  function whyList(d) {
    return `<ul class="ov-whyl">${arr(d.why).filter(w => w.k !== 'data').map(w => `<li class="${esc(w.k || '')}">${esc(w.text)}</li>`).join('')}</ul>`;
  }
  const whyData = d => arr(d.why).filter(w => w.k === 'data').map(w => w.text).join('\n');
  // "Not known" as chips: the subject visible, the sentence on hover
  const gapChips = gs => `<div class="ov-gaps">${gs.map(g => { const s = String(g || ''); const lab = s.includes(' — ') ? s.split(' — ')[0] : s.split(/[ ,(]/)[0]; return `<span class="ov-gap" data-tip="${esc(s)}">${esc(lab)}</span>`; }).join('')}</div>`;
  /* ---- "Why this recommendation?" as boxes (3 Oct design pass): one decision bar, five evidence tiles (each tile's
     sentence on hover), where-to-watch + not-known boxes, and a verdict timeline with the raw records folded away. */
  const whyOf = (d, k) => (arr(d.why).find(w => w.k === k) || {}).text || '';
  function evTile(o) {
    const was = o.was != null && o.was !== '' ? `<span class="wv-was" data-tip="${esc(o.wasTip || '')}">was ${esc(o.was)}${o.cmp === 'different' ? ' <i class="ne">≠</i>' : o.cmp && CMP[o.cmp] ? ` <i class="${CMP[o.cmp][1]}">${CMP[o.cmp][0]}</i>` : ''}</span>` : '<span class="wv-was">&nbsp;</span>';
    const bar = isNum(o.pct) ? `<span class="wv-bar"><i style="width:${Math.max(2, Math.min(100, o.pct))}%"></i>${isNum(o.mark) ? `<b style="left:${o.mark}%" data-tip="${esc(o.markTip || '')}"></b>` : ''}</span>` : '<span class="wv-bar none"></span>';
    return `<div class="wv-tile${o.unknown ? ' unk' : ''}" data-tip="${esc(o.tip || '')}"><span class="wv-l">${esc(o.label)}</span><span class="wv-v">${esc(o.value == null || o.value === '' ? '—' : o.value)}</span>${bar}${was}</div>`;
  }
  T.visualHtml = (it, o) => {
    o = o || {};
    const d = it.decision || {}, v = it.verdict || {}, n = d.numbers || {}, disp = d.display || {}, e = d.earlier || null, ec = (e && e.cmp) || {};
    const tags = arr(d.tags), tagOf = k => tags.find(t => t.kind === k);
    const since = e ? `scan ${e.hhmm || ''}` : '';
    // decision bar
    const valid = d.expires_at ? (d.expired ? ui.tag('Expired · ' + agoText(d.age_s || 0) + ' old', 'warn', 'The data behind this verdict is past its limit — re-check before acting') : `<span class="wv-chip" data-tip="${esc('Re-decided on every new read; this verdict expires at ' + fmt.ist(d.expires_at))}">${OV.icon('clock')}Valid to ${esc(fmt.time(d.expires_at))}</span>`) : '';
    const src = d.basis_word ? `<span class="wv-chip" data-tip="${esc(whyOf(d, 'data') || '')}">${OV.icon('search')}${esc(d.basis_word)} ${esc(d.basis_hhmm || '')}</span>` : '';
    const bar = `<div class="wv-bar-top">${ui.verdict(v, { lg: true, full: true })}${ui.stageTag(it.stage)}${d.confidence ? ui.tag(d.confidence[0].toUpperCase() + d.confidence.slice(1) + ' confidence', 'muted', 'High = two or more independent source families agree') : ''}<span class="sp"></span>${src}${valid}${it.key && !o.onTitle ? ui.btn('Title 360', { cls: 'sm', icon: 'title', go: ['title', { key: it.key }] }) : ''}</div>`;
    // evidence tiles
    const heat = isNum(n.heat) ? n.heat : null, rep = isNum(n.reporting) ? n.reporting : null;
    const demandTip = whyOf(d, 'demand');
    const tiles = [
      evTile({ label: 'Heat', value: disp.heat, pct: heat, mark: 60, markTip: 'Strong demand from 60', was: e && e.heat_display, cmp: ec.heat, wasTip: since, tip: demandTip }),
      evTile({ label: 'Searches', value: disp.volume, was: e && e.volume_display, cmp: ec.volume, wasTip: since, tip: 'Google’s search-volume bucket for the last 24 h (a lower bound)' }),
      evTile({ label: 'States', value: isNum(n.breadth) ? `${n.breadth}${rep ? '/' + rep : ''}` : null, pct: isNum(n.breadth) && rep ? n.breadth / rep * 100 : null, mark: rep ? 8 / rep * 100 : null, markTip: 'Wide from 8 states',
        was: e && isNum(e.breadth) ? `${e.breadth}${isNum(e.reporting) ? '/' + e.reporting : ''}` : null, cmp: ec.breadth, wasTip: since, tip: 'State trending feeds this search is on, of the feeds that reported' }),
      evTile({ label: 'Rank', value: isNum(d.rank) ? '#' + d.rank : (isNum(it.rank) ? '#' + it.rank : null), was: e && isNum(e.rank) ? '#' + e.rank : null, cmp: ec.rank, wasTip: since, tip: 'Rank on Search Trends now' }),
      evTile({ label: 'Growth', value: disp.growth, unknown: !isNum(n.growth), was: e && e.growth_display, cmp: ec.growth, wasTip: since, tip: isNum(n.growth) ? 'Google’s growth vs the search’s own earlier level' : 'Google’s free RSS gives no growth figure — the ' + OV.scanWord() + ' does' }),
    ].join('');
    // where to watch
    const pf = it.platform && (it.platform.name || it.platform);
    const route = v.route === 'xstream_play' ? ['In Xstream Play', 'up'] : /pack/.test(String(v.label || '')) || v.route === 'pack' ? ['Via Airtel pack', 'info'] : v.route ? [String(v.route).replace('_', ' '), 'muted'] : null;
    const rights = tagOf('rights');
    const watch = `<div class="wv-box"><span class="wv-h">Where to watch</span><div class="wv-watch" data-tip="${esc(whyOf(d, 'verdict') + (whyOf(d, 'watch') ? '\n' + whyOf(d, 'watch') : ''))}">${pf ? ui.platform(String(pf), { noVia: true }) : ui.unk('Not announced')}${route ? ui.tag(route[0], route[1]) : ''}${rights ? ui.freshTag(rights) : ''}</div></div>`;
    const gaps = arr(d.gaps);
    const unknown = `<div class="wv-box"><span class="wv-h">Not known</span>${gaps.length ? gapChips(gaps.slice(0, 6)) : `<span class="wv-ok">${OV.icon('check')}Nothing missing</span>`}</div>`;
    const fresh = tags.filter(t => t.kind !== 'rights');
    const freshBox = `<div class="wv-box"><span class="wv-h">Freshness</span><div class="ov-fts">${ui.freshTags(fresh)}</div></div>`;
    // history: verdict timeline (filled by loadRecords), raw records folded away
    const ids = arr(d.obs_ids);
    const hist = `<div class="wv-hist"><span class="wv-h">Decision history${ui.tip('Every re-decision on a new read (newest left) · hover a dot')}</span><div class="wv-tl" id="ov-rec-tl"></div>
      <details class="wv-rec"><summary>Records</summary><div class="ov-rec"><span>${esc(d.formula || '—')}</span><span>basis <b>${esc(d.basis || '—')}</b></span><span>${esc(fmt.num(ids.length))} observations</span><span>evaluated ${esc(fmt.time(d.evaluated_at))}</span></div><div class="ov-rec-h" id="ov-rec-h"></div></details></div>`;
    if (o.onTitle) {     // Title 360: the numbers are the page's KPI row (made live below) — the card is the decision only
      const grp = (label, body) => `<div class="wv-g"><span class="wv-h">${esc(label)}</span><div class="wv-gb">${body}</div></div>`;
      const watchB = `${pf ? ui.platform(String(pf), { noVia: true }) : ui.unk('Not announced')}${route ? ui.tag(route[0], route[1]) : ''}${rights ? ui.freshTag(rights) : ''}`;
      const unkB = gaps.length ? gapChips(gaps.slice(0, 6)) : `<span class="wv-ok">${OV.icon('check')}Nothing missing</span>`;
      const histB = `<div class="wv-tl" id="ov-rec-tl"></div><details class="wv-rec"><summary>Records</summary><div class="ov-rec"><span>${esc(d.formula || '—')}</span><span>basis <b>${esc(d.basis || '—')}</b></span><span>${esc(fmt.num(ids.length))} observations</span><span>evaluated ${esc(fmt.time(d.evaluated_at))}</span></div><div class="ov-rec-h" id="ov-rec-h"></div></details>`;
      return bar + `<div class="wv-facts" data-tip-host>${grp('Where to watch', `<span data-tip="${esc(whyOf(d, 'verdict'))}" class="wv-watch">${watchB}</span>`)}${grp('Freshness', `<div class="ov-fts">${ui.freshTags(fresh)}</div>`)}${grp('Not known', unkB)}${grp('History', histB)}</div>`;
    }
    return bar + `<div class="wv-tiles">${tiles}</div><div class="wv-row">${watch}${freshBox}${unknown}</div>` + hist;
  };
  T.rowHtml = (it, o) => {
    o = o || {};
    const d = it.decision || {};
    const v = it.verdict || {};
    const age = d.expired && isNum(d.age_s) ? ui.tag(agoText(d.age_s) + ' old', 'warn', 'Age of the search data behind this verdict') : '';
    const head = `<div class="ov-dh">${ui.verdict(v, { lg: true, full: true })}${age}${ui.stageTag(it.stage)}${d.confidence ? ui.tag('confidence ' + d.confidence, 'muted', 'Verdict confidence: type, availability and lifecycle known') : ''}<span class="sp"></span>${it.key && !o.onTitle ? ui.btn('Title 360', { cls: 'sm', icon: 'title', go: ['title', { key: it.key }] }) : ''}</div>`;
    const tags = `<div class="ov-fts">${ui.freshTags(d.tags)}</div>`;
    const gaps = arr(d.gaps).length ? `<div class="ov-sub-h">Not known${ui.tip('What this verdict could not use · hover a chip for why')}</div>${gapChips(d.gaps.slice(0, 5))}` : '';
    return head + tags + `<div class="ov-sub-h">Why this recommendation?${ui.tip('Generated from the inputs this verdict used — every number here is the number on the row' + (whyData(d) ? '\n' + whyData(d) : ''))}</div>` + whyList(d) + earlierHtml(d) + gaps + recordsSlot(d);
  };
  const agoText = s => { s = Math.max(0, Math.round(s)); if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min'; const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h >= 6 || !m ? h + ' h' : h + ' h ' + m + ' min'; };
  T.ago = agoText;
  async function loadRecords(key, entity) {
    if (!key) return;
    let r;
    try { r = await OV.api.get('/api/ott/records', entity && /^Q\d+$/.test(entity) ? { key, entity } : { key }, { ttl: 60 }); } catch (e) { return; }
    const box = document.getElementById('ov-rec-h');
    if (!box || !r) return;
    const ds = arr(r.decisions).slice(0, 5);
    const tl = document.getElementById('ov-rec-tl');
    if (tl) {
      const all = arr(r.decisions).slice(0, 24);
      const VC = { promote_now: 'var(--up)', promote: '#7FC796', watch: 'var(--blue)', check_rights: 'var(--amber)', recheck: 'var(--flat)', skip: 'var(--flat)' };
      tl.innerHTML = all.length ? all.map(x => { const code = typeof x.verdict === 'string' ? x.verdict : ((x.verdict || {}).code || ''); return `<span class="wv-dot" style="--c:${VC[code] || 'var(--flat)'}" data-tip="${esc(fmt.ist(x.evaluated_at) + ' · ' + ((typeof x.verdict === 'object' && x.verdict && x.verdict.label) || code.replace('_', ' ') || '—') + ' · score ' + fmt.heat(x.score) + (x.rank != null ? ' · #' + x.rank : '') + ' · ' + (x.stage || ''))}"></span>`; }).join('') + `<span class="wv-tl-l">${esc(fmt.time(all[all.length - 1].evaluated_at))} → ${esc(fmt.time(all[0].evaluated_at))}</span>` : '<span class="ov-note1">No decision recorded yet</span>';
    }
    box.innerHTML = ds.length ? `<table class="ov-mini"><thead><tr><th>Evaluated</th><th>Basis</th><th>Verdict</th><th class="n">Score</th><th class="n">#</th><th>Stage</th></tr></thead><tbody>${ds.map(x => `<tr><td>${esc(fmt.ist(x.evaluated_at))}</td><td>${esc(x.basis || '—')}</td><td>${ui.verdict(x.verdict)}</td><td class="n">${esc(fmt.heat(x.score))}</td><td class="n">${esc(x.rank == null ? '—' : x.rank)}</td><td>${esc(x.stage || '—')}</td></tr>`).join('')}</tbody></table>`
      + `<div class="ov-note1" data-tip="Recent observations · source families">${esc(fmt.num(arr(r.observations).length))} obs · ${esc(arr(r.families).join(', ') || '—')}</div>` : `<div class="ov-note1">No decision recorded yet</div>`;
  }
  // Title 360's Growth KPI from a row's decision: the sub-label names the read the value came from — 'RSS gives none'
  // only when the row IS on Google's RSS read (audit qa-drill-17: a scan growth was labelled 'RSS gives none')
  T.growthKpi = dd => {
    dd = dd || {};
    const dsp = dd.display || {}, ee = dd.earlier || {};
    const now = (dd.basis_word || 'Live') + ' ' + (dd.basis_hhmm || '');
    if (dd.basis_source === 'free-rss') return { value: dsp.growth || '—', sub: ee.growth_display && ee.growth_display !== '—' ? 'scan ' + ee.growth_display : 'RSS gives none', tip: 'Google’s free RSS gives no growth figure; the ' + OV.scanWord() + ' does' };
    return { value: dsp.growth || '—', sub: now, tip: 'Growth vs normal, ' + now + ' (Google caps it at +1,000%)' };
  };
  // a row opens its FULL Title 360 page (as before Stage 1 — the user prefers the full page to a side drawer); the
  // "Why this recommendation?" block, the Earlier comparison and the records are shown on that page (below)
  T.openRow = it => {
    if (!it) return;
    OV.openTitle(it.key ? it.key : { q: it.name || it.display_title || it.query });
  };
  T.drawerRow = it => {                       // kept for callers that still want the side drawer
    if (!it) return;
    OV.drawer.open({ title: it.name || it.display_title || it.query || it.key, html: T.visualHtml(it), width: 680 });
    loadRecords(it.key, (it.stage || {}).entity);
  };
  OV.on('rendered', async ctx => {
    if (!ctx || ctx.id !== 'title' || !ctx.params || !ctx.params.key) return;
    const key = ctx.params.key;
    let R;
    try { R = await OV.data.rows({ scope: 'IN' }); } catch (e) { return; }
    if (!ctx.alive() || document.getElementById('ov-why-card')) return;
    const items = arr(R && R.items);
    const it = items.find(x => x.key === key) || items.find(x => arr(x.folded).includes(key)) || arr(R && R.newly).find(x => x.key === key);
    const ph = document.querySelector('#ov-view .ov-ph');
    if (!it || !ph) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = ui.card({ id: 'ov-why-card', cls: 'ov-why-card', title: 'Why this recommendation?', icon: 'info',
      tip: 'The verdict on Search Trends for this row, generated from the numbers it used, with the earlier scan figures and the decision records',
      body: T.visualHtml(it, { onTitle: true }) });
    const kpRow = document.querySelector('#ov-view .ov-kpis');
    (kpRow || ph).insertAdjacentElement('afterend', wrap.firstElementChild);   // right under the numbers, above Google detail
    loadRecords(it.key, (it.stage || {}).entity);
    // ONE set of numbers: the KPI cards take the live (re-decided) read; the paid scan's figure becomes a small line
    const dd = it.decision || {}, nn = dd.numbers || {}, dsp = dd.display || {}, ee = dd.earlier || {};
    const scanW = 'scan ';                                   // the scan time rides the tooltip
    const setK = (label, val, sub, tip) => {
      const k = [...document.querySelectorAll('#ov-view .ov-kpi')].find(x => ((x.querySelector('.ov-kpi-l span') || {}).textContent || '').trim() === label);
      if (!k || val == null) return;
      const vEl = k.querySelector('.ov-kpi-v'); if (vEl) { vEl.textContent = val; vEl.classList.toggle('txt', String(val).length > 6); }
      const sEl = k.querySelector('.ov-kpi-s'); if (sEl && sub) sEl.innerHTML = `<span data-tip="${esc((tip || '') + (ee.hhmm ? '\n' + OV.scanWord(true) + ' at ' + ee.hhmm : ''))}">${esc(sub)}</span>`;
    };
    if (dd.basis_source === 'free-rss' || dd.basis_word) {
      const now = (dd.basis_word || 'Live') + ' ' + (dd.basis_hhmm || '');
      setK('Heat', dsp.heat, ee.heat_display ? scanW + ee.heat_display : now, 'Live heat from ' + now + (ee.heat_display ? ' · the ' + OV.scanWord() + ' said ' + ee.heat_display + ' (measured differently)' : ''));
      setK('Today', dsp.volume, ee.volume_display ? scanW + ee.volume_display : now, 'Searches in the last 24 h, ' + now);
      const gk = T.growthKpi(dd);
      setK('Growth', gk.value, gk.sub, gk.tip);
      setK('States', isNum(nn.breadth) ? nn.breadth + (isNum(nn.reporting) ? '/' + nn.reporting : '') : null, isNum(ee.breadth) ? scanW + ee.breadth + (isNum(ee.reporting) ? '/' + ee.reporting : '') : now, 'State trending feeds it is on, of those that reported');
    }
    // one verdict on the page: the header shows the live (re-decided) verdict and rank, and says that the KPI cards
    // below are the paid scan's figures (Title 360 itself reads the scan)
    const d = it.decision || {};
    const sub = ph.querySelector('.sub');
    if (sub) {
      const vp = sub.querySelector('.ov-vp');
      if (vp && it.verdict) vp.outerHTML = ui.verdict(it.verdict);
      const rk = [...sub.querySelectorAll('.ov-tag')].find(x => /^#\d+/.test(x.textContent.trim()));
      if (rk && isNum(it.rank)) { rk.textContent = '#' + it.rank + ' ' + (OV.marketLabel ? OV.marketLabel() : 'India'); rk.setAttribute('data-tip', 'Rank on Search Trends now (' + (d.basis_word || 'newest read') + ' ' + (d.basis_hhmm || '') + ')'); }
      [...sub.querySelectorAll('.ov-tag.warn')].filter(x => /older scan/i.test(x.textContent)).forEach(x => x.remove());
    }
  });

  /* ---------------- a Today action */
  T.actionHtml = a => {
    const d = a.decision || {};
    const v = a.verdict || null;
    const exp = d.expired ? ui.tag('Re-check · data past its limit', 'warn', 'The newest signal behind this action is older than its limit') : '';
    const open = a.key ? ui.btn('Title 360', { cls: 'sm', icon: 'title', go: ['title', { key: a.key }] }) : ui.btn('Title 360', { cls: 'sm', icon: 'title', go: ['title', { q: a.title || '' }] });
    const head = `<div class="ov-dh">${v ? ui.verdict(v, { lg: true, full: true }) : ui.tag('Score ' + ((d.display || {}).score || '—'), 'info', 'Promote-today score 0–100')}${exp}${ui.tag('confidence ' + (a.confidence || '—'), 'muted', 'High = two or more independent source families agree (Google’s scan, RSS and Explore are ONE family)')}<span class="sp"></span>${open}</div>`;
    return head + `<div class="ov-fts">${ui.freshTags(d.tags)}</div><div class="ov-sub-h">Why this recommendation?${ui.tip('Generated from the signals this action used — every number here is on the row')}</div>${whyList(d)}`
      + `<div class="ov-sub-h">Records</div><div class="ov-rec"><span>${esc(d.formula || '—')}</span><span>${esc(fmt.num(arr(d.obs_ids).length))} observations</span><span>families: ${esc(arr(d.families).join(', ') || '—')}</span><span>${d.expires_at ? (d.expired ? '<b class="ov-exp">expired</b> ' : 'valid to ') + esc(fmt.ist(d.expires_at)) : 'no expiry'}</span></div>`;
  };
  T.openAction = a => { if (!a) return; if (a.key) OV.openTitle(a.key); else if (a.title) OV.openTitle({ q: a.title }); else OV.drawer.open({ title: '—', html: T.actionHtml(a), width: 600 }); };

  // a Newly-detected chip: its drawer (the same Why / records as a ranked row)
  OV.actions.trustNewly = key => { const it = arr(T.newly).find(x => x.key === key); if (it) T.openRow(Object.assign({ name: it.display_title || it.query }, it)); };
  T.newly = [];
})();

</script>
<script>
/* ---- pages_a.js ---- */
/* =====================================================================================================
   OTTVerse Trends — pages A: Trend Explorer · Regions & Languages · Title Gap · Fixtures · Calendar
   (docs/OTTVERSE_SPEC.md §4). Built only from window.OV (docs/OTTVERSE_COMPONENTS.md).

   House rules kept here:
   * Anatomy: header → filters → KPIs → main visual → dense table (CSV) on every page. No paragraph anywhere;
     explanations live in tooltips (tip:, data-tip, OV.ui.tip).
   * Every server string goes through esc() or a ui.* component. Unknown is "—" with the reason on hover.
   * Nothing spends on load. The Explorer reads only what is stored (insight explore, title lookups, evidence); a
     Google Trends pull, related queries or the absolute scale run only from a click — paid ones through OV.arm
     (price on the button, second click confirms). A stored pull is shown on one click from /api/ott/explore_cached,
     which reads storage only and can never spend.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const D = OV.data;
  const jattr = o => esc(JSON.stringify(o));
  const sum = a => a.reduce((x, y) => x + (isNum(y) ? y : 0), 0);
  const uniq = a => Array.from(new Set(a));
  const cap = s => String(s || '').replace(/^./, c => c.toUpperCase());

  /* ================================================================== shared cells */
  const ON_TAG = { yes: ['On Xstream', 'up'], partner: ['Partner', 'up'], no: ['Rival', 'down'], unknown: ['Unknown', 'muted'] };
  const onTag = (on, tip) => { const d = ON_TAG[on] || ON_TAG.unknown; return ui.tag(d[0], d[1], tip || OV.ON_LABEL[on] || OV.ON_LABEL.unknown); };
  const BUNDLE = { in_bundle: ['In bundle', 'up', 'Streams inside Xstream Play'], via_pack: ['Via pack', 'info', 'Sold through an Airtel pack or plan'], unknown: ['Unknown', 'muted', 'Xstream bundle status not known'] };
  const bundleTag = b => { const d = BUNDLE[b] || BUNDLE.unknown; return ui.tag(d[0], d[1], d[2]); };
  // no "?" glyph beside a platform (design system §4): unknown availability is said in the tooltip only
  const knownOn = on => on && on !== 'unknown' ? on : null;
  const avPlatform = (name, av, o) => ui.platform(name || (av && av.platform), Object.assign({ on: knownOn(av && av.on_xstream), via: av && av.via,
    pack: [av && av.pack, knownOn(av && av.on_xstream) ? '' : OV.ON_LABEL.unknown].filter(Boolean).join(' · '), source: av && av.source, noVia: true, unkTip: 'Streams on: unknown\n' + ((av && (av.note || av.rights_note)) || 'Not found in catalog › calendar › partner list › Wikidata · check rights') }, o || {}));
  const awayTxt = d => !isNum(d) ? '' : d === 0 ? 'today' : d === 1 ? 'tomorrow' : d > 0 ? 'in ' + d + 'd' : (-d) + 'd ago';
  const dateCell = (iso, away) => `<span class="pa-dt"><b>${esc(fmt.day(iso))}</b><small>${esc(fmt.weekday(iso))}${isNum(away) ? ' · ' + esc(awayTxt(away)) : ''}</small></span>`;
  const vIndex = v => { const i = OV.V_ORDER.indexOf(v && v.code); return i < 0 ? 99 : i; };
  // THE ROW RULE (docs/OTTVERSE_DESIGN_SYSTEM.md §3): thumb · full name · ONE meta line; everything else on hover
  const tcell = (row, name, meta, tip) => ui.nameCell(row, { name, meta: meta != null ? meta : OV.rowMeta(row), tip: arr(tip).filter(Boolean).join('\n') });
  // a named thing with no picture (a state, a circle, a language lane, a source): same name / meta anatomy
  const ncell = (name, meta, tip) => ui.nameCell({ name }, { name, meta: meta || '', tip: tip || '', noThumb: true });
  const metaOf = (it, extra) => OV.rowMeta(it, extra);
  const KIND_C = { release: 'var(--pink)', ott_release: 'var(--violet)', premiere: 'var(--violet)', episode: 'var(--violet)', match: 'var(--teal)', festival: 'var(--amber)' };
  const KIND_L = { release: 'Release', ott_release: 'OTT premiere', premiere: 'Series premiere', episode: 'Episode', match: 'Match', festival: 'Festival' };
  const errPage = (el, title, e, sub) => { el.innerHTML = ui.page({ title, subtitle: sub || '', main: e && e.status === 404 ? ui.empty('Not available yet', { box: true }) : ui.error(e) }); };
  const srcLink = u => { const h = OV.hostOf(u); return OV.safeUrl(u) ? ui.extLink(u, h.replace(/^(en|m)\./, '').replace(/\.(org|com|in|net)$/, ''), { tip: h }) : '—'; };
  const scanLabel = s => s ? `Scan #${s.id} · ${s.finished_at_ist || fmt.ist(s.finished_at)}` : '';
  OV.actions.paGoTitle = q => { if (q) OV.go('title', { q }); };
  // the release & fixture calendar is an import: its age shows on every calendar view as one chip (grey · amber 3 d ·
  // red 7 d — the chip itself turns colour, no banner)
  const calRow = () => OV.fresh.get('calendar');
  const calChip = () => calRow() ? ui.asOf(calRow(), { prefix: 'calendar', name: 'Release & fixture calendar', tip: 'Rights, dates and premieres can move after this' }) : '';
  const todayIso = () => new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10);
  const onNow = r => !!(r.status === 'running_through_window' || (r.date_end && r.date_start && r.date_start < todayIso() && r.date_end >= todayIso()));

  /* ================================================================== TREND EXPLORER */
  const TF_DEF = 'today 3-m';
  const TF_FALLBACK = [['now 1-d', 'Past day'], ['now 7-d', 'Past 7 days'], ['today 1-m', 'Past 30 days'], ['today 3-m', 'Past 90 days'], ['today 12-m', 'Past 12 months'], ['today 5-y', 'Past 5 years']];
  // the server's cache lifetime per window (core.TTL_BY_TF): a stored pull younger than this is served from cache
  const TF_TTL = { 'now 1-H': 300, 'now 4-H': 600, 'now 1-d': 1800, 'now 7-d': 3600, 'today 1-m': 21600, 'today 3-m': 43200, 'today 12-m': 86400, 'today 5-y': 172800, all: 259200 };
  const ADS_VOLUME_USD = 0.09;          // DataForSEO Google Ads search volume, live task (connectors/dataforseo.PRICE['volume'])
  const EXP = new Map(), REL = new Map(), CAL = new Map();     // pulls made in this session, by query (never auto-fetched)
  const MAX_TERMS = 5;
  const termColor = i => OV.color.series(i);
  const parseTerms = s => { const out = []; String(s || '').split(',').map(x => x.trim().slice(0, 100)).filter(Boolean).forEach(x => { if (!out.some(y => y.toLowerCase() === x.toLowerCase())) out.push(x); }); return out.slice(0, MAX_TERMS); };
  const exGeo = () => { const m = OV.state.market; return /^IN-[A-Z]{2}$/.test(m) ? m : 'IN'; };
  const pinKind = k => ({ headline: 'news', pulse: 'start' })[k] || k;
  const OTT_BRANDS = ['netflix', 'jiohotstar', 'prime video', 'sonyliv', 'airtel xstream'];

  function exStats(ex, i) {
    const pts = arr(ex && ex.series && ex.series.points).filter(p => !p.partial && arr(p.values).length > i);
    const vals = pts.map(p => p.values[i]).filter(isNum);
    if (!vals.length) return { avg: null, peak: null, chg: null };
    const avg = ex.averages && isNum(ex.averages[i]) ? ex.averages[i] : sum(vals) / vals.length;
    let pk = null; pts.forEach(p => { const v = p.values[i]; if (isNum(v) && (!pk || v >= pk.v)) pk = { ts: p.ts, v }; });
    const n = pts.length, w = Math.max(2, Math.floor(n / 4));
    const cur = pts.slice(-w).map(p => p.values[i]).filter(isNum), prev = pts.slice(-2 * w, -w).map(p => p.values[i]).filter(isNum);
    const a = cur.length ? sum(cur) / cur.length : null, b = prev.length ? sum(prev) / prev.length : null;
    return { avg, peak: pk && pk.v > 0 ? pk : null, chg: isNum(a) && isNum(b) && b > 0 ? (a - b) / b * 100 : null, window: w };
  }
  const wikiSeries = t => {
    const att = arr(t && t.attention).filter(a => arr(a.points).length);
    const days = uniq(att.flatMap(a => a.points.map(p => p.day))).sort();
    return { days, values: days.map(d => { let s = null; att.forEach(a => { const p = a.points.find(x => x.day === d); if (p && isNum(p.views)) s = (s || 0) + p.views; }); return s; }) };
  };

  OV.actions.exRemove = (i) => { const P = OV.route().params; const t = parseTerms(P.terms); t.splice(+i, 1); OV.setParams({ terms: t.join(',') }); };
  OV.actions.exAdd = (term) => { const P = OV.route().params; const t = parseTerms(P.terms); if (term && t.length < MAX_TERMS && !t.some(x => x.toLowerCase() === term.toLowerCase())) t.push(term); OV.setParams({ terms: t.join(',') }); };
  OV.actions.exSet = (terms) => OV.setParams({ terms });
  OV.actions.exCurve = (arg, el) => {
    let q; try { q = JSON.parse(arg); } catch (e) { return; }
    const mode = el.getAttribute('data-mode'), cost = el.getAttribute('data-cost') || 'paid';
    const run = async () => {
      el.disabled = true; el.innerHTML = OV.icon('clock') + 'Loading…';
      try {
        // cached = the free stored-pull read (/api/ott/explore_cached never fetches); paid = the armed Trends pull
        const d = mode === 'cached'
          ? await OV.api.get('/api/ott/explore_cached', q.query, { force: true, ttl: 0 })
          : await OV.api.get('/api/trends/explore', q.query, { force: true, ttl: 0 });
        EXP.set(q.key, d);
        OV.api.clear('/api/insight/explore');
        OV.toast(mode === 'cached' ? 'Stored pull loaded · no spend' : d && d.provenance && d.provenance.cache === 'hit' ? 'Loaded from cache' : 'Pulled · cached for the next view');
      } catch (e) { OV.toast(mode === 'cached' && e.status === 404 ? 'No stored pull for these terms' : e.status === 503 ? 'No Trends provider available now' : (e.detail || 'Pull failed'), 'down'); }
      OV.refresh();
    };
    if (mode === 'cached') run(); else OV.arm(el, 'Spend ' + cost + '? Click again', run);
  };
  OV.actions.exRelated = (arg, el) => {
    let q; try { q = JSON.parse(arg); } catch (e) { return; }
    OV.arm(el, 'Spend ' + (el.getAttribute('data-cost') || 'paid') + '? Click again', async () => {
      el.disabled = true; el.innerHTML = OV.icon('clock') + 'Loading…';
      try { REL.set(q.key, await OV.api.get('/api/trends/related', q.query, { force: true, ttl: 0 })); OV.toast('Related queries loaded'); }
      catch (e) { OV.toast(e.status === 503 ? 'No provider available now' : (e.detail || 'Load failed'), 'down'); }
      OV.refresh();
    });
  };
  OV.actions.exAbs = (arg, el) => {
    let q; try { q = JSON.parse(arg); } catch (e) { return; }
    OV.arm(el, 'Spend ' + (el.getAttribute('data-cost') || 'paid') + '? Click again', async () => {
      el.disabled = true; el.innerHTML = OV.icon('clock') + 'Calibrating…';
      try { CAL.set(q.key, await OV.api.get('/api/demand/calibrate', q.query, { force: true, ttl: 0 })); OV.toast('Absolute scale ready'); }
      catch (e) { OV.toast(e.detail || 'Calibration failed', 'down'); }
      OV.refresh();
    });
  };

  OV.register('explore', {
    market: true, period: false, periodTip: 'Pick the time range in the filter bar',
    coach: [
      { sel: '#ov-view .pa-terms', text: 'Up to 5 terms · type and press Enter' },
      { sel: '#ov-view .ov-filters', text: 'Time range · category · search type' },
      { sel: '#ov-view .ov-kpis', text: 'Leader, demand and board status' },
      { sel: '#ov-view .ov-mainvis', text: 'Interest over time · pins = events' },
      { sel: '#ov-view .ov-maintable', text: 'Side-by-side numbers · CSV' },
    ],
    async render(el, ctx) {
      const P = ctx.params;
      const terms = parseTerms(P.terms);
      const geo = exGeo();
      el.innerHTML = ui.pageHeader({ title: 'Trend Explorer', subtitle: terms.join(' · ') || 'Compare up to 5 terms' }) + ui.skeleton('kpis', 5) + ui.skeleton('card');
      const tmeta = await OV.api.get('/api/meta', null, { ttl: Infinity }).catch(() => null);
      if (!ctx.alive()) return;
      const TFS = arr(tmeta && tmeta.timeframes).length ? tmeta.timeframes.filter(t => TF_TTL[t.id] && !/^now [14]-H$/.test(t.id)).map(t => [t.id, t.label]) : TF_FALLBACK;
      const timeframe = TFS.some(t => t[0] === P.timeframe) ? P.timeframe : TF_DEF;
      const CATS = arr(tmeta && tmeta.categories).map(c => [String(c.id), c.label]);
      const cat = CATS.some(c => c[0] === String(P.gcat || '')) ? String(P.gcat) : '0';
      const GPROPS = arr(tmeta && tmeta.gprops).map(g => [g.id, g.label]);
      const gprop = GPROPS.some(g => g[0] === (P.gprop || '')) ? (P.gprop || '') : '';
      const query = { terms: terms.join(','), geo, timeframe, cat: +cat || 0, gprop };
      const qkey = JSON.stringify(query);
      const tfLabel = (TFS.find(t => t[0] === timeframe) || [0, timeframe])[1];

      const [ins, looks, om, board] = await Promise.all([
        terms.length ? OV.api.get('/api/insight/explore', query, { ttl: 120 }).catch(e => ({ err: e })) : null,
        Promise.all(terms.map(t => OV.api.get('/api/ott/title', { q: t }, { ttl: 300 }).catch(() => null))),
        OV.api.get('/api/ott/meta', null, { ttl: 3600 }).catch(() => null),
        terms.length < MAX_TERMS ? D.rows({ scope: 'IN' }).then(r => ({ items: r.items })).catch(() => null) : null,
      ]);
      if (!ctx.alive()) return;
      const evq = await Promise.all(looks.map(t => t && t.key ? D.evidence(t.key, 'queries').catch(() => null) : null));
      if (!ctx.alive()) return;
      const offer = om && om.paid && om.paid.explore;
      const costUsd = offer && isNum(offer.cost_usd) ? offer.cost_usd : null;
      const cost = (offer && offer.cost_label) || (isNum(costUsd) ? '≈' + fmt.usd(costUsd, 3) : 'paid');
      const ex = EXP.get(qkey) || null;
      const insOk = ins && !ins.err && ins.status === 'ok';
      const src = ins && ins.source || {};
      const fresh = insOk && isNum(src.age_s) && src.age_s < (TF_TTL[timeframe] || 0);

      // ---- term bar (chips + add box + quick picks)
      const chipsHtml = terms.map((t, i) => `<span class="pa-term" style="--tc:${termColor(i)}"><i></i><span class="nm" data-tip="${esc(t)}">${esc(t)}</span><button data-act="exRemove" data-arg="${i}" aria-label="Remove ${esc(t)}" data-tip="Remove">✕</button></span>`).join('');
      const add = terms.length < MAX_TERMS ? `<input id="pa-ex-add" class="pa-addterm" data-focus-id="ex-add" maxlength="100" autocomplete="off" placeholder="${terms.length ? '+ Compare' : '+ Add a term'}" aria-label="Add a term">` : '';
      const picks = terms.length < MAX_TERMS && board ? arr(board.items).filter(it => !it.fold_lead && !(it.fixture && it.fixture.is_primary === false) && !terms.some(t => t.toLowerCase() === String(it.query).toLowerCase())).slice(0, 5) : [];
      // the chip shows the same name as Search Trends; the term added is the real search query (in the tooltip)
      const pickHtml = picks.length ? `<span class="pa-picks"><span class="ov-flabel">Trending</span>${picks.map(it => `<button class="ov-chip" data-act="exAdd" data-arg="${esc(it.query)}" data-tip="${esc([metaOf(it), 'Adds “' + it.query + '” · #' + it.rank + ' on the latest board · heat ' + fmt.dec(it.heat, 0)].filter(Boolean).join('\n'))}">${esc(it.name || it.query)}</button>`).join('')}<button class="ov-chip" data-act="exSet" data-arg="${esc(OTT_BRANDS.join(','))}" data-tip="${esc(OTT_BRANDS.join(' · '))}">OTT brands</button></span>` : '';
      const termBar = `<div class="pa-terms ov-card">${chipsHtml}${add}${pickHtml}</div>`;

      // ---- filters
      const filters = ui.filterBar([
        ui.select('timeframe', TFS, timeframe, { all: false, label: 'Time', tip: 'Google Trends window' }),
        CATS.length ? ui.select('gcat', CATS, cat, { all: false, label: 'Category', tip: 'Google Trends category' }) : '',
        GPROPS.length ? ui.select('gprop', GPROPS, gprop, { all: false, label: 'Search', tip: 'Search property' }) : '',
        `<span class="ov-tag ${geo === 'IN' ? 'muted' : 'info'}" data-tip="${esc(OV.state.market.indexOf('circle:') === 0 ? 'Google Trends has no circle view · showing India' : 'Location follows the market selector')}">${OV.icon('map')} ${esc(fmt.geo(geo))}</span>`,
        ui.reset(['timeframe', 'gcat', 'gprop'], !!(P.timeframe || P.gcat || P.gprop)),
        '<span class="sp"></span>',
        terms.length ? `<button class="ov-btn sm" data-act="exSet" data-arg="" data-tip="Remove every term">Clear</button>` : '',
      ]);

      // ---- per-term rows
      const rows = terms.map((term, i) => {
        const t = looks[i] || {};
        const s = ex ? exStats(ex, i) : { avg: null, peak: null, chg: null };
        const vol = t.volume || null;
        const sm = t.summary || null, inScan = !!t.in_scan;
        const w = wikiSeries(t);
        const av = t.availability || {};
        return { i, term, color: termColor(i), t, key: t.key || null, type: t.type || 'other', language: t.language, label: t.label || term,
          avg: s.avg, peak: s.peak, chg: s.chg, chgW: s.window,
          searches: vol && isNum(vol.searches) ? vol.searches : null, month: vol && vol.month, monthly: arr(vol && vol.monthly).filter(m => isNum(m.searches)),
          rank: inScan && sm ? sm.rank : null, heat: inScan && sm ? sm.heat : null, mom: inScan && sm ? sm.momentum : null, status: t.status,
          verdict: t.verdict || null, av, wiki: w, wikiLast: w.values.filter(isNum).slice(-1)[0], evq: evq[i] };
      });

      // ---- KPIs
      const withAvg = rows.filter(r => isNum(r.avg)), withVol = rows.filter(r => isNum(r.searches));
      const lead = withAvg.length ? withAvg.slice().sort((a, b) => b.avg - a.avg)[0] : withVol.length ? withVol.slice().sort((a, b) => b.searches - a.searches)[0] : null;
      const topVol = withVol.slice().sort((a, b) => b.searches - a.searches)[0];
      const onBoard = rows.filter(r => isNum(r.rank));
      const bestRank = onBoard.length ? Math.min(...onBoard.map(r => r.rank)) : null;
      const pullState = ex ? 'Loaded' : insOk ? (fresh ? 'Cached' : 'Stale') : terms.length ? 'Not pulled' : null;
      const kpis = [
        { label: 'Terms', value: terms.length, unit: '/' + MAX_TERMS, sub: `${fmt.geo(geo)} · ${tfLabel}`, tip: 'Terms compared on one Google Trends scale (max 5).' },
        { label: 'Leader', value: lead ? lead.term : null, sub: lead ? (isNum(lead.avg) ? `avg ${fmt.dec(lead.avg, 0)} / 100` : `${fmt.compact(lead.searches)} searches/mo`) : '', unkTip: 'Pull the curve or add terms with stored searches',
          tip: 'Highest average Google Trends index in the window; without a pull, the most Google Ads searches.' },
        { label: 'Searches/mo', value: topVol ? topVol.searches : null, fmt: fmt.compact, sub: topVol ? `${topVol.term} · ${fmt.month(topVol.month)}` : '', spark: topVol ? topVol.monthly.map(m => m.searches) : null, sparkColor: topVol ? topVol.color : 'var(--violet)',
          tip: 'Google Ads monthly searches, India (stored weekly task). Highest among the terms.', unkTip: 'No Google Ads volume stored for these terms' },
        { label: 'On the board', value: terms.length ? onBoard.length : null, unit: terms.length ? '/' + terms.length : '', sub: isNum(bestRank) ? `best #${bestRank}` : terms.length ? 'none trending' : '', tip: 'Terms on the latest entertainment + sports trending board (India).', unkTip: 'Add a term' },
        { label: 'Trends pull', value: pullState, sub: ex ? `${(ex.provenance || {}).provider_label || ''} · ${['hit', 'stored'].includes((ex.provenance || {}).cache) ? 'stored' : 'new'}` : insOk ? `${src.provider || ''} · ${fmt.ago(src.fetched_at)} ago` : terms.length ? cost : '',
          tip: 'Google Trends 0–100 curve for these exact terms. Stored pulls are free; a new pull is paid and runs only on a click.', unkTip: 'Add a term',
          source: insOk || ex ? { name: 'Google Trends', state: ex || fresh ? 'ok' : 'warn', fresh: insOk ? fmt.ist(src.fetched_at) : '' } : null },
      ];

      // ---- main visual: interest over time
      const hasAds = rows.some(r => r.monthly.length >= 2), hasWiki = rows.some(r => r.wiki.days.length >= 2);
      const srcTab = ['gt', 'ads', 'wiki'].includes(P.src) ? P.src : (ex ? 'gt' : hasAds ? 'ads' : 'gt');
      const tabs = ui.tabs('src', [{ id: 'gt', label: 'Google Trends', tip: '0–100 relative index (100 = the peak on this chart)' }, { id: 'ads', label: 'Searches/mo', tip: 'Google Ads monthly searches (stored, free)' }, { id: 'wiki', label: 'Wikipedia', tip: 'Daily views from Wikipedia top lists (stored, free)' }], srcTab, { cls: 'sm in' });
      const cachedBtn = insOk ? `<button class="ov-btn sm pri" data-act="exCurve" data-mode="cached" data-arg="${jattr({ key: qkey, query })}" data-tip="${esc('Stored pull · ' + fmt.ago(src.fetched_at) + ' old · read from storage only · no spend')}">${OV.icon('explore')}Show curve · stored</button>` : '';
      const paidBtn = insOk && fresh ? '' : `<button class="ov-lc" data-act="exCurve" data-mode="paid" data-cost="${esc(cost)}" data-arg="${jattr({ key: qkey, query })}" data-tip="${esc((offer && offer.provider ? offer.provider : 'Google Trends pull') + '\nPaid · runs only when you click twice' + (insOk ? '\nStored pull is ' + fmt.ago(src.fetched_at) + ' old' : ''))}">${OV.icon('download')}${insOk ? 'Refresh' : 'Pull curve'} · ${esc(cost)}</button>`;
      const curveBtn = !terms.length || ex ? '' : cachedBtn + paidBtn;
      let chart = '', legendExtra = '';
      if (!terms.length) chart = ui.empty('Add a term to start', { box: true });
      else if (srcTab === 'gt') {
        if (ex && arr(ex.series && ex.series.points).length) {
          const pts = ex.series.points;
          const allPins = arr(insOk ? ins.pins : []).filter(p => isNum(p.ts));
          const pins = allPins.filter(p => p.kind !== 'headline').concat(allPins.filter(p => p.kind === 'headline').sort((a, b) => b.ts - a.ts).slice(0, 6)).slice(0, 24).map(p => ({ x: p.ts, label: `${p.label || p.title || ''} · ${p.term}`, kind: pinKind(p.kind), url: p.url }));
          chart = ui.line({ series: terms.map((t, i) => ({ name: t, values: pts.map(p => isNum(arr(p.values)[i]) ? p.values[i] : null), color: termColor(i) })), x: pts.map(p => p.ts), time: true, h: 290, yMax: 100, pins, fmt: v => fmt.dec(v, 0), legend: false });
          const avgBars = `<div class="pa-avg" data-tip="Average index over the window (Google’s own averages)">${rows.map(r => `<div class="c"><span class="b" style="height:${isNum(r.avg) ? Math.max(2, r.avg) : 0}%;background:${r.color}"></span><b>${isNum(r.avg) ? esc(fmt.dec(r.avg, 0)) : '—'}</b></div>`).join('')}<small>Avg</small></div>`;
          chart = `<div class="pa-exw">${avgBars}<div style="min-width:0">${chart}</div></div>`;
          if (ex.empty) chart = ui.empty('Not enough search volume for these terms', { box: true });
          legendExtra = `<span data-tip="The last point may be a period still in progress">· partial last point</span>`;
        } else chart = `<div class="pa-pull">${OV.icon('explore')}<b>${esc(insOk ? 'Stored pull · ' + fmt.ago(src.fetched_at) + ' old' : 'No stored pull')}</b>${curveBtn}${hasAds ? `<button class="ov-btn sm" data-set="${jattr({ src: 'ads' })}">Searches/mo · free</button>` : ''}</div>`;
      } else if (srcTab === 'ads') {
        const months = uniq(rows.flatMap(r => r.monthly.map(m => m.month))).sort();
        chart = months.length >= 2 ? ui.line({ series: rows.map(r => ({ name: r.term, values: months.map(mo => { const m = r.monthly.find(x => x.month === mo); return m ? m.searches : null; }), color: r.color })), x: months.map(m => m + '-01'), time: true, h: 290, fmt: fmt.compact, legend: false, dots: true })
          : ui.empty('No Google Ads monthly volume stored for these terms', { box: true });
      } else {
        const days = uniq(rows.flatMap(r => r.wiki.days)).sort();
        chart = days.length >= 2 ? ui.line({ series: rows.map(r => ({ name: r.term, values: days.map(d => { const k = r.wiki.days.indexOf(d); return k >= 0 ? r.wiki.values[k] : null; }), color: r.color })), x: days, time: true, h: 290, fmt: fmt.compact, legend: false, dots: true })
          : ui.empty('None of these terms is on a stored Wikipedia top list', { box: true });
      }
      const legend = terms.length ? `<div class="ov-legend" style="margin-top:6px">${rows.map(r => `<span><i class="ln" style="background:${r.color}"></i>${esc(r.term)}</span>`).join('')}${srcTab === 'gt' && ex ? legendExtra : ''}<span style="margin-left:auto" class="ov-note1">${esc(srcTab === 'gt' ? (ex ? `${(ex.provenance || {}).provider_label || ''} · ${fmt.geo(geo)} · ${tfLabel}` : '') : srcTab === 'ads' ? 'Google Ads · India · monthly' : 'Wikimedia top lists · daily')}</span></div>` : '';
      const insChips = insOk && arr(ins.insights).length ? `<div class="pa-ins">${ins.insights.slice(0, 4).map(x => { const i = terms.findIndex(t => t.toLowerCase() === String(x.term || '').toLowerCase()); return `<span class="pa-insc" style="--tc:${i >= 0 ? termColor(i) : 'var(--slate)'}" data-tip="${esc('Computed from the ' + (fresh ? '' : 'stored ') + 'pull · ' + (x.kind || ''))}">${OV.icon({ peak: 'up', regional: 'map', volume: 'search', streak: 'explore', seasonal: 'calendar' }[x.kind] || 'bolt')}${esc(x.text)}</span>`; }).join('')}</div>` : '';
      const absOk = ['today 12-m', 'today 5-y'].includes(timeframe) && !gprop && !+cat && terms.length > 0;
      const absCost = isNum(costUsd) ? '≤ ≈' + fmt.usd(costUsd + ADS_VOLUME_USD, 3) : 'paid';
      const absBtn = terms.length ? (CAL.has(qkey) ? '' : `<button class="ov-lc" data-act="exAbs" data-cost="${esc(absCost)}" data-arg="${jattr({ key: qkey, query: { terms: query.terms, geo, timeframe, anchor: (topVol || {}).term || terms[0] } })}"${absOk ? '' : ' disabled'} data-tip="${esc(absOk ? 'Turns the 0–100 index into estimated searches/month, anchored on Google Ads volume.\nPaid: Ads volume + a Trends pull (stored parts are free) · click twice' : 'Needs Past 12 months or 5 years, Web search, All categories')}">${OV.icon('bolt')}Absolute scale · ${esc(absCost)}</button>`) : '';
      const mainCard = ui.card({ title: 'Interest over time', icon: 'explore', tip: 'Google Trends: 0–100, relative to the highest point on this chart. Pins: releases, matches, headlines, India Pulse appearances.',
        source: insOk || ex ? { name: 'Google Trends', state: ex || fresh ? 'ok' : 'warn', fresh: insOk ? fmt.ist(src.fetched_at) : '' } : null,
        actions: tabs + (srcTab === 'gt' && ex ? '' : srcTab === 'gt' ? '' : curveBtn) + absBtn, body: insChips + chart + legend });

      // ---- absolute scale (after a paid click)
      const calD = CAL.get(qkey);
      const calCard = calD ? ui.card({ title: 'Absolute scale', icon: 'bolt', tip: calD.method || 'Least-squares fit of the anchor’s Google Ads volume to its Trends index',
        badge: ui.tag(`MAPE ${fmt.dec(calD.anchor && calD.anchor.fit_mape_pct, 1)}%`, (calD.anchor && calD.anchor.fit_mape_pct) <= 25 ? 'up' : 'warn', 'Fit error over the overlapping months: lower is better'),
        body: `<table class="ov-mini">${arr(calD.estimates).map(e => { const i = terms.findIndex(t => t.toLowerCase() === String(e.term).toLowerCase()); return `<tr><td><span class="pa-sw" style="background:${termColor(i)}"></span>${esc(e.term)}</td><td class="r ov-note1" data-tip="Monthly Trends index, ${esc(fmt.month(e.month))}">${isNum(e.index) ? esc(fmt.dec(e.index, 1)) : '—'}</td><td class="r"><b data-tip="${esc(e.note || 'Estimated searches, ' + fmt.month(e.month))}">${isNum(e.est_monthly_searches) ? esc(fmt.compact(e.est_monthly_searches)) : '—'}</b></td></tr>`; }).join('')}</table><div class="ov-note1" style="margin-top:6px">Anchor ${esc(calD.anchor ? calD.anchor.term : '—')} · ${esc(fmt.compact(calD.anchor && calD.anchor.monthly_volume))}/mo · ${esc(fmt.month(calD.anchor && calD.anchor.month))}</div>` }) : '';

      // ---- compare table (the main table)
      const table = ui.table({
        id: 'ex-compare', rows, pageSize: 25, chooser: true, csvName: 'explore-' + terms.join('-'), noun: 'terms', empty: 'Add a term to compare',
        onRow: r => r.key ? OV.openTitle(r.key) : OV.go('title', { q: r.term }),
        toolbar: `<span><b>${esc(fmt.num(rows.length))}</b> terms · ${esc(fmt.geo(geo))} · ${esc(tfLabel)}</span>`,
        columns: [
          { id: 'term', label: 'Term', value: r => r.term, render: r => `<div class="pa-termc"><span class="pa-sw" style="background:${r.color}"></span>${tcell(Object.assign({}, r.t, { name: r.label, type: r.type, key: r.key, language: r.language }), r.label, null, [r.label.toLowerCase() !== r.term.toLowerCase() ? 'Search term: “' + r.term + '”' : ''])}</div>` },
          { id: 'avg', label: 'Avg', num: true, tip: 'Average Google Trends index, 0–100 (needs the curve)', value: r => r.avg, render: r => isNum(r.avg) ? `<b>${esc(fmt.dec(r.avg, 0))}</b>` : ui.unk(ex ? 'No data' : 'Curve not pulled') },
          { id: 'chg', label: 'Recent', num: true, tip: 'Last quarter of the window vs the quarter before (same pull)', value: r => r.chg, render: r => isNum(r.chg) ? ui.delta(r.chg, { chip: false, title: `Last ${r.chgW} points vs the ${r.chgW} before` }) : ui.unk(ex ? 'Not enough points' : 'Curve not pulled') },
          { id: 'peak', label: 'Peak', tip: 'Highest point in the window', value: r => r.peak && r.peak.ts, render: r => r.peak ? `<span data-tip="${esc('Index ' + r.peak.v + ' · ' + fmt.ist(r.peak.ts))}">${esc(fmt.day(r.peak.ts))}</span>` : ui.unk(ex ? 'No peak' : 'Curve not pulled'), csv: r => r.peak ? fmt.day(r.peak.ts) : '' },
          { id: 'searches', label: 'Searches/mo', num: true, tip: 'Google Ads monthly searches, India (stored)', value: r => r.searches, render: r => isNum(r.searches) ? `<span data-tip="${esc(fmt.month(r.month) + ' · Google Ads')}">${esc(fmt.compact(r.searches))}</span>` : ui.unk('Not fetched yet') },
          { id: 'trend12', label: '12 mo', sort: false, tip: 'Google Ads monthly searches, last 12 months', render: r => r.monthly.length >= 2 ? ui.spark(r.monthly.map(m => m.searches), { w: 78, h: 22, color: r.color, area: true }) : ui.noSpark(78, 'No monthly series'), csvSkip: true },
          { id: 'rank', label: 'Board #', num: true, tip: 'Rank on the latest trending board (India)', value: r => r.rank, render: r => isNum(r.rank) ? `#${esc(r.rank)}` : ui.unk(r.status === 'seen_before' ? 'On earlier scans only' : 'Not trending now') },
          { id: 'mom', label: 'Δ', tip: 'Rank change since the previous scan', sort: false, render: r => r.mom ? ui.rankDelta(r.mom) : ui.unk('Not on the board'), csv: r => r.mom ? r.mom.state : '' },
          { id: 'heat', label: 'Heat', num: true, tip: 'Heat 0–100 on the latest board', value: r => r.heat, render: r => ui.heat(r.heat) },
          { id: 'platform', label: 'Streams on', tip: 'Where it streams: ✓ on Xstream Play · ◐ sold by Airtel · ✕ rival only · — unknown (hover it for why)', value: r => r.av.platform, render: r => avPlatform(r.av.platform, r.av), csv: r => r.av.platform ? `${r.av.platform} (${r.av.on_xstream || 'unknown'})` : '' },
          { id: 'verdict', label: 'Verdict', tip: 'Verdict engine (latest appearance)', value: r => vIndex(r.verdict), render: r => ui.verdict(r.verdict), csv: r => r.verdict && r.verdict.code },
          { id: 'wiki', label: 'Wiki/day', num: true, hide: !hasWiki, tip: 'Wikipedia views, last stored day', value: r => r.wikiLast, render: r => isNum(r.wikiLast) ? esc(fmt.compact(r.wikiLast)) : ui.unk('Not on a stored top list') },
        ],
      });

      // ---- regions comparison (from the pull) + over-index (free, from the stored pull)
      const regRows = arr(ex && ex.regions && ex.regions.rows).filter(r => arr(r.values).some(v => v > 0));
      let regions = '';
      if (terms.length) {
        const n = terms.length;
        const vals = {};
        regRows.forEach(r => { const L = isNum(r.leader) ? r.leader : 0; const v = n > 1 ? arr(r.share || r.values)[L] : r.values[0]; vals[r.code] = { v, color: termColor(L), op: .2 + .8 * Math.min(1, (v || 0) / 100), lines: terms.map((t, i) => `${t}: ${isNum(r.values[i]) ? r.values[i] + (n > 1 ? '%' : '') : '—'}`) }; });
        const regTbl = ui.table({ id: 'ex-regions', rows: regRows, pageSize: 25, chooser: false, onRow: null, csvName: 'explore-regions', noun: 'states', sort: { id: 'top', dir: 'desc' },
          empty: ex ? 'No regional breakdown returned' : 'Pull the curve to compare states',
          columns: [{ id: 'name', label: 'State', render: r => ncell(r.name, String(r.code || '').replace(/^IN-/, '')), csv: r => r.name },
            ...terms.map((t, i) => ({ id: 'v' + i, label: t.length > 14 ? t.slice(0, 13) + '…' : t, csvLabel: t, num: true, tip: n > 1 ? `${t}: share of these terms’ searches in the state (%)` : `${t}: interest relative to the top state (100)`, value: r => arr(n > 1 ? (r.share || r.values) : r.values)[i],
              render: r => { const v = arr(n > 1 ? (r.share || r.values) : r.values)[i]; return isNum(v) ? `<span class="pa-cellbar"><b>${esc(v)}${n > 1 ? '%' : ''}</b><i style="width:${Math.min(100, v)}%;background:${termColor(i)}"></i></span>` : '—'; } })),
            { id: 'top', label: 'Leader', tip: 'Term with the highest value in the state', value: r => Math.max(...arr(r.values).filter(isNum)), render: r => { const L = isNum(r.leader) ? r.leader : 0; return `<span class="pa-lead"><span class="pa-sw" style="background:${termColor(L)}"></span>${esc(terms[L] || '—')}</span>`; }, csv: r => terms[isNum(r.leader) ? r.leader : 0] }] });
        const div = arr(insOk ? ins.divergence : []);
        const divHtml = div.length ? `<div class="ov-sub-h" style="margin-top:10px">Over-index${ui.tip('States where a term’s share is far above or below its India share (stored pull).')}</div><table class="ov-mini">${div.slice(0, 8).map(d => { const i = terms.findIndex(t => t.toLowerCase() === String(d.term).toLowerCase()); return `<tr><td><span class="pa-sw" style="background:${termColor(i)}"></span>${esc(d.name || fmt.geo(d.geo))}</td><td class="ov-note1">${esc(d.term)}</td><td class="r"><b>${esc(fmt.dec(d.ratio, 1))}×</b></td></tr>`; }).join('')}</table>` : '';
        const mapCard = ui.card({ title: 'By state', icon: 'regions', tip: n > 1 ? 'Colour = the term with the highest share in each state; depth = that share.' : 'Depth = interest relative to the top state (100).',
          body: (regRows.length ? ui.map(vals, { mini: true, legend: false, label: 'Interest by state' }) + `<div class="ov-legend" style="margin-top:6px">${terms.map((t, i) => `<span><i style="background:${termColor(i)}"></i>${esc(t)}</span>`).join('')}</div>` : ui.empty(ex ? 'No regional breakdown' : 'Pull the curve to map states', { box: true })) + divHtml });
        regions = ui.grid('minmax(0,1fr) minmax(0,1.6fr)', [mapCard, `<div>${regTbl}</div>`]);
      }

      // ---- related per term: stored (free) for scanned terms; Top + Rising on a paid click
      let related = '';
      if (terms.length) {
        const relCards = rows.map(r => {
          const rq = { term: r.term, geo, timeframe, cat: +cat || 0, gprop };
          const rk = JSON.stringify(rq);
          const got = REL.get(rk);
          const rel = got && got.related && got.related.queries;
          const stored = arr(r.evq && r.evq.rows);
          let body = '';
          if (rel) {
            const list = (xs, rising) => arr(xs).slice(0, 8).map(x => `<tr><td><span class="pa-q">${esc(x.query)}</span></td><td class="r">${rising ? `<span class="ov-d up">${esc(x.formatted || x.value)}</span>` : esc(x.formatted || x.value)}</td></tr>`).join('');
            body = `<div class="ov-split"><div><div class="ov-sub-h">Top${ui.tip('Relative 0–100: most searched together with the term')}</div><table class="ov-mini">${list(rel.top, false) || '<tr><td>—</td></tr>'}</table></div><div><div class="ov-sub-h">Rising${ui.tip('Growth vs the previous period; Breakout = > +5,000%')}</div><table class="ov-mini">${list(rel.rising, true) || '<tr><td>—</td></tr>'}</table></div></div>`;
          } else if (stored.length) {
            const IC = { watch: 'var(--up)', info: 'var(--blue)', score: 'var(--teal)', piracy: 'var(--down)' };
            body = `<table class="ov-mini">${stored.slice(0, 8).map(x => `<tr><td><span class="pa-q">${esc(x.query)}</span></td><td>${x.intent ? `<span class="ov-kind" style="--kc:${IC[x.intent] || 'var(--slate)'}">${esc(cap(x.intent))}</span>` : ''}</td><td class="r ov-note1">${esc(x.value || '')}</td></tr>`).join('')}</table>`;
          } else body = ui.empty('No stored related queries');

          return `<section class="ov-card pa-relc" style="--tc:${r.color}"><div class="ov-ch"><span class="pa-sw" style="background:${r.color}"></span><h3>${esc(r.term)}</h3>${stored.length && !rel ? ui.tag('stored', 'muted', 'Breakdown and related queries from the scans (free)') : ''}<div class="acts">${btn}</div></div><div class="ov-cb">${body}</div></section>`;
        });
        related = `<div class="ov-section-t" style="margin-top:4px">Related searches</div><div class="pa-relg">${relCards.join('')}</div>`;
      }

      const insErr = ins && ins.err && ins.err.status !== 404 ? ui.error(ins.err) : '';
      el.innerHTML = ui.page({
        title: 'Trend Explorer', subtitle: terms.length ? `${fmt.geo(geo)} · ${tfLabel}` : 'Compare up to 5 terms',
        actions: terms.length && OV.has('title') && rows[0] ? ui.btn('Title Overview', { cls: 'sm', icon: 'title', go: ['title', rows[0].key ? { key: rows[0].key } : { q: rows[0].term }] }) : '',
        strip: termBar, filters, kpis, main: insErr + mainCard + calCard, table, extra: `<div style="margin-top:12px">${regions}</div>${related}`,
      });
      const inp = el.querySelector('#pa-ex-add');
      if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const v = inp.value.trim(); if (v) OV.actions.exAdd(v); } });
    },
  });

  /* ================================================================== REGIONS & LANGUAGES */
  OV.register('regions', {
    market: false, period: false, periodTip: 'Latest scan',
    coach: [
      { sel: '#ov-view .ov-filters', text: 'States · circles · languages' },
      { sel: '#ov-view .ov-kpis', text: 'Where demand sits' },
      { sel: '#ov-view .pa-mapcard', text: 'Click a state to open its charts' },
      { sel: '#ov-view .pa-lanes', text: 'Top titles per language' },
      { sel: '#ov-view .ov-maintable', text: 'Ranked table · CSV' },
    ],
    async render(el, ctx) {
      const P = ctx.params;

      const stLang = {}; lanes.forEach(ln => arr(ln.region_states).forEach(g => { stLang[g] = ln.lang; }));

      // states whose list was fetched, plus those whose feed came back empty (shown as no data, never as 0)
      const smap = arr(b.map).filter(s => s.fetched !== false || s.empty_at_source);
      const k = b.kpis || {};
      const hsI = k.hottest_state_india || k.hottest_state;
      // circles: aggregate the state rows each circle covers
      const circ = OV.circles().map(c => {
        const sts = smap.filter(s => arr(s.circles).includes(c.id) || arr(c.geos).includes(s.geo));
        const live = sts.filter(s => isNum(s.heat));
        const top = live.slice().sort((a, b2) => b2.heat - a.heat)[0] || null;
        return { id: c.id, name: c.name, states: sts.map(s => s.geo), trends: sum(sts.map(s => s.count)), heat: live.length ? Math.max(...live.map(s => s.heat)) : null, top: top && top.top, topState: top && top.name };
      });
      const circActive = circ.filter(c => c.trends > 0).length;
      const kpis = [
        { label: 'States active', value: isNum(k.states_active) ? k.states_active : smap.filter(s => s.count > 0).length, unit: '/' + (isNum(k.states_measured) && k.states_measured ? k.states_measured : 36), sub: cat ? cap(cat) : 'ent + sports', subHtml: arr(k.states_empty).length ? `<span>${esc(cat ? cap(cat) : 'ent + sports')}</span>${ui.tag(arr(k.states_empty).length + ' no data', 'muted', 'Google’s feed for ' + arr(k.states_empty).map(fmt.geo).join(', ') + ' was empty at scan time — no data, not zero, and left out of the total')}` : '', tip: 'States whose Google trending list has at least one entertainment or sports trend, of the states whose list had items (latest scan).' },

        { label: 'Circles active', value: circActive, unit: '/' + circ.length, sub: 'Airtel circles', tip: 'Airtel circles covering at least one state with a trend.' },

      const mapCard = ui.card({ title: tab === 'circles' ? 'Circles' : tab === 'languages' ? 'Language regions' : 'States', icon: 'map', cls: 'pa-mapcard', tip: mapTip,

      const laneHtml = lanes.map((ln, i) => `<div class="pa-lane" style="--lc:${OV.color.series(i)}"><div class="h"><i></i><b data-go="charts" data-params="${jattr({ lang: ln.lang })}" data-tip="Open Search Trends for ${esc(ln.lang)}">${esc(ln.lang)}</b><span class="ov-note1" data-tip="Trending titles · Σ heat (latest scan)">${esc(fmt.num(ln.count))} · ${esc(fmt.dec(ln.heat_sum, 0))}</span>${ln.wiki ? `<span class="ov-note1" data-tip="${esc(`Entities read on ${ln.lang} Wikipedia in 7 days · views${wikiTo ? ' (to ' + wikiTo + ')' : ''}`)}">${OV.icon('wiki')}${esc(fmt.num(ln.wiki.count))} · ${esc(fmt.compact(ln.wiki.views_7d))}</span>` : ''}<span class="ov-note1 r" data-tip="${esc(`Trends on the lists of ${ln.lang}-speaking states (${arr(ln.region_states).map(fmt.geo).join(', ') || 'none'})`)}">${OV.icon('map')}${esc(fmt.num(ln.region_trends))}</span></div>`

            { id: 'verdict', label: 'Verdict', value: c => c.top ? OV.V_ORDER.indexOf(c.top.verdict) : null, render: c => c.top ? ui.verdict(c.top.verdict) : '', csv: c => c.top && c.top.verdict },
          ] });
      } else if (tab === 'languages') {
        table = ui.table({ id: 'rg-langs', rows: lanes, pageSize: 25, csvName: 'regions-languages', noun: 'lanes', sort: { id: 'count', dir: 'desc' },
          onRow: ln => OV.go('charts', { lang: ln.lang }),
          columns: [
            { id: 'lang', label: 'Lane', render: ln => `<div class="pa-termc"><span class="pa-sw" style="background:${OV.color.series(laneIdx[ln.lang])}"></span>${ncell(ln.lang, fmt.langCode(ln.lang), 'Language lane')}</div>`, csv: ln => ln.lang },
            { id: 'count', label: 'Titles', num: true, tip: 'Board titles in this language', render: ln => esc(fmt.num(ln.count)) },
            { id: 'heat_sum', label: 'Σ Heat', num: true, tip: 'Sum of heat of those titles', render: ln => esc(fmt.dec(ln.heat_sum, 0)) },
            { id: 'region_trends', label: 'Region', num: true, tip: 'Trends on the lists of the states that speak it', render: ln => esc(fmt.num(ln.region_trends)) },
            { id: 'wiki_n', label: 'Read', num: true, tip: 'Tracked entities read on this language’s Wikipedia in 7 days', value: ln => ln.wiki ? ln.wiki.count : null, render: ln => ln.wiki ? esc(fmt.num(ln.wiki.count)) : ui.unk('No Wikipedia views fetched'), csv: ln => ln.wiki ? ln.wiki.count : '' },
            { id: 'wiki_views', label: 'Views 7d', num: true, tip: 'Their Wikipedia views in that edition, last 7 days', value: ln => ln.wiki ? ln.wiki.views_7d : null, render: ln => ln.wiki ? esc(fmt.compact(ln.wiki.views_7d)) : ui.unk('No Wikipedia views fetched'), csv: ln => ln.wiki ? ln.wiki.views_7d : '' },
            { id: 'wiki_top', label: 'Most read', sort: false, hideBelow: 1250, tip: 'Most-read tracked entities on that edition, 7 days', render: ln => arr(ln.wiki && ln.wiki.items).slice(0, 3).map(x => esc(x.title)).join('<span class="ov-note1"> · </span>') || ui.unk('None'), csv: ln => arr(ln.wiki && ln.wiki.items).map(x => x.title).join(' | ') },
            { id: 'region_states', label: 'States', tip: 'States whose main language it is', value: ln => arr(ln.region_states).length, render: ln => `<span data-tip="${esc(arr(ln.region_states).map(fmt.geo).join(', '))}">${esc(arr(ln.region_states).map(g => g.replace('IN-', '')).join(' ') || '—')}</span>`, csv: ln => arr(ln.region_states).join(' ') },
            { id: 'top', label: 'Top titles', sort: false, render: ln => arr(ln.items).slice(0, 3).map(x => `<span class="pa-lk" data-title-key="${esc(x.key)}">${esc(x.title || x.query)}</span>`).join('<span class="ov-note1"> · </span>') || ui.unk('None'), csv: ln => arr(ln.items).map(x => x.title || x.query).join(' | ') },
          ] });
      } else {

        table = ui.table({ id: 'rg-states', rows: rowsS, pageSize: 50, csvName: 'regions-states', noun: 'states', sort: { id: 'heat', dir: 'desc' }, search: true, searchPlaceholder: 'Filter states',
          onRow: s => goState(s.geo),

            { id: 'name', label: 'State', render: s => ncell(s.name, String(s.geo).replace('IN-', ''), fmt.geo(s.geo)), csv: s => s.name },

  /* ================================================================== TITLE GAP */
  const GAP_TYPES = [['film', 'Film', ['movie', 'film']], ['series', 'Series / Show', ['series', 'show']], ['match', 'Match', ['sports_event', 'sports_generic']], ['people', 'Player / Person', ['player', 'person', 'team']], ['other', 'Other', ['music', 'platform', 'other']]];
  const gapType = t => { const g = GAP_TYPES.find(o => o[2].includes(t || 'other')); return g ? g[0] : 'other'; };
  const ACT_TONE = { promote_now: 'up', promote: 'up', counter: 'violet', check_rights: 'warn', watch: 'info', skip: 'muted' };
  // the gap row's momentum as Search Trends draws it: {state, delta, prev_rank} (a bare state string from older backends)
  const gapMom = r => { const m = r.momentum; if (m && typeof m === 'object') return m; return { state: m || null, delta: isNum(r.momentum_delta) ? r.momentum_delta : isNum(r.rank_delta) ? r.rank_delta : null, prev_rank: isNum(r.prev_rank) ? r.prev_rank : null }; };
  OV.register('gap', {
    market: false, period: false, periodTip: 'Use the window in the filter bar',
    badge: async () => { const g = await OV.api.get('/api/ott/gap', { days: 7, cat: 'all' }, { ttl: 300 }); return g && g.kpis && isNum(g.kpis.gap_titles) ? g.kpis.gap_titles : null; },
    coach: [
      { sel: '#ov-view .ov-filters', text: 'Wanted vs building · window · type' },
      { sel: '#ov-view .ov-kpis', text: 'Size of the gap · hover ⓘ for rules' },

    async render(el, ctx) {
      const P = ctx.params;

      const cat = ['entertainment', 'sports'].includes(P.cat) ? P.cat : 'all';
      const days = [1, 3, 7, 14, 30].includes(+P.days) ? +P.days : 7;
      el.innerHTML = ui.pageHeader({ title: 'Title Gap' }) + ui.skeleton('kpis', 5) + ui.skeleton('page');
      let g; try { g = await OV.api.get('/api/ott/gap', { days, cat }, { ttl: 300 }); } catch (e) { if (ctx.alive()) errPage(el, 'Title Gap', e); return; }
      if (!ctx.alive()) return;
      const k = g.kpis || {};
      const all = arr(tab === 'building' ? g.building : g.wanted).map((r, i) => Object.assign({}, r, { pos: i + 1 }));
      const tcount = {}; all.forEach(r => { const t = gapType(r.type); tcount[t] = (tcount[t] || 0) + 1; });
      const rows = all.filter(r => (!P.type || gapType(r.type) === P.type) && (!P.rights || r.on_xstream === P.rights));
      const lane = k.gap_demand_lane || 'entertainment';

      const hot = rows.filter(x => x._live).sort((a, b) => (b._live.heat || 0) - (a._live.heat || 0));
      const hotCard = ui.card({ title: 'Trending now', icon: 'bolt', tip: 'Fixtures in the window that are on Search Trends now — heat (0–100), Google’s search volume (a lower bound) and India rank, from the newest read. Click to open.',
        actions: `<span class="ov-note1" data-tip="Search Trends · India · newest read">Google · India${hot.length && hot[0]._live.hhmm ? ' · ' + esc(hot[0]._live.hhmm) : ''}</span>`,
        // a side list follows the row rule: thumb · name · one meta line | heat | searches · rank | rights | bundle
        body: hot.length ? `<div class="pa-hot">${hot.map(x => { const L = x._live; return `<div class="pa-hotr" role="button" tabindex="0" data-act="paFx" data-arg="${esc(x.id)}">${tcell(x, nameOf(x), [x.competition || x.stage || '', awayTxt(x.days_away)].filter(Boolean).join(' · '), [x.stage, x.india ? 'India playing' : ''])}${ui.heat(L.heat, { tip: 'Heat on Search Trends now (0–100)' })}<span class="vl" data-tip="${esc([isNum(L.volume) ? 'Google search volume (a lower bound)' : 'Search volume not shown by Google', isNum(L.rank) ? '#' + L.rank + ' on the India list' : ''].filter(Boolean).join('\n'))}">${isNum(L.volume) ? esc(volTxt(L.volume)) : '—'}${isNum(L.rank) ? `<small>#${esc(L.rank)}</small>` : ''}</span><span class="pl">${x.platform ? ui.platform(x.platform, { noVia: true, short: true }) : ui.unk('Rights not announced')}${bundleTag(x.bundle)}</span></div>`; }).join('')}</div>`
          : ui.empty('None on Google’s lists now') });
      const soonAll = rows.filter(x => x.days_away === 0 || x.days_away === 1).sort((a, b) => a.days_away - b.days_away || dayOrder(a, b));
      const soon = soonAll.filter(x => x._live || x.india).concat(soonAll.filter(x => !x._live && !x.india)).slice(0, 6);
      const soonRest = soonAll.slice(0).filter(x => !soon.includes(x));
      const restBy = {}; soonRest.forEach(x => { const c = String(x.competition || 'Other').split(',')[0].trim(); restBy[c] = (restBy[c] || 0) + 1; });
      const soonCard = ui.card({ title: 'Today & tomorrow', icon: 'calendar', tip: 'Fixtures today and tomorrow — trending ones first, then India, then tier.',
        body: soon.length ? `<table class="ov-mini pa-soon"><tbody>${soon.map(x => `<tr data-act="paFx" data-arg="${esc(x.id)}" style="cursor:pointer"><td class="d">${esc(x.days_away === 0 ? 'Today' : 'Tmrw')}</td><td>${tcell(x, nameOf(x), x.competition || x.stage || metaOf(x), [x.stage, x.india ? 'India playing' : ''])}</td><td class="r">${x._live ? trChip(x._live, { compact: true }) : ui.unk('Not on Google’s lists now')}</td><td class="r">${bundleTag(x.bundle)}</td></tr>`).join('')}</tbody></table>${soonRest.length ? `<div style="margin-top:6px">${ui.tag('+' + soonRest.length + ' more', 'muted', Object.entries(restBy).sort((a, b) => b[1] - a[1]).map(([c, n2]) => c + ' ×' + n2).join('\n') + '\nAll in the table below')}</div>` : ''}`
          : ui.empty('No fixtures today or tomorrow') });
      const main = ui.grid('minmax(0,2.2fr) minmax(0,1.15fr)', [strip, ui.stack([hotCard, soonCard, side])], { stretch: true });
      const table = ui.table({
        id: 'fixtures-main', rows, pageSize: 50, csvName: `fixtures-${days}d`, search: true, searchPlaceholder: 'Filter matches', noun: 'fixtures', sort: { id: 'rank', dir: 'asc' },
        onRow: fxOpen, rowClass: x => x.india ? 'pa-ind' : '',
        toolbar: `<span><b>${esc(fmt.num(n))}</b> fixtures · ${esc(fmt.day(f.from))} – ${esc(fmt.day(f.to))}</span>`,
        empty: 'No fixture matches these filters',
        columns: [
          { id: 'rank', label: '#', num: true, cls: 'rk', width: '34px', tip: f.rank_rule || 'India playing › tier › rights known › date', render: x => `<span data-tip="${esc(x.rank_reason || '')}">${esc(x.rank)}</span>` },
          { id: 'date_start', label: 'Date', tip: f.time_note || 'Date (IST)', render: x => dateCell(x.date_start, x.days_away) + (x.time ? ` <span class="ov-note1" data-tip="${esc('Start ' + x.time + ' IST · ' + (x.time_source || 'as listed on the calendar row'))}">${esc(x.time)}</span>` : ''), csv: x => x.date_start + (x.time ? ' ' + x.time : '') },
          { id: 'match', label: 'Match', value: x => x.match, render: x => tcell(x, x.match || x.title, stageShort(x) || metaOf(Object.assign({ type: 'sports_event' }, x)), [x.title !== (x.match || x.title) ? x.title : '', x.stage, x.india ? 'India playing' : '']), csv: x => x.title },
          { id: 'competition', label: 'Competition', hideBelow: 1300, tip: 'Format or event', render: x => `<span class="clip" data-tip="${esc((x.competition || '') + (x.tier_label ? ' · ' + x.tier_label : ''))}">${esc(x.competition || '—')}</span>` },
          { id: 'sport', label: 'Sport', hideBelow: 1180, render: x => x.sport ? ui.tag(SPORT_L[x.sport] || cap(x.sport), 'teal') : ui.unk('Sport unknown') },
