          { id: 'indic7', label: 'Indian 7d', num: true, hide: true, tip: 'Indian-language editions (hi ta te kn ml mr bn), 7 days', render: r => isNum(r.indic7) ? esc(fmt.num(r.indic7)) : ui.unk('No Indian-language article') },
          { id: 'en_world7', label: 'EN world', num: true, hide: true, tip: 'English Wikipedia worldwide, 7 days', render: r => isNum(r.en_world7) ? esc(fmt.num(r.en_world7)) : ui.unk('No English article') },
          { id: 'en_in7', label: 'EN·IN', num: true, hide: true, tip: 'English from India: India’s per-country list. ≤ when listed all 7 days (a ceiling); a range when off the list some days (unknown, up to that day’s cutoff)', render: r => !isNum(r.en_in7) ? ui.unk('No per-country list stored') : isNum(r.en_in_hi) && r.en_in_hi > r.en_in7 ? esc(fmt.num(r.en_in7) + '–' + fmt.num(r.en_in_hi)) : esc('≤ ' + fmt.num(r.en_in7)), csv: r => r.en_in7 },
          { id: 'status', label: 'Status', hide: true, tip: 'Status on the list page / infobox', render: r => esc(r.status || '—') },
          { id: 'qid', label: 'Wikidata', hide: true, render: r => esc(r.qid || '—') },
        ].filter(Boolean),
      });
      el.innerHTML = ui.page({
        title: 'Title Attention by Platform', subtitle: 'Wikipedia reads per platform · not viewing', actions,
        tip: 'Each platform’s catalogue as Wikipedia records it, ranked by Wikipedia reading over 7 days. ' + (RULES.latest || '') + ' Reads, not viewers: most-read on Wikipedia, never most watched.',
        strip: `<div class="pc-tabs"><div class="pc-view">${ui.chips('view', [['', 'Wikipedia reads'], ['trailers', 'YouTube trailers']], '')}</div>${tabs}</div>` + `<div class="ov-rh-row">${ui.rankHeader(shortHd, { icon: 'wiki', block: true })}${allTime ? ui.tag('All time', 'muted', 'Whole catalogue') : ui.tag('Latest · new or airing since ' + fmt.day(d.since), 'info', latestTip)}</div>`, filters, kpis, main, table, extra: noReadsGroup(d),
      });
      // Netflix match, week by week (bars): drawn after the page so it sizes to its card
      const wk = el.querySelector('#pc-wk');
      if (wk && n) {
        try {
          const c = await OV.api.get(API + '/calibration', null, { ttl: 600 });
          if (!ctx.alive()) return;
          const det = arr(c.detail);
          if (det.length) wk.innerHTML = ui.bars({ x: det.map(w => fmt.day(w.week)), values: det.map(w => w.hits), h: 70, fmt: v => String(v), tipFmt: v => v + ' of 20 matched', highlightLast: true });
        } catch (e) { /* the bars are decoration: the KPI already carries the number */ }
      }
      if (P.key) OV.go('detail', { pkey: P.key }, { replace: true });   // deep link: #/platforms?key=Q123 opens its page
    },
  });
})();

</script>
<script>
/* ---- pages_today.js ---- */
/* =====================================================================================================
   OTTVerse Trends — Today (#/today, the home page): the morning brief. "What should Airtel Xstream do today?"
   Everything is decided by ott/today.py from stored data (/api/ott/today) — rules, no LLM, no paid call.
   Sections: header strip (date · freshness · data health) → KPIs → Promote today (top 8) + Matches →
   Changed since yesterday · Landing this week · Just happened (hidden when empty) → Export (one-page HTML).
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const D = OV.data;
  const EXPORT = '/api/ott/today/export.html';
  D.today = force => OV.api.get('/api/ott/today', null, { ttl: 60, force: !!force });

  const HR = 3600, DY = 86400;
  const nowS = () => Date.now() / 1000;
  const hhmm = ts => isNum(ts) ? fmt.time(ts) : '—';
  const dayOf = s => s ? fmt.day(s) : '—';
  // age → ok / warn / bad (the dot beside each freshness item)
  const ageLevel = (ts, warn, bad) => !isNum(ts) ? 'off' : nowS() - ts > bad ? 'bad' : nowS() - ts > warn ? 'warn' : 'ok';
  const dayLevel = (day, warnD, badD) => { const ts = OV.toTs(day); return ts == null ? 'off' : ageLevel(ts + DY, warnD * DY, badD * DY); };
  const REACH_TONE = { p99: 'up', p279: 'info', pack: 'violet', prime: 'warn', free: 'muted', none: 'muted' };
  const CONF_TONE = { high: 'up', medium: 'info', low: 'muted' };
  const reachTag = r => r && r.word ? ui.tag(r.word, REACH_TONE[r.code] || 'muted', 'Airtel route: ' + r.word) : ui.unk('No Airtel route');
  // monogram (+ name when `name`) + the Airtel route; the name is always in the monogram's tooltip
  const where = (platform, reach, name) => platform ? `<span class="tw-wh">${ui.platform(platform, { short: true, noVia: true })}${name ? `<span class="nm">${esc(platform)}</span>` : ''}${reachTag(reach)}</span>` : ui.unk('Platform unknown');
  const openAttrs = x => x.key ? `data-title-key="${esc(x.key)}"` : `data-go="title" data-params="${esc(JSON.stringify({ q: x.title || '' }))}"`;

  /* ---------------- header strip: date · freshness · data health */
  function strip(T) {
    const f = T.freshness || {}, h = f.health || {};
    const it = (lv, label, val, tip) => `<span class="it" data-tip="${esc(tip)}"><span class="tw-dot ${esc(lv)}"></span>${esc(label)} <b>${esc(val)}</b></span>`;
    const sc = f.scan || {}, rs = f.rss || {}, wk = f.wiki || {};
    const hl = String(h.level || '').toLowerCase();
    const htone = /^(ok|good|green|fresh)$/.test(hl) ? 'up' : /^(warn|amber|stale|degraded)$/.test(hl) ? 'warn' : /^(bad|red|down|fail|error)/.test(hl) ? 'down' : 'muted';
    const health = h.available
      ? `<button class="it tw-hl" ${OV.has('health') ? 'data-go="health" data-params="{}"' : ''} data-tip="${esc('Data health' + (h.tip ? '\n' + h.tip : ''))}">Data health ${ui.tag(h.label ? String(h.label).charAt(0) + String(h.label).slice(1).toLowerCase() : '—', htone)}</button>`
      : `<span class="it" data-tip="${esc(h.tip || 'Data health is not available yet')}">Data health <b>—</b></span>`;
    return `<div class="ov-strip tw-strip">
      <span class="it tw-date"><b>${esc(T.date_label || '—')}</b></span><span class="sep"></span>
      ${it(ageLevel(sc.at, 12 * HR, 36 * HR), 'Google scan', sc.at ? `${fmt.day(sc.at)} ${hhmm(sc.at)}` : '—', `Google scan: ${sc.cost ? sc.cost + ' ' : ''}Trending-now scan${sc.id ? ' #' + sc.id : ''} · finished ${sc.ist || '—'}`)}
      ${it(ageLevel(rs.at, 2 * HR, 6 * HR), 'RSS', rs.at ? hhmm(rs.at) : '—', `Google RSS: free Trending-now RSS sweep · ${rs.ist || 'none yet'}${rs.lists ? ' · ' + rs.lists + ' lists' : ''}`)}
      ${it(dayLevel(wk.day, 2, 4), 'Wiki reads', wk.day ? fmt.day(wk.day) : '—', 'Newest day of Wikipedia page views stored (Wikimedia publishes about a day late). Reads, not viewing.')}
      ${health}<span class="sp"></span>
      <span class="it ov-note1" data-tip="Built from stored data only · no paid call">as of ${esc(hhmm(T.as_of))}</span>
    </div>`;
  }

  /* ---------------- Promote today */
  // every number on a chip is the server's own display string — the drawer's "Why" quotes the same strings
  function sigChip(s, disp) {
    disp = disp || {};
    const at = s.as_of_ist || (s.as_of_day ? fmt.day(s.as_of_day) : '—');
    const src = `${s.source || '—'} · ${at}`;
    if (s.kind === 'google') {
      const g = disp.google || (isNum(s.value) ? fmt.heat(s.value) : '—'), st = disp.states || (isNum(s.states) ? String(s.states) : null);
      const tip = [`Google heat ${g} of 100${st && st !== '—' ? ' · observed in ' + st + ' of ' + (isNum(s.reporting) ? s.reporting : '—') + ' reporting state feeds' : ''}`, s.rows > 1 ? `Taken from the match’s own row (${s.rows} rows: spellings / players)` : '', src].filter(Boolean).join('\n');
      return `<span class="tw-sig g" data-tip="${esc(tip)}"><i>G</i>${esc(g)}${st && st !== '—' ? `<small>${esc(st)} st</small>` : ''}</span>`;
    }
    if (s.kind === 'wiki' || s.kind === 'platform') {
      const isNew = /^New on/.test(s.label || '');
      const tip = [s.label, isNum(s.reads) ? fmt.num(Math.round(s.reads)) + ' ' + (s.reads_basis || 'reads') + ' in 7 days' : '', isNum(s.rank) ? 'Title Attention by Platform #' + s.rank : '', 'Wikipedia page views — reads, not viewing', src].filter(Boolean).join('\n');
      const v = disp.wiki || (isNum(s.value) ? (s.value > 0 ? '+' : '') + fmt.dec(s.value, 0) + '%' : '');
      return `<span class="tw-sig w" data-tip="${esc(tip)}"><i>W</i>${isNew ? esc(s.label) : esc(v)}${isNum(s.reads) ? `<small>${esc(disp.reads || fmt.compact(s.reads))}</small>` : ''}</span>`;
    }
    const live = /LIVE/.test(s.label || '');
    const tip = [s.label, s.competition, s.rights ? 'Rights: ' + s.rights : '', s.bundle ? 'Xstream: ' + s.bundle : '', s.window ? `Window ${s.window.from_ist} → ${s.window.to_ist}` : '', src].filter(Boolean).join('\n');
    return `<span class="tw-sig m${live ? ' live' : ''}" data-tip="${esc(tip)}">${live ? '<b class="dot"></b>' : `<i>${OV.icon('match')}</i>`}${esc(s.label)}</span>`;
  }
  function scoreCell(a, max) {
    const p = a.parts || {}, W = { google: 40, wiki: 25, timing: 20, airtel: 15 };
    const dp = ((a.decision || {}).display || {}).parts || {};
    const sc = ((a.decision || {}).display || {}).score || fmt.dec(a.score, 1);
    const tip = ['Score ' + sc + ' of 100'].concat(Object.keys(W).map(k => `${{ google: 'Google', wiki: 'Wikipedia', timing: 'Timing', airtel: 'Airtel fit' }[k]} ${dp[k] || fmt.dec((p[k] || 0) * W[k], 1)} of ${W[k]}`)).join('\n');
    return `<span class="tw-sc" data-tip="${esc(tip)}"><b>${esc(sc)}</b><i style="--w:${OV.clamp(a.score / (max || 100) * 100, 0, 100)}%"></i></span>`;
  }
  function xsCell(a, cat) {
    if (a.on_xstream === true) return '<span class="tw-xs on" data-tip="In the Xstream catalogue">✓</span>';
    if (a.on_xstream === false) return '<span class="tw-xs" data-tip="Not found in the Xstream catalogue">✕</span>';
    return ui.unk(cat && cat.loaded ? 'No catalogue answer for this title' : 'No Xstream catalogue loaded');
  }
  function promoteCard(T) {
    const A = arr(T.actions), cat = T.xstream_catalog || {};
    const max = Math.max(100, ...A.map(a => a.score || 0));
    const rows = A.map((a, i) => {
      const mem = arr(a.members), d = a.decision || {};
      // the row keeps ONE meta line (type · language); folded players and the freshness of each signal ride the hover
      const tip = [mem.length ? 'Folded in: ' + mem.join(', ') : '', ...arr(d.tags).filter(t => t.kind !== 'match').map(t => t.text)].filter(Boolean).join('\n');
      const confTip = a.confidence === 'high' ? 'High: two or more independent signals agree (Google · Wikipedia · fixture calendar), or the verdict engine says high' : 'One signal; its own confidence';
      return `<tr class="click" data-act="todayWhy" data-arg="${esc(i)}" tabindex="0" data-tip="Why this recommendation?">
        <td class="rk">${esc(a.rank)}</td>
        <td class="nmc">${ui.nameCell(a, { name: a.title, tip })}</td>
        <td class="sg">${arr(a.signals).map(s => sigChip(s, d.display)).join('')}</td>
        <td class="wh">${where(a.platform, a.reach, true)}</td>
        <td class="cf">${d.expired ? ui.tag('Re-check', 'warn', 'The newest signal behind this action is past its limit\nConfidence: ' + (a.confidence || '—')) : ui.tag(a.confidence || '—', CONF_TONE[a.confidence] || 'muted', confTip)}</td>
        <td class="sc">${scoreCell(a, max)}</td>
        <td class="xs">${xsCell(a, cat)}</td></tr>`;
    }).join('');
    const body = A.length ? `<div class="tw-scroll"><table class="ov-t tw-t tw-act"><thead><tr><th>#</th><th>Title</th><th>Why${ui.tip('The signal that fired, with its number. G = Google heat (0–100) · W = Wikipedia reads rise (7 days) · match = fixture calendar. Hover a chip for source and time.')}</th><th>Where</th><th>Conf.</th><th>Score${ui.tip(T.score_rule || '')}</th><th data-tip="On Xstream: ✓ in the Xstream catalogue · — no catalogue loaded">Xs</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : ui.empty('No action passes the rules today', { action: { label: 'Search Trends', go: ['charts', {}] } });
    OV.trust.actions = A;
    return ui.card({ title: 'Promote today', icon: 'bolt', tip: T.score_rule + '\nClick a row: why this recommendation, with every number from the row.', cls: 'tw-promote', pad: false, body,
      badge: T.header ? ' ' + ui.rankHeader(T.header, { icon: 'today' }) : '',
      actions: OV.has('charts') ? ui.btn('Search Trends', { cls: 'sm', go: ['charts', { verdict: 'promote_now' }] }) : '' });
  }
  OV.actions.todayWhy = i => OV.trust.openAction(arr(OV.trust.actions)[+i]);

  /* ---------------- Matches: live · today · tomorrow */
  const BUNDLE_TONE = { 'in bundle': 'up', 'via pack': 'info' };
  const BUNDLE_WORD = { 'in bundle': 'Bundle', 'via pack': 'Pack' };   // the full words ride the pill's hover
  // one meta line: the competition up to its first comma ("UEFA Nations League 2026–27"); the full one, the long
  // title and "India playing" sit in the hover
  function matchName(m) {
    const it = Object.assign({ type: 'sports_event' }, m);
    const comp = m.competition && m.competition !== m.title ? String(m.competition).split(/,\s*/)[0] : '';
    return ui.nameCell(it, { name: m.title, meta: comp || OV.rowMeta(it), tip: [m.full && m.full !== m.title ? m.full : '', comp && comp !== m.competition ? m.competition : '', m.india ? 'India playing' : ''].filter(Boolean).join('\n') });
  }
  function matchesCard(T) {
    const M = T.matches || {}, items = arr(M.items), c = M.counts || {};
    const rows = items.map(m => {
      const when = m.live ? `<span class="tw-live" data-tip="${esc('In its window: ' + (m.window_from || '') + ' → ' + (m.window_to || ''))}"><b class="dot"></b>LIVE</span>`
        : m.ended ? `<span class="tw-when" data-tip="${esc('Match over: ' + (m.ended_why || 'its window has passed'))}">Ended</span>`
        : `<span class="tw-when${m.when === 'today' ? ' today' : ''}"${m.start_hhmm ? '' : ' data-tip="The calendar has the date, not the start time"'}>${m.when === 'today' ? 'Today' : 'Tomorrow'}</span>`;
      const st = m.start_hhmm ? `<span class="tm" data-tip="Start time as listed on the calendar row (IST)">${esc(m.start_hhmm)}</span>` : '';   // no start time: the line stays empty (the reason is on the day's hover), never a dash under the day
      return `<tr class="click" ${m.trending_key ? `data-title-key="${esc(m.trending_key)}"` : `data-go="fixtures" data-params="{}"`} tabindex="0">
        <td class="wn">${when}<div class="mem st">${st}</div></td>
        <td class="nmc">${matchName(m)}</td>
        <td class="bd"><span class="tw-wh">${m.platform ? where(m.platform, m.reach) : ui.unk(m.rights || 'Rights not on the calendar')}${m.bundle && m.bundle !== 'unknown' ? ui.tag(BUNDLE_WORD[m.bundle] || m.bundle, BUNDLE_TONE[m.bundle] || 'muted', 'Xstream: ' + m.bundle + ' (fixture calendar)' + (m.rights ? '\nRights: ' + m.rights : '')) : ui.unk('Bundle status unknown')}</span></td></tr>`;
    }).join('');
    const sub = `${isNum(c.live) && c.live ? c.live + ' live · ' : ''}${fmt.num(c.today || 0)} today · ${fmt.num(c.tomorrow || 0)} tomorrow`;
    const body = items.length ? `<div class="tw-scroll"><table class="ov-t tw-t tw-mt"><tbody>${rows}</tbody></table></div>${M.more ? `<div class="tw-more">${ui.btn('+' + fmt.num(M.more) + ' more · Fixtures', { cls: 'sm', go: ['fixtures', {}] })}</div>` : ''}`
      : ui.empty('No match today or tomorrow', { action: { label: 'Fixtures', go: ['fixtures', {}] } });
    return ui.card({ title: 'Matches', icon: 'match', tip: (M.rule || '') + '\nRights holder and Xstream bundle status from the fixture calendar · no score source is used', cls: 'tw-matches', pad: false, body, badge: `<span class="ov-note1 tw-cs">${esc(sub)}</span>` });
  }

  /* ---------------- Changed since yesterday */
  function changeCard(T) {
    const C = T.changes || {}, items = arr(C.items), n = C.counts || {};
    const rows = items.map(c => {
      // 'diff' = the two heats were measured differently (growth in one scan only, other state feeds): no arrow
      const tag = c.kind === 'new' ? '<span class="ov-d new">New</span>' : c.kind === 'up' ? '<span class="ov-d up">▲</span>' : c.kind === 'down' ? '<span class="ov-d down">▼</span>' : `<span class="ov-d" data-tip="${esc('Different measurement' + (c.different ? ': ' + c.different : ''))}">≠</span>`;
      const at = c.as_of_ist || (c.as_of_day ? fmt.day(c.as_of_day) : '—');
      let val;
      // every row names the read its number comes from ('scan 17:45', 'Indian-language reads') — the scan's heat
      // can differ from the newer RSS heat in Promote today
      const basisTxt = c.board === 'Google' ? (c.read || '') : (c.unit || 'reads');
      if (c.board === 'Google') val = c.kind === 'new' ? `<b>${esc(fmt.dec(c.value, 0))}</b>` : c.kind === 'diff' ? `${esc(fmt.dec(c.prev, 0))} → <b>${esc(fmt.dec(c.value, 0))}</b>` : `${esc(fmt.dec(c.prev, 0))} → <b>${esc(fmt.dec(c.value, 0))}</b> ${ui.delta(c.delta, { unit: 'n', chip: false })}`;
      else val = `${esc(fmt.compact(c.prev))} → <b>${esc(fmt.compact(c.value))}</b> ${ui.delta(c.pct, { unit: '%', chip: false })}`;
      if (basisTxt) val += `<div class="mem">${esc(c.kind === 'diff' ? 'Different measurement · ' + basisTxt : basisTxt)}</div>`;
      const tip = [c.board === 'Google' ? 'Google heat (0–100)' : `Wikipedia ${c.unit || 'reads'}, one day (reads, not viewing)`, c.basis, `${c.source} · ${at}`].filter(Boolean).join('\n');
      return `<tr class="click" ${openAttrs(c)} tabindex="0"><td class="wn">${tag}</td>
        <td class="nmc">${ui.nameCell(c, { name: c.title, meta: OV.rowMeta(c, c.board === 'Google' ? 'Google' : 'Wikipedia'), tip: c.board === 'Google' ? 'Google Trending now' : 'Wikipedia reads' })}</td>
        <td class="vl r" data-tip="${esc(tip)}">${val}</td></tr>`;
    }).join('');
    const tip = (C.rule || '') + (C.google_basis ? '\nGoogle: ' + C.google_basis : '') + (C.wiki_day ? `\nWikipedia: ${C.wiki_day} vs ${C.wiki_prev_day}` : '');
    const sub = isNum(n.google_new) ? `${fmt.num(n.google_new)} new · ${fmt.num((n.google_up || 0) + (n.wiki_up || 0))} up · ${fmt.num((n.google_down || 0) + (n.wiki_down || 0))} down` : '';
    return ui.card({ title: 'Since yesterday', icon: 'explore', tip, pad: false, cls: 'tw-chg', badge: sub ? `<span class="ov-note1 tw-cs">${esc(sub)}</span>` : '',
      body: items.length ? `<div class="tw-scroll"><table class="ov-t tw-t"><tbody>${rows}</tbody></table></div>` : ui.empty('No comparable earlier data yet') });
  }

  /* ---------------- Landing this week */
  function landingCard(T) {
    const L = T.landing || {}, items = arr(L.week);
    const plat = arr(L.by_platform).map(p => `<span class="tw-pp" data-tip="${esc(p.platform + ' · ' + ((p.reach || {}).word || '—'))}">${ui.platform(p.platform, { short: true, noVia: true })}<b>${esc(p.count)}</b></span>`).join('');
    const rows = items.map(x => `<tr class="click" data-go="title" data-params="${esc(JSON.stringify({ q: x.title || '' }))}" tabindex="0">
        <td class="wn" data-tip="${esc(x.date)}"><b>${esc(fmt.weekday(x.date))} ${esc(dayOf(x.date))}</b><div class="mem">${x.days === 0 ? 'today' : 'in ' + esc(x.days) + ' d'}</div></td>
        <td class="nmc">${ui.nameCell(x, { name: x.title, tip: 'Source: ' + (x.source_word || x.source || '—') + (x.source_word && x.source && x.source !== x.source_word ? ' (' + x.source + ')' : '') + (x.as_of_day ? ' · as of ' + x.as_of_day : '') })}</td>
        <td class="wh">${where(x.platform, x.reach)}</td></tr>`).join('');
    const sub = `${fmt.num(L.count_7 || 0)} in 7 d · ${fmt.num(L.count_30 || 0)} in 30 d`;
    return ui.card({ title: 'Landing this week', icon: 'release', tip: L.rule || '', pad: false, cls: 'tw-land', badge: `<span class="ov-note1 tw-cs">${esc(sub)}</span>`,
      body: (plat ? `<div class="tw-plats">${plat}</div>` : '') + (items.length ? `<div class="tw-scroll"><table class="ov-t tw-t"><tbody>${rows}</tbody></table></div>` : ui.empty(`Nothing dated in the next 7 days${L.count_30 ? ' · ' + L.count_30 + ' in 30 days' : ''}`, { action: OV.has('platforms') ? { label: 'Title Attention by Platform', go: ['platforms', {}] } : null })) });
  }

  /* ---------------- Just happened (edit bursts) — hidden when missing or empty */
  function burstCard(T) {
    const B = T.bursts || {}, items = arr(B.items);
    if (!B.available || !items.length) return '';
    const rows = items.map(b => `<tr class="click" ${b.key ? `data-title-key="${esc(b.key)}"` : `data-go="title" data-params="${esc(JSON.stringify({ q: b.title || '' }))}"`} tabindex="0">
        <td class="wn"><b>${esc(b.hhmm || '—')}</b></td>
        <td class="nmc">${ui.nameCell(b, { name: b.title, meta: [b.kind && b.kind !== 'Edit burst' ? b.kind : '', b.wiki ? b.wiki + ' Wikipedia' : ''].filter(Boolean).join(' · '), tip: b.label && b.label !== b.title ? b.label : '' })}</td>
        <td class="vl r"data-tip="${esc('Wikipedia edits · ' + (b.at_ist || '—') + (isNum(b.editors) ? '\n' + b.editors + ' editors' : '') + (isNum(b.window_min) ? ' in ' + b.window_min + ' min' : ''))}"><b>${esc(isNum(b.edits) ? fmt.num(b.edits) : '—')}</b> edits${isNum(b.editors) ? `<div class="mem">${esc(b.editors)} ed.${isNum(b.window_min) ? ' · ' + esc(b.window_min) + ' min' : ''}</div>` : ''}</td></tr>`).join('');
    return ui.card({ title: 'Just happened', icon: 'alerts', tip: 'Wikipedia edit bursts on tracked titles, last 24 h (edits, not reads)', pad: false, cls: 'tw-burst',
      body: `<div class="tw-scroll"><table class="ov-t tw-t"><tbody>${rows}</tbody></table></div>`, actions: OV.has('alerts') ? ui.btn('Alerts', { cls: 'sm', go: ['alerts', {}] }) : '' });
  }

  /* ---------------- Trailers this week (YouTube via SerpApi, India): what the platforms are pushing */
  // One row per PLATFORM (its fastest-rising title, views per day since upload), the really-trending titles first, at
  // most 6; a soap's daily promos fold into one title (OV.trailers, pages_platforms.js). The platform monogram sits in
  // its own cell so a two-line name never hides it; the meta line is kind · age, the channel rides the hover.
  const VERDICT_SHORT = { really_trending: 'Trending', searched: 'Searched', pushed: 'Pushed', fading: 'Fading', steady: 'Steady' };
  function trailersCard(TR) {
    const T = OV.trailers || {};
    const all = arr(TR && TR.items);
    if (!all.length) return '';
    const titles = T.group ? T.group(all) : all;
    const TRENDING = new Set(['really_trending', 'searched_pushed']);                 // two signals up, both ways
    const pace = r => (T.pace ? T.pace(r) : null) || 0;
    const ranked = titles.slice().sort((a, b) => pace(b) - pace(a) || (b.views || 0) - (a.views || 0));
    const rows = [], seenP = new Set(), seenT = new Set();
    const take = r => { const k = (r.platform || '') + '|' + String(r.title || '').toLowerCase(); if (rows.length >= 6 || seenT.has(k)) return; rows.push(r); seenP.add(r.platform); seenT.add(k); };
    ranked.filter(r => TRENDING.has((r.verdict || {}).code)).forEach(take);
    ranked.forEach(r => { if (!seenP.has(r.platform)) take(r); });
    const vc = (TR && TR.verdict_counts) || null;                                       // the server's count over every title
    const rt = vc ? (vc.really_trending || 0) + (vc.searched_pushed || 0) : titles.filter(r => TRENDING.has((r.verdict || {}).code)).length;
    const nTitles = isNum(TR && TR.total_titles) ? TR.total_titles : titles.length;
    const kindWord = r => T.kindWord ? T.kindWord(r.kind) : (r.kind || '');
    const age = r => isNum(r.published_ts) ? fmt.ago(r.published_ts) : '';
    const html = rows.map(r => {
      const go = T.go ? T.go(r) : null;
      const open = go ? `data-go="${esc(go[0])}" data-params="${esc(JSON.stringify(go[1]))}"` : `data-go="platforms" data-params="${esc(JSON.stringify({ view: 'trailers', tab: r.platform }))}"`;
      const meta = [r.kind_label || kindWord(r), age(r) ? age(r) + ' ago' : ''].filter(Boolean).join(' · ');
      const tip = [r.platform, kindWord(r), age(r) ? 'uploaded ' + fmt.day(r.published_ts) : '', r.channel ? 'channel: ' + r.channel : '', r.n_videos > 1 ? r.n_videos + ' videos this week' : '', r.title_raw && r.title_raw !== r.title ? r.title_raw : ''].filter(Boolean).join('\n');
      // one short word under the views (the full verdict and its reason on hover) so the name keeps its width
      const line = r.verdict && r.verdict.code !== 'unknown' ? `<div class="mem" data-tip="${esc(r.verdict.label + (r.verdict.why ? ' · ' + r.verdict.why : ''))}">${esc(VERDICT_SHORT[r.verdict.code] || r.verdict.label)}</div>`
        : r.google ? `<div class="mem" data-tip="${esc('On Google now: #' + r.google.rank + ' · heat ' + fmt.dec(r.google.heat, 0))}">Google #${esc(r.google.rank)}</div>`
        : `<div class="mem">${esc(isNum(pace(r)) && pace(r) > 0 ? fmt.compact(pace(r)) + '/day' : r.n_videos > 1 ? r.n_videos + ' videos' : kindWord(r))}</div>`;
      return `<tr class="click" ${open} tabindex="0">
        <td class="nmc">${ui.nameCell({ name: r.title, key: r.match_label || r.title, type: r.kind === 'song' ? 'music' : 'other' }, { meta, tip })}</td>
        <td class="wh">${ui.platform(r.platform, { short: true, noVia: true })}</td>
        <td class="vl r" data-tip="${esc('YouTube views when last searched' + (r.n_videos > 1 ? ' · ' + r.n_videos + ' videos summed' : '') + (isNum(r.gain_1d) && r.gain_1d > 0 ? '\n+' + fmt.num(r.gain_1d) + ' since yesterday' : ''))}"><b>${isNum(r.views) ? esc(fmt.compact(r.views)) : ui.unk('Views not shown by YouTube')}</b>${line}</td></tr>`;
    }).join('');
    return ui.card({ title: 'Trailers this week', icon: 'platforms', tip: 'What each platform is pushing in India: its fastest-rising YouTube trailer this week (views per day since upload), one row per platform, really-trending titles first. SerpApi, gl=IN. Attention, not viewing. “Google #n” = on Google’s Trending-now lists right now.', pad: false, cls: 'tw-trail',
      badge: `<span class="ov-note1 tw-cs" data-tip="${esc('Top ' + fmt.num(titles.length) + ' of the titles pushed this week · ' + fmt.num(rt) + ' really trending (two of three signals up: reads, search, views)')}">${esc('top ' + fmt.num(titles.length) + ' · ' + fmt.num(rt) + ' trending')}</span>`,
      body: `<div class="tw-scroll"><table class="ov-t tw-t"><tbody>${html}</tbody></table></div>`, actions: ui.btn('All trailers', { cls: 'sm', go: ['platforms', { view: 'trailers' }] }) });
  }

  /* ---------------- export: the server's one-page HTML brief */
  OV.actions.todayExport = () => {
    const a = document.createElement('a');
    a.href = EXPORT; a.download = ''; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    OV.toast('Brief downloading · one HTML page, print-ready');
  };

  OV.register('today', {
    market: false, period: false,
    export() { OV.actions.todayExport(); },
    coach: [
      { sel: '#ov-view .tw-strip', text: 'Freshness of every source · data health' },
      { sel: '#ov-view .tw-promote', text: 'The 8 things to push today · hover for why' },
      { sel: '#ov-view .tw-matches', text: 'Live, today and tomorrow · rights holder' },
      { sel: '#ov-view .tw-chg', text: 'What moved since yesterday' },
      { sel: '#ov-view .tw-trail', text: 'What the platforms push · YouTube · on Google?' },
      { sel: '#ov-view .tw-exp', text: 'One-page brief to share or print' },
    ],
    async render(el, ctx) {
      const actions = `<button class="ov-btn sm pri tw-exp" data-act="todayExport" data-tip="Download a one-page HTML brief (light, print-ready). Every number carries its time and source.">${OV.icon('download')}Export brief</button>${ui.btn('Print', { cls: 'sm', icon: 'print', act: 'print' })}`;
      el.innerHTML = ui.pageHeader({ title: 'Today', subtitle: 'What to push today' }) + ui.skeleton('page');
      let T, TR = null;
      try { [T, TR] = await Promise.all([D.today(), OV.api.get('/api/ott/trailers', { days: 7, limit: 8, slim: 1 }, { ttl: 300 }).catch(() => null)]); } catch (e) {
        if (!ctx.alive()) return;
        if (e.status === 404 && OV.has('overview')) { OV.go('overview', {}, { replace: true }); return; }   // a server not restarted yet
        el.innerHTML = ui.page({ title: 'Today', main: ui.card({ body: ui.error(e) }) });
        return;
      }
      if (!ctx.alive()) return;
      const A = arr(T.actions), M = (T.matches || {}).counts || {}, L = T.landing || {}, C = (T.changes || {}).counts || {};
      const top = A[0];
      const kpis = [
        { label: 'Promote today', value: A.length, sub: top ? 'top: ' + top.title : '', tip: 'Things to push today that pass the rules (score in the table’s ⓘ). Stored data only.' },
        { label: 'Matches', value: (M.live || 0) + (M.today || 0), sub: `${M.live ? M.live + ' live · ' : ''}${fmt.num(M.tomorrow || 0)} tomorrow`, tip: 'Fixture-calendar matches today (live ones included) · tomorrow below', go: ['fixtures', {}] },
        { label: 'Landing 7 d', value: L.count_7, sub: isNum(L.count_30) ? fmt.num(L.count_30) + ' in 30 d' : '', tip: L.rule || 'OTT arrivals in the next 7 days', unkTip: 'Title Attention by Platform not built yet' },
        { label: 'New on Google', value: C.google_new, sub: (T.changes || {}).yesterday_scan ? 'vs scan ' + String(T.changes.yesterday_scan).replace(/ \d{4},/, ',').replace(' IST', '') : '', tip: 'Trends on today’s scan or Google RSS that were on no list in yesterday’s last scan', unkTip: 'No earlier scan to compare' },
        { label: 'Score leader', value: top ? Math.round(top.score) : null, sub: top ? (top.reach || {}).word || '' : '', tip: T.score_rule, unkTip: 'No action today' },
      ];
      const main = ui.grid('minmax(0,2fr) minmax(0,1fr)', [promoteCard(T), matchesCard(T)], { stretch: true });
      const bc = burstCard(T), tc = trailersCard(TR);
      const row2 = [changeCard(T), landingCard(T), tc].filter(Boolean);
      const table = ui.grid(row2.length === 3 ? 'minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1fr)', row2) + (bc ? ui.grid('minmax(0,1fr)', [bc]) : '');
      const errs = Object.keys(T.errors || {});
      const warn = errs.length ? `<div class="ov-stale warn" role="status" data-tip="${esc(errs.map(k => k + ': ' + T.errors[k]).join('\n'))}">${OV.icon('clock')}<b>Partial brief</b><span>${esc(errs.join(', '))} unavailable · shown as —</span></div>` : '';
      OV.trust.newly = arr(T.newly);
      el.innerHTML = ui.page({ title: 'Today', subtitle: 'What to push today', actions, strip: strip(T) + warn + ui.newlyStrip(T.newly, { max: 6, rule: T.newly_rule }), kpis, main, table });
    },
  });
})();

</script>
<script>
/* ---- pages_cohorts.js ---- */
/* =====================================================================================================
   OTTVerse Trends — Cohorts (CHARTS · #/cohorts) and the title drawer's History panel. Built only from window.OV
   (docs/OTTVERSE_COMPONENTS.md) on /api/ott/cohorts* (ott/cohorts.py) and /api/ott/history/* (ott/history.py).

   Cohorts: release-week × days-since-release heat grid (% of each title's own peak, English Wikipedia reads), the
   shape tag (Front-loaded / Steady / Slow burner), the language-month percentile, fan-base groups (Wikidata cast,
   director, franchise, team, event), the sport staying power and the Netflix Top 10 honesty check.
   History: weekly rank per board (inverted multi-line SVG), weeks on board, Netflix official weeks, the shape.

   House rules: header → filters → KPIs → main visual → dense table (CSV on every table). No paragraph; the rules
   live in ⓘ tooltips. Unknown is "—" with the reason. Reads, never "watched". The refresh is free and gated
   server-side (≤ 1 per 6 h); GETs never fetch.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const jattr = o => esc(JSON.stringify(o));
  if (!OV.icons.cohorts) OV.icons.cohorts = '<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/>';
  const API = '/api/ott/cohorts', HAPI = '/api/ott/history/title/';
  const SHAPES = ['Front-loaded', 'Steady', 'Slow burner'];
  const SHAPE_T = { 'Front-loaded': 'pink', Steady: 'info', 'Slow burner': 'teal' };
  const SHAPE_C = { 'Front-loaded': 'var(--pink)', Steady: 'var(--blue)', 'Slow burner': 'var(--teal)' };
  const BASIS_W = { theatrical: 'Theatrical', ott: 'OTT', premiere: 'Premiere' };
  const KIND_C = { star: 'var(--pink)', director: 'var(--violet)', franchise: 'var(--amber)', team: 'var(--teal)', event: 'var(--cyan)' };
  let RULES = {}, AUTO_TRIED = false, POLL = null, SEQ = 0;

  const day = d => d ? fmt.day(d) : '—';
  /** a fan-base group as a picture subject: its Wikidata id + a type for the monogram colour */
  const FAN_TYPE = { star: 'person', director: 'person', team: 'team', franchise: 'other', event: 'other' };
  const fanItem = x => ({ qid: /^Q\d+$/.test(x.id || '') ? x.id : '', name: x.label || x.id, type: FAN_TYPE[x.kind] || 'other' });
  const pctTxt = v => isNum(v) ? Math.round(v * 100) + '%' : '—';
  /** whole-number shares that sum to 100 (largest remainder): per-share Math.round gave 10 + 39 + 52 = 101 */
  const lrPct = vals => {
    const tot = vals.reduce((a, v) => a + (isNum(v) ? v : 0), 0);
    if (!tot) return vals.map(() => null);
    const raw = vals.map(v => (isNum(v) ? v : 0) / tot * 100), fl = raw.map(Math.floor);
    let left = 100 - fl.reduce((a, v) => a + v, 0);
    raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0 && vals[i]) { fl[i] += 1; left -= 1; } });
    return fl;
  };
  /** the shape-mix bar with largest-remainder percentages (the ov-stk markup of ui.stacked) */
  const shapeMix = sh => {
    const vals = SHAPES.map(s => sh[s] || 0), pc = lrPct(vals);
    if (!vals.some(v => v > 0)) return ui.empty('No title reached 21 days yet');
    const tot = vals.reduce((a, v) => a + v, 0);
    const seg = SHAPES.map((s, i) => vals[i] ? `<i style="width:${(vals[i] / tot * 100).toFixed(2)}%;background:${SHAPE_C[s]}" data-tip="${esc(s + ': ' + fmt.num(vals[i]) + ' (' + pc[i] + '%)')}"></i>` : '').join('');
    const lg = `<div class="ov-legend ov-stk-l">${SHAPES.map((s, i) => vals[i] ? `<span><i style="background:${SHAPE_C[s]}"></i>${esc(s)} <b style="font-variant-numeric:tabular-nums">${esc(pc[i] + '%')}</b></span>` : '').join('')}</div>`;
    return `<div class="ov-stk">${seg}</div>${lg}`;
  };
  const shapeTag = (s, tip) => s ? ui.tag(s, SHAPE_T[s] || 'muted', (tip ? tip + '\n' : '') + (RULES.shape || '')) : ui.unk('Needs the curve to reach release + 21 days\n' + (RULES.shape || ''));
  /** a shape chip for any page's row (Wikidata id or platform key → /api/ott/cohorts/shapes) */
  OV.shapeTag = shapeTag;
  OV.cohortShapes = () => OV.api.get(API + '/shapes', null, { ttl: 600 }).then(d => d.shapes || {}).catch(() => ({}));

  /* ------------------------------------------------------------------ the heat grid */
  function heatGrid(grid, sel) {
    const rows = arr(grid.rows);
    if (!rows.length) return ui.empty('No titles with ≥ 7 days of curve after release for this filter', { box: true });
    const days = arr(grid.days);
    const head = `<tr><th class="wk" data-tip="Release week (Mon–Sun)">Week</th><th class="n" data-tip="Titles in the row">n</th>${days.map(j => `<th class="d">${j % 7 === 0 ? 'D' + j : ''}</th>`).join('')}</tr>`;
    const body = rows.map(r => {
      const cells = arr(r.cells).map((c, j) => {
        if (!isNum(c.v)) return `<td class="c na" data-tip="${esc(`Week of ${day(r.week)} · day ${j}: not reached yet`)}"></td>`;
        const p = Math.max(4, Math.min(100, Math.round(c.v)));
        return `<td class="c${c.v >= 99.5 ? ' pk' : ''}" style="--p:${p}%" data-tip="${esc(`Week of ${day(r.week)} · day ${j}: ${fmt.dec(c.v, 0)}% of peak (mean of ${c.n} title${c.n === 1 ? '' : 's'})`)}"></td>`;
      }).join('');
      const sh = SHAPES.filter(s => (r.shapes || {})[s]).map(s => `${s}: ${r.shapes[s]}`).join(' · ');
      return `<tr class="${sel === r.week ? 'on' : ''}" data-set="${jattr({ wk: sel === r.week ? '' : r.week })}" tabindex="0" role="button" data-tip="${esc(`Week of ${day(r.week)} · ${r.n} title${r.n === 1 ? '' : 's'}${r.partial ? ' · some still under 29 days (peak so far)' : ''}${sh ? '\n' + sh : ''}\nClick: list its titles`)}"><th class="wk">${esc(day(r.week))}${r.partial ? '<i class="pt" aria-label="partial"></i>' : ''}</th><td class="n">${esc(r.n)}</td>${cells}</tr>`;
    }).join('');
    const scale = `<div class="ch-scale"><span>0%</span><i></i><span>100% of peak</span><span class="sp"></span><span><i class="na"></i>not reached</span><span><i class="pt"></i>row still filling</span></div>`;
    return `<div class="ch-wrap"><table class="ch-grid">${head}${body}</table></div>${scale}`;
  }

  /* ------------------------------------------------------------------ small parts */
  const spark = e => arr(e.pct).some(isNum) ? ui.spark(arr(e.pct).map(v => isNum(v) ? v * 100 : null), { w: 96, h: 22, max: 100, min: 0, color: SHAPE_C[e.shape] || 'var(--slate)', tip: '% of peak, days 0..28 (English Wikipedia)' }) : ui.noSpark(96, 'No curve stored after release yet');
  const etype = e => e.lane === 'film' ? 'movie' : 'series';
  const titleCell = e => { const it = Object.assign({}, e, { type: etype(e) }); return ui.nameCell(it, { meta: OV.rowMeta(it), tip: arr(e.platforms).length ? 'On ' + e.platforms.join(' · ') : '' }); };
  const pctl = e => isNum(e.pctl) ? `<span class="ch-pc" data-tip="${esc(`${fmt.num(e.pctl_n)} ${e.language || ''} titles released ${fmt.month(e.month)}\n` + (RULES.pctl || ''))}"><b>${esc(fmt.dec(e.pctl, 0))}</b><small>/${esc(e.pctl_n)}</small></span>` : ui.unk(isNum(e.reads28) ? `Under ${3} ${e.language || ''} titles that month (n ${e.pctl_n || 0})` : 'Needs 28 days after release');
  function titleColumns(lane) {
    return [
      { id: 'name', label: 'Title', render: titleCell, value: e => e.name, csv: e => e.name },
      { id: 'language', label: 'Lang', render: e => e.language ? ui.lang(e.language) : ui.unk('No language on Wikidata'), value: e => e.language || '' },
      { id: 'date', label: 'Release', tip: RULES.release, render: e => `<span data-tip="${esc((BASIS_W[e.basis] || e.basis || '') + ' release')}">${esc(day(e.date))}</span>`, value: e => e.date, csv: e => e.date },
      { id: 'basis', label: 'Basis', hide: true, csvAlways: true, render: e => esc(BASIS_W[e.basis] || e.basis), value: e => e.basis },
      { id: 'days', label: 'Days', num: true, tip: 'Days of curve from release (max 29: days 0..28)', render: e => esc(e.days) },
      { id: 'curve', label: 'Curve', sort: false, tip: '% of peak, days 0..28', render: spark, csvSkip: true },
      { id: 'peak_day', label: 'Peak day', num: true, tip: 'Day of the peak (0 = release day), days 0..28', render: e => isNum(e.peak_day) ? 'D' + esc(e.peak_day) : ui.unk('No peak yet'), value: e => e.peak_day },
      { id: 'r7', label: '@peak+7', num: true, desc: true, tip: 'Views 7 days after the peak, as % of the peak', render: e => isNum(e.r7) ? esc(pctTxt(e.r7)) : ui.unk('Needs 21 days'), value: e => e.r7 },
      { id: 'shape', label: 'Shape', tip: RULES.shape, render: e => shapeTag(e.shape), value: e => e.shape || '' },
      { id: 'reads28', label: 'Reads 28d', num: true, desc: true, tip: 'English Wikipedia reads, days 0..27 (worldwide). Reads, not viewers.', render: e => isNum(e.reads28) ? esc(fmt.compact(e.reads28)) : ui.unk('Needs 28 days after release'), value: e => e.reads28 },
      { id: 'pctl', label: 'Lang pctl', num: true, desc: true, tip: RULES.pctl, render: pctl, value: e => e.pctl },
      { id: 'pctl_n', label: 'Cohort n', hide: true, num: true, render: e => esc(e.pctl_n || 0), value: e => e.pctl_n },
      { id: 'platforms', label: 'On', hideBelow: 1300, tip: 'Platforms in the catalogue (Title Attention by Platform)', render: e => arr(e.platforms).slice(0, 2).map(p => ui.platform(p, { short: true, noVia: true })).join(' ') || ui.unk('Not in a platform catalogue'), value: e => arr(e.platforms).join('; ') },
    ];
  }

  function validationCard(v) {
    v = v || {};
    const g = v.groups || {}, t = v.test || {};
    const ans = { yes: ['Yes', 'up'], opposite: ['Opposite', 'warn'], no_difference: ['No clear difference', 'muted'], too_few: ['Too few to tell', 'muted'] }[v.answer] || ['—', 'muted'];
    const row = s => { const x = g[s] || {}; return `<div class="ch-vr"><span>${shapeTag(s)}</span><b>${isNum(x.median) ? esc(fmt.dec(x.median, 1).replace(/\.0$/, '')) : '—'}</b><small>median wk</small><span class="n">n ${esc(x.n || 0)}</span></div>`; };
    const cat = c => { const b = (v.by_category || {})[c] || {}; const f = b['Front-loaded'] || {}, s = b['Slow burner'] || {}; return `<span data-tip="${esc(`${c}: Slow burners median ${isNum(s.median) ? s.median : '—'} wk (n ${s.n || 0}) vs Front-loaded ${isNum(f.median) ? f.median : '—'} (n ${f.n || 0})${b.test ? ' · p = ' + b.test.p : ''}`)}">${esc(c)} ${isNum(s.median) ? esc(s.median) : '—'} vs ${isNum(f.median) ? esc(f.median) : '—'}</span>`; };
    const body = v.status === 'ok' ? `${SHAPES.map(row).join('')}
      <div class="ch-vf">${ui.tag(ans[0], ans[1], v.verdict || '')}<span data-tip="Mann–Whitney U, two-sided: Slow burners vs Front-loaded">p ${isNum(t.p) ? esc(fmt.dec(t.p, t.p < 0.01 ? 3 : 2)) : '—'}</span><span>${cat('Films')}</span><span>${cat('TV')}</span></div>
      <div class="ov-note1" data-tip="A run = one title or season's stay in Netflix's India Top 10; two runs on the same release curve count once">${esc(fmt.num(v.runs != null ? v.runs : v.n))} runs tested${isNum(v.titles) ? ' (' + esc(fmt.num(v.titles)) + ' titles)' : ''} · ${esc(fmt.num(v.matched))} Netflix runs matched</div>`
      : ui.empty(v.verdict || 'No Netflix Top 10 history matched yet');
    return ui.card({ title: 'Netflix test', tip: 'Does the shape predict Netflix Top 10 weeks?\n' + (RULES.validation || '') + (v.verdict ? '\n\n' + v.verdict : ''), cls: 'ch-valid', body });
  }

  function langCard(rows) {
    const L = arr(rows).filter(r => r.language !== '—');
    if (!L.length) return ui.card({ title: 'By language', body: ui.empty('No titles') });

  /* ------------------------------------------------------------------ refresh */
  OV.actions.cohortRefresh = (arg, el) => OV.arm(el, 'Fetch curves + Wikidata · free', async () => {

  function refreshBtn(st) {
    st = st || {};

    if (st.running) return `<span class="rd-run">${OV.icon('clock')}Refreshing · <b>${esc(fmt.num(last && last.calls || 0))}</b> calls</span>`;
    const tip = (next ? 'Next refresh allowed ' + next + ' (once per 6 h)' : 'Curves around releases + Wikidata relations · free · once per 6 h') + (last ? `\nLast: ${last.status} · ${fmt.num(last.calls)} calls · ${last.finished_at_ist || last.started_at_ist || ''}` : '');
    return `<button class="ov-btn sm" data-act="cohortRefresh"${next ? ' disabled' : ''} data-tip="${esc(tip)}">${OV.icon('run')}Refresh · free</button>`;
  }
  function poll(ctx) {
    clearTimeout(POLL);
    POLL = setTimeout(async () => {
      if (!ctx.alive()) return;
      let s; try { s = await OV.api.get(API + '/status', null, { ttl: 0, force: true }); } catch (e) { return; }
      if (!ctx.alive()) return;
      if (s && s.running) { poll(ctx); return; }
      OV.api.clear(API); ctx.rerender();
    }, 6000);
  }

  /* ------------------------------------------------------------------ the page */
  OV.register('cohorts', {

      }
      if (st.running) poll(ctx);
      const actions = refreshBtn(st);
      const K = d.kpis || {}, sh = d.shapes || {};
      const langs = arr(d.languages);
      const filters = ui.filterBar([
        ui.chips('lane', [['', 'Films', (d.lane_counts || {}).film], ['show', 'Shows', (d.lane_counts || {}).show]], lane === 'show' ? 'show' : ''),

        ui.select('lang', langs.map(([l, n]) => [l, l, n]), P.lang || '', { all: 'All languages', tip: 'Wikidata original language (P364) or the catalogue' }),
        ui.chips('weeks', [['', '26 wk'], ['52', '52 wk'], ['all', 'All']], weeks === '26' ? '' : weeks),

      const shaped = d.shaped || 0;

      const kpis = [
        { label: 'Titles aligned', value: K.titles, sub: `${fmt.num(K.entries)} releases · ≥ 7 days`, tip: RULES.cohort },
        { label: 'Release weeks', value: K.weeks, sub: weeks === 'all' ? 'all on file' : `last ${weeks} with titles`, tip: 'Weeks (Mon–Sun) with at least one release in the chart' },
        { label: 'Front-loaded', value: K.front, sub: shaped ? pF + '% of tagged' : 'none tagged', tip: RULES.shape },
        { label: 'Steady', value: K.steady, sub: shaped ? pS + '% of tagged' : 'none tagged', tip: RULES.shape },
        { label: 'Slow burners', value: K.slow, sub: shaped ? pB + '% of tagged' : 'none tagged', tip: RULES.shape },
        { label: 'Netflix test', value: isNum(K.validation_n) ? K.validation_n : null, unit: ' runs', sub: [isNum(K.validation_titles) ? fmt.num(K.validation_titles) + ' titles' : '', ((d.validation || {}).answer || '').replace(/_/g, ' ')].filter(Boolean).join(' · ') || '—', tip: (RULES.validation || '') + '\nA run = one title or season in the Top 10; two runs on the same release curve count once.', unkTip: 'No Netflix Top 10 history matched yet' },
      ];
      const sel = P.wk || '';
      const shapeBar = shapeMix(sh);
      const gridCard = ui.card({ title: `${lane === 'film' ? 'Films · ' + BASIS_W[basis] : 'Shows · premiere'}${P.lang ? ' · ' + P.lang : ''}`, tip: RULES.cohort + '\n' + (RULES.basis || ''), cls: 'ch-card', pad: false, body: heatGrid(d.grid || {}, sel) });
      const side = ui.stack([ui.card({ title: 'Shape mix', tip: RULES.shape, body: shapeBar + `<div class="ov-note1">${esc(fmt.num(shaped))} of ${esc(fmt.num(d.total))} reached day 21</div>` }), validationCard(d.validation), langCard(d.by_language)]);
      let weekList = '';
      if (sel) {

        weekList = ui.card({ title: `Week of ${day(sel)}`, actions: `<button class="ov-btn sm" data-set="${jattr({ wk: '' })}">Close</button>`, cls: 'ch-wl', pad: false,
          body: ui.table({ id: 'cohort-week', rows: W, columns: titleColumns(lane), pageSize: 25, csvName: `ottverse-cohort-week-${sel}`, onRow: e => openTitle(e), noun: 'titles', empty: 'No title in that week for this filter' }) });
      }
      const main = ui.grid('minmax(0,2.1fr) minmax(0,1fr)', [gridCard + weekList, side]);
      const items = arr(d.items);
      const table = ui.table({
        id: 'cohort-titles', rows: items, pageSize: 25, csvName: `ottverse-cohorts-${lane}-${lane === 'film' ? basis : 'premiere'}${P.lang ? '-' + P.lang : ''}-${d.as_of || ''}`,
        search: true, searchPlaceholder: 'Filter titles', searchText: e => [e.name, e.language, e.shape].join(' '), noun: 'releases',
        toolbar: `<span><b>${esc(fmt.num(items.length))}</b> releases</span>`,

      });
      el.innerHTML = ui.page({
        title: 'Cohorts', subHtml: `<span data-tip="${esc('Reading from release day\n' + (RULES.basis || ''))}">English Wikipedia · % of own peak · ${d.as_of ? 'reads to ' + esc(day(d.as_of)) + ' UTC' : 'no reads stored'}</span>`, actions, tip: (RULES.cohort || '') + '\n' + (RULES.basis || ''),
        filters, kpis, main, table, extra: fanSection(d.fan) + sportSection(d.sport),
      });
