  // This table owns each item's group and nav label (a page def's own group / title no longer moves it). Every route
  // stays reachable. `coming` (5th field): listed before its page script ships, as a one-line "coming" page.
  const NAV = [
    ['today', 'TODAY', 'Today', 'today'],
    // the bot's boards are drawn live by the server (and carry JustWatch posters): never on the public snapshot copy
    ...(OV.static ? [] : [['boards', 'TODAY', 'Boards (as on Telegram)', 'today']]),
    ['charts', 'CHARTS', 'Search Trends', 'charts'], ['platforms', 'CHARTS', 'Title Attention by Platform', 'platforms'],
    ['reading', 'CHARTS', 'Wikipedia Attention', 'reading'], ['cohorts', 'CHARTS', 'Cohorts', 'cohorts', 1],
    ['sweep', 'HIDDEN', 'India Sweep', 'sweep'],
    ['detail', 'HIDDEN', 'Title detail', 'title'],              // reading / platform detail as a full page              // inside Search Trends (win=lists|spread|deep); old links redirect
    ['title', 'TITLES', 'Title 360', 'title'], ['fixtures', 'TITLES', 'Fixtures', 'fixtures'], ['calendar', 'TITLES', 'Calendar', 'calendar'],
    ['overview', 'MORE', 'Overview', 'overview'], ['explore', 'MORE', 'Trend Explorer', 'explore'], ['regions', 'MORE', 'Regions & Languages', 'regions'],
    ['sos', 'MORE', 'Share of Search', 'sos'], ['platform', 'MORE', 'Platform Overview', 'platform'], ['gap', 'MORE', 'Title Gap', 'gap'],
    ['opps', 'MORE', 'Opportunities', 'opps'], ['alerts', 'MORE', 'Alerts', 'alerts'], ['reports', 'MORE', 'Reports', 'reports'],
    ['watchlists', 'MORE', 'Watchlists', 'watchlists'], ['method', 'MORE', 'Data & Method', 'method'], ['health', 'MORE', 'Data health', 'health', 1],
  ].map(([id, group, title, ic, coming]) => ({ id, group, title, icon: ic, coming: !!coming }));
  OV.HOME = 'today';
  OV.nav = () => NAV.map(n => Object.assign({}, n));
  const REG = {};
  const BADGES = {};
  let BOOTED = false, TOKEN = 0, CUR = null;
  OV.register = (id, def) => {
    const base = NAV.find(n => n.id === id) || { id, group: 'MORE', title: def && def.title || id, icon: def && def.icon || 'question' };
    if (!NAV.find(n => n.id === id)) NAV.push(base);
    REG[id] = Object.assign({ market: false, period: false }, base, def || {}, { id });
    if (BOOTED) { renderNav(); if (CUR && CUR.id === id) render(); }
  };
  OV.pages = () => NAV.filter(n => REG[n.id]).map(n => REG[n.id]);
  const parseHash = () => {
    const h = location.hash.replace(/^#\/?/, '');
    const i = h.indexOf('?');
    let id = (i >= 0 ? h.slice(0, i) : h) || OV.HOME;
    try { id = decodeURIComponent(id); } catch (e) { /* keep raw */ }
    const params = {};
    new URLSearchParams(i >= 0 ? h.slice(i + 1) : '').forEach((v, k) => { params[k] = v; });
    return { id, params };
  };
  OV.route = () => CUR ? { id: CUR.id, params: Object.assign({}, CUR.params) } : parseHash();
  OV.go = (id, params, opt) => {
    const h = '#/' + enc(id).replace(/%2F/g, '/') + qs(params);
    if (opt && opt.replace) { history.replaceState(null, '', h); render(); return; }
    if (location.hash === h) render(); else location.hash = h;
  };
  const setParams = (partial, opt) => {
    if (!CUR) return;
    const p = Object.assign({}, CUR.params);
    Object.keys(partial || {}).forEach(k => { const v = partial[k]; if (v === null || v === undefined || v === '') delete p[k]; else p[k] = String(v); });
    if ('page' in p && !('page' in (partial || {}))) delete p.page;
    OV.go(CUR.id, p, opt);
  };
  OV.setParams = setParams;
  OV.openTitle = x => { const key = typeof x === 'string' ? x : x && x.key; if (key) OV.go('title', { key }); else if (x && (x.q || x.label || x.title)) OV.go('title', { q: x.q || x.label || x.title }); };
  OV.openPlatform = name => { if (!name) return; if (REG.platform) OV.go('platform', { name }); else OV.go('title', { q: name }); };

  function render() {
    if (!BOOTED) return;
    const r = parseHash();
    let def = REG[r.id];
    if (!def) { def = REG[OV.HOME] || REG.overview || OV.pages()[0]; if (def && r.id !== def.id && location.hash) { history.replaceState(null, '', '#/' + def.id); } }
    const view = document.getElementById('ov-view');
    if (!def) { view.innerHTML = OV.ui.empty('No pages registered.'); return; }
    const pageChanged = !CUR || CUR.id !== def.id;
    const my = ++TOKEN;
    CUR = { id: def.id, params: def.id === r.id ? r.params : {} };
    Object.keys(CHARTS).forEach(k => delete CHARTS[k]);
    Object.keys(MAPS).forEach(k => delete MAPS[k]);
    hideTip(); closeMenus(); OV.drawer.close(true); closeAC(); OV.coach.hide();
    document.body.classList.remove('nav-on');
    syncNav(); syncControls();
    document.title = (def.title ? def.title + ' · ' : '') + 'OTTVerse Trends';
    if (pageChanged) window.scrollTo(0, 0);
    const focus = captureFocus();
    const ctx = { id: def.id, params: Object.assign({}, CUR.params), state: OV.state, def, alive: () => my === TOKEN,
      set: (p, o) => { if (my === TOKEN) setParams(p, o); }, rerender: () => { if (my === TOKEN) render(); } };
    OV.ctx = ctx;
    if (TH.loaded) OV.thumbs.load();     // re-reads the image index at most every 5 min
    if (OV.offline) { view.innerHTML = OV.ui.page({ title: def.title, subtitle: 'Offline', main: OV.ui.offline() }); OV.emit('route', ctx); return; }
    let out;
    try { out = def.render(view, ctx); } catch (e) { console.error(e); view.innerHTML = OV.ui.page({ title: def.title, main: OV.ui.error(e) }); }
    const done = () => { if (ctx.alive()) { restoreFocus(focus); OV.emit('rendered', ctx); maybeAutoCoach(ctx); } };
    if (out && typeof out.then === 'function') out.then(done, e => { console.error(e); if (ctx.alive()) view.innerHTML = OV.ui.page({ title: def.title, main: OV.ui.error(e) }); });
    else done();
    OV.emit('route', ctx);
  }
  OV.refresh = () => render();
  function captureFocus() {
    const a = document.activeElement;
    if (!a || !a.getAttribute) return null;
    const sel = a.getAttribute('data-focus-id');
    return sel ? { sel, start: a.selectionStart, end: a.selectionEnd } : null;
  }
  function restoreFocus(f) {
    if (!f) return;
    const el = document.querySelector(`[data-focus-id="${CSS.escape(f.sel)}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(f.start, f.end); } catch (e) { /* not a text input */ } }
  }

  /* ================================================================== shell: nav, controls */
  function renderNav() {
    const nav = document.getElementById('ov-nav');
    if (!nav) return;
    let html = '', grp = null;
    const open = navMoreOpen();
    const item = (n, d) => {
      const b = BADGES[n.id];
      return `<a class="ov-ni" href="#/${esc(n.id)}" data-nav="${esc(n.id)}">${icon(ICONS[n.icon] ? n.icon : d.icon || n.icon)}<span>${esc(n.title || d.title)}</span>${isNum(b) && b > 0 ? `<span class="ct${d.badgeHot ? ' hot' : ''}">${esc(fmt.compact(b))}</span>` : ''}</a>`;
    };
    const more = NAV.filter(n => n.group === 'MORE' && REG[n.id]);
    NAV.forEach(n => {
      const d = REG[n.id]; if (!d || n.group === 'MORE' || n.group === 'HIDDEN') return;
      const g = n.group || '';
      if (g !== grp) { if (g) html += `<div class="ov-ng">${esc(g)}</div>`; grp = g; }
      html += item(n, d);
    });
    if (more.length) {
      // collapsed: only the page you are on stays visible; the hidden items' counts add up on the toggle
      const hidden = more.map(n => BADGES[n.id]).filter(b => isNum(b) && b > 0).reduce((a, b) => a + b, 0);
      const hot = more.some(n => REG[n.id].badgeHot && isNum(BADGES[n.id]) && BADGES[n.id] > 0);
      html += `<button type="button" class="ov-ng ov-more" id="ov-more" aria-expanded="${open}" aria-controls="ov-moreg" data-tip="${esc(more.map(n => n.title).join('\n'))}">MORE<i class="chev"></i>${!open && hidden ? `<span class="ct${hot ? ' hot' : ''}">${esc(fmt.compact(hidden))}</span>` : ''}</button>`
        + `<div class="ov-moreg${open ? '' : ' shut'}" id="ov-moreg">${more.map(n => item(n, REG[n.id])).join('')}</div>`;
    }
    html += `<div class="ov-nav-foot">OTTVerse ${esc(OV.version)}</div>`;
    nav.innerHTML = html;
    const tg = document.getElementById('ov-more');
    if (tg) tg.addEventListener('click', () => { LS.set('ov.nav.more', navMoreOpen() ? '0' : '1'); renderNav(); });
    syncNav();
  }
  const navMoreOpen = () => LS.get('ov.nav.more') === '1';
  function syncNav() { document.querySelectorAll('#ov-nav .ov-ni').forEach(a => a.classList.toggle('on', !!CUR && a.getAttribute('data-nav') === CUR.id)); }
  OV.refreshBadges = async () => {
    await Promise.all(OV.pages().filter(d => typeof d.badge === 'function').map(async d => {
      try { const n = await d.badge(); BADGES[d.id] = isNum(n) ? n : null; } catch (e) { BADGES[d.id] = null; }
    }));
    renderNav();
  };
  function fillMarket() {
    const sel = document.getElementById('ov-market'); if (!sel) return;
    const states = Object.keys(GEO).filter(g => g !== 'IN').sort((a, b) => GEO[a].localeCompare(GEO[b]));
    sel.innerHTML = `<option value="IN">India</option><optgroup label="States">${states.map(g => `<option value="${esc(g)}">${esc(GEO[g])}</option>`).join('')}</optgroup>`
      + `<optgroup label="Airtel circles">${CIRCLES.map(c => `<option value="circle:${esc(c.id)}">${esc(c.name)}</option>`).join('')}</optgroup>`;
    sel.value = OV.state.market;
    if (sel.value !== OV.state.market) { OV.state.market = 'IN'; sel.value = 'IN'; }
  }
  function syncControls() {
    const def = CUR && REG[CUR.id];
    const sel = document.getElementById('ov-market');
    if (sel) {
      sel.value = OV.state.market;
      sel.disabled = !!def && !def.market;
      sel.setAttribute('data-tip', def && !def.market ? 'This page covers all of India' : 'Market: India, a state or an Airtel circle');
    }
    const seg = document.getElementById('ov-period');
    if (seg) {
      // a page without a period shows no period control (its own window, if any, sits in its filter bar)
      const off = !!def && !def.period;
      seg.hidden = off;
      seg.classList.toggle('off', off);
      seg.setAttribute('data-tip', 'Period');
      seg.querySelectorAll('button').forEach(b => { b.classList.toggle('on', !off && b.getAttribute('data-p') === OV.state.period); b.disabled = off; });
    }
    const th = document.getElementById('ov-theme');
    if (th) th.innerHTML = OV.state.theme === 'dark'
      ? '<svg class="ov-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg class="ov-ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  }
  function closeMenus() { document.querySelectorAll('.ov-menu.on, .ov-chooser.on').forEach(m => m.classList.remove('on')); }

  /* ================================================================== scan status + live pill */
  const SCAN = { status: null, timer: null, wasRunning: false };
  OV.status = null;
  async function refreshStatus(force) {
    try { applyStatus(await OV.api.get('/api/pulse/status', null, { ttl: force ? 0 : 15, force: !!force })); }
    catch (e) { const pill = document.getElementById('ov-live'); if (pill) { pill.className = 'ov-live'; document.getElementById('ov-live-t').textContent = e.status === 0 ? 'Offline' : 'Status —'; } }
  }
  OV.refreshStatus = refreshStatus;
  /** The header pill. Its dot says how old the board is: live red under 6 h · amber 6–24 h · grey "stale" after 24 h. */
  function paintPill(s) {
    const pill = document.getElementById('ov-live'), t = document.getElementById('ov-live-t');
    if (!pill || !t) return;
    const run = s && s.running, ls = s && s.last_scan, caps = (s && s.caps) || {};
    if (run) {
      pill.className = 'ov-live run';
      t.textContent = `Scanning · ${isNum(run.done) && isNum(run.total) && run.total ? Math.round(run.done / run.total * 100) + '%' : '…'}`;
      pill.setAttribute('data-tip', `Scan #${run.scan_id} running · ${run.phase || ''} ${run.current_geo || ''}`.trim());
    } else if (ls) {
      const lv = fresh.level({ source: 'pulse_scan', last_ok_ts: ls.finished_at, status: ls.partial ? 'partial' : '' });
      pill.className = 'ov-live ' + lv;
      t.textContent = `Scan #${ls.id} · ${fmt.ago(ls.finished_at)}${lv === 'bad' ? ' · stale' : ''}`;
      pill.setAttribute('data-tip', [`Last scan ${fmt.ist(ls.finished_at)} · ${ls.mode || ''}${ls.partial ? ' · partial' : ''}`,
        lv === 'ok' ? 'Fresh (under 6 h)' : lv === 'warn' ? 'Ageing: older than 6 h' : 'Stale: older than 24 h',
        `${isNum(caps.scans_today) ? caps.scans_today : '—'} of ${isNum(caps.max_per_day) ? caps.max_per_day : 2} scans today`].join('\n'));
    } else { pill.className = 'ov-live'; t.textContent = 'No scan yet'; pill.setAttribute('data-tip', 'No finished scan'); }
    paintScanBtn(s);
  }
  /** The header "Scan now" button (every page): cost and what is left before the click; two clicks to spend. */
  function paintScanBtn(s) {
    const b = document.getElementById('ov-scan-now');
    if (!b) return;
    const run = s && s.running, caps = (s && s.caps) || {}, est = (s && s.estimate) || {};
    const n = isNum(est.searches_per_scan) ? est.searches_per_scan : null;
    // the NEXT scan's full DataForSEO cost (curves + any due Google Ads top-up / weekly / monthly volume), not the curves
    // alone; older servers send only curves_usd
    const nx = est.next_scan && isNum(est.next_scan.usd) ? est.next_scan : null;
    const usd = nx ? nx.usd : est.dataforseo && isNum(est.dataforseo.curves_usd) ? est.dataforseo.curves_usd : null;
    const cost = [n != null ? fmt.plural(n, 'SerpApi search', 'SerpApi searches') : '', usd ? (nx && nx.upper_bound ? 'up to ' : '≈') + fmt.usd(usd) + ' DataForSEO' : ''].filter(Boolean).join(' + ') || 'free sources only';
    const parts = nx && arr(nx.parts).length > 1 ? '\n' + arr(nx.parts).map(p => `· ${p.what}: ${fmt.usd(p.usd)}`).join('\n') : '';
    const left = isNum(caps.max_per_day) && isNum(caps.scans_today) ? Math.max(0, caps.max_per_day - caps.scans_today) : null;
    const can = !run && caps.can_scan !== false;
    b.disabled = !can;
    b.setAttribute('data-cost', cost);
    b.querySelector('span').textContent = run ? 'Scanning…' : 'Scan now';
    b.setAttribute('data-tip', run ? 'A scan is running'
      : !can ? (caps.next_allowed_at ? 'Next scan allowed ' + fmt.ist(caps.next_allowed_at) + (caps.gap_wait ? ` (${caps.min_gap_min || 15} min after the last one)` : ' (daily limit)') : 'Scan not available')
      : `Scan now · costs ${cost} · ${est.duration_note || 'a few minutes'}${parts}\n${left != null ? left + ' of ' + caps.max_per_day + ' scans left today' : ''}${est.mode ? '\nMode: ' + est.mode : ''}\nClick twice to confirm.`);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('#ov-scan-now');
    if (!b || b.disabled) return;
    OV.arm(b, 'Confirm · ' + (b.getAttribute('data-cost') || 'paid'), () => { b.disabled = true; OV.runScan(); });
  });
  OV.scanLevel = () => { const ls = SCAN.status && SCAN.status.last_scan; return ls ? fresh.level({ source: 'pulse_scan', last_ok_ts: ls.finished_at }) : 'never'; };
  function applyStatus(s) {
    SCAN.status = OV.status = s;
    const run = s && s.running;
    paintPill(s);
    if (run && !SCAN.timer) {
      SCAN.wasRunning = true;
      SCAN.timer = setInterval(() => { if (!document.hidden) refreshStatus(true); }, 2000);
    } else if (!run && SCAN.timer) { clearInterval(SCAN.timer); SCAN.timer = null; }
    if (!run && SCAN.wasRunning) {
      SCAN.wasRunning = false;
      OV.api.clear('/api/'); LOCAL_IDX = null;
      OV.toast('Scan finished · data refreshed');
      OV.emit('scan', s); OV.refreshBadges(); render();
    } else OV.emit('status', s);
  }
  /** Start a scan (spends: 1 SerpApi search + the DataForSEO curves). Pages call this from a two-click button. */
  OV.runScan = async () => {
    try {
      const r = await OV.api.post('/api/pulse/scan', {});
      OV.toast(`Scan #${r && r.scan_id != null ? r.scan_id : ''} started`);
      SCAN.wasRunning = true;
      await refreshStatus(true);
      render();
    } catch (e) {
      OV.toast(e.status === 429 ? `${(e.detail || 'Scan limit reached').replace(/^./, c => c.toUpperCase())}${e.body && e.body.next_allowed_at_ist ? ' · next ' + e.body.next_allowed_at_ist : ''}` : e.status === 409 ? 'A scan is already running' : (e.detail || 'Scan failed to start'), 'down');
      refreshStatus(true);
    }
  };

  /* ================================================================== tooltip */
  let TIP_EL = null, TIP_FOR = null;
  function showTip(el) {
    const text = el.getAttribute('data-tip');
    if (!text) return;
    TIP_EL = TIP_EL || document.getElementById('ov-tip');
    if (!TIP_EL) return;
    TIP_FOR = el;
    TIP_EL.textContent = text;
    TIP_EL.style.display = 'block';
    const r = el.getBoundingClientRect(), tw = TIP_EL.offsetWidth, th = TIP_EL.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2, y = r.bottom + 8;
    if (y + th > window.innerHeight - 6) y = r.top - th - 8;
    TIP_EL.style.left = clamp(x, 6, window.innerWidth - tw - 6) + 'px';
    TIP_EL.style.top = Math.max(6, y) + 'px';
  }
  function hideTip() { if (TIP_EL) TIP_EL.style.display = 'none'; TIP_FOR = null; }
  OV.hideTip = hideTip;

  /* ================================================================== UI components */
  const ui = OV.ui = {};
  ui.icon = icon;
  ui.tip = (text, o) => text ? `<span class="ov-i" tabindex="0" data-tip="${esc(text)}"${o && o.style ? ` style="${esc(o.style)}"` : ''}>i</span>` : '';
  ui.unk = tip => `<span class="ov-unk" data-tip="${esc(tip || 'Unknown')}">—</span>`;
  ui.sourceDot = s => { if (!s) return ''; const st = s.state || 'ok'; const lines = [s.name, s.fresh ? 'Updated ' + s.fresh : '', s.tip || ''].filter(Boolean).join('\n'); return `<span class="ov-sd ${esc(st)} sd" data-tip="${esc(lines || 'Source')}"></span>`; };
  /** A SourceDot coloured by a dataset's freshness (row from /api/live/home, or {source, last_ok_ts | age_s, status}). */
  ui.freshDot = (row, name) => row ? ui.sourceDot({ name: name || row.label || row.source, state: fresh.level(row) === 'never' ? 'off' : fresh.level(row), tip: fresh.tip(row, name).split('\n').slice(1).join('\n') }) : '';
  /** "as of 27 Sep" chip: grey when fresh, amber / red when the dataset is old. text overrides the label. */
  ui.asOf = (row, o) => {
    o = o || {};
    if (!row) return '';
    const lv = fresh.level(row), ts = toTs(row.last_ok_ts != null ? row.last_ok_ts : row.fetched_at);
    const txt = o.text || ((o.prefix || 'as of') + ' ' + (ts != null ? fmt.day(ts) : '—'));
    return `<span class="ov-asof ${esc(lv)}" data-tip="${esc(fresh.tip(row, o.name) + (o.tip ? '\n' + o.tip : ''))}"><i></i>${esc(txt)}</span>`;
  };
  /** One-line banner, drawn only when the dataset behind the page is old (amber / red). Never a paragraph. */
  ui.staleBanner = (row, o) => {
    o = o || {};
    if (!row) return '';
    const lv = fresh.level(row);
    if (lv !== 'warn' && lv !== 'bad') return '';
    const age = fresh.age(row), ts = toTs(row.last_ok_ts != null ? row.last_ok_ts : row.fetched_at);
    const old = isNum(age) ? (age >= DY ? Math.round(age / DY) + ' d' : Math.round(age / HR) + ' h') + ' old' : '';
    return `<div class="ov-stale ${esc(lv)}" role="status" data-tip="${esc(fresh.tip(row, o.name))}">${icon('clock')}<b>${esc(o.name || row.label || 'Data')}</b><span>${esc([o.verb || 'updated', ts != null ? fmt.day(ts) : 'never'].join(' '))}${old ? ' · ' + esc(old) : ''}</span>${o.risk ? `<span class="rk">${esc(o.risk)}</span>` : ''}${o.action || ''}</div>`;
  };
  ui.tag = (text, tone, tip) => `<span class="ov-tag ${esc(tone || '')}"${tip ? ` data-tip="${esc(tip)}"` : ''}>${esc(text)}</span>`;
  ui.badge = (type, o) => {
    if (!TYPES[type] || type === 'other') return '';      // no "?" chip anywhere (design system §4)
    const t = type; const [b, c] = TYPES[t];
    return `<span class="ov-b${b.length > 1 ? ' w2' : ''}${o && o.lg ? ' lg' : ''}" style="background:${fill(c)}" data-tip="${esc(fmt.type(type || 'other'))}">${esc(b)}</span>`;
  };
  ui.verdict = (v, o) => {
    if (!v) return ui.unk('No verdict');
    const code = typeof v === 'string' ? v : v.code;
    const d = VERDICTS[code]; if (!d) return ui.unk('No verdict');
    const full = typeof v === 'object' && v.label ? v.label : d.label;
    const tip = [full, typeof v === 'object' && v.reason ? v.reason : d.tip, typeof v === 'object' && v.confidence ? 'Confidence: ' + v.confidence : ''].filter(Boolean).join('\n');
    return `<span class="ov-vp${o && o.lg ? ' lg' : ''}" style="--vc:${d.c};${d.t ? '--vt:' + d.t : ''}" data-tip="${esc(tip)}"><i></i>${esc(o && o.full ? full : d.label)}</span>`;
  };
  ui.lang = (l, o) => { if (!l) return ''; const n = fmt.langName(l); return `<span class="ov-lang" data-tip="${esc(n + (o && o.source ? ' · ' + o.source : ''))}">${esc(o && o.full ? n : fmt.langCode(l))}</span>`; };
  // 'not yet announced', 'unknown', 'TBA' are no platform: a dash with the reason, never a monogram chip (spec §1.7)
  const NO_PLATFORM = /^\s*(?:not yet announced|not announced|unknown|tba|tbc|tbd|n\/?a|none|—|-)\s*$/i;
  ui.platform = (name, o) => {
    o = o || {};
    if (name && NO_PLATFORM.test(String(name))) return ui.unk(o.unkTip || String(name).replace(/^./, c => c.toUpperCase()));
    if (!name) return ui.unk(o.unkTip || 'Platform unknown');
    const on = o.on && ON_GLYPH[o.on] ? o.on : null, onK = o.on && ON_LABEL[o.on] ? o.on : null;

    if (t.hasAttribute('data-tcol')) { const id = t.getAttribute('data-tcol'), T = TABLES[id]; if (T) { T.st.userCols = true; if (t.checked) T.st.hidden.delete(t.value); else T.st.hidden.add(t.value); rerenderTable(id); } return; }
    if (t.id === 'ov-market') { OV.setState({ market: t.value }); }
  }
  const INPUT_T = {};
  function onInput(e) {
    const t = e.target; if (!t || !t.getAttribute) return;
    if (t.hasAttribute('data-tsearch')) {
      const id = t.getAttribute('data-tsearch'), T = TABLES[id]; if (!T) return;

    }
  }
  function onKey(e) {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);
    if (e.key === 'Escape') { OV.coach.hide(); OV.drawer.close(); closeMenus(); closeAC(); hideTip(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    // Enter / Space on a focused clickable row, card line or KPI acts like a click (links and buttons do this natively)
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('tr[data-ti], [data-title-key], [data-go], [data-set], [data-act]')
      && !/^(A|BUTTON|SUMMARY)$/.test(e.target.tagName)) { e.preventDefault(); e.target.click(); return; }

  }

  /* ================================================================== boot */
  function boot() {
    if (BOOTED) return;

    if (OV.offline) document.body.classList.add('ov-is-offline');

      else if (COACH.on && Date.now() - COACH.at > 400) OV.coach.hide();   // the marks are pinned to the screen: scrolling hides them
    }, true);
    document.addEventListener('mousemove', chartHover);
    document.addEventListener('mouseleave', () => document.querySelectorAll('.ov-ctip').forEach(t => { t.style.display = 'none'; }), true);
    document.getElementById('ov-period').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b && !b.disabled) OV.setState({ period: b.getAttribute('data-p') }); });
    document.getElementById('ov-theme').addEventListener('click', () => OV.setState({ theme: OV.state.theme === 'dark' ? 'light' : 'dark' }));
    document.getElementById('ov-help').addEventListener('click', () => { if (COACH.on) OV.coach.hide(); else OV.coach.show(); });
    document.getElementById('ov-burger').addEventListener('click', () => document.body.classList.toggle('nav-on'));
    document.getElementById('ov-scrim').addEventListener('click', () => OV.drawer.close());
    document.getElementById('ov-drawer-x').addEventListener('click', () => OV.drawer.close());
    document.getElementById('ov-export').addEventListener('click', () => document.getElementById('ov-export-menu').classList.toggle('on'));
    document.getElementById('ov-export-menu').addEventListener('click', e => {
      const b = e.target.closest('button[data-x]'); if (!b) return;
      closeMenus();
      if (b.getAttribute('data-x') === 'print') { window.print(); return; }
      const def = CUR && REG[CUR.id];
      if (def && typeof def.export === 'function') { def.export(OV.ctx); return; }
      const w = document.querySelector('#ov-view .ov-tw[data-tid]');
      if (!w || !OV.exportTable(w.getAttribute('data-tid'))) OV.toast('No table on this page');
    });
    window.addEventListener('hashchange', render);

    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { rehideTables(); redrawCharts(); fitNames(); }, 160); });

      .observe(document.getElementById('ov-view').parentNode.parentNode, { childList: true, subtree: true });
    if (!OV.offline) {
      D.meta().then(m => { if (m && arr(m.circles).length) { CIRCLES = m.circles.map(c => ({ id: c.id, name: c.name, geos: c.geos })); fillMarket(); syncControls(); } }).catch(() => {});
      refreshStatus(false);
      OV.refreshBadges();
      fresh.load();
      OV.api.get('/api/ott/meta', null, { ttl: 3600 }).then(m => {
        const g = (m && m.glossary) || {};
        Object.keys(g).forEach(k => { const x = g[k]; if (x && x.def) GLOSS[k] = String(x.def).replace(/last complete month/i, 'latest month Google has published') + (x.source ? ' · ' + x.source : ''); });
      }).catch(() => {});
      setInterval(() => { if (!SCAN.timer && SCAN.status) paintPill(SCAN.status); }, 60000);   // the age ticks without a fetch
    }
    // a nav item whose page script has not shipped yet: a one-line "coming" page, never a 404 or a blank view
    NAV.filter(n => n.coming && !REG[n.id]).forEach(n => OV.register(n.id, {
      coming: true,
      render(el) { el.innerHTML = OV.ui.page({ title: n.title, subtitle: 'Coming', main: OV.ui.card({ body: OV.ui.empty(n.title + ' is coming', { box: true, action: { label: 'Back to Today', go: [OV.HOME, {}] } }) }) }); },
    }));
    if (!location.hash) history.replaceState(null, '', '#/' + (REG[OV.HOME] ? OV.HOME : 'overview'));
    if (OV.static) {                    // the shared read-only copy: say so once, at the top of every page
      document.documentElement.classList.add('ov-static');
      const b = document.createElement('div');
      b.className = 'ov-static-bar';
      b.textContent = `Read-only snapshot · taken ${window.OV_STATIC.taken || ''} · numbers do not update · scans and refresh are off`;
      if (window.OV_STATIC.update_url) {  // the owner's button (GitHub "Run workflow": only the repo owner can press it)
        const a = document.createElement('a');
        a.href = window.OV_STATIC.update_url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = 'Update now (owner)'; a.className = 'ov-static-upd';
        b.append(' · ', a);
      }
      document.body.prepend(b);
    }
    // the image index first (a local read, ≤ 1.2 s) so tiles draw as pictures on the first paint
    Promise.race([OV.thumbs.load(), new Promise(r => setTimeout(r, 1200))]).then(render, render);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

<script>
/* ---- pages_core.js ---- */
/* =====================================================================================================
   OTTVerse Trends — core pages: Overview · Search Trends · Title Overview (docs/OTTVERSE_SPEC.md §4).
   Built only from window.OV (docs/OTTVERSE_COMPONENTS.md). Every server string goes through esc / ui.*.
   Text budget: no paragraph; the only sentences are the Recommended-action brief and tooltips.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const D = OV.data;
  const jattr = o => esc(JSON.stringify(o));

  /* ================================================================== shared helpers */
  const BREAKOUT_PCT = 1000, BREAKOUT_MIN_VOL = 10000;     // pulse/decide.py BREAKOUT_* (refreshed from /api/pulse/meta)
  let THRESH = null;
  D.meta().then(m => { THRESH = (m && m.thresholds) || null; }).catch(() => {});
  const isBreakout = it => isNum(it.increase_pct) && it.increase_pct >= ((THRESH && THRESH.breakout_pct) || BREAKOUT_PCT)
    && isNum(it.volume) && it.volume >= ((THRESH && THRESH.breakout_min_volume) || BREAKOUT_MIN_VOL);
  // ONE source of truth on a board row (audit, 4 Oct). Google's RSS gives no growth: a row re-decided on it counts as
  // a breakout on its paid scan's growth + band, flagged 'scan' (never silently dropped, never shown as the RSS's own)
  const breakoutOf = it => {
    if (!it) return '';
    if (isBreakout(it)) return 'now';
    const d = it.decision || {}, e = d.earlier;
    return !isNum(it.increase_pct) && d.basis_source === 'free-rss' && e && isBreakout({ increase_pct: e.growth, volume: e.volume }) ? 'scan' : '';
  };
  // the shown # is the re-decided rank (rows on Google's lists now first, players folded into their match); the
  // momentum Δ is the paid scans' movement on the SCAN board (rank_scan) — another rank system whenever the two differ
  const rankBasisDiffers = it => !!(it && isNum(it.rank) && isNum(it.rank_scan) && it.rank !== it.rank_scan);
  const scanMove = (it, scanTs) => {
    const m = it.momentum || {};
    const arrow = m.state === 'up' ? '▲' + Math.abs(m.delta) : m.state === 'down' ? '▼' + Math.abs(m.delta) : m.state === 'same' ? '=' : m.state === 'new' ? 'NEW' : '—';
    return OV.scanWord(true) + (scanTs ? ' ' + fmt.time(scanTs) : '') + ': #' + it.rank_scan + (isNum(m.prev_rank) ? ' (previous scan #' + m.prev_rank + ', ' + arrow + ')' : m.state === 'new' ? ' (NEW)' : '');
  };
  const deltaCell = (it, scanTs) => {
    if (it.source === 'free-rss') return ui.unk('New on Google’s RSS after the scan · no earlier rank to compare');
    const m = it.momentum || {}, d = it.decision || {};
    if (m.state === 'new' || !(rankBasisDiffers(it) || d.earlier)) return ui.rankDelta(m);
    return `<span class="ov-neq" data-tip="${esc('Different measurement — no arrow: #' + it.rank + ' is the rank now' + (d.basis_word ? ' (' + d.basis_word + ' ' + (d.basis_hhmm || '') + ')' : '') + '; the scans’ Δ is on the scan board\n' + scanMove(it, scanTs))}">≠</span>`;
  };
  // the most common language among TITLES: a search we cannot type ('other') is no title of any language
  const topLanguage = rows => {
    const lc = {};
    arr(rows).filter(it => !isSpelling(it) && it.language && (it.type || 'other') !== 'other').forEach(it => { const l = fmt.langName(it.language); lc[l] = (lc[l] || 0) + 1; });
    return Object.entries(lc).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))[0] || null;
  };
  // 'Tracked x of N': N is the paid scan's distinct trending searches, so rows that reached Google's RSS after the scan
  // are named separately, never counted inside the scan's denominator
  const trackedSub = (rows, total) => {
    const nRss = arr(rows).filter(it => it.source === 'free-rss' && !isSpelling(it)).length;
    if (!isNum(total)) return '';
    return nRss ? `${fmt.num(arr(rows).filter(it => !isSpelling(it)).length - nRss)} of ${fmt.num(total)} at scan · +${fmt.num(nRss)} RSS` : `of ${fmt.num(total)} trending`;
  };
  OV.boards = { breakoutOf, rankBasisDiffers, scanMove, deltaCell, topLanguage, trackedSub };
  const TYPE_OPTS = [['movie', 'Film', ['movie', 'film']], ['series', 'Series / Show', ['series', 'show']], ['sports_event', 'Match', ['sports_event', 'sports_generic']],
    ['player', 'Player / Team', ['player', 'team']], ['person', 'Person', ['person']], ['music', 'Music', ['music']], ['platform', 'Platform', ['platform']], ['other', 'Other', ['other']]];
  const typeGroup = t => { const g = TYPE_OPTS.find(o => o[2].includes(t || 'other')); return g ? g[0] : 'other'; };
  // a row folded into another (a match's extra spelling, a player mirroring his match): one thing, one row
  const isSpelling = it => !!(it.fold_lead || (it.fixture && it.fixture.is_primary === false));
  // distinct things with a verdict, as the board counts them: spellings fold into their lead, and a player / team
  // that only mirrors a match's verdict counts with the match (one definition on Overview and Search Trends)
  const isMirror = it => (it.type === 'player' || it.type === 'team') && !!(it.verdict && it.verdict.link);
  const nVerdict = (rows, code) => arr(rows).filter(it => !isSpelling(it) && !isMirror(it) && it.verdict && it.verdict.code === code).length;
  OV.nVerdict = nVerdict;
  const vIndex = v => { const i = OV.V_ORDER.indexOf(v && v.code); return i < 0 ? 99 : i; };
  const TRIG_ICON = { match: 'match', match_day: 'match', match_result: 'match', squad_news: 'users', release: 'release', box_office: 'release', ott_release: 'play', premiere: 'play',
    episode: 'play', festival: 'calendar', trailer: 'trailer', death: 'users', personal: 'users', award: 'star', music: 'play', wiki: 'wiki' };
  const whyText = it => it.why && it.why.kind !== 'unknown' && it.why.label ? it.why.label : '';
  const whyCell = it => {
    const w = it.why;
    if (!w || w.kind === 'unknown' || !w.label) return ui.unk(it.insight ? 'No clear trigger in the calendar, headlines or Wikipedia' : 'Outside the insight engine’s top rows');
    const tip = [w.label, it.why_via ? 'Trending because of “' + it.why_via + '”' : '', w.confidence ? 'Confidence: ' + w.confidence : ''].filter(Boolean).join('\n');
    return `<span class="why" data-tip="${esc(tip)}">${OV.icon(TRIG_ICON[w.kind] || 'news')}<span class="wt">${esc(w.label)}</span></span>`;
  };
  // why a row has no platform, in one line (never a guess): the backend's own note when it sends one
  const unknownWhy = it => {
    const note = it.availability_note || (it.availability && it.availability.note) || it.rights_note;
    if (note) return 'Streams on: unknown\n' + note;
    const t = it.type || 'other';
    if (t === 'person') return 'Streams on: — · a person, not a title (promote their titles)';
    if (t === 'player' || t === 'team') return 'Streams on: — · a player or team: rights follow their match';
    if (t === 'sports_event' || t === 'sports_generic') return 'Streams on: unknown\nNo rights holder in the release calendar or Airtel’s partner list · check rights';
    if (t === 'platform') return 'A platform itself';
    return 'Streams on: unknown\nNot found in catalog › calendar › partner list › Wikidata · check rights';
  };
  OV.unknownWhy = unknownWhy;
  const platformOf = it => {
    const p = it.platform || null;
    return ui.platform(p && p.name, { on: p ? p.on_xstream : 'unknown', via: it.availability_via, pack: it.availability_pack, source: it.availability_source, unkTip: unknownWhy(it), noVia: true });
  };
  const titleHref = key => '#/title?key=' + encodeURIComponent(key);
  // the title cell: picture (Wikipedia image or typed monogram) · the FULL name (wraps, never cut) · one short sub-line
  // (type badge · language · Google's own spelling when it differs); the type's words live in the badge's tooltip
  // the title cell = the ROW RULE (OTTVERSE_DESIGN_SYSTEM.md §3): picture · the FULL name · ONE meta line
  // ("Film · Telugu", "Match · Cricket"). Google's own spelling, folded spellings, the Google hint and the freshness tags
  // live in the hover tooltip (and on Title 360), never under the name.
  const titleCell = (it, o) => {
    o = o || {};
    const tip = [];
    if (it.language) tip.push('Language: ' + fmt.langName(it.language) + (it.language_source ? ' · ' + it.language_source : ''));
    if (norm2(it.name) !== norm2(it.query)) tip.push('Google’s spelling: ' + it.query);
    const gh = it.google_hint;
    if (gh && (!it.type || it.type === 'other')) tip.push('Google’s search box maps it to “' + gh.title + '” (' + (gh.type || 'no type') + ') · a hint, not Wikidata');
    const fo = arr(it.folded);
    if (fo.length) tip.push('Folded into this row:\n' + fo.slice(0, 12).join('\n'));
    else if (it.fixture && it.fixture.is_primary && it.fixture.spellings > 1) tip.push('Same match, ' + it.fixture.spellings + ' spellings — scored once on their combined searches');
    if (o.tip) tip.push(o.tip);
    const lead = it.fold_lead || (it.fixture && it.fixture.is_primary === false ? (it.fixture.primary_query || it.fixture.label) : '');
    const meta = isSpelling(it) ? '↳ spelling of “' + (lead || '') + '”' : OV.rowMeta(it);
    const fr = o.fresh && ui.freshText ? ui.freshText(o.fresh) : '';
    return ui.nameCell(it, { meta, metaHtml: fr ? esc(meta) + (meta ? ' · ' : '') + fr : '', tip: tip.join('\n'), href: it.key ? titleHref(it.key) : '' });
  };
  const norm2 = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const startedCell = (it, scanTs) => {
    if (!isNum(it.started)) return ui.unk('Start time unknown');
    const same = scanTs && fmt.day(scanTs) === fmt.day(it.started);
    const live = it.active ? '<i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:5px;vertical-align:1px" data-tip="Still trending (Google: active)"></i>' : '';
    return `<span data-tip="${esc('Started ' + fmt.ist(it.started) + (it.active ? ' · still active' : ' · Google had already ended it at the scan'))}" style="color:var(--ink-2)">${live}${it.active === false ? '<i class="ov-endot"></i>' : ''}${esc(same ? fmt.time(it.started) : fmt.day(it.started))}</span>`;
  };
  // a state / circle board shows the band its OWN list gave (volume_scope 'state'), India the national one
  const volCell = it => it.volume_label && it.volume_label !== 'unknown' ? `<span data-tip="${esc((it.volume_scope === 'state' ? 'Google Trending-now searches band on this market’s own state list' + (it.national_volume ? ' (India: ' + fmt.compact(it.national_volume) + '+)' : '') : 'Google Trending-now searches band, India') + ', last 24 h · ' + (it.decision && it.decision.basis_word ? it.decision.basis_word + ' ' + it.decision.basis_hhmm : 'seen at the scan') + (it.fixture ? ' · a match: its spellings summed' : ''))}">${esc(it.volume_label)}</span>` : ui.unk(it.volume_scope === 'state' ? 'This market’s list gave no volume band' : 'Volume band unknown');

    const s = arr(it.spark);

  };
  const dmom = m => { if (!m) return null; if (m.state === 'new') return 1000; if (isNum(m.delta)) return m.delta; if (m.state === 'same') return 0; return null; };

  }

  };

  /* ================================================================== status strip (Overview) */
  function statusStrip(st, home) {
    if (!st) return '';
    const ls = st.last_scan, run = st.running, caps = st.caps || {}, est = st.estimate || {};
    const curves = ls && ls.curves;

  OV.register('overview', {

    const X = t => ((t - t0) / (t1 - t0) * 100).toFixed(2) + '%';
