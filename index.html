  --thumb: 28px; --thumb-slot: 36px; --thumb-lg: 72px;

  --fill-blue: #214EA6; --fill-teal: #0A6F63; --fill-violet: #5740B3; --fill-amber: #986100; --fill-pink: #9D3461;
  --fill-cyan: #06667D; --fill-slate: #465161; --fill-lime: #477209; --fill-orange: #A43E08; --fill-up: #0F7234;

* { box-sizing: border-box; }

.ov-top { position: fixed; z-index: 40; top: 0; left: 0; right: 0; height: var(--top-h); display: flex; align-items: center; gap: 12px;

.ov-search > .ov-ico { position: absolute; left: 11px; top: 9px; color: var(--ink-3); }

.ov-ac { position: absolute; top: 40px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px; display: none; max-height: 70vh; overflow: auto; }
.ov-ac.on { display: block; }
.ov-ac-h { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px 4px; display: flex; justify-content: space-between; }
.ov-ac-i { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; cursor: pointer; min-height: 34px; }
.ov-ac-i.on, .ov-ac-i:hover { background: var(--sel); }
.ov-ac-i .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.ov-ac-i .m { color: var(--ink-3); font-size: var(--fs-sm); white-space: nowrap; }

.ov-ac-foot { border-top: 1px solid var(--line-2); margin-top: 4px; padding: 6px 8px 2px; font-size: var(--fs-xs); color: var(--ink-3); display: flex; gap: 12px; }
.ov-ctl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.ov-sel { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 0 26px 0 10px; font-weight: 500; max-width: 210px;
  appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 13px) 14px, calc(100% - 9px) 14px; background-size: 4px 4px; background-repeat: no-repeat; }

.ov-ib { height: 32px; min-width: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 9px; color: var(--ink-2); font-weight: 600; font-size: var(--fs-sm); position: relative; }
.ov-ib:hover { background: var(--hover); color: var(--ink); }

.ov-menu { position: absolute; top: 38px; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow-2); padding: 5px; min-width: 190px; display: none; z-index: 60; text-align: left; }
.ov-menu.on { display: block; }

.ov-ni .ct { margin-left: auto; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); background: var(--field-2); border-radius: 9px; padding: 0 6px; line-height: 17px; font-variant-numeric: tabular-nums; }
.ov-ni .ct.hot { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down); }
.ov-nav-foot { margin: 18px 10px 0; font-size: var(--fs-xs); color: var(--ink-3); }

.ov-main { margin-left: var(--nav-w); padding: calc(var(--top-h) + 16px) 24px 48px; min-height: 100vh; }

.ov-top .ov-offline-badge { display: none; }

/* ------------------------------------------------------------------ page anatomy */
.ov-ph { display: flex; align-items: center; gap: var(--sp-4); margin: 0 0 var(--sp-4); min-height: 44px; }

.ov-crumb { font-size: var(--fs-sm); color: var(--ink-3); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }

.ov-filters { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin: 0 0 var(--sp-4); padding: var(--sp-2) var(--sp-3); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

.ov-fsel { height: 30px; border: 1px solid var(--line); border-radius: 8px; background-color: var(--field); padding: 0 24px 0 9px; font-weight: 500; font-size: var(--fs-md); max-width: 200px;
  appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 12px) 13px, calc(100% - 8px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }

  background-repeat: no-repeat; background-position: 8px 8px; }
