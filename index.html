@media (max-width: 760px) { .cg-ph360 { flex-wrap: wrap; } .cg-ph360 > .ov-th, .cg-ph360 > .ov-thp { --th: 48px !important; } }

/* ---- pages_free.css ---- */
/* OTTVerse — free refresh button, "fresh as of" strip, LIVE strip (web/ott/pages_free.js). Tokens only. */

/* the free button: neutral outline + a green FREE tag — never the red, confirm-gated paid "Run scan" */
.ov-freebtn { height: 26px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--field); color: var(--ink-2); font-size: var(--fs-sm); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ov-freebtn:hover { background: var(--hover); color: var(--ink); }
.ov-freebtn:disabled { opacity: .65; cursor: progress; }
.ov-freebtn .ic { display: inline-flex; }
.ov-freebtn .ic .ov-ico { width: 14px; height: 14px; }
.ov-freebtn .ic.spin .ov-ico { animation: ov-free-spin 1s linear infinite; }
.ov-freebtn.hd { height: 24px; }
.ov-freebtn.live { border-color: color-mix(in srgb, var(--teal) 45%, var(--line)); }
.ov-free-tag { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; line-height: 16px; padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--up) 13%, transparent); color: var(--up-ink); }
@keyframes ov-free-spin { to { transform: rotate(360deg); } }

/* Top Charts: fresh-as-of strip (an .ov-strip) */
.ov-freestrip { gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); }
.ov-freestrip .lk { border: 0; background: none; padding: 0; color: var(--ink-2); font-size: var(--fs-sm); cursor: pointer; }
.ov-freestrip .lk:hover { color: var(--blue-ink); text-decoration: underline; }
.ov-fdot { width: 6px; height: 6px; border-radius: 50%; background: var(--flat); display: inline-block; }
.ov-fdot.ok { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 18%, transparent); }
.ov-fdot.off { background: transparent; border: 1.5px solid var(--flat); }
.ov-t tr.ov-freerow td:first-child { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--blue) 55%, transparent); }

/* LIVE strip: one compact line per big match */
.ov-livestrip { display: flex; align-items: stretch; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); padding: var(--sp-1) var(--sp-2); background: var(--card); border: 1px solid color-mix(in srgb, var(--brand) 28%, var(--line)); border-radius: var(--r); box-shadow: var(--shadow); font-size: var(--fs-sm); color: var(--ink-2); }
.ov-livebadge { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; color: var(--brand); white-space: nowrap; }
.ov-livebadge i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: ov-pulse 1.4s infinite; }
.ov-livestrip .lm { display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; min-height: 40px; padding: var(--sp-1) var(--sp-3); border-left: 1px solid var(--line-2); cursor: pointer; border-radius: 6px; }
.ov-livestrip .lm:hover, .ov-livestrip .lm:focus-visible { background: var(--hover); outline: none; }
.ov-livestrip .nm { font-size: var(--fs-base); font-weight: 600; color: var(--ink); overflow-wrap: anywhere; line-height: var(--lh-name); }   /* a name: 14/600, complete */
.ov-livestrip .win { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ov-livestrip .win .ov-ico { width: 12px; height: 12px; }
.ov-livestrip .ht { font-size: var(--fs-md); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 20px; }
.ov-livestrip .sts { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
@media (max-width: 760px) { .ov-livestrip .lm { border-left: 0; flex-wrap: wrap; } .ov-top .ov-freebtn.hd { display: none; } }
@media print { .ov-freebtn, .ov-freestrip .lk { display: none !important; } }

/* ---- pages_health.css ---- */
/* OTTVerse — Data health (web/ott/pages_health.js). Tokens only; light first, dark via the shared token override. */

/* status: the system pill (22 · 0 8 · radius 11 · md/500 · 6 px dot) */
.hl-pill { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--field-2); color: var(--ink-2); }
.hl-pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.hl-pill.up { background: color-mix(in srgb, var(--up) 13%, transparent); color: var(--up-ink); }
.hl-pill.warn { background: color-mix(in srgb, var(--amber) 17%, transparent); color: color-mix(in srgb, var(--amber) 78%, var(--ink)); }
.hl-pill.down { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down-ink); }
.ov-ph h1 .hl-pill { margin-left: var(--sp-2); vertical-align: 2px; }

/* status squares: one per run */
.hl-strip { display: inline-flex; gap: 2px; align-items: center; vertical-align: middle; }
.hl-strip i { width: 5px; height: 12px; border-radius: 1.5px; background: var(--line); display: inline-block; }

/* the G · chip = the system pill (22 · radius 11 · 13/500, soft blue) */
.rd-gchip { display: inline-flex; align-items: center; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; color: var(--blue-ink); background: color-mix(in srgb, var(--blue) 11%, transparent); white-space: nowrap; font-variant-numeric: tabular-nums; }

.rd-page { max-width: 1180px; }

/* ---- pages_sweep.css ---- */
/* OTTVerse — India Sweep (web/ott/pages_sweep.js) + Title 360's "Google detail (free)" card. Tokens only, light first.
   Rows follow the shared row rule (.ov-tcell from ott.css): no name / meta / pill sizes here. */
.sw-tabs { margin-bottom: var(--sp-2); }
.sw-tabs .ov-tabs { flex-wrap: wrap; }
/* header: scan + deep-dive state as system pills (22 · 0 8 · radius 11 · md/500) */
.sw-pill { display: inline-flex; align-items: center; gap: 4px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; background: var(--field-2); color: var(--ink-2); font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sw-pill b { color: var(--ink); font-weight: 600; }
.sw-blocked { border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
.sw-blocked > .ov-ico { width: 16px; height: 16px; color: var(--amber); }
.sw-mt { margin-top: var(--sp-2); }

.ov-t td.sw-qc { min-width: 320px; }
.ov-t td.sw-qc .ov-tcell { max-width: 420px; }   /* long Google queries stay complete in two lines */
.sw-g { color: var(--up-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
/* Active / Ended: one system pill with a 6 px dot */
.sw-st { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sw-st i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.sw-st.on { background: color-mix(in srgb, var(--up) 12%, transparent); color: var(--up-ink); }
.sw-st.off { background: var(--field-2); color: var(--ink-3); }
.sw-st.off i { background: var(--ink-4); }
.sw-cnt { display: inline-block; min-width: 24px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
/* long text cells: two lines at most, the full text on hover (keeps every row 48 px) */
.sw-where, .sw-why, .sw-codes { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; white-space: normal; line-height: var(--lh-meta); font-size: var(--fs-sm); color: var(--ink-2); }
.ov-t td .sw-where, .ov-t td .sw-why { min-width: 260px; max-width: 520px; }
.sw-codes { min-width: 260px; max-width: 330px; letter-spacing: .02em; word-spacing: 2px; font-variant-numeric: tabular-nums; cursor: help; }
.sw-hint { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.sw-hint small { color: var(--ink-3); font-size: var(--fs-sm); white-space: normal; overflow-wrap: anywhere; line-height: var(--lh-meta); }   /* cards only: Google's entity title */
.sw-hintbig { margin-bottom: var(--sp-2); }
.sw-hintbig .sw-hint { max-width: 100%; flex-wrap: wrap; }
.sw-g360 .ov-grid > div { min-width: 0; overflow-wrap: anywhere; }

/* honest state words: rate-limited (amber, clock) vs no data (grey) */
.sw-word { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-3); padding: var(--sp-1) 0; }
.sw-word .ov-ico { width: 14px; height: 14px; }
.sw-word.rate_limited, .sw-word.self_cap { color: color-mix(in srgb, var(--amber) 80%, var(--ink)); font-weight: 500; }
.sw-word.error { color: var(--down-ink); }

/* deep-dive / related / news card grids */
.sw-ddg { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
.sw-dd { cursor: pointer; margin: 0; }
.sw-dd:hover { border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); }
.sw-ddh { display: flex; align-items: flex-start; gap: var(--sp-3); margin-bottom: var(--sp-1); }
.sw-ddh > .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sw-ddh h3 { margin: 0; font-size: var(--fs-base); font-weight: 600; line-height: var(--lh-name); color: var(--ink); overflow-wrap: anywhere; }
.sw-ddh > .sw-hint { flex: none; max-width: 45%; flex-wrap: wrap; justify-content: flex-end; text-align: right; }
.sw-ddh .ov-note1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sw-ddh .ov-note1 b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sw-more { font-weight: 600; color: var(--blue-ink); text-decoration: none; letter-spacing: 0; margin-left: 4px; }
.sw-mline { margin-bottom: var(--sp-2); }
.sw-scanl { font-variant-numeric: tabular-nums; }
.sw-dd .ov-sub-h { margin-top: var(--sp-3); }
.sw-dd .ov-bl-r { cursor: default; }
.sw-news { margin: 4px 0 0; padding-left: 16px; font-size: var(--fs-sm); line-height: var(--lh-meta); }
.sw-news li { margin: 4px 0; }
.sw-news a { color: var(--ink); }
.sw-news small { color: var(--ink-3); font-size: var(--fs-sm); }
.sw-chips { display: flex; flex-wrap: wrap; gap: 4px; }
/* rising searches: system pills */
.sw-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; background: var(--field-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sw-chip b { color: var(--up-ink); font-weight: 600; }
.sw-ll { columns: 2; column-gap: 16px; font-size: var(--fs-sm); line-height: var(--lh-meta); margin: 4px 0 0; padding-left: 16px; }
.sw-ll li { break-inside: avoid; margin: 2px 0; }
.sw-ll small { color: var(--ink-3); font-size: var(--fs-sm); }
.sw-relg { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.sw-relg .sw-ll { columns: 1; }

/* 7-day curve cards */
.sw-cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-4); }
.sw-cv { margin: 0; cursor: pointer; }
.sw-cvh { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: 4px; }
.sw-cv h4 { margin: 0; font-size: var(--fs-base); font-weight: 600; line-height: var(--lh-name); color: var(--ink); overflow-wrap: anywhere; }
.sw-cv .ov-spark { width: 100%; height: 46px; margin-top: 4px; }

/* Title 360 card */
.sw-g360 { margin-bottom: var(--sp-4); }
.sw-g360 .ov-grid { margin-bottom: 0; }
.sw-g360 .ov-sub-h:first-child { margin-top: 0; }

@media (max-width: 900px) {
  .sw-ddg { grid-template-columns: 1fr; }
  .sw-g360 .ov-grid { grid-template-columns: 1fr !important; }
  .ov-t td .sw-where, .ov-t td .sw-why { max-width: 260px; }
}

/* ---- pages_today.css ---- */
/* OTTVerse — Today (web/ott/pages_today.js) + the side nav's collapsible MORE group (core.js renderNav). Tokens only. */

/* ---- side nav: MORE toggle (collapsed: only the page you are on stays visible) */
.ov-nav .ov-more { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; font: inherit; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .07em; color: var(--ink-3); padding: 14px 10px 5px; border-radius: 6px; }
.ov-nav .ov-more:hover { color: var(--ink); }
.ov-nav .ov-more:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.ov-nav .ov-more .chev { width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(-45deg); margin-left: 2px; transition: transform .15s; }
.ov-nav .ov-more[aria-expanded="true"] .chev { transform: rotate(45deg); margin-top: -3px; }
.ov-nav .ov-more .ct { margin-left: auto; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0; color: var(--ink-3); background: var(--field-2); border-radius: 9px; padding: 0 6px; line-height: 17px; font-variant-numeric: tabular-nums; }
.ov-nav .ov-more .ct.hot { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down-ink); }
.ov-moreg.shut .ov-ni:not(.on) { display: none; }

/* ---- header strip */
.tw-strip { gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); }
.tw-strip .tw-date b { font-size: var(--fs-md); }
.tw-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: var(--flat); flex: none; }
.tw-dot.ok { background: var(--up); }
.tw-dot.warn { background: var(--amber); }
.tw-dot.bad { background: var(--down); }
.tw-dot.off { background: transparent; border: 1.5px solid var(--flat); }
.tw-strip .tw-hl { border: 0; background: none; padding: 0; font: inherit; color: var(--ink-2); cursor: pointer; }
.tw-strip .tw-hl:hover { color: var(--ink); }
.tw-cs { margin-left: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---- the tables inside the cards are .ov-t (THE ROW RULE: 48 px rows, 11 px uppercase headers); only page bits here */
.tw-scroll { overflow-x: auto; }
.tw-t th { position: static; }                       /* inside a card: no sticky header */
.tw-t .mem { font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); font-weight: 400; }
.tw-t td.sg { white-space: normal; min-width: 222px; line-height: 0; }   /* at most two pill lines (2 × 23) inside the 48 px row */
.tw-t td.sg .tw-sig { margin: 1px 4px 0 0; vertical-align: top; }
.tw-t td.wn { width: 1%; }
.tw-t td.wn .mem { text-align: left; }
.tw-t td.bd, .tw-t td.cf, .tw-t td.xs, .tw-t td.sc { width: 1%; }
.tw-t td.vl { color: var(--ink-2); }
.tw-t td.vl b { color: var(--ink); font-weight: 600; }
.tw-t .tm { font-weight: 500; color: var(--ink-2); }
.tw-t td.nmc .ov-tcell { min-width: 160px; max-width: 260px; }
.tw-act td.nmc .ov-tcell { min-width: 180px; max-width: 220px; }
.tw-mt td.nmc .ov-tcell { min-width: 150px; max-width: 175px; }
.tw-act td:not(:first-child):not(:last-child), .tw-act th:not(:first-child):not(:last-child) { padding-left: 6px; padding-right: 6px; }
.tw-when { font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); line-height: var(--lh-name); }
.tw-when.today { color: var(--teal-ink); }            /* the competition (meta) ellipsises; the name never does */
.tw-land td.nmc .ov-tcell { min-width: 150px; }
.tw-wh { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; min-width: 0; }
.tw-wh .nm { font-weight: 500; color: var(--ink); white-space: nowrap; }
.tw-mt .tw-wh .tw-wh .ov-tag { display: none; }
.tw-mt td.bd { text-align: right; }        /* matches: the bundle column says it; the monogram names the app */
@media (max-width: 1600px) { .tw-act .tw-wh .nm { display: none; } }   /* the platform name rides the logo's tooltip */

/* signal chips: G (Google heat) · W (Wikipedia rise) · match — the system pill (22 · radius 11 · 13/500) with a glyph */
.tw-sig { display: inline-flex; align-items: center; gap: 4px; height: var(--pill-h); padding: 0 7px 0 3px; margin-right: var(--sp-1); border-radius: 11px; background: var(--field-2); font-size: var(--fs-md); font-weight: 500; line-height: 1; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
.tw-sig i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: var(--fs-xs); font-weight: 600; color: var(--on-fill); }
.tw-sig i .ov-ico { width: 10px; height: 10px; }
.tw-sig small { font-size: var(--fs-sm); font-weight: 400; color: var(--ink-3); }
.tw-sig.g i { background: var(--fill-blue); }
.tw-sig.w i { background: var(--fill-violet); }
.tw-sig.m i { background: var(--fill-teal); }
.tw-sig.live { color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, transparent); padding-left: 8px; }
.tw-sig .dot, .tw-live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block; animation: ov-pulse 1.4s infinite; }
.tw-live { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); font-size: var(--fs-md); font-weight: 600; color: var(--brand); }

/* score bar */
.tw-sc { display: inline-flex; align-items: center; gap: 6px; }
.tw-sc b { min-width: 28px; text-align: right; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tw-sc i { width: 36px; height: 4px; border-radius: 2px; background: var(--field-2); position: relative; overflow: hidden; }
.tw-sc i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--blue); border-radius: 2px; }
.tw-xs { font-weight: 600; color: var(--ink-3); }
.tw-xs.on { color: var(--up-ink); }

.tw-more { padding: var(--sp-2) var(--sp-4) var(--sp-3); }
.tw-plats { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-1) var(--sp-4) var(--sp-2); }
.tw-pp { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px 0 3px; border-radius: 11px; background: var(--field-2); font-size: var(--fs-md); font-weight: 500; }
.tw-pp b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* phones: rows stay one line each; the Why chips wrap under the title */
@media (max-width: 760px) {
  .tw-act thead { display: none; }
  .tw-act tr { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; grid-template-areas: "rk nmc sc" "rk sg sg" "rk wh cf"; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
  .tw-act td { height: auto; }
  .tw-act td.sg { white-space: normal; }
  .tw-act tr:last-child { border-bottom: 0; }
  .tw-act td { border: 0; padding: 2px 8px; }
  .tw-act td.rk { grid-area: rk; padding: 4px 0 0 10px; }
  .tw-act td.nmc { grid-area: nmc; max-width: none; }
  .tw-act td.sg { grid-area: sg; }
  .tw-act td.wh { grid-area: wh; }
  .tw-act td.cf { grid-area: cf; width: auto; text-align: right; }
  .tw-act td.sc { grid-area: sc; width: auto; text-align: right; padding-right: 14px; }
  .tw-act td.xs { display: none; }
  .tw-strip .sep, .tw-strip .sp { display: none; }
  .tw-wh .nm { display: none; }
  .tw-t td.nmc .ov-tcell { min-width: 0; }
  .tw-strip .it { white-space: normal; }
  #ov-view .ov-ph .acts .ov-btn:not(.tw-exp) { display: none; }
}
@media print { .tw-exp { display: none !important; } .tw-sig .dot, .tw-live .dot { animation: none; } }

/* ---- pages_trust.css ---- */
/* Stage 1 "Trust" (pages_trust.js): freshness tags, ranking header, Newly detected strip, the Why drawer. Tokens only. */
.ov-ft { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1;
  white-space: nowrap; border: 1px solid var(--line); color: var(--ink-3); background: transparent; vertical-align: middle; cursor: help; font-variant-numeric: tabular-nums; }
.ov-ft i { width: 6px; height: 6px; border-radius: 50%; background: var(--up); flex: none; }
.ov-ft.warn { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: color-mix(in srgb, var(--amber) 9%, transparent); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.ov-ft.warn i { background: var(--amber); }
.ov-ft.bad { border-color: color-mix(in srgb, var(--down) 40%, var(--line)); background: color-mix(in srgb, var(--down) 7%, transparent); color: var(--down-ink); }
.ov-ft.bad i { background: var(--down); }
.ov-ft.off i { background: var(--ink-4); }
.ov-fts { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }

/* the ranking header: source · geography · period */
.ov-rh { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; cursor: help; }
.ov-rh .ov-ico { width: 13px; height: 13px; color: var(--ink-3); flex: none; }
.ov-rh b { color: var(--ink); font-weight: 600; }
.ov-rh small { color: var(--ink-3); font-size: var(--fs-xs); }
.ov-rh .sep { color: var(--ink-4); }
.ov-rh.blk { display: flex; margin: -4px 0 10px; }

/* Newly detected */
.ov-nd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 10px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--card); box-shadow: var(--shadow); }
.ov-nd-h { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink); margin-right: 4px; cursor: help; white-space: nowrap; }
.ov-nd-h .ov-ico { width: 14px; height: 14px; color: var(--blue); }
.ov-nd-h b { font-weight: 600; color: var(--blue-ink); }
.ov-nd-i { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 2px 8px 2px 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--field);
  font: inherit; font-size: var(--fs-sm); color: var(--ink); cursor: pointer; max-width: 420px; text-align: left; }
.ov-nd-i:hover { background: var(--hover); border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); }
.ov-nd-i .nm { font-size: var(--fs-base); font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; min-width: 0; }
.ov-nd-i .ov-th { border-radius: 5px; }
.ov-nd-i .ht { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.ov-nd-i .fs { color: var(--ink-3); font-size: var(--fs-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ov-nd-i .uk { color: color-mix(in srgb, var(--amber) 70%, var(--ink)); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; padding: 0 4px; border-radius: 4px;
  background: color-mix(in srgb, var(--amber) 10%, transparent); font-variant-numeric: tabular-nums; }

/* the Why drawer */
.ov-dh { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ov-dh .sp { flex: 1; }
.ov-whyl { margin: 4px 0 10px; padding-left: 18px; font-size: var(--fs-md); line-height: 1.5; color: var(--ink); }
.ov-whyl li { margin: 3px 0; }
.ov-whyl li.verdict { font-weight: 600; }
.ov-whyl li.data, .ov-whyl li.lifecycle, .ov-whyl li.score { color: var(--ink-2); }
.ov-whyl.gaps { color: var(--ink-2); font-size: var(--fs-sm); }
.ov-ear td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-ear th { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; text-align: right; }
.ov-ear th:first-child { text-align: left; }
.ov-dm { display: inline-flex; align-items: center; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; white-space: nowrap; cursor: help;
  border: 1px dashed var(--line); color: var(--ink-3); }
.ov-rec { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ov-rec small { color: var(--ink-3); }
.ov-rec .ov-exp { color: var(--down-ink); }
.ov-rec-h { margin-top: 6px; }

/* Search Trends cells */
.ov-age { font-size: var(--fs-xs); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); margin-left: 4px; white-space: nowrap; }
.ov-neq { color: var(--ink-3); font-weight: 600; cursor: help; }
.tw-act td.tt .tw-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.ov-rh-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -2px 0 10px; }
.ov-rh-row .ov-rh.blk { margin: 0; }
.ov-why-card { margin: 12px 0; }

/* "Not known" as chips (sentence on hover) · the Title 360 note above the KPI cards as two chips */
.ov-gaps { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
.ov-gap { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; cursor: help;
  border: 1px dashed color-mix(in srgb, var(--amber) 45%, var(--line)); color: var(--ink-2); background: color-mix(in srgb, var(--amber) 6%, transparent); }
.ov-gap::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.ov-kpinote { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.ov-kpinote .ov-tag { cursor: help; }
.ov-ear td { font-variant-numeric: tabular-nums; }
/* a row's stale-data note inside its meta line (text, not a chip) */
.ov-ftx { cursor: help; font-variant-numeric: tabular-nums; }
.ov-ftx.warn { color: color-mix(in srgb, var(--amber) 75%, var(--ink)); }
.ov-ftx.bad { color: var(--down-ink); }
.ov-ftx .ov-ico { width: 12px; height: 12px; vertical-align: -2px; margin-right: 2px; }

/* ---- Why this recommendation? as boxes (3 Oct) */
.wv-bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.wv-bar-top .sp { flex: 1; }
.wv-chip { display: inline-flex; align-items: center; gap: 5px; height: var(--pill-h); padding: 0 var(--sp-2); border-radius: 11px; background: var(--bg); border: 1px solid var(--line); color: var(--ink-2); font-size: var(--fs-md); font-weight: 500; }
.wv-chip .ov-ico { width: 13px; height: 13px; color: var(--ink-3); }
.wv-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-3); }
.wv-tile { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--r); background: var(--card); min-width: 0; }
.wv-l { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-3); }
.wv-v { font-size: var(--fs-kpi); font-weight: 600; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.wv-tile.unk .wv-v { color: var(--ink-4); }
.wv-bar { position: relative; height: 6px; border-radius: 3px; background: var(--line-2); }
.wv-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--blue); }
.wv-bar b { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ink-2); border-radius: 1px; }
.wv-bar.none { background: transparent; border-top: 1px dotted var(--line); height: 0; margin-top: 3px; }
.wv-was { font-size: var(--fs-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wv-was i { font-style: normal; font-weight: 600; } .wv-was i.up { color: var(--up-ink); } .wv-was i.down { color: var(--down-ink); } .wv-was i.ne { color: var(--ink-4); }
.wv-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-3); }
.wv-box { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); min-width: 0; }
.wv-h { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.wv-watch { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.wv-ok { display: inline-flex; align-items: center; gap: 5px; color: var(--up-ink); font-size: var(--fs-md); font-weight: 500; } .wv-ok .ov-ico { width: 14px; height: 14px; }
.wv-hist { display: flex; flex-direction: column; gap: var(--sp-2); padding-top: var(--sp-2); border-top: 1px solid var(--line-2); }
.wv-tl { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-height: 18px; }
.wv-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 20%, transparent); }
.wv-tl-l { margin-left: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.wv-rec summary { cursor: pointer; font-size: var(--fs-sm); color: var(--ink-3); font-weight: 500; }
.wv-rec[open] summary { margin-bottom: var(--sp-2); }
@media (max-width: 1100px) { .wv-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .wv-row { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .wv-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* compact decision card on Title 360 (3 Oct): one facts line, no boxes, no duplicate numbers */
.wv-facts { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.2fr); border-top: 1px solid var(--line-2); }
.wv-g { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); min-width: 0; }
.wv-g + .wv-g { border-left: 1px solid var(--line-2); }
.wv-g:first-child { padding-left: 0; }
.wv-gb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.wv-gb .ov-fts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
.wv-gb .wv-rec summary { margin-top: 2px; }
.ov-why-card .wv-bar-top { margin-bottom: var(--sp-2); }
@media (max-width: 1100px) { .wv-facts { grid-template-columns: 1fr 1fr; } .wv-g:nth-child(3) { border-left: 0; padding-left: 0; } }
@media (max-width: 640px) { .wv-facts { grid-template-columns: 1fr; } .wv-g + .wv-g { border-left: 0; padding-left: 0; border-top: 1px solid var(--line-2); } }

/* ---- pages_zz_magic.css ---- */
/* =====================================================================================================
   Magic UI port — the effects that suit a dense intelligence tool, hand-ported to CSS (the script
   pages_zz_magic.js applies the classes): DotPattern canvas · BlurFade on cards · AnimatedList stagger ·
   NumberTicker on KPI values · BorderBeam on the hero card · ShimmerButton on the primary action.
   Every motion stops under prefers-reduced-motion. Light only. MIT (magicui.design).
   ===================================================================================================== */
/* DotPattern: a faint dot grid under the cards (the page stays light; cards sit white on top) */
:root:not([data-theme="dark"]) body { background-color: var(--bg); background-image: radial-gradient(var(--sc-border, #E4E4E7) .8px, transparent .8px); background-size: 22px 22px; background-attachment: fixed; }

/* BlurFade: opacity 0 → 1, blur 6px → 0, y 8px → 0, staggered by --mg-i (max 14 steps × 40 ms) */
@keyframes mgFade { from { opacity: 0; filter: blur(6px); transform: translateY(8px); } to { opacity: 1; filter: blur(0); transform: none; } }
.mg-fade { animation: mgFade .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--mg-i, 0) * 40ms); }

/* AnimatedList: rows slide in one after another (Today's picks, Just happened, Newly detected) */
@keyframes mgRow { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.mg-row { animation: mgRow .4s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--mg-i, 0) * 35ms); }

/* NumberTicker: the value counts up; tabular digits so the width never jumps */
.mg-tick { font-variant-numeric: tabular-nums; }

/* BorderBeam: one light beam travelling the border of the hero card (Promote today) — slow, thin, blue */
@property --mg-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes mgBeam { to { --mg-a: 360deg; } }
.mg-beam { position: relative; }
.mg-beam::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--mg-a), transparent 0 78%, var(--blue, #2F6FED) 90%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
  animation: mgBeam 9s linear infinite; }

/* ShimmerButton: a soft light sweep across the primary action, once on load and on hover */
@keyframes mgShimmer { from { transform: translateX(-120%) skewX(-18deg); } to { transform: translateX(220%) skewX(-18deg); } }
.mg-shimmer { position: relative; overflow: hidden; }
.mg-shimmer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgb(255 255 255 / .35), transparent); transform: translateX(-120%) skewX(-18deg); }
.mg-shimmer.mg-once::after, .mg-shimmer:hover::after { animation: mgShimmer 1.1s ease-out 1; }

/* the hidden state while the script measures (never a flash of unstyled rows) */
.mg-pending { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .mg-fade, .mg-row { animation: none !important; }
  .mg-beam::before, .mg-shimmer::after { animation: none !important; display: none; }
  .mg-pending { opacity: 1; }
  :root:not([data-theme="dark"]) body { background-image: none; }
}

/* ---- pages_zz_shadcn.css ---- */
/* =====================================================================================================
   shadcn/ui port — the "new-york · zinc" recipes applied to OTTVerse's own components (loads last: it overrides
   ott.css and the page styles). No React, no Tailwind: the same tokens and the same component rules, hand-ported.
   Light only (the owner's rule). The density tokens (--fs-*, --row-h, --pill-h) stay: the lints enforce them.
   Sources: shadcn/ui registry (new-york) globals.css + card / button / badge / tabs / table / input / select /
   switch / tooltip / skeleton / sheet / sidebar recipes. MIT.
   ===================================================================================================== */
:root {
  /* globals.css · :root (zinc) — hsl values from the registry, written as hex */
  --sc-background: #FFFFFF;          /* 0 0% 100% */
  --sc-foreground: #09090B;          /* 240 10% 3.9% */
  --sc-card: #FFFFFF;
  --sc-primary: #18181B;             /* 240 5.9% 10% */
  --sc-primary-fg: #FAFAFA;          /* 0 0% 98% */
  --sc-secondary: #F4F4F5;           /* 240 4.8% 95.9% */
  --sc-muted: #F4F4F5;
  --sc-muted-fg: #71717A;            /* 240 3.8% 46.1% */
  --sc-accent: #F4F4F5;
  --sc-border: #E4E4E7;              /* 240 5.9% 90% */
  --sc-input: #E4E4E7;
  --sc-ring: #18181B;                /* 240 5.9% 10% */
  --sc-radius: 8px;                  /* 0.5rem: rounded-md 6px · rounded-lg 8px · rounded-xl 12px */
  --sc-shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .05);
  --sc-shadow-md: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1);
  --sc-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  --sc-sidebar: #FAFAFA;             /* sidebar: 0 0% 98% */
  --sc-sidebar-accent: #F4F4F5;
  /* the app's tokens, re-pointed at the zinc scale (the dark theme keeps its own block in ott.css) */
  --bg: #FAFAFA; --card: var(--sc-card); --line: var(--sc-border); --line-2: #F0F0F2;
  --ink: var(--sc-foreground); --ink-2: #3F3F46; --ink-3: var(--sc-muted-fg); --ink-4: #A1A1AA;
  --hover: var(--sc-accent); --sel: var(--sc-secondary); --field: #FFFFFF; --field-2: var(--sc-secondary);
  --shadow: var(--sc-shadow-sm); --shadow-2: var(--sc-shadow-lg);
  --r: 12px; --r-chip: 6px;
  --font: "Inter", "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
:root:not([data-theme="dark"]) body { background-color: var(--bg); color: var(--ink); }   /* -color: the dot pattern (pages_zz_magic.css) keeps its image */

/* ---- focus: ring-2 ring-ring ring-offset-2 (every focusable control) ---- */
:root:not([data-theme="dark"]) :where(button, a, input, select, [tabindex]):focus-visible { outline: 2px solid var(--sc-ring); outline-offset: 2px; border-radius: 6px; }

/* ---- header (bg-background/80 backdrop-blur border-b) + sidebar (bg-sidebar) ---- */
:root:not([data-theme="dark"]) .ov-top { background: rgb(255 255 255 / .85); backdrop-filter: saturate(180%) blur(8px); -webkit-backdrop-filter: saturate(180%) blur(8px); border-bottom: 1px solid var(--sc-border); box-shadow: none; }
:root:not([data-theme="dark"]) .ov-nav { background: var(--sc-sidebar); border-right: 1px solid var(--sc-border); }
:root:not([data-theme="dark"]) .ov-nav a, :root:not([data-theme="dark"]) .ov-nav button { border-radius: 6px; }
:root:not([data-theme="dark"]) .ov-nav a:hover, :root:not([data-theme="dark"]) .ov-nav button:hover { background: var(--sc-sidebar-accent); }
:root:not([data-theme="dark"]) .ov-nav .on, :root:not([data-theme="dark"]) .ov-nav a.on { background: var(--sc-sidebar-accent); color: var(--sc-foreground); font-weight: 500; }
:root:not([data-theme="dark"]) #ov-q, :root:not([data-theme="dark"]) .ov-top input[type="search"], :root:not([data-theme="dark"]) .ov-top input[type="text"] {
  border: 1px solid var(--sc-input); border-radius: 6px; background: #fff; box-shadow: var(--sc-shadow-sm); }

/* ---- Card: rounded-xl border bg-card text-card-foreground shadow-sm · CardTitle: font-semibold leading-none tracking-tight ---- */
:root:not([data-theme="dark"]) .ov-card { border-radius: 12px; border: 1px solid var(--sc-border); box-shadow: var(--sc-shadow-sm); }
:root:not([data-theme="dark"]) .ov-ch { letter-spacing: -.01em; }
:root:not([data-theme="dark"]) .ov-ch > .ov-ico { color: var(--sc-muted-fg); }

/* ---- the stat card (KPI): CardDescription text-sm text-muted-foreground · value text-2xl font-semibold tabular-nums tracking-tight ---- */
:root:not([data-theme="dark"]) .ov-kpi { border-radius: 12px; border: 1px solid var(--sc-border); box-shadow: var(--sc-shadow-sm); }
:root:not([data-theme="dark"]) .ov-kpi b, :root:not([data-theme="dark"]) .ov-kpi .v { font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* ---- Tabs: TabsList = inline-flex h-9 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground
        TabsTrigger = rounded-md px-3 py-1 text-sm font-medium · active: bg-background text-foreground shadow ---- */
:root:not([data-theme="dark"]) .ov-tabs { display: inline-flex; max-width: 100%; align-items: center; gap: 2px; padding: 4px; border: 0; border-radius: 8px; background: var(--sc-muted); color: var(--sc-muted-fg); margin-bottom: var(--sp-4); }
:root:not([data-theme="dark"]) .ov-tab { height: 28px; padding: 0 12px; border-radius: 6px; color: var(--sc-muted-fg); font-weight: 500; }
:root:not([data-theme="dark"]) .ov-tab:hover { color: var(--sc-foreground); }
:root:not([data-theme="dark"]) .ov-tab.on { background: var(--sc-background); color: var(--sc-foreground); box-shadow: var(--sc-shadow-sm); font-weight: 500; }
:root:not([data-theme="dark"]) .ov-tab.on::after { display: none; }
:root:not([data-theme="dark"]) .pc-tabs { gap: 12px; }

/* ---- Toggle / ToggleGroup items (the filter chips): rounded-md border bg-transparent hover:bg-accent · on = primary ---- */
:root:not([data-theme="dark"]) .ov-chips { gap: 4px; }
:root:not([data-theme="dark"]) .ov-chip { height: 28px; border-radius: 6px; border: 1px solid var(--sc-input); background: var(--sc-background); color: var(--sc-foreground); font-weight: 500; box-shadow: var(--sc-shadow-sm); }
:root:not([data-theme="dark"]) .ov-chip:hover { background: var(--sc-accent); }
:root:not([data-theme="dark"]) .ov-chip.on { background: var(--sc-primary); border-color: var(--sc-primary); color: var(--sc-primary-fg); }
:root:not([data-theme="dark"]) .ov-chip.on .c, :root:not([data-theme="dark"]) .ov-chip.on small { color: var(--sc-primary-fg); opacity: .75; }

/* ---- Button: inline-flex rounded-md text-sm font-medium shadow-sm · outline: border bg-background hover:bg-accent ---- */
:root:not([data-theme="dark"]) .ov-btn { border-radius: 6px; border: 1px solid var(--sc-input); background: var(--sc-background); color: var(--sc-foreground); box-shadow: var(--sc-shadow-sm); transition: background-color .15s, color .15s, box-shadow .15s; }
:root:not([data-theme="dark"]) .ov-btn:hover { background: var(--sc-accent); }
:root:not([data-theme="dark"]) .ov-btn.sm { border-radius: 6px; }
/* the brand stays the primary colour (Airtel red) with the shadcn button shape; "ghost" and "secondary" come from the tones */
:root:not([data-theme="dark"]) .ov-btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: var(--sc-shadow-sm); }
:root:not([data-theme="dark"]) .ov-btn.pri:hover { background: color-mix(in srgb, var(--brand) 90%, #000); filter: none; }
:root:not([data-theme="dark"]) .ov-btn:disabled { opacity: .5; pointer-events: none; }

/* ---- Badge: rounded-md border px-2.5 py-0.5 text-xs font-semibold · the app's tone classes keep their colours ---- */
:root:not([data-theme="dark"]) .ov-tag { border-radius: 6px; padding: 0 8px; font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0; }

/* ---- Table: TableHead h-10 text-left font-medium text-muted-foreground (sentence case) · rows border-b, hover:bg-muted/50 ---- */
:root:not([data-theme="dark"]) .ov-t th { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: var(--fs-sm); color: var(--sc-muted-fg); border-bottom: 1px solid var(--sc-border); }
:root:not([data-theme="dark"]) .ov-t td { border-bottom: 1px solid var(--line-2); }
:root:not([data-theme="dark"]) .ov-t tbody tr:hover td { background: color-mix(in srgb, var(--sc-muted) 50%, transparent); }
:root:not([data-theme="dark"]) .ov-t tbody tr.sel td, :root:not([data-theme="dark"]) .ov-t tbody tr.on td { background: var(--sc-muted); }
:root:not([data-theme="dark"]) .ov-mini th { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--sc-muted-fg); }

/* ---- the filter row: shadcn pages keep filters as a plain toolbar, not a boxed card ---- */
:root:not([data-theme="dark"]) .ov-filters { background: transparent; border: 0; box-shadow: none; padding: 0; gap: 6px; }

/* ---- Input / Select trigger: h-9 rounded-md border border-input bg-transparent px-3 shadow-sm ---- */
:root:not([data-theme="dark"]) .ov-sel, :root:not([data-theme="dark"]) .ov-filters input, :root:not([data-theme="dark"]) .ov-tb input, :root:not([data-theme="dark"]) .ov-search input {
  border-radius: 6px; border: 1px solid var(--sc-input); background: var(--sc-background); box-shadow: var(--sc-shadow-sm); }

/* ---- Switch: h-5 w-9 rounded-full · unchecked bg-input · checked bg-primary · thumb h-4 w-4 bg-background shadow ---- */
:root:not([data-theme="dark"]) .ov-toggle { border: 0; background: transparent; padding: 0 6px 0 0; height: 28px; color: var(--sc-foreground); font-weight: 500; box-shadow: none; }
:root:not([data-theme="dark"]) .ov-toggle i { width: 36px; height: 20px; border-radius: 999px; background: var(--sc-input); }
:root:not([data-theme="dark"]) .ov-toggle i::after { width: 16px; height: 16px; left: 2px; top: 2px; box-shadow: var(--sc-shadow-sm); }
:root:not([data-theme="dark"]) .ov-toggle.on i { background: var(--sc-primary); }
:root:not([data-theme="dark"]) .ov-toggle.on i::after { left: 18px; }

/* ---- Tooltip: rounded-md bg-primary px-3 py-1.5 text-xs text-primary-foreground shadow-md ---- */
:root:not([data-theme="dark"]) .ov-tipbox { background: var(--sc-primary); color: var(--sc-primary-fg); border-radius: 6px; padding: 6px 12px; box-shadow: var(--sc-shadow-md); }

/* ---- Sheet (the drawer): border-l shadow-lg · title text-lg font-semibold ---- */
:root:not([data-theme="dark"]) .ov-drawer { border-left: 1px solid var(--sc-border); box-shadow: var(--sc-shadow-lg); }

/* ---- the status strips and page header ---- */
:root:not([data-theme="dark"]) .ov-strip { border-radius: 8px; border: 1px solid var(--sc-border); box-shadow: var(--sc-shadow-sm); }
:root:not([data-theme="dark"]) .ov-ph h1, :root:not([data-theme="dark"]) .ov-ph .t { letter-spacing: -.02em; font-weight: 600; }
:root:not([data-theme="dark"]) .ov-static-bar { background: var(--sc-secondary); border-bottom: 1px solid var(--sc-border); }

</style>
</head>

  <a class="ov-brand" href="#/today" aria-label="OTTVerse Trends home">
    <span class="mk"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><i></i></span>
    <span><b>OTTVerse</b> <small>TRENDS</small></span>
  </a>
  <div class="ov-search" id="ov-search">
    <svg class="ov-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="ov-q" type="search" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Search a title, star, team or platform" aria-label="Search" role="combobox" aria-expanded="false" aria-controls="ov-ac">
    <kbd>/</kbd>
    <div class="ov-ac" id="ov-ac" role="listbox"></div>
  </div>
  <div class="ov-ctl">
    <span class="ov-tag warn ov-offline-badge" data-tip="Opened as a file. Start the server for live data.">OFFLINE</span>
    <span class="ov-live" id="ov-live" data-tip="Last scan"><i></i><span class="lbl" id="ov-live-t">—</span></span>
    <button class="ov-ib ov-scan-now" id="ov-scan-now" data-tip="Run a scan now" disabled><svg class="ov-ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg><span>Scan now</span></button>
    <select class="ov-sel" id="ov-market" aria-label="Market"></select>
    <div class="ov-seg" id="ov-period" role="group" aria-label="Period">
      <button data-p="24h">24h</button><button data-p="7d">7d</button><button data-p="30d">30d</button>
    </div>
    <div style="position:relative" class="hide-m">
      <button class="ov-ib" id="ov-export" aria-haspopup="menu"><svg class="ov-ico" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Export</button>

        <button data-x="print"><svg class="ov-ico" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>Print / PDF</button>
      </div>

<script>
/* ---- core.js ---- */
/* =====================================================================================================
   OTTVerse Trends — core (window.OV). Router, shared state, API client, and every shared component.
   Contract: docs/OTTVERSE_COMPONENTS.md. Spec: docs/OTTVERSE_SPEC.md.

   House rules this file enforces for every page:
   * Every server string is escaped (OV.esc) before it reaches innerHTML; tooltips are set as text.
   * Unknown is "—" (OV.fmt.* return "—" for null / NaN). Nothing here invents a number.
   * Nothing spends money on its own: paid parts load only through OV.ui.loadChip (price shown, two clicks),
     a scan only through OV.runScan (two clicks). Status is polled every 2 s ONLY while a scan runs.
   * No libraries; hand-rolled SVG; colours are CSS tokens so light / dark switch live.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV = window.OV || {};
  OV.version = '1.0.0';

  /* ================================================================== utils */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
  const isNum = v => typeof v === 'number' && isFinite(v);
  const arr = x => Array.isArray(x) ? x : [];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nowS = () => Date.now() / 1000;
  const jattr = o => esc(JSON.stringify(o));
  const safeUrl = u => { if (!u || typeof u !== 'string') return ''; try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
  const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const cssLen = s => String(s || '').replace(/[^0-9a-zA-Z().,%\- ]/g, '');
  let SEQ = 0;
  const uid = p => (p || 'x') + (++SEQ).toString(36);
  const LS = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* private window: conveniences only */ } },
  };
  Object.assign(OV, { esc, isNum, arr, clamp, safeUrl, hostOf, norm, uid });

  /* ================================================================== formatting */
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const IST_OFF = 5.5 * 3600;
  const toTs = v => { if (v == null || v === '') return null; if (isNum(v)) return v > 1e12 ? v / 1000 : v; if (typeof v !== 'string') return null; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]) / 1000 - IST_OFF; const t = Date.parse(v); return isNaN(t) ? null : t / 1000; };
  const ist = ts => { const d = new Date((ts + IST_OFF) * 1000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), H: d.getUTCHours(), M: d.getUTCMinutes(), wd: d.getUTCDay() }; };
  const p2 = n => String(n).padStart(2, '0');
  const DASH = '—';
  const compact = n => {
    if (!isNum(n)) return DASH;
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    // round FIRST, then pick the bucket: 99,960 → '1L' (not '100K'), 99,96,000 → '1Cr' (not '100L'), 999.96 → '1K'
    const R = v => v >= 100 ? Math.round(v) : Math.round(v * 10) / 10;
    const f = (v, u) => { const r = R(v); return s + (r >= 100 ? String(r) : r.toFixed(1).replace(/\.0$/, '')) + u; };
    if (a >= 1e7) return f(a / 1e7, 'Cr');
    if (a >= 1e5) return R(a / 1e5) >= 100 ? f(a / 1e7, 'Cr') : f(a / 1e5, 'L');
    if (a >= 1e3) return R(a / 1e3) >= 100 ? f(a / 1e5, 'L') : f(a / 1e3, 'K');
    if (Math.round(a * 10) / 10 >= 1e3) return f(a / 1e3, 'K');
    return s + (a % 1 ? a.toFixed(1) : String(a));
  };
  const TYPE_LABEL = { movie: 'Film', film: 'Film', series: 'Series', show: 'Show', sports_event: 'Match', sports_generic: 'Match search', team: 'Team', player: 'Player', person: 'Person', music: 'Music', platform: 'Platform', other: 'Other' };
  const LANG_NAMES = { hi: 'Hindi', en: 'English', ta: 'Tamil', te: 'Telugu', kn: 'Kannada', ml: 'Malayalam', bn: 'Bengali', mr: 'Marathi', gu: 'Gujarati', pa: 'Punjabi', or: 'Odia', as: 'Assamese', ur: 'Urdu', bho: 'Bhojpuri' };
  const LANG_CODE = { hindi: 'HIN', english: 'ENG', tamil: 'TAM', telugu: 'TEL', kannada: 'KAN', malayalam: 'MAL', bengali: 'BEN', bangla: 'BEN', marathi: 'MAR', gujarati: 'GUJ', punjabi: 'PUN', odia: 'ODI', oriya: 'ODI', assamese: 'ASM', urdu: 'URD', bhojpuri: 'BHO', korean: 'KOR', japanese: 'JPN', spanish: 'SPA' };
  const GEO = { 'IN': 'India', 'IN-AN': 'Andaman & Nicobar', 'IN-AP': 'Andhra Pradesh', 'IN-AR': 'Arunachal Pradesh', 'IN-AS': 'Assam', 'IN-BR': 'Bihar', 'IN-CH': 'Chandigarh',
    'IN-CT': 'Chhattisgarh', 'IN-DN': 'Dadra & Nagar Haveli', 'IN-DD': 'Daman & Diu', 'IN-DL': 'Delhi', 'IN-GA': 'Goa', 'IN-GJ': 'Gujarat', 'IN-HR': 'Haryana',
    'IN-HP': 'Himachal Pradesh', 'IN-JK': 'Jammu & Kashmir', 'IN-JH': 'Jharkhand', 'IN-KA': 'Karnataka', 'IN-KL': 'Kerala', 'IN-LD': 'Lakshadweep', 'IN-MP': 'Madhya Pradesh',
    'IN-MH': 'Maharashtra', 'IN-MN': 'Manipur', 'IN-ML': 'Meghalaya', 'IN-MZ': 'Mizoram', 'IN-NL': 'Nagaland', 'IN-OR': 'Odisha', 'IN-PY': 'Puducherry', 'IN-PB': 'Punjab',
    'IN-RJ': 'Rajasthan', 'IN-SK': 'Sikkim', 'IN-TN': 'Tamil Nadu', 'IN-TG': 'Telangana', 'IN-TR': 'Tripura', 'IN-UP': 'Uttar Pradesh', 'IN-UT': 'Uttarakhand', 'IN-WB': 'West Bengal' };
  const CIRCLES_FALLBACK = [['AP', 'Andhra Pradesh'], ['AS', 'Assam'], ['BR', 'Bihar'], ['DL', 'Delhi'], ['GJ', 'Gujarat'], ['HP', 'Himachal Pradesh'], ['HR', 'Haryana'],
    ['JK', 'Jammu & Kashmir'], ['KA', 'Karnataka'], ['KL', 'Kerala'], ['KO', 'Kolkata'], ['MP', 'Madhya Pradesh'], ['MH', 'Maharashtra'], ['MU', 'Mumbai'],
    ['NE', 'North East'], ['OR', 'Odisha'], ['PB', 'Punjab'], ['RJ', 'Rajasthan'], ['TN', 'Tamil Nadu'], ['UPE', 'UP (East)'], ['UPW', 'UP (West)'], ['WB', 'West Bengal']].map(([id, name]) => ({ id, name }));
  let CIRCLES = CIRCLES_FALLBACK.slice();

  const fmt = OV.fmt = {
    num: n => isNum(n) ? Math.round(n).toLocaleString('en-IN') : DASH,
    dec: (n, dp) => isNum(n) ? n.toLocaleString('en-IN', { maximumFractionDigits: dp == null ? 1 : dp }) : DASH,
    compact,
    heat: n => isNum(n) ? (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '') : DASH,
    pct: (n, dp) => isNum(n) ? n.toLocaleString('en-IN', { maximumFractionDigits: dp == null ? 0 : dp }) + '%' : DASH,
    signed: (n, unit, dp) => { if (!isNum(n)) return DASH; const v = Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: dp == null ? 0 : dp }); return (n > 0 ? '+' : n < 0 ? '−' : '±') + v + (unit || ''); },
    growth: p => !isNum(p) ? DASH : (p >= 1000 ? '+1,000%' : (p >= 0 ? '+' : '−') + Math.round(Math.abs(p)).toLocaleString('en-IN') + '%'),
    usd: (v, dp) => !isNum(v) ? DASH : '$' + (dp != null ? v.toFixed(dp) : v >= 0.1 || v === 0 ? v.toFixed(2) : v.toFixed(3)),
    ago: ts => { ts = toTs(ts); if (ts == null) return DASH; let s = Math.max(0, Math.round(nowS() - ts)); if (s < 60) return 'now'; if (s < 3600) return Math.round(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; if (s < 86400 * 60) return Math.round(s / 86400) + 'd'; return Math.round(s / 86400 / 30) + 'mo'; },
    ist: ts => { ts = toTs(ts); if (ts == null) return DASH; const p = ist(ts); return `${p.d} ${MON[p.m]}, ${p2(p.H)}:${p2(p.M)} IST`; },
    day: v => { if (typeof v === 'string') { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v); if (m) return (+m[3]) + ' ' + MON[+m[2] - 1]; } const ts = toTs(v); if (ts == null) return v ? String(v) : DASH; const p = ist(ts); return p.d + ' ' + MON[p.m]; },
    weekday: v => { const ts = toTs(v); if (ts == null) return ''; return WD[ist(ts).wd]; },
    time: ts => { ts = toTs(ts); if (ts == null) return DASH; const p = ist(ts); return p2(p.H) + ':' + p2(p.M); },
    month: m => { const x = /^(\d{4})-(\d{2})/.exec(String(m || '')); return x ? MON[+x[2] - 1] + ' ' + x[1] : (m ? String(m) : DASH); },
    mon: m => { const x = /^(\d{4})-(\d{2})/.exec(String(m || '')); return x ? MON[+x[2] - 1] : (m ? String(m) : DASH); },
    type: t => TYPE_LABEL[t] || (t ? String(t).replace(/_/g, ' ') : 'Other'),
    langName: l => { if (!l) return ''; const s = String(l); return LANG_NAMES[s.toLowerCase()] || s.charAt(0).toUpperCase() + s.slice(1); },
    langCode: l => { if (!l) return ''; const n = fmt.langName(l); return LANG_CODE[n.toLowerCase()] || n.slice(0, 3).toUpperCase(); },
    geo: g => GEO[g] || (g ? String(g) : DASH),
    circle: id => { const c = CIRCLES.find(x => x.id === id); return c ? c.name : (id || DASH); },
    plural: (n, w, pl) => fmt.num(n) + ' ' + (n === 1 ? w : (pl || w + 's')),
  };
  OV.toTs = toTs;
  OV.GEO = GEO;
  OV.circles = () => CIRCLES.slice();

  /* ================================================================== freshness (amber / red per dataset)
     The backend's own answer wins (a `level` / `status` of amber·red·stale, or its own `amber_after_s` / `red_after_s`
     and `coverage_pct`); otherwise these limits apply to the row's age (docs/data_truth_audit_2026-10-03.json). */
  const HR = 3600, DY = 86400;
  const FRESH_RULES = {
    pulse_scan: [6 * HR, 24 * HR], dataforseo_curves: [6 * HR, 24 * HR],
    ads_volume_in: [8 * DY, 14 * DY], ads_volume_states: [31 * DY, 45 * DY],
    competitor: [7 * DY, 14 * DY], calendar: [3 * DY, 7 * DY],
    registry: [7 * DY, 14 * DY], entities: [7 * DY, 14 * DY], etcc_registry: [7 * DY, 14 * DY],
    press_store: [6 * HR, 24 * HR], press: [6 * HR, 24 * HR], press_rss: [6 * HR, 24 * HR],
    reading: [3 * DY, 5 * DY], listening: [3 * DY, 8 * DY],
  };
  const LV_WORD = { ok: 'Fresh', warn: 'Ageing', bad: 'Stale', off: 'Off', never: 'Never fetched' };
  const fresh = OV.fresh = {
    rules: FRESH_RULES,
    rows: [],
    /** 'ok' | 'warn' | 'bad' | 'off' | 'never' for a freshness row ({source, status, age_s | last_ok_ts, …}). */
    level(r) {
      if (!r) return 'never';
      const st = String(r.level || r.state || r.status || '').toLowerCase();
      if (['red', 'bad', 'very_stale', 'failed', 'error', 'dead'].includes(st)) return 'bad';
      if (['not_configured', 'off'].includes(st)) return 'off';
      if (st === 'never') return 'never';
      const ts = toTs(r.last_ok_ts != null ? r.last_ok_ts : r.fetched_at);
      const age = isNum(r.age_s) ? r.age_s : ts != null ? nowS() - ts : null;
      const rule = isNum(r.amber_after_s) || isNum(r.red_after_s) ? [r.amber_after_s, r.red_after_s] : FRESH_RULES[String(r.source || '').replace(/^provider:/, '')] || null;
      let lv = 'ok';
      if (age != null && rule) { if (isNum(rule[1]) && age > rule[1]) lv = 'bad'; else if (isNum(rule[0]) && age > rule[0]) lv = 'warn'; }
      if (isNum(r.coverage_pct)) { if (r.coverage_pct < 50) lv = 'bad'; else if (r.coverage_pct < 80 && lv === 'ok') lv = 'warn'; }
      if (['amber', 'warn', 'warning', 'stale', 'partial', 'pending', 'cooling'].includes(st) && lv === 'ok') lv = 'warn';
      return lv;
    },
    word: lv => LV_WORD[lv] || '',
    /** The latest /api/live/home freshness row for a dataset (call OV.fresh.load() first). */
    get: source => fresh.rows.find(x => x && x.source === source) || null,
    load: () => OV.data.home().then(h => { fresh.rows = arr(h && h.freshness); return fresh.rows; }).catch(() => fresh.rows),
    age: r => { if (!r) return null; if (isNum(r.age_s)) return r.age_s; const ts = toTs(r.last_ok_ts != null ? r.last_ok_ts : r.fetched_at); return ts != null ? nowS() - ts : null; },
    /** A freshness row for the share-of-search answer (/api/live/competitor): fetch age, plus its last data day. */
    competitor: c => c && (c.fetched_at || isNum(c.age_s)) ? { source: 'competitor', label: 'Share of search · Google Trends via DataForSEO', last_ok_ts: c.fetched_at, last_ok_ist: c.fetched_at_ist,
      age_s: c.age_s, status: c.stale ? 'stale' : (c.freshness && c.freshness.status) || '', amber_after_s: c.stale_after_s, red_after_s: isNum(c.stale_after_s) ? 2 * c.stale_after_s : undefined,
      note: c.window && c.window.to ? 'Data to ' + fmt.day(c.window.to) + ' (' + (c.window.label || '') + ')' : null } : null,
    /** One tooltip line set: what · when · how old · the limits. */
    tip(r, name) {
      if (!r) return name || '';
      const rule = FRESH_RULES[String(r.source || '').replace(/^provider:/, '')];
      const lim = isNum(r.amber_after_s) ? [r.amber_after_s, r.red_after_s] : rule;
      const span = s => s >= DY ? Math.round(s / DY) + ' d' : Math.round(s / HR) + ' h';
      return [name || r.label || r.source, r.last_ok_ist || (r.last_ok_ts ? fmt.ist(r.last_ok_ts) : 'never fetched'),
        isNum(fresh.age(r)) ? fmt.ago(nowS() - fresh.age(r)) + ' old · ' + fresh.word(fresh.level(r)).toLowerCase() : '',
        isNum(r.coverage_pct) ? 'covers ' + Math.round(r.coverage_pct) + '% of the board' : '',
        lim ? `amber after ${span(lim[0])} · red after ${span(lim[1])}` : '', r.note || ''].filter(Boolean).join('\n');
    },
  };

  /* ================================================================== colours + vocab */
  const TYPES = {
    movie: ['F', 'var(--violet)'], film: ['F', 'var(--violet)'], series: ['S', 'var(--pink)'], show: ['SH', 'var(--pink)'],
    sports_event: ['M', 'var(--teal)'], sports_generic: ['M', 'var(--teal)'], player: ['PL', 'var(--cyan)'], team: ['T', 'var(--cyan)'],
    person: ['P', 'var(--amber)'], music: ['♪', 'var(--orange)'], platform: ['▶', 'var(--blue)'], other: ['?', 'var(--slate)'],
  };
  const VERDICTS = {
    promote_now: { label: 'Promote now', c: 'var(--v-promote_now)', t: 'var(--v-promote_now-ink)', tip: 'Strong demand and Airtel sells it. Push it today.' },
    promote: { label: 'Promote', c: 'var(--v-promote)', t: 'var(--v-promote-ink)', tip: 'Solid demand and Airtel sells it. Schedule a push.' },
    counter: { label: 'Counter', c: 'var(--v-counter)', t: 'var(--violet-ink)', tip: 'Strong demand on a rival platform. Push similar titles we carry.' },
    check_rights: { label: 'Check rights', c: 'var(--v-check_rights)', t: 'color-mix(in srgb, var(--amber) 72%, var(--ink))', tip: 'Real demand, availability unknown. Confirm we carry it, then promote.' },
    recheck: { label: 'Re-check', c: 'var(--v-recheck)', t: 'var(--ink-2)', tip: 'Was Promote, but its search data is past the limit (3 h; 30 min in a live match window). Re-check before acting.' },
    watch: { label: 'Watch', c: 'var(--v-watch)', t: 'var(--blue-ink)', tip: 'Not actionable yet. Re-check after the next scan.' },
    skip: { label: 'Skip', c: 'var(--v-skip)', t: 'var(--ink-3)', tip: 'Weak or cooling. Not worth effort now.' },
  };
  const V_ORDER = ['promote_now', 'promote', 'counter', 'check_rights', 'recheck', 'watch', 'skip'];
  const ON_LABEL = { yes: 'On Xstream Play', partner: 'Sold by Airtel (partner, pack or plan)', no: 'Rival only', unknown: 'Availability unknown' };
  const ON_GLYPH = { yes: '✓', partner: '◐', no: '✕', unknown: '' };   // unknown: no glyph (the tooltip says it; no "?" anywhere)
  const VIA_LABEL = { pack: 'via pack', plan: 'via plan', xstream_play: 'in app', xstream_bundle: 'via pack', airtel_plan: 'via plan', catalog: 'catalog', partner: 'partner' };
  const SERIES = ['var(--blue)', 'var(--teal)', 'var(--violet)', 'var(--amber)', 'var(--pink)', 'var(--cyan)', 'var(--orange)', 'var(--lime)', 'var(--slate)'];
  const PLATFORM_COLOR = { 'airtel xstream': 'var(--xs)', 'xstream play': 'var(--xs)', 'airtel xstream play': 'var(--xs)', xstream: 'var(--xs)', jiohotstar: 'var(--blue)', hotstar: 'var(--blue)', 'jio hotstar': 'var(--blue)',
    netflix: 'var(--pink)', 'prime video': 'var(--cyan)', 'amazon prime video': 'var(--cyan)', sonyliv: 'var(--teal)', 'sony liv': 'var(--teal)', zee5: 'var(--amber)',
    'sun nxt': 'var(--orange)', aha: 'var(--lime)', fancode: 'var(--slate)', 'lionsgate play': 'var(--slate)', jiotv: 'var(--blue)' };
  const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; };
  // a palette colour as a FILL behind type: its --fill-* token (darker in light, AA with --on-fill)
  const FILLS = new Set(['blue', 'teal', 'violet', 'amber', 'pink', 'cyan', 'slate', 'lime', 'orange', 'up', 'down', 'xs', 'flat']);
  const fill = c => { const m = /^var\(--([a-z]+)\)$/.exec(String(c || '')); return m && FILLS.has(m[1]) ? `var(--fill-${m[1]})` : c; };
  OV.color = {
    verdict: c => (VERDICTS[c] || VERDICTS.skip).c,
    type: t => (TYPES[t] || TYPES.other)[1],
    platform: name => PLATFORM_COLOR[norm(name)] || SERIES[hash(norm(name)) % SERIES.length],
    series: i => SERIES[((i % SERIES.length) + SERIES.length) % SERIES.length],
    cat: c => c === 'sports' ? 'var(--sport)' : c === 'entertainment' ? 'var(--ent)' : 'var(--slate)',
    xs: 'var(--xs)',   // Airtel Xstream, everywhere (brand red stays for the primary button, active nav and live dot)
  };
  OV.fill = fill;
  OV.statesN = 36;               // state lists with data in the latest scan (D.rows sets it from the board)
  OV.VERDICTS = VERDICTS; OV.V_ORDER = V_ORDER; OV.TYPES = TYPES; OV.ON_LABEL = ON_LABEL;
  const monogram = name => {
    const s = String(name || '').trim(); if (!s) return '?';
    const words = s.split(/[\s_\-]+/).filter(Boolean);
    if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
    const caps = s.match(/[A-Z]/g);
    if (caps && caps.length >= 2 && s !== s.toUpperCase()) return caps.slice(0, 2).join('');
    return s.slice(0, 2).toUpperCase();
  };

  /* ================================================================== icons */
  const ICONS = {
    today: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
    reading: '<path d="M3 5.5c3-1.3 6-1.3 9 .7 3-2 6-2 9-.7V19c-3-1.3-6-1.3-9 .7-3-2-6-2-9-.7z"/><path d="M12 6.2v13.5"/>',
    platforms: '<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 9h4M7 12h7"/>',
    cohorts: '<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="3" y="17" width="5" height="4" rx="1"/>',
    health: '<path d="M3 12h4l2-5 4 10 2-5h6"/>',
