  });

  /** a cohort row → the reading drawer (Wikidata id on the board) or the platform drawer (catalogue key) */
  async function openTitle(e) {
    if (e.key && OV.actions.pcOpen) { OV.actions.pcOpen(e.key); return; }
    if (e.qid && OV.actions.readOpen) {
      try { await OV.api.get('/api/ott/reading/entity/' + encodeURIComponent(e.qid), null, { ttl: 300 }); OV.actions.readOpen(e.qid); return; }
      catch (x) { /* not on this week's reading board: History only */ }
    }
    const id = 'hx-' + (++SEQ);
    OV.drawer.open({ title: e.name, width: 780, html: `<div class="rd-dh">${ui.thumb(Object.assign({}, e, { type: etype(e) }), { size: 72 })}<div><div class="rd-dn">${esc(e.name)}</div><div class="rd-chips">${ui.tag(etype(e) === 'movie' ? 'Film' : 'Series', 'muted')}${e.language ? ui.lang(e.language, { full: true }) : ''}${shapeTag(e.shape)}</div></div></div>` + OV.historySlot(id) });
    OV.historyPanel(e.qid || e.key || e.id, e.name, id);
  }

  /* ================================================================== the History panel (title drawer) */
  OV.historySlot = id => `<div class="ov-sub-h">History · weekly rank per board${ui.tip('Best rank each week (Mon–Sun) on every board this title reached. Hollow dots = seeded from stored curves.')}</div><div class="hx" id="${esc(id || 'hx-slot')}">${ui.skeleton('card')}</div>`;

  function rankChart(H, w) {
    const weeks = arr(H.weeks);
    const boards = arr(H.boards).filter(b => arr(b.weekly).length).slice(0, 6);
    const nf = H.netflix && arr(H.netflix.points).length ? H.netflix : null;
    const series = boards.map((b, i) => ({ name: b.label, pts: b.weekly.map(x => ({ w: x.week, r: x.rank, seed: x.seed, reads: x.reads, floor: x.floor })), color: OV.color.series(i) }));
    if (nf) series.push({ name: 'Netflix official Top 10', pts: nf.points.map(x => ({ w: x.week, r: x.rank })), color: 'var(--brand)', dash: true });
    if (!series.length || !weeks.length) return ui.empty('No board has ranked it yet', { box: true });
    const W = Math.max(320, w || 700), Hh = 200, pl = 34, pr = 12, pt = 10, pb = 24;
    const maxR = Math.max(10, ...series.flatMap(s => s.pts.map(p => p.r || 0)));
    const top = maxR <= 10 ? 10 : maxR <= 25 ? 25 : maxR <= 50 ? 50 : 100;
    const X = i => pl + (weeks.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (weeks.length - 1));
    const Y = r => pt + (Math.min(r, top) - 1) / (top - 1) * (Hh - pt - pb);
    const wi = {}; weeks.forEach((x, i) => { wi[x] = i; });
    let g = '';
    [1, Math.round(top / 4), Math.round(top / 2), top].forEach(r => { const y = Y(r); g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${pl - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">#${r}</text>`; });
    const k = Math.max(1, Math.ceil(weeks.length / Math.max(2, Math.floor((W - pl - pr) / 64))));
    weeks.forEach((x, i) => { const last = weeks.length - 1; if (i % k && i !== last) return; if (i === last && i % k && i % k < k / 2 + 1) return; g += `<text class="ax" x="${X(i).toFixed(1)}" y="${Hh - 6}" text-anchor="middle">${esc(fmt.day(x))}</text>`; });
    let p = '';
    series.forEach(s => {
      let d = '', prev = null;
      s.pts.forEach(q => { const i = wi[q.w]; if (i == null || !isNum(q.r)) return; d += (prev != null && i === prev + 1 ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(q.r).toFixed(1); prev = i; });
      p += `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round${s.dash ? ';stroke-dasharray:5 3' : ''}"/>`;
      s.pts.forEach(q => { const i = wi[q.w]; if (i == null || !isNum(q.r)) return; p += `<circle cx="${X(i).toFixed(1)}" cy="${Y(q.r).toFixed(1)}" r="3.2" style="fill:${q.seed ? 'var(--card)' : s.color};stroke:${s.color};stroke-width:1.5" data-tip="${esc(`${s.name}\nWeek of ${fmt.day(q.w)}: #${q.r}${isNum(q.reads) ? ' · ' + (q.floor ? '≥ ' : '') + fmt.num(q.reads) + ' reads' : ''}${q.seed ? '\nSeeded from stored curves' : ''}`)}"/>`; });
    });
    const lg = `<div class="ov-legend">${series.map(s => `<span><i class="ln" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
    return `<svg class="hx-svg" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}">${g}${p}</svg>${lg}`;
  }

  OV.historyPanel = async (id, name, slotId) => {
    const el = document.getElementById(slotId || 'hx-slot');
    if (!el) return;
    if (!id) { el.innerHTML = ui.empty('No id to look up', { box: true }); return; }
    const mine = 'hx-' + (++SEQ); el.id = mine;
    let H;
    try { H = await OV.api.get(HAPI + encodeURIComponent(id), name ? { name } : null, { ttl: 120 }); }
    catch (e) { const x = document.getElementById(mine); if (x) x.innerHTML = ui.error(e); return; }
    const box = document.getElementById(mine);
    if (!box) return;
    const B = arr(H.boards), nf = H.netflix, s = H.shape;
    const best = B.filter(b => isNum(b.best_rank)).sort((a, b) => a.best_rank - b.best_rank)[0];
    const tile = (l, v, tip, sub) => `<div class="hx-t"><span>${esc(l)}${tip ? ui.tip(tip) : ''}</span><b>${v}</b>${sub ? `<em>${esc(sub)}</em>` : ''}</div>`;
    const tiles = `<div class="hx-tiles">${tile('Weeks on a board', isNum(H.weeks_on_any) && H.weeks_on_any ? esc(H.weeks_on_any) : ui.unk('No snapshot holds it yet'), (H.rules || {}).history)}
      ${tile('Best rank', best ? `#${esc(best.best_rank)}` : ui.unk('Never ranked on a stored board'), '', best ? best.label : '')}
      ${tile('Netflix Top 10', nf ? (nf.weeks ? `${esc(nf.weeks)} wk` : '0 wk') : ui.unk('Not a Netflix title in the catalogue'), (H.rules || {}).netflix, nf && nf.weeks && nf.runs && nf.runs.length ? 'best #' + Math.min(...nf.runs.map(r => r.best_rank)) : '')}
      ${tile('Shape', s ? shapeTag(s.tag, `${BASIS_W[s.basis] || s.basis} ${fmt.day(s.date)} · peak D${s.peak_day} · @peak+7 ${pctTxt(s.r7)}`) : shapeTag(null))}</div>`;
    const chart = rankChart(H, box.clientWidth);
    const rows = B.map(b => ({ board: b.label, weeks: b.weeks_on, best: b.best_rank, last: b.last_rank, last_day: b.last_day, first_day: b.first_day, reads: (arr(b.points).slice(-1)[0] || {}).reads, seeded: b.seeded }));
    if (nf && nf.runs) nf.runs.forEach(r => rows.push({ board: 'Netflix official · ' + r.label, weeks: r.weeks, best: r.best_rank, last: null, last_day: r.last, first_day: r.first, reads: null, seeded: false }));
    const cols = [{ label: 'Board', get: r => r.board }, { label: 'Weeks', get: r => r.weeks }, { label: 'Best rank', get: r => r.best }, { label: 'Last rank', get: r => r.last }, { label: 'First day', get: r => r.first_day }, { label: 'Last day', get: r => r.last_day }, { label: 'Last reads 7d', get: r => r.reads }, { label: 'Seeded', get: r => r.seeded ? 'yes' : 'no' }];
    const csvId = 'hxcsv-' + SEQ;
    OV.actions[csvId] = () => OV.csv(`ottverse-history-${String(name || id).replace(/[^\w-]+/g, '-').slice(0, 40)}`, cols, rows);
    const mini = rows.length ? `<table class="ov-mini hx-tb"><tr><th>Board</th><th class="r">Weeks</th><th class="r">Best</th><th class="r">Last</th><th class="r">Reads 7d</th><th>Last seen</th></tr>${rows.map(r => `<tr><td>${esc(r.board)}${r.seeded ? ' <span class="hx-seed" data-tip="Includes weeks seeded from stored curves">seed</span>' : ''}</td><td class="r">${esc(r.weeks)}</td><td class="r">${isNum(r.best) ? '#' + esc(r.best) : '—'}</td><td class="r">${isNum(r.last) ? '#' + esc(r.last) : '—'}</td><td class="r">${isNum(r.reads) ? esc(fmt.compact(r.reads)) : '—'}</td><td>${esc(day(r.last_day))}</td></tr>`).join('')}</table><div class="hx-f"><button class="ov-btn sm" data-act="${csvId}">${OV.icon('download')}CSV</button></div>` : '';
    box.innerHTML = H.status === 'empty' && !s ? tiles + ui.empty('No board snapshot holds this title yet · history fills daily', { box: true }) : tiles + chart + mini;
  };
})();

</script>
<script>
/* ---- pages_health.js ---- */
/* =====================================================================================================
   OTTVerse Trends — Data health (MORE · #/health). The app checks its own numbers so the user is not the QA.
   Built only from window.OV on /api/ott/health* (ott/health.py): status per area, the checks with their evidence,
   the 14-day history and "Run now" (local checks, free — never a fetch, never a spend).
   House rules: header → filters → KPIs → main visual → dense table (CSV). No paragraph; rules live in tooltips.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const API = '/api/ott/health';
  const TONE = { pass: 'up', warn: 'warn', fail: 'down', ok: 'up' };
  const WORD = { pass: 'OK', warn: 'Warn', fail: 'Fail', ok: 'OK' };
  const RANK = { fail: 0, warn: 1, pass: 2 };
  const COLOR = { pass: 'var(--up)', ok: 'var(--up)', warn: 'var(--amber)', fail: 'var(--down)' };
  let POLL = null;

  const get = force => OV.api.get(API, null, { ttl: 20, force: !!force });
  const pill = (st, tip) => `<span class="hl-pill ${esc(TONE[st] || 'muted')}"${tip ? ` data-tip="${esc(tip)}"` : ''}><i></i>${esc(WORD[st] || '—')}</span>`;
  const trig = t => ({ 'free-sweep': 'after free sweep', 'reading-refresh': 'after reading refresh', 'platform-refresh': 'after platform refresh', manual: 'run by hand', cli: 'CLI', 'first-open': 'first open', summary: 'first summary' }[t] || t || '—');

  /* one square per run, oldest → newest (a check's or an area's history) */
  function strip(statuses, n) {
    const s = arr(statuses).slice(-(n || 30));
    if (!s.length) return ui.unk('No history yet');
    return `<span class="hl-strip">${s.map(x => `<i class="${esc(x || 'none')}" data-tip="${esc(x ? WORD[x] : 'not checked')}"></i>`).join('')}</span>`;
  }

  /* 14-day history: one stacked column per run (fail red over warn amber; a clean run is a short green tick) */
  function historyChart(H) {
    const runs = arr(H).slice(-160);
    if (!runs.length) return ui.empty('No run stored yet');
    const w = 640, h = 92, pad = 4, n = runs.length;
    const mx = Math.max(1, ...runs.map(r => (r.fail || 0) + (r.warn || 0)));
    const bw = Math.min(14, Math.max(2, (w - pad * 2) / n)), x0 = w - pad - bw * n;   // few runs: narrow bars, newest on the right
    const Y = v => (h - 14) * v / mx;
    const cols = runs.map((r, i) => {
      const x = x0 + i * bw, f = r.fail || 0, wn = r.warn || 0;
      const tip = `${fmt.ist(r.at)} · ${trig(r.trigger)}\n${r.pass} pass · ${wn} warn · ${f} fail`;
      if (!f && !wn) return `<rect x="${x.toFixed(1)}" y="${h - 16}" width="${Math.max(1, bw - 1).toFixed(1)}" height="3" rx="1" style="fill:var(--up)"><title>${esc(tip)}</title></rect>`;
      const hf = Y(f), hw = Y(wn), base = h - 13;
      return `<g><title>${esc(tip)}</title>${wn ? `<rect x="${x.toFixed(1)}" y="${(base - hw).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${hw.toFixed(1)}" style="fill:var(--amber)"/>` : ''}${f ? `<rect x="${x.toFixed(1)}" y="${(base - hw - hf).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${hf.toFixed(1)}" style="fill:var(--down)"/>` : ''}</g>`;
    }).join('');
    const first = runs[0], lastR = runs[n - 1];
    return `<svg class="hl-hist" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Fails and warnings per run, last 14 days">${cols}`
      + `<line x1="${pad}" x2="${w - pad}" y1="${h - 12.5}" y2="${h - 12.5}" style="stroke:var(--line);stroke-width:1"/></svg>`
      + `<div class="hl-hx"><span>${esc(fmt.ist(first.at))}</span><span class="lg"><i class="f"></i>fail<i class="w"></i>warn<i class="p"></i>clean</span><span>${esc(fmt.ist(lastR.at))}</span></div>`;
  }

  function areaTiles(rep, H, areaSel) {
    const runs = arr(H);
    return `<div class="hl-areas">${arr(rep.areas).map(a => {
      const ids = arr(rep.checks).filter(c => c.area === a.id).map(c => c.id);
      const hist = runs.map(r => { const s = ids.map(id => r.checks && r.checks[id]).filter(Boolean); return s.length ? (s.includes('fail') ? 'fail' : s.includes('warn') ? 'warn' : 'pass') : null; });
      const cnt = a.fail || a.warn ? [a.fail ? `<b class="f">${a.fail} fail</b>` : '', a.warn ? `<b class="w">${a.warn} warn</b>` : ''].filter(Boolean).join(' · ') : `<span class="ok">${a.pass} ok</span>`;
      return `<button type="button" class="hl-area ${esc(a.status)}${areaSel === a.id ? ' on' : ''}" data-set='${esc(JSON.stringify({ area: areaSel === a.id ? '' : a.id }))}' data-tip="${esc(a.name + ': ' + a.pass + ' pass · ' + a.warn + ' warn · ' + a.fail + ' fail\nClick to filter the table')}">`
        + `<span class="hd"><i class="dot"></i><span class="nm">${esc(a.name)}</span></span><span class="ct">${cnt}</span>${strip(hist, 24)}</button>`;
    }).join('')}</div>`;
  }

  function evidence(c, max) {
    const ev = arr(c.evidence).slice(0, max || 5);
    if (!ev.length) return '<span class="hl-none">—</span>';
    const more = (c.count || 0) > ev.length && c.status !== 'pass' ? `<li class="more">+${esc(fmt.num(c.count - ev.length))} more</li>` : '';
    return `<ul class="hl-ev">${ev.map(e => `<li data-tip="${esc(e)}">${esc(e)}</li>`).join('')}${more}</ul>`;
  }
  /** the table cell: the first two evidence lines (a 48 px row); the rest as "+N" with every line on hover */
  function evidenceCell(c) {
    const all = arr(c.evidence);
    if (!all.length) return '<span class="hl-none">—</span>';
    const total = Math.max(all.length, c.status !== 'pass' && isNum(c.count) ? c.count : 0);
    const shown = all.slice(0, 2), rest = total - shown.length;
    const tip = all.slice(0, 5).join('\n') + (total > Math.min(all.length, 5) ? `\n+${fmt.num(total - Math.min(all.length, 5))} more` : '');
    return `<ul class="hl-ev" data-tip="${esc(tip)}">${shown.map((e, i) => `<li><span>${esc(e)}</span>${i === shown.length - 1 && rest > 0 ? `<b>+${esc(fmt.num(rest))}</b>` : ''}</li>`).join('')}</ul>`;
  }

  function openCheck(c, H) {
    const hist = arr(H).map(r => r.checks && r.checks[c.id]);
    OV.drawer.open({
      title: c.what, width: 560,
      html: `<div class="hl-dr">
        <div class="row">${pill(c.status)}${ui.tag(c.area_name || c.area, 'muted')}<span class="id">${esc(c.id)}</span></div>
        <h4>Evidence${isNum(c.count) && c.count ? ` · ${esc(fmt.num(c.count))}` : ''}</h4>${evidence(c, 5)}
        ${c.fix_hint ? `<h4>Fix</h4><div class="fix">${esc(c.fix_hint)}</div>` : ''}
        <h4>History · ${esc(hist.filter(Boolean).length)} runs</h4>${strip(hist, 60)}
      </div>`,
    });
  }

  OV.actions.healthRun = async (arg, el) => {
    if (el) el.disabled = true;
    try {
      const r = await OV.api.post(API + '/run');
      OV.toast(r.status === 'recent' ? 'Checked moments ago' : r.status === 'running' ? 'A check is running · joined it' : 'Checking · local, free');
    } catch (e) { OV.toast(e.detail || 'Check not started', 'down'); if (el) el.disabled = false; return; }
    OV.api.clear(API);
    watch(true);
  };

  /* while a run is going: poll every 3 s, then redraw once */
  function watch(started) {
    clearTimeout(POLL);
    const tick = async () => {
      if (!OV.ctx || OV.ctx.id !== 'health') return;
      let d = null;
      try { d = await get(true); } catch (e) { /* keep polling */ }
      if (d && !d.running) { OV.api.clear(API); OV.refresh(); return; }
      POLL = setTimeout(tick, 3000);
    };
    POLL = setTimeout(tick, started ? 1500 : 3000);
  }

  OV.register('health', {
    title: 'Data health', group: 'MORE', icon: 'health',
    badgeHot: true,
    badge: async () => { const s = await OV.api.get(API + '/summary', null, { ttl: 120 }); return s && s.fail ? s.fail : 0; },
    coach: [
      { sel: '#ov-view .ov-ph', text: 'Overall status · Run now re-checks (local, free)' },
      { sel: '#ov-view .ov-filters', text: 'Filter by area or status' },
      { sel: '#ov-view .ov-kpis', text: 'Fails, warnings, last check' },
      { sel: '#ov-view .hl-areas', text: 'One tile per area · its last 24 runs' },
      { sel: '#ov-view .ov-tw', text: 'Every check with its evidence · click for the fix' },
    ],
    async render(el, ctx) {
      el.innerHTML = ui.pageHeader({ title: 'Data health' }) + ui.skeleton('kpis', 6) + ui.skeleton('table', 8);
      let d;
      try { d = await get(); } catch (e) { if (ctx.alive()) el.innerHTML = ui.page({ title: 'Data health', main: ui.error(e) }); return; }
      if (!ctx.alive()) return;
      const P = ctx.params, rep = d.last, H = arr(d.history);
      const busy = d.running;
      const runBtn = `<button class="ov-freebtn" data-act="healthRun"${busy ? ' disabled' : ''} data-tip="Re-run every check now: local, stored data only · never a fetch or a spend"><span class="ic${busy ? ' spin' : ''}">${OV.icon('run')}</span>${busy ? 'Checking…' : 'Run now'}<span class="ov-free-tag">FREE</span></button>`;
      if (busy) watch(false);
      if (!rep) {
        el.innerHTML = ui.page({ title: 'Data health', actions: runBtn, main: ui.empty(busy ? 'First check running…' : 'No check stored yet', busy ? null : { action: { act: 'healthRun', label: 'Run now' } }) });
        return;
      }
      const areaSel = P.area || '', stSel = P.st || '';
      const checks = arr(rep.checks).slice().sort((a, b) => (RANK[a.status] - RANK[b.status]) || 0);
      const rows = checks.filter(c => (!areaSel || c.area === areaSel) && (!stSel || c.status === stSel));
      const cnt = s => checks.filter(c => (!areaSel || c.area === areaSel) && c.status === s).length;
      const runs14 = H.length, clean = H.filter(r => !r.fail).length;
      const tip = (d.rules && d.rules.runs) || '';
      const filters = ui.filterBar([
        ui.chips('area', [['', 'All areas', checks.length]].concat(arr(rep.areas).map(a => [a.id, a.name, a.fail + a.warn || null])), areaSel),
        ui.chips('st', [['', 'All'], ['fail', 'Fail', cnt('fail')], ['warn', 'Warn', cnt('warn')], ['pass', 'Pass', cnt('pass')]], stSel),
        ui.reset(['area', 'st'], areaSel || stSel),
      ]);
      const kpis = [
        { label: 'Status', value: WORD[rep.status], sub: `${rep.pass + rep.warn + rep.fail} checks`, tip: 'Worst check: FAIL if any fails, WARN if any warns' },
        { label: 'Fail', value: rep.fail, sub: rep.fail ? 'needs a fix' : 'none', tip: 'Checks failing now', spark: H.slice(-40).map(r => r.fail), sparkColor: 'var(--down)', sparkTip: 'Fails per run, last 40 runs' },
        { label: 'Warn', value: rep.warn, sub: rep.warn ? 'worth a look' : 'none', tip: 'Checks warning now', spark: H.slice(-40).map(r => r.warn), sparkColor: 'var(--amber)', sparkTip: 'Warnings per run, last 40 runs' },
        { label: 'Pass', value: rep.pass },
        { label: 'Last check', value: fmt.ago(rep.as_of), sub: `${trig(rep.trigger)} · ${isNum(rep.seconds) ? fmt.dec(rep.seconds, 1) + ' s' : '—'}`, tip: fmt.ist(rep.as_of) + '\n' + tip },
        { label: 'Clean runs · 14d', value: runs14 ? Math.round(clean / runs14 * 100) : null, unit: '%', sub: `${fmt.num(clean)} of ${fmt.num(runs14)} runs`, tip: 'Share of stored runs (14 days) with no failing check', unkTip: 'No history yet' },
      ];
      const main = ui.grid('minmax(0,1.45fr) minmax(0,1fr)', [
        ui.card({ title: 'Areas', tip: 'Worst status per area; squares = its last 24 runs', body: areaTiles(rep, H, areaSel) }),
        ui.card({ title: 'History · 14 d', tip: 'Fails (red) and warnings (amber) per run; green tick = clean run', body: historyChart(H) }),
      ]);
      const table = ui.table({
        id: 'health-table', rows, pageSize: 50, csvName: 'data-health-' + new Date(rep.as_of * 1000).toISOString().slice(0, 16).replace(':', ''),
        search: true, searchPlaceholder: 'Filter checks', searchText: c => [c.id, c.what, c.area_name, arr(c.evidence).join(' '), c.fix_hint].join(' '),
        toolbar: `<span><b>${esc(fmt.num(rows.length))}</b> checks · ${esc(fmt.ist(rep.as_of))}</span>`,
        onRow: c => openCheck(c, H), empty: 'No check matches',
        columns: [
          { id: 'status', label: 'Status', width: '64px', tip: 'pass · warn · fail', value: c => RANK[c.status], render: c => pill(c.status), csv: c => c.status },
          { id: 'area', label: 'Area', width: '128px', value: c => c.area_name, render: c => esc(c.area_name || c.area) },
          { id: 'what', label: 'Check', cls: 'hl-wc', render: c => ui.nameCell({ name: c.what }, { meta: c.id, noThumb: true, tip: c.fix_hint && c.status !== 'pass' ? 'Fix: ' + c.fix_hint : '' }), value: c => c.what },
          { id: 'evidence', label: 'Evidence', sort: false, cls: 'hl-evc', render: evidenceCell, csv: c => arr(c.evidence).join(' | ') },
          { id: 'count', label: 'n', num: true, width: '44px', tip: 'Offending rows / values (all, not only the 5 shown)', value: c => c.status === 'pass' ? 0 : c.count, render: c => c.status !== 'pass' && isNum(c.count) ? esc(fmt.num(c.count)) : '<span class="hl-none">—</span>' },
          { id: 'hist', label: 'History', sort: false, width: '170px', hideBelow: 1100, tip: 'This check, last 30 runs (oldest → newest)', render: c => strip(H.map(r => r.checks && r.checks[c.id]), 30), csvSkip: true },
          { id: 'fix', label: 'Fix', hide: true, render: c => esc(c.fix_hint || '—'), csv: c => c.fix_hint || '' },
        ],
      });
      el.innerHTML = ui.page({
        title: 'Data health', badge: pill(rep.status, `${rep.pass} pass · ${rep.warn} warn · ${rep.fail} fail`),
        subHtml: `<span>Checked <b>${esc(fmt.time(rep.as_of))}</b> · ${esc(trig(rep.trigger))} · local, free</span>`,
        tip: 'The app checks its own numbers after every free sweep and every reading / platform refresh: freshness, order vs Google, Title Attention by Platform, reading ladders, provenance, cost, Netflix match, API.',
        actions: runBtn, filters, kpis, main, table,
      });
    },
  });
})();

</script>
<script>
/* ---- pages_sweep.js ---- */
/* =====================================================================================================
   OTTVerse Trends — India Sweep (CHARTS · #/sweep). Built only from window.OV on /api/ott/sweep* (ott/sweep.py).

   Every Google Trending-now list of the latest scan — India + 36 states / UTs, every field the scan stored — plus the
   FREE deep-dive into the scan's top national entertainment + sports trends: interest by state, 7-day curves, related
   searches (top + rising), what Google's search box maps each search to, and news. trendspy first, pytrends for
   related searches when trendspy is blocked; never SerpApi or DataForSEO; ≤ 70 calls a run.

   House rules (the old, full-page UI the user asked to keep): header → tabs → filters → KPIs → main visual → dense
   table (sort, CSV, row → the FULL Title 360 page, never a drawer). Honest words: volume is Google's lower-bound
   bucket; an empty state list is no data; a rate-limit is "rate-limited, retry after HH:MM", never "no data"; search
   interest, not viewing. Also: the Title 360 "Google detail (free)" card (injected after the KPI row).
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  OV.icons.sweep = '<path d="M3 12h3.5l2.5-6 4 13 3-9 2 2H21"/>';
  const API = '/api/ott/sweep';
  let POLL = null;

  const TABS = [['', 'National list'], ['state', 'By state'], ['spread', 'Spread across states'], ['deep', 'Deep-dive'],
    ['curves', '7-day curves'], ['related', 'Related & rising'], ['suggest', 'Suggestions'], ['news', 'News'], ['na', 'Not available']];
  const CAT_TONE = { Entertainment: 'pink', Sports: 'teal', Uncategorised: 'muted' };
  const HINT_TONE = { film: 'pink', tv_series: 'violet', athlete: 'teal', team: 'teal', event: 'info', person: 'warn', music: 'pink', brand: 'muted', topic: 'muted', other: 'muted' };
  const ST_TONE = { ok: 'up', empty: 'muted', no_tokens: 'muted', rate_limited: 'warn', self_cap: 'warn', error: 'down', skipped: 'muted', unavailable: 'down' };
  const hhmm = ts => isNum(ts) ? fmt.time(ts) : '—';
  const T = {
    volume: 'Google’s volume bucket for the last 24 h — a lower bound (1M+ = at least a million searches), not an exact count',
    growth: 'Google’s growth vs the search’s own earlier level (capped at +1,000%)',
    states: 'State / UT Trending-now lists this search is on (of the lists with data in this scan)',
    hint: 'What Google’s search box maps the search to (suggestions: film, TV series, athlete, topic…). A hint for rows Wikidata left unclassified — never overrides Wikidata',
    region: 'Interest by state, past day, 0–100 within India (100 = where it is searched most, relative to all searches there). Search interest, not viewing',
    curve: '7-day hourly interest, 0–100; each group of 5 searches is scaled together (compare within a group only)',
  };

  /* ------------------------------------------------------------------ cells */
  // one pill per row (the first category); any more ride as "+1" with every category on hover (and in the CSV)
  const catTags = cs => { const L = arr(cs); if (!L.length) return ui.tag('Uncategorised', 'muted', 'Google gave no category');
    return ui.tag(L[0], CAT_TONE[L[0]] || 'muted', L.length > 1 ? 'Google’s categories: ' + L.join(' · ') : '') + (L.length > 1 ? ` <span class="ov-note1" data-tip="${esc('Also: ' + L.slice(1).join(' · '))}">+${L.length - 1}</span>` : ''); };
  const vol = r => r.volume_label ? `<span data-tip="${esc(T.volume)}">${esc(r.volume_label)}</span>` : ui.unk('Google gave no volume bucket');
  const growth = r => isNum(r.growth) ? `<span class="sw-g">${esc(fmt.growth(r.growth))}</span>` : ui.unk('Google gave no growth figure');
  const started = r => isNum(r.started) ? `<span data-tip="${esc('Started ' + fmt.ist(r.started))}">${esc(fmt.ago(r.started))} ago</span>` : ui.unk('No start time');
  const status = r => r.active ? '<span class="sw-st on" data-tip="Google still marks it active"><i></i>Active</span>' : `<span class="sw-st off" data-tip="${esc(isNum(r.ended) ? 'Ended ' + fmt.ist(r.ended) : 'Ended')}"><i></i>Ended${isNum(r.ended) ? ' ' + esc(fmt.ago(r.ended)) + ' ago' : ''}</span>`;
  const hint = (h, o) => {
    if (!h) return o && o.unk === false ? '' : ui.unk('No suggestion fetched (only the deep-dive’s top searches get one)');
    const tip = `Google’s search box: “${h.title}” · ${h.type || 'no type'}${h.match === 'first' ? '\n(weak: the first suggestion — none matched the search)' : ''}\n${T.hint}`;
    return `<span class="sw-hint" data-tip="${esc(tip)}">${ui.tag(h.label || h.coarse, HINT_TONE[h.coarse] || 'muted')}${o && o.full ? `<small>${esc(h.title)}</small>` : ''}</span>`;
  };
  // the thumbnail's item: the row itself, typed from what is known (a sports "a vs b" search draws the team pair;
  // Google's search-box hint gives the monogram its colour). Never a guessed image: ui.thumb looks up the cache only.
  const HINT_TYPE = { film: 'film', tv_series: 'series', athlete: 'player', team: 'team', person: 'person', music: 'music' };
  const VS = /\s(v|vs\.?|versus)\s/i;
  const isSport = r => r.lane === 'sports' || arr(r.categories).includes('Sports');
  const thItem = r => {
    r = r || {};
    const h = r.hint || (((r.facets || {}).suggest || {}).hint) || null;
    const type = r.type || (isSport(r) && VS.test(r.query || '') ? 'sports_event' : h && HINT_TYPE[h.coarse]) || '';
    return type ? Object.assign({}, r, { type }) : r;
  };
  const qHint = r => r.hint || (((r.facets || {}).suggest || {}).hint) || null;
  const qMeta = r => { const t = thItem(r), h = qHint(r); return [OV.rowMeta(t) || (h ? h.label : ''), r.top ? 'Deep-dive' : ''].filter(Boolean).join(' · '); };
  const qTip = r => [r.top ? 'In the deep-dive’s top searches' : '', arr(r.related).length ? 'Related searches Google lists with it:\n' + r.related.join('\n') : ''].filter(Boolean).join('\n');
  const qCell = r => ui.nameCell(thItem(r), { name: r.query, meta: qMeta(r), tip: qTip(r) });
  const searchCell = qCell;
  const statesCell = (r, names) => isNum(r.n_states) && r.n_states ? `<span class="sw-cnt" data-tip="${esc(arr(r.states).length ? arr(r.states).map(g => names[g] || g).join(', ') : T.states)}">${esc(r.n_states)}</span>` : '<span class="ov-note1" data-tip="On no state list in this scan">0</span>';
  const statusTag = f => f ? ui.tag(f.status === 'ok' ? 'ok' : f.status.replace('_', ' '), ST_TONE[f.status] || 'muted', f.word || (f.status === 'ok' ? 'Fetched · ' + (f.provider || '') + ' ' + hhmm(f.at) : '')) : ui.tag('not run', 'muted', 'Deep-dive not run yet for this search');
  const facetWord = (f, what) => !f ? ui.empty('Deep-dive not run yet') : f.status === 'ok' ? '' : `<div class="sw-word ${esc(f.status)}">${f.status === 'rate_limited' || f.status === 'self_cap' ? OV.icon('clock') : ''}${esc(f.word || what || 'No data')}</div>`;
  const csvList = a => arr(a).join('; ');
  const openKey = r => { if (r && r.key) OV.go('title', { key: r.key }); };

  /* ------------------------------------------------------------------ filters */
  function applyFilters(rows, P) {
    const q = OV.norm(P.q || ''), cat = P.cat || '', act = P.active === '1', es = P.es === '1';
    return arr(rows).filter(r => (!cat || (cat === 'Uncategorised' ? !arr(r.categories).length : arr(r.categories).includes(cat)))
      && (!act || r.active) && (!es || r.lane || arr(r.categories).some(c => c === 'Entertainment' || c === 'Sports'))
      && (!q || OV.norm(r.query + ' ' + arr(r.related).join(' ') + ' ' + ((r.hint || {}).title || '')).indexOf(q) >= 0));
  }
  function filterBar(d, P, tab) {
    const cats = arr(d.categories).map(([c, n]) => [c, c, n]);
    const parts = [];
    if (tab === 'state' && !P.geo) {
      const geo = P.geo || 'IN-MH';
      parts.push(ui.select('geo', arr(d.states).map(s => [s.geo, s.name + (s.status === 'no_data' ? ' · no data' : s.status === 'failed' ? ' · not fetched' : ''), s.n]), geo, { all: false, label: 'State', tip: 'Every state / UT list of the scan, with its size' }));
    }
    parts.push(ui.select('cat', cats, P.cat || '', { all: 'All categories', tip: 'Google’s Trending-now categories (a search can carry several)' }));
    parts.push(ui.toggle('active', 'Active only', P.active === '1', { tip: 'Only searches Google still marks active (not ended)' }));
    parts.push(ui.toggle('es', 'Entertainment + Sport', P.es === '1', { tip: 'Only Google’s Entertainment / Sports categories, or rows the app classified as entertainment / sports' }));
    parts.push(ui.search('q', P.q || '', 'Filter searches'));
    parts.push(ui.reset(['cat', 'active', 'es', 'q'], !!(P.cat || P.active || P.es || P.q)));
    parts.push('<span class="sp"></span>');
    parts.push(ui.tag('Search interest · not viewing', 'muted', ['Volume = Google’s lower-bound bucket (1M+ = at least a million searches).', 'Search interest, not viewing.'].concat(arr(d.notes)).join('\n')));
    return ui.filterBar(parts);
  }

  /* ------------------------------------------------------------------ header bits */
  // the calls cap in effect (settings.max_calls, XST_SWEEP_MAX_CALLS) — printed, never a hard-coded 70 (audit dev-search-15)
  const capOf = d => { const s = (d && d.settings) || {}, dp = (d && d.deep) || {}; return isNum(s.max_calls) ? s.max_calls : isNum(dp.cap) ? dp.cap : null; };
  // "state 8/8 · suggest 8/8 · related 0/8": what a deep-dive holds, per facet (audit dev-search-14 / qa-drill-20)
  const facetLine = (dp, which) => arr(dp && dp.by_facet).filter(x => x.of && (!which || which.includes(x.facet))).map(x => `${x.short} ${x.done}/${x.of}`).join(' · ');
  // the KPI's short line: state interest, then only the 'complete' facets still missing ("state 8/8 · related 0/8")
  const facetShort = dp => facetLine({ by_facet: arr(dp && dp.by_facet).filter(x => x.facet === 'region' || (['suggest', 'related'].includes(x.facet) && x.done < x.of)) });
  // the News sub-tab counts the searches the tab lists (the plan's news keys with news), not every stored facet
  const newsCount = (d, dp) => { const fc = (d && d.facets) || {}; return arr(dp && dp.news_keys).filter(k => ((fc[k] || {}).news || {}).status === 'ok').length; };
  OV.sweepBits = { capOf, facetLine, facetShort, newsCount };
  function runBtn(b, cap) {
    b = b || {};
    const tip = [b.allowed ? `Fetch the free Google detail for the latest scan’s top searches (trendspy, pytrends for related searches; ≤ ${isNum(cap) ? cap : '—'} calls, a few minutes). A retry fetches only what is missing.` : '',
      b.reason === 'cooldown' ? `15-min cool-down · next after ${b.until_hhmm}` : '', b.reason === 'complete' ? 'Complete for this scan: nothing missing to fetch' : '',
      b.reason === 'running' ? 'Running now' : '', 'Free · never SerpApi or DataForSEO · automatic once after each scan'].filter(Boolean).join('\n');
    const run = b.reason === 'running';
    return `<button class="ov-freebtn st sw-run" data-act="sweepRun"${b.allowed ? '' : ' disabled'} data-tip="${esc(tip)}"><span class="ic${run ? ' spin' : ''}">${OV.icon('run')}</span>${esc(run ? 'Deep-dive running…' : b.allowed ? 'Run deep-dive' : b.label || 'Run deep-dive')}<span class="ov-free-tag">FREE</span></button>`;
  }
  function deepPill(d) {
    const dp = d.deep || {}, run = dp.run;
    if (!run) return `<span class="sw-pill" data-tip="No deep-dive for this scan yet">Deep-dive: <b>not run</b></span>`;
    const tip = [`Run #${run.id} · ${run.trigger} · ${run.status} · ${run.calls} calls (cap ${run.cap})`, Object.entries(run.calls_by || {}).map(([k, v]) => `${k} ${v}`).join(' · '),
      `Ledger: ${Object.entries(run.ledger || {}).map(([k, v]) => `${k} ${v}`).join(' · ') || '—'}`].concat(arr(run.notes)).filter(Boolean).join('\n');
    const fl = facetLine(dp, ['region', 'suggest', 'related']);
    return `<span class="sw-pill" data-tip="${esc(tip + '\n' + (dp.done_rule || '') + '\n' + facetLine(dp))}">Deep-dive: <b>${esc(fl || dp.done + ' of ' + dp.planned + ' complete')}</b> · ${esc(run.status === 'running' ? 'running' : hhmm(run.finished_at || run.started_at))}</span>`;
  }
  function blockedStrip(d) {
    const run = (d.deep || {}).run;
    const bl = arr(run && run.blocked);
    if (!bl.length) return '';
    return `<div class="ov-strip sw-blocked">${OV.icon('clock')}<span class="it" data-tip="Not “no data”: Google refused these calls · the rest of the deep-dive carried on"><b>Rate-limited</b></span>${bl.map(b => ui.tag(`${b.label} · ${b.provider} · ${b.past ? 'retry now' : 'after ' + b.until_hhmm}`, 'warn', (b.reason ? b.reason + '\n' : '') + (b.past ? 'Retry now possible' : 'Retry after ' + b.until_hhmm))).join('')}</div>`;
  }

  /* ------------------------------------------------------------------ main visuals */
  function mapCard(d, title, o) {
    const vals = {};
    arr(d.states).forEach(s => { vals[s.geo] = s.status === 'ok' ? { v: s.n, lines: [fmt.plural(s.n, 'search', 'searches') + ' on its list'] } : { v: null, tip: s.why }; });
    return ui.card({ title, icon: 'map', tip: 'Size of each state’s Trending-now list in this scan. Grey = no data (Google listed nothing, or the list was not fetched).', body: ui.map(vals, Object.assign({ abs: true, legendLabel: 'searches', noneLabel: 'no data', mini: true }, o || {})) });
  }
  function natMain(d) {
    const nat = arr(d.national);
    const cats = {};
    nat.forEach(r => (arr(r.categories).length ? r.categories : ['Uncategorised']).forEach(c => { cats[c] = (cats[c] || 0) + 1; }));
    const catCard = ui.card({ title: 'Categories', tip: 'Google’s Trending-now categories on India’s list (a search can carry several). Click to filter.', body: ui.barlist(Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([c, n]) => ({ label: c, value: n, color: c === 'Entertainment' ? 'var(--pink)' : c === 'Sports' ? 'var(--teal)' : 'var(--blue)', go: ['sweep', { cat: c }] })), { fmt: fmt.num }) });
    const bk = {};
    nat.forEach(r => { const l = r.volume_label || '—'; bk[l] = (bk[l] || 0) + 1; });
    const order = Object.keys(bk).sort((a, b) => (nat.find(r => (r.volume_label || '—') === b) || {}).volume - (nat.find(r => (r.volume_label || '—') === a) || {}).volume || 0);
    const volCard = ui.card({ title: 'Volume buckets', tip: T.volume, body: ui.barlist(order.map(l => ({ label: l, value: bk[l], color: 'var(--violet)' })), { fmt: fmt.num }) });
    const wide = nat.filter(r => r.n_states).sort((a, b) => b.n_states - a.n_states).slice(0, 10);
    const wideCard = ui.card({ title: 'Widest across states', tip: 'India-list searches on the most state lists', body: ui.barlist(wide.map(r => ({ label: r.query, value: r.n_states, key: r.key, sub: r.volume_label || '' })), { fmt: v => v + '/' + (d.kpis.states_with_data || 36), max: d.kpis.states_with_data || 36 }) });
    return ui.grid('minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)', [catCard, volCard, wideCard, mapCard(d, 'State list size')]);
  }
  function stateMain(d, geo, rows) {
    const s = arr(d.states).find(x => x.geo === geo) || {};
    const es = rows.filter(r => r.lane || arr(r.categories).some(c => c === 'Entertainment' || c === 'Sports')).length;
    const regional = rows.filter(r => !r.on_national).length;
    const summary = ui.card({ title: s.name || geo, icon: 'regions', tip: 'This state’s list in the scan', body: s.status !== 'ok'
      ? ui.empty(s.why || 'No data', { box: true })
      : `<dl class="ov-kv"><dt>Searches</dt><dd>${esc(fmt.num(s.n))}</dd><dt>Ent + Sport</dt><dd>${esc(fmt.num(es))}</dd><dt>Active</dt><dd>${esc(fmt.num(rows.filter(r => r.active).length))}</dd><dt>Regional only</dt><dd data-tip="Not on India’s national list">${esc(fmt.num(regional))}</dd><dt>Source</dt><dd>${esc(s.source || '—')}</dd></dl>` });
    const sizes = ui.card({ title: 'List sizes', tip: 'Searches on each state’s list (click a state to open it)', body: ui.barlist(arr(d.states).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 12).map(x => ({ label: x.name, value: x.n, go: ['sweep', { tab: 'state', geo: x.geo }], color: x.geo === geo ? 'var(--brand)' : 'var(--blue)' })), { fmt: fmt.num }) });
    return ui.grid('minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)', [summary, sizes, mapCard(d, 'Click a state', { click: 'geo', sel: geo })]);
  }
  function spreadMain(d, rows) {
    const top = rows.slice(0, 12);
    const nOn = rows.filter(r => r.on_national).length;
    const left = ui.card({ title: 'Most state lists', tip: 'Searches by how many state / UT lists carry them', body: ui.barlist(top.map(r => ({ label: r.query, value: r.n, key: r.key, sub: r.on_national ? '#' + r.national_rank + ' India' : 'regional only', color: r.on_national ? 'var(--blue)' : 'var(--amber)' })), { fmt: v => String(v), max: d.kpis.states_with_data || 36 }) });
    const mid = ui.card({ title: 'National vs regional', tip: 'Searches on state lists that are also on India’s list, vs regional only', body: ui.stacked([{ label: 'Also on India’s list', value: nOn, color: 'var(--blue)' }, { label: 'Regional only', value: rows.length - nOn, color: 'var(--amber)' }], { lg: true, pct: false, fmt: fmt.num }) + `<div class="ov-note1 sw-mt" data-tip="Distinct searches across the state lists with data">${esc(fmt.num(rows.length))} searches · ${esc(d.kpis.states_with_data)} lists</div>` });
    return ui.grid('minmax(0,1.6fr) minmax(0,1fr)', [left, mid]);
  }
  function deepCard(t, d) {
    const f = t.facets || {};
    const reg = f.region, nw = f.news, rel = f.related, sg = f.suggest;
    const bars = reg && reg.status === 'ok' ? ui.barlist(arr(reg.rows).slice(0, 10).map(x => ({ label: x.state, value: x.value, color: 'var(--brand)' })), { fmt: v => String(v), max: 100 }) : facetWord(reg, 'No state data');
    const news = nw && nw.status === 'ok' ? `<ul class="sw-news">${arr(nw.items).slice(0, 2).map(a => `<li>${ui.extLink(a.url, a.title || a.url)} <small>${esc(a.source || '')}${isNum(a.time) ? ' · ' + esc(fmt.ago(a.time)) + ' ago' : ''}</small></li>`).join('')}</ul>` : facetWord(nw, 'No news');
    const rising = rel && rel.status === 'ok' ? arr(rel.rising).slice(0, 4).map(x => `<span class="sw-chip">${esc(x.query)} <b>${esc(x.formatted || '')}</b></span>`).join('') : '';
    return `<section class="ov-card sw-dd" data-title-key="${esc(t.key)}"><div class="ov-cb"><div class="sw-ddh">${ui.thumb(thItem(t))}<div class="tx"><h3>${esc(t.query || t.key)}</h3>
      <div class="ov-note1"><b data-tip="${esc(T.volume)}">${esc(t.volume_label || '—')}</b> · ${esc(fmt.growth(t.growth))} ${catTags(t.categories)}</div></div>${hint(sg && sg.hint, { unk: false, full: true })}</div>
      <div class="ov-sub-h">By state · past day${ui.tip(T.region)}</div>${bars}
      ${rising ? `<div class="ov-sub-h">Rising searches${ui.tip('Related searches rising fastest, past 7 days, India (' + (rel.provider || '') + ')')}</div><div class="sw-chips">${rising}</div>` : ''}
      <div class="ov-sub-h">News${nw && nw.status === 'ok' && arr(nw.items).length > 2 ? ` <a class="sw-more" href="#/charts?win=deep&tab=news">+${esc(arr(nw.items).length - 2)}</a>` : ''}</div>${news}</div></section>`;
  }
  function curveCard(k, row, f) {
    if (!f || f.status !== 'ok') return `<div class="ov-card sw-cv" data-title-key="${esc(k)}"><div class="ov-cb"><div class="sw-cvh">${ui.thumb(thItem(row || { query: k, key: k }))}<h4>${esc((row || {}).query || (f && f.query) || k)}</h4></div>${facetWord(f, 'No curve')}</div></div>`;
    const v = arr(f.values), now = v[v.length - 1], pk = Math.max(...v);
    return `<div class="ov-card sw-cv" data-title-key="${esc(k)}"><div class="ov-cb"><div class="sw-cvh">${ui.thumb(thItem(row || { query: k, key: k }))}<h4>${esc((row || {}).query || k)}</h4></div><div class="ov-note1">${esc((row || {}).volume_label || '—')} · now ${esc(now)} · peak ${esc(pk)}${row ? ' · ' + catTags(row.categories) : ''}</div>${ui.spark(v, { w: 260, h: 46, area: true, color: 'var(--brand)', tip: `${T.curve}\nGroup: ${arr(f.group).join(' · ')}\n${fmt.ist(f.ts0)} → ${fmt.ist(f.ts1)}` })}</div></div>`;
  }
  const relList = (rows, rising) => arr(rows).length ? `<ol class="sw-ll">${arr(rows).slice(0, 15).map(o => `<li>${esc(o.query || o.title)} <small>${esc(o.formatted || (isNum(o.value) ? (rising ? (o.value >= 5000 ? 'Breakout' : '+' + fmt.num(o.value) + '%') : o.value) : ''))}</small></li>`).join('')}</ol>` : '<div class="ov-note1">—</div>';

  /* ------------------------------------------------------------------ tables */
  function listColumns(d, withNat) {
    const names = d.names || {};
    return [
      { id: 'rank', label: '#', num: true, cls: 'rk', width: '40px', tip: 'Google’s own order on this list' },
      { id: 'query', label: 'Search', cls: 'sw-qc', render: searchCell, csv: r => r.query },
      { id: 'related', label: 'Related', hide: true, tip: 'Related searches Google lists with it', value: r => csvList(r.related), render: r => esc(csvList(r.related)) },
      { id: 'volume', label: 'Volume', num: true, tip: T.volume, render: vol, csv: r => r.volume_label || '' },
      { id: 'growth', label: 'Growth', num: true, tip: T.growth, render: growth },
      { id: 'started', label: 'Started', num: true, tip: 'When Google first listed it (IST on hover)', render: started, csv: r => isNum(r.started) ? fmt.ist(r.started) : '' },
      { id: 'active', label: 'Status', value: r => r.active ? 1 : 0, render: status, csv: r => r.active ? 'active' : 'ended' },
      { id: 'categories', label: 'Category', tip: 'Google’s Trending-now categories', value: r => csvList(r.categories), render: r => catTags(r.categories) },
      withNat ? { id: 'national_rank', label: 'India list', num: true, tip: 'Rank on India’s national list · “regional only” = not on it', value: r => r.national_rank, render: r => r.on_national ? '#' + esc(r.national_rank) : '<span class="ov-note1">regional only</span>', csv: r => r.on_national ? r.national_rank : 'regional only' } : null,
      { id: 'n_states', label: 'States', num: true, tip: T.states, render: r => statesCell(r, names) },
      { id: 'hint', label: 'Google sees', tip: T.hint, value: r => r.hint ? r.hint.label + ' · ' + r.hint.title : null, render: r => hint(r.hint), csv: r => r.hint ? `${r.hint.label} (${r.hint.title} · ${r.hint.type})` : '' },
      { id: 'on_board', label: 'Board', align: 'c', tip: 'On the Search Trends board (entertainment + sports)', value: r => r.on_board ? 1 : 0, render: r => r.on_board ? '✓' : '<span class="ov-note1">—</span>', csv: r => r.on_board ? 'yes' : '' },
    ].filter(Boolean);
  }
  function listTable(id, rows, d, noun, withNat, csvName) {
    return ui.table({ id, rows, pageSize: 50, csvName, noun, onRow: openKey, empty: 'No search matches the filters',
      toolbar: `<span><b>${esc(fmt.num(rows.length))}</b> ${esc(noun)} · ${esc((d.header || {}).period || '')}</span>`, columns: listColumns(d, withNat) });
  }

  /* ------------------------------------------------------------------ the page */
  OV.actions.sweepRun = async (arg, el) => {
    if (el) el.disabled = true;
    try {
      const r = await OV.api.post(API + '/run');
      OV.toast(r.status === 'started' ? 'Deep-dive started · free · a few minutes' : (r.note || r.status));
    } catch (e) { OV.toast((e.body && e.body.detail) || e.detail || 'Deep-dive not started', 'down'); }
    OV.api.clear(API); OV.refresh();
  };
  function poll(ctx) {
    clearTimeout(POLL);
    POLL = setTimeout(async () => {
      if (!ctx.alive()) return;
      let s; try { s = await OV.api.get(API + '/status', null, { ttl: 0, force: true }); } catch (e) { return; }
      if (!ctx.alive()) return;
      if (s && s.running) { poll(ctx); return; }
      OV.api.clear(API); ctx.rerender();
    }, 8000);
  }

  const DEEP_TABS = [['deep', 'Overview'], ['curves', '7-day curves'], ['related', 'Related & rising'], ['suggest', 'Suggestions'], ['news', 'News'], ['na', 'Not available']];
  /** Search Trends' tabs 'All Google lists' (lists), 'Spread across states' (spread) and 'Deep-dive' (deep) — the India
   *  Sweep lives INSIDE Search Trends (3 Oct: the user wanted it in the existing tab, not a separate page). */
  OV.sweepWin = async function (el, ctx, win) {
      const P = Object.assign({}, ctx.params);
      const mk = OV.state.market || 'IN';
      let tab = win === 'spread' ? 'spread' : win === 'lists' ? (/^IN-/.test(mk) ? 'state' : '') : (DEEP_TABS.some(t => t[0] === P.tab) ? P.tab : 'deep');
      if (tab === 'state') P.geo = mk;
      if (P.cat === 'entertainment' || P.cat === 'sports') P.cat = P.cat[0].toUpperCase() + P.cat.slice(1);   // Search Trends' own category values
      const SUB = 'Google · ' + OV.marketLabel() + ' · search interest';
      el.innerHTML = ui.pageHeader({ title: 'Search Trends', subtitle: SUB }) + ui.skeleton('kpis', 7) + ui.skeleton('page');
      let d;
      try { d = await OV.api.get(API, null, { ttl: 60 }); } catch (e) { if (ctx.alive()) el.innerHTML = ui.page({ title: 'Search Trends', subtitle: SUB, main: ui.error(e) }); return; }
      if (!ctx.alive()) return;
      if (d.status !== 'ready') { el.innerHTML = ui.page({ title: 'Search Trends', subtitle: SUB, strip: ui.filterBar([OV.winTabs(win, {})]), main: ui.empty('No finished scan yet — run a scan first', { box: true }) }); return; }
      const dp = d.deep || {}, k = d.kpis || {}, sc = d.scan || {};
      if (dp.run && dp.run.status === 'running') poll(ctx);
      const geoN = tab === 'state' ? arr((d.lists || {})[mk]).length : k.national;
      const tabs = OV.winTabs(win, { lists: geoN, spread: arr(d.spread).length, deep: dp.planned });
      const sub = win === 'deep' ? ui.tabs('tab', DEEP_TABS.map(([id, label]) => ({ id, label, count: id === 'deep' ? dp.planned : id === 'curves' ? arr(dp.curve_keys).length : id === 'news' ? newsCount(d, dp) :id === 'na' ? arr(d.not_available).length : null })), tab, { cls: 'sm' }) : '';
      const circleNote = win === 'lists' && mk !== 'IN' && !/^IN-/.test(mk) ? ui.tag('India list shown', 'warn', 'Google has no circle lists — showing India’s list') : '';
      const actions = `<span class="sw-pill" data-tip="${esc((sc.provider_label || '') + '\n' + Object.entries(sc.sources || {}).map(([p, n]) => `${p} × ${n}`).join(' · '))}">Scan #${esc(sc.id)} · <b>${esc(hhmm(sc.finished_at))}</b> · ${esc(sc.mode || '')}</span>${deepPill(d)}${runBtn(d.button, capOf(d))}`;
      const kpis = [
        { label: 'India list', value: k.national, sub: 'searches · 24 h', tip: 'Searches on Google’s national Trending-now list for India (last 24 h)' },
        { label: 'Ent + Sport', value: k.national_es, sub: `${fmt.num(k.on_board)} on the board`, tip: 'India-list searches in Google’s Entertainment / Sports categories, or classified entertainment / sports by the app' },
        { label: 'Still active', value: k.national_active, sub: `of ${fmt.num(k.national)}`, tip: 'India-list searches Google still marks active' },
        { label: 'State lists', value: `${k.states_with_data}/${k.states_total}`, sub: `${k.states_no_data} no data · ${k.states_failed} not fetched`, tip: 'State / UT lists with searches in this scan. No data = Google listed nothing there (not zero interest).' },

    if (!view || view.querySelector('.sw-g360')) return;
    const anchor = view.querySelector('#ov-why-card') || view.querySelector('.ov-kpis');   // under the decision card when it is there
    if (anchor) anchor.insertAdjacentHTML('afterend', googleCard(g)); else { const ph = view.querySelector('.ov-ph'); if (ph) ph.insertAdjacentHTML('afterend', googleCard(g)); }
    OV.hydrate();
  });
})();

</script>
<script>
/* ---- pages_boards.js ---- */
/* OTTVerse · Boards — the Telegram bot's boards inside the web app (#/boards).
   The boards are drawn by the server (/ottverse/boards/<page>, ott/boards_web.py) from this app's own data, with their own
   menu; this page frames them, full height, and remembers the last one opened. Same build on the laptop and the phone. */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.register || OV.static) return;      // the public snapshot copy has no server to draw them
  const KEY = 'ov.boards.last';
  OV.register('boards', {
    title: 'Boards (as on Telegram)', group: 'TODAY', icon: 'today',
    coach: [
      { sel: '#ov-boards', text: 'The bot\'s boards, live · switch with the menu at the top of the board' },
      { sel: '#ov-view .ov-ph .ov-btn', text: 'Open a board full screen (it fits a phone too)' },
    ],
    async render(el) {
      let last = 'home';
      try { last = localStorage.getItem(KEY) || 'home'; } catch (e) { /* private window: start at home */ }
      el.innerHTML = `<div class="ov-ph" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px">
          <div><h1 style="margin:0">Boards</h1><div class="ov-note1">The same boards the Telegram bot sends — live from this app</div></div>
          <a class="ov-btn" href="/ottverse/boards/${encodeURIComponent(last)}" target="_blank" rel="noopener">Open full screen ↗</a></div>
        <iframe id="ov-boards" title="OTTVerse boards" src="/ottverse/boards/${encodeURIComponent(last)}"
          style="width:100%;height:calc(100vh - 150px);min-height:640px;border:1px solid var(--line, #E4E4E7);border-radius:16px;background:#fff"></iframe>`;
      const fr = el.querySelector('#ov-boards');
      fr.addEventListener('load', () => {
        try {
          const m = /\/ottverse\/boards\/([a-z0-9-]+)/.exec(fr.contentWindow.location.pathname);
          if (m) localStorage.setItem(KEY, m[1]);
        } catch (e) { /* same origin; ignore */ }
      });
    },
  });
})();

</script>
<script>
/* ---- pages_zz_magic.js ---- */
/* Magic UI effects for OTTVerse (pages_zz_magic.css holds the keyframes) — hand-ported, no framework.
 * BlurFade on cards / KPIs / strips as they appear · AnimatedList on Today's lists and mini tables ·
 * NumberTicker on KPI values · BorderBeam on the hero card (Promote today) · ShimmerButton on the primary action.
 * Pages fill #ov-view after their data arrives, so a MutationObserver (one frame, debounced) applies the classes to
 * new nodes; a node is enhanced once (.mg-done). Nothing runs under prefers-reduced-motion. Never a fetch. */
(function () {
  'use strict';
  const OV = window.OV;
  const view = document.getElementById('ov-view');
  if (!OV || !view) return;
  const reduce = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const SEL_FADE = '.ov-card, .ov-kpi, .ov-strip, .ov-filters, .ov-tabs';
  const SEL_ROW = '.tw-t tbody tr, .ov-mini tbody tr, .ov-newly .it';
  const FADE_MAX = 14, ROW_MAX = 16, TICK_MS = 800;

  /** NumberTicker: the KPI's leading figure counts up from 0 and lands on the exact text it was rendered with.
   *  Grouping (1,234 or the Indian 1,58,873), decimals, a prefix (₹) and a suffix (%, Cr, L, ' of 600') are kept;
   *  a value that is a word (a title, a platform) or zero is left alone. */
  function tick(el) {
    el.classList.add('mg-done');
    const t = el.firstChild;
    if (!t || t.nodeType !== 3) return;
    const m = /^([^\d]*?)(\d[\d,]*)(\.\d+)?(.*)$/.exec(t.nodeValue);
    if (!m) return;
    const num = parseFloat(m[2].replace(/,/g, '') + (m[3] || ''));
    if (!isFinite(num) || num <= 0) return;
    const dec = m[3] ? m[3].length - 1 : 0, pre = m[1], suf = m[4], final = t.nodeValue;
    const grouped = m[2].indexOf(',') >= 0, indian = /\d,\d{2},\d{3}/.test(m[2]);
    const nf = grouped ? new Intl.NumberFormat(indian ? 'en-IN' : 'en-US', { maximumFractionDigits: 0 }) : null;
    const fmtN = v => {
      const f = v.toFixed(dec);
      if (!nf) return f;
      const parts = f.split('.');
      return nf.format(Number(parts[0])) + (parts[1] != null ? '.' + parts[1] : '');
    };
    el.classList.add('mg-tick');
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / TICK_MS), e = 1 - Math.pow(1 - p, 3);
      t.nodeValue = p < 1 ? pre + fmtN(num * e) + suf : final;
      if (p < 1) requestAnimationFrame(step);
    };
    t.nodeValue = pre + fmtN(0) + suf;
    requestAnimationFrame(step);
  }

  let raf = 0;
  function enhance() {
    raf = 0;
    if (reduce()) return;
    let i = 0;
    view.querySelectorAll(SEL_FADE).forEach(el => {
      if (el.classList.contains('mg-done')) return;
      el.classList.add('mg-done', 'mg-fade');
      el.style.setProperty('--mg-i', String(Math.min(i++, FADE_MAX)));
    });
    let j = 0;
    view.querySelectorAll(SEL_ROW).forEach(el => {
      if (el.classList.contains('mg-done')) return;
      el.classList.add('mg-done', 'mg-row');
      el.style.setProperty('--mg-i', String(Math.min(j++, ROW_MAX)));
    });
    view.querySelectorAll('.ov-kpi-v:not(.txt):not(.mg-done)').forEach(tick);
    const hero = view.querySelector('.tw-promote');
    if (hero && !hero.classList.contains('mg-beam')) hero.classList.add('mg-beam');
    document.querySelectorAll('.ov-btn.pri:not(.mg-shimmer)').forEach(b => {
      b.classList.add('mg-shimmer', 'mg-once');
      setTimeout(() => b.classList.remove('mg-once'), 1600);
    });
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(enhance); };
  new MutationObserver(schedule).observe(view, { childList: true, subtree: true });
  if (OV.on) OV.on('route', schedule);
  schedule();
  OV.magic = { enhance, tick };
})();

</script>
