          { id: 'confidence', label: 'Conf.', hide: true, tip: 'Calendar row confidence', render: x => x.confidence ? ui.tag(x.confidence, x.confidence === 'high' ? 'up' : x.confidence === 'medium' ? 'warn' : 'muted') : '—' },
        ],
      });
      el.innerHTML = ui.page({ title: 'Fixtures', subHtml: `<span>India first · rights · bundle</span>${calChip()}`, tip: f.rank_rule || '', filters, kpis, main, table });
    },
  });

  /* ================================================================== CALENDAR */
  const calOpen = r => { if (r.trending_key) OV.openTitle(r.trending_key); else OV.go('title', { q: String(r.title || '').split(',')[0] }); };
  OV.register('calendar', {
    market: false, period: false, periodTip: 'Use the window in the filter bar',
    coach: [
      { sel: '#ov-view .ov-filters', text: 'Kind · language · lane · bundle' },
      { sel: '#ov-view .ov-kpis', text: 'What is coming · what Airtel sells' },

    async render(el, ctx) {
      const P = ctx.params;
      const days = [30, 60, 90, 120].includes(+P.days) ? +P.days : 90;
      const past = P.past === '1' ? 7 : 0;
      el.innerHTML = ui.pageHeader({ title: 'Calendar' }) + ui.skeleton('kpis', 7) + ui.skeleton('page');
      let c; try { [c] = await Promise.all([OV.api.get('/api/ott/calendar', { days, past, kind: P.kind || '', lang: P.lang || '', lane: P.lane || '', bundle: P.bundle || '' }, { ttl: 600 }), OV.fresh.load()]); } catch (e) { if (ctx.alive()) errPage(el, 'Calendar', e); return; }
      if (!ctx.alive()) return;
      const weeks = arr(c.weeks);
      const k = c.kpis || {};
      const labels = c.kind_labels || KIND_L;
      const allRows = weeks.flatMap((w, wi) => arr(w.items).map(r => Object.assign({}, r, { week: w.week, week_label: w.label, wi })));
      const rows = P.wk ? allRows.filter(r => r.week === P.wk) : allRows;
      const fc = c.facets || {};
      const kpis = [
        { label: 'Events', value: k.total, sub: `${fmt.day(c.from)} – ${fmt.day(c.to)}`, tip: 'Dated rows in the release & fixture calendar for the window and filters.' },
        { label: 'Releases', value: k.releases, sub: isNum(k.ott_premieres) && k.ott_premieres ? `${fmt.num(k.ott_premieres)} OTT` : 'theatrical + OTT', tip: 'Theatrical and OTT releases.', go: ['calendar', Object.assign({}, P, { kind: P.kind === 'release' ? '' : 'release' })] },
        { label: 'Matches', value: k.matches, sub: 'fixtures', tip: 'Matches and sports events.', go: ['calendar', Object.assign({}, P, { kind: P.kind === 'match' ? '' : 'match' })] },
        { label: 'Festivals', value: k.festivals, sub: 'viewing peaks', tip: 'Festivals and holidays that lift viewing.', go: ['calendar', Object.assign({}, P, { kind: P.kind === 'festival' ? '' : 'festival' })] },
        { label: 'Promotable', value: k.promotable, sub: `${fmt.num(k.in_bundle)} bundle · ${fmt.num(k.via_pack)} pack`, tip: 'The rights holder streams inside Xstream Play or is sold by Airtel.', go: ['calendar', Object.assign({}, P, { bundle: P.bundle === 'promotable' ? '' : 'promotable' })] },
        { label: 'Rights unknown', value: k.rights_unknown, sub: isNum(k.total) && k.total ? fmt.pct(k.rights_unknown / k.total * 100) + ' of rows' : '', tip: 'No broadcaster or platform named yet.' },
        { label: 'Trending now', value: k.trending_now, sub: 'on Search Trends now', tip: 'Rows whose title or match is on Search Trends now (a same-teams trend counts only for a match today or tomorrow). ' + (c.pair_rule || '') },
      ];
      const filters = ui.filterBar([
        ui.chips('kind', [['', 'All']].concat(arr(fc.kind).map(x => [x.value, labels[x.value] || cap(x.value), x.count])), P.kind || ''),
        '<span class="pa-vsep"></span>',
        ui.select('lane', arr(fc.lane).map(x => [x.value, cap(x.value), x.count]), P.lane, { all: 'Both lanes' }),
        ui.select('lang', arr(fc.lang).map(x => [x.value, x.value === 'multi' ? 'Multi-language' : fmt.langName(x.value), x.count]), P.lang, { all: 'All languages' }),
        ui.select('bundle', [['promotable', 'Promotable', k.promotable]].concat(arr(fc.bundle).map(x => [x.value, (BUNDLE[x.value] || [cap(x.value)])[0], x.count])), P.bundle, { all: 'Any bundle', tip: 'Xstream bundle status' }),
        ui.select('days', [['30', '30 days'], ['60', '60 days'], ['120', '120 days']], days === 90 ? '' : String(days), { all: '90 days', label: 'Window' }),
        ui.toggle('past', 'Last 7 days', past > 0, { tip: 'Also show rows from the past 7 days' }),
        ui.reset(['kind', 'lane', 'lang', 'bundle', 'days', 'past', 'wk'], !!(P.kind || P.lane || P.lang || P.bundle || P.days || P.past || P.wk)),
      ]);
      // main: week-by-week stacked columns (click a week to filter the table)
      const groups = ['release', 'ott_release', 'premiere', 'episode', 'match', 'festival'];
      const mx = Math.max(1, ...weeks.map(w => w.total || 0));
      const bars = weeks.map(w => {
        const segs = groups.filter(g => (w.counts || {})[g]).map(g => `<i style="height:${(w.counts[g] / mx * 100).toFixed(1)}%;background:${KIND_C[g]}" data-tip="${esc((labels[g] || g) + ': ' + w.counts[g])}"></i>`).join('');
        const on = P.wk === w.week;
        return `<button class="pa-wk${on ? ' on' : ''}${P.wk && !on ? ' dim' : ''}" data-set="${jattr({ wk: on ? '' : w.week })}" data-tip="${esc(w.label + ' · ' + fmt.plural(w.total, 'event'))}"><span class="n">${esc(w.total)}</span><span class="bar">${segs}</span><span class="l">${esc(fmt.day(w.week))}</span></button>`;
      }).join('');
      const usedG = groups.filter(g => weeks.some(w => (w.counts || {})[g]));
      const wkCard = ui.card({ title: 'Week by week', icon: 'calendar', tip: 'Events per week (Monday start) by kind. Click a week to filter the table; click again to clear.',
        actions: `<span class="ov-legend">${usedG.map(g => `<span><i style="background:${KIND_C[g]}"></i>${esc(labels[g] || g)}</span>`).join('')}</span>`,
        body: weeks.length ? `<div class="pa-wks">${bars}</div>` : ui.empty('Nothing dated in this window', { action: { label: 'Reset filters', set: { kind: '', lane: '', lang: '', bundle: '' } } }) });
      const hold = {}; rows.forEach(r => { const h = r.platform || 'Not announced'; hold[h] = (hold[h] || 0) + 1; });
      const side = ui.card({ title: 'Who holds them', icon: 'platform', tip: 'Rows per rights holder (first named platform) for the rows below.',
        body: ui.barlist(Object.entries(hold).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([h, n]) => ({ label: h, html: h === 'Not announced' ? `${ui.unk('Rights not announced')} <span>Not announced</span>` : ui.platform(h, { noVia: true }), value: n, color: h === 'Not announced' ? 'var(--flat)' : OV.color.platform(h), go: h !== 'Not announced' && OV.has('platform') ? ['platform', { name: h }] : null })), { empty: 'No rows' }) });
      const main = ui.grid('minmax(0,2.4fr) minmax(0,1fr)', [wkCard, side], { stretch: true });
      const table = ui.table({
        id: 'calendar-main', cls: 'wn', rows, pageSize: 50, csvName: `calendar-${days}d`, search: true, searchPlaceholder: 'Filter titles', noun: 'events', sort: { id: 'date_start', dir: 'asc' },
        onRow: calOpen, rowClass: r => 'pa-wkb' + (r.wi % 2),
        toolbar: `<span><b>${esc(fmt.num(rows.length))}</b> events${P.wk ? ' · week of ' + esc(fmt.day(P.wk)) : ''} · ${esc(fmt.plural(weeks.length, 'week'))}</span>`,
        empty: 'Nothing matches these filters',
        columns: [
          { id: 'week', label: 'Week', hideBelow: 1360, tip: 'Week (Monday start)', render: r => `<span class="ov-note1">${esc(r.week_label)}</span>` },
          { id: 'date_start', label: 'Date', tip: 'Start date (IST) · On now = started, still running', render: r => (onNow(r) ? ui.tag('On now', 'up', 'Started ' + fmt.day(r.date_start) + ', runs to ' + fmt.day(r.date_end)) + ' ' : '') + dateCell(r.date_start, r.days_away) + (r.date_end && r.date_end !== r.date_start ? `<span class="ov-note1" data-tip="Ends">→ ${esc(fmt.day(r.date_end))}</span>` : ''), csv: r => r.date_start },
          { id: 'title', label: 'Title', value: r => r.title, render: r => tcell(Object.assign({}, r, { type: r.type || OV.calType(r.kind_group || r.kind, r.entity_type) }), r.title, metaOf(Object.assign({}, r, { type: r.type || OV.calType(r.kind_group || r.kind, r.entity_type) }, r.multi_language ? { language: null, lang: null } : {}), r.multi_language ? 'Multi-language' : ''), [r.lane ? cap(r.lane) + ' lane' : '', r.detail || '']), csv: r => r.title },
          { id: 'kind', label: 'Kind', value: r => r.kind_group, render: r => ui.kindBadge(r.kind), csv: r => r.kind },
          { id: 'language', label: 'Lang', hideBelow: 1180, render: r => r.language ? ui.lang(r.language) : r.multi_language ? ui.tag('Multi', 'muted', 'Several languages') : ui.unk('Language unknown') },
          { id: 'platform', label: 'Rights', tip: 'Rights holder (✓ Xstream · ◐ partner · ✕ rival · — unknown)', value: r => r.platform, render: r => r.platform ? avPlatform(r.platform, r.availability) + (arr(r.platforms).length > 1 ? ' ' + ui.tag('+' + (r.platforms.length - 1), 'muted', r.platforms.slice(1).join(', ')) : '') : ui.unk(r.rights_or_platform || 'Rights not announced'), csv: r => arr(r.platforms).join(' + ') },
          { id: 'bundle', label: 'Xstream', tip: 'Xstream bundle status (calendar)', value: r => ({ in_bundle: 2, via_pack: 1 })[r.bundle] || 0, render: r => bundleTag(r.bundle), csv: r => r.bundle },
          { id: 'trending', label: 'Trending', hideBelow: 1180, tip: 'On the latest trending board', value: r => (r.trending || {}).heat, render: r => r.trending ? `<span class="pa-trd">${ui.verdict(r.trending.verdict)}<span class="ov-note1">${isNum(r.trending.rank) ? '#' + esc(r.trending.rank) : ''}</span></span>` : '<span class="ov-unk" data-tip="Not on the latest board">—</span>', csv: r => r.trending ? 'yes' : '' },
          { id: 'source_url', label: 'Source', sort: false, hideBelow: 1280, render: r => OV.safeUrl(r.source_url) ? srcLink(r.source_url) : '—', csv: r => r.source_url },
          { id: 'confidence', label: 'Conf.', hide: true, tip: 'Calendar row confidence', render: r => r.confidence ? ui.tag(r.confidence, r.confidence === 'high' ? 'up' : r.confidence === 'medium' ? 'warn' : 'muted') : '—' },
        ],

      el.innerHTML = ui.page({ title: 'Calendar', subHtml: `<span>Next ${esc(days)} days · releases, matches, festivals</span>${calChip()}`, tip: c.source || '', filters, kpis, main, table });
    },
  });
})();

</script>
<script>
/* ---- pages_b.js ---- */
/* =====================================================================================================
   OTTVerse Trends — pages B: Share of Search · Platform Overview · Opportunities · Alerts · Reports · Watchlists ·
   Data & Method, plus the legal-gated placeholders (Keyword / SERP / AI Search: registered, hidden from the nav).
   Spec: docs/OTTVERSE_SPEC.md §3–§4. Built only from window.OV (docs/OTTVERSE_COMPONENTS.md).
   House rules: every server string goes through esc / ui.*; unknown is "—"; no paragraph (explanations live in
   tooltips); the only spend here is the share-of-search refresh, behind OV.arm (price on the button, two clicks).
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const D = OV.data;
  const jattr = o => esc(JSON.stringify(o));
  const enc = encodeURIComponent;
  const PB = { reopenOpp: null };

  /* ================================================================== shared helpers */
  const isX = n => /xstream/i.test(String(n || ''));
  const brandColor = n => isX(n) ? OV.color.xs : OV.color.platform(n);   // Xstream: one highlight colour everywhere
  const squash = s => OV.norm(s).replace(/\s+/g, '');
  const vIdx = c => { const i = OV.V_ORDER.indexOf(c); return i < 0 ? 99 : i; };
  const pct1 = v => isNum(v) ? fmt.dec(v, 1) + '%' : '—';
  const sum = a => a.reduce((s, x) => s + (isNum(x) ? x : 0), 0);
  const mean = a => { const v = a.filter(isNum); return v.length ? sum(v) / v.length : null; };
  const countBy = (list, f) => { const o = {}; list.forEach(x => { const k = f(x); if (k != null && k !== '') o[k] = (o[k] || 0) + 1; }); return o; };
  const dayAway = n => !isNum(n) ? '' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : n > 0 ? 'in ' + n + 'd' : -n + 'd ago';
  const hours = h => !isNum(h) ? '—' : h >= 48 && h % 24 === 0 ? (h / 24) + ' d' : h + ' h';
  const failPage = (el, ctx, title, e) => { if (ctx.alive()) el.innerHTML = ui.page({ title, main: ui.error(e) }); };
  const loading = (el, title, sub) => { el.innerHTML = ui.pageHeader({ title, subtitle: sub || '' }) + ui.skeleton('page'); };
  // THE ROW RULE (docs/OTTVERSE_DESIGN_SYSTEM.md §3): thumb · full name · ONE meta line; the rest on hover
  const tcell = (row, name, meta, tip) => ui.nameCell(row, { name, meta: meta != null ? meta : OV.rowMeta(row), tip: arr(tip).filter(Boolean).join('\n') });
  const ncell = (name, meta, tip) => ui.nameCell({ name }, { name, meta: meta || '', tip: tip || '', noThumb: true });
  // the calendar kind as a word ("OTT", "Release", "Cricket") for a meta line
  const kindWord = k => String(ui.kindBadge(k) || '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&');
  const calMeta = r => [kindWord(r.kind), r.language ? fmt.langName(r.language) : ''].filter(Boolean).join(' · ');
  // the row to draw a picture for: the board row (qid, type) under the item's own name
  const thRow = (bi, key, name, type) => Object.assign({}, (bi && bi[key]) || {}, { key, name, title: name, type: type || ((bi && bi[key]) || {}).type || 'other' });
  const calRow = r => Object.assign({}, r, { type: r.type || OV.calType(r.kind_group || r.kind, r.entity_type) });
  const dot = (on, tip) => `<i class="pb-dot${on ? ' on' : ''}" data-tip="${esc(tip)}"></i>`;
  const BUNDLE = { 'in bundle': ['In bundle', 'up'], 'via pack': ['Via pack', 'info'], 'via plan': ['Via plan', 'info'], 'not in bundle': ['Rival', 'down'], rival: ['Rival', 'down'] };
  const bundleTag = b => { const d = BUNDLE[String(b || '').toLowerCase()] || ['Unknown', 'muted']; return ui.tag(d[0], d[1], 'Xstream bundle status (release calendar)'); };
  const rightsCell = (r, o) => (r.platform || (r.rights_or_platform && !/not yet|unknown/i.test(r.rights_or_platform))) ? ui.platform(r.platform || r.rights_or_platform, Object.assign({ noVia: true }, o || {})) : ui.unk(r.rights_or_platform || 'Rights unknown');
  // type + language of a trend key, read from the latest national board (one row per thing)
  async function boardIndex() {
    try {
      const R = await D.rows({ scope: 'IN' });
      const m = {};
      arr(R && R.items).forEach(it => { if (it && it.key && !m[it.key]) m[it.key] = it; });
      return m;
    } catch (e) { return {}; }
  }
  const groupType = g => /^fixture:/.test(g || '') ? 'sports_event' : /^platform:/.test(g || '') ? 'platform' : null;
  // the raw search query, when it differs from the name: hover only (never under the name)
  const keyNote = (name, key) => key && OV.norm(name) !== OV.norm(key) ? 'Search: ' + key : '';

  /* ================================================================== platform vocabulary */
  const ROUTE_L = { xstream_play: ['In Xstream Play', 'up', 'Streams inside the Xstream Play app'], pack: ['Via pack', 'info', 'Sold in an Airtel pack'], plan: ['Via plan', 'info', 'Included in Airtel plans'] };
  function statusTags(p, o) {
    if (!p) return ui.unk('Not in the partner list');
    const st = p.partner_status;
    const s = st === 'own' ? ui.tag('Own', 'brand', 'Airtel’s own platform') : st === 'partner' ? ui.tag('Partner', 'up', 'Sold by Airtel' + (p.pack ? ' · ' + p.pack : ''))
      : st === 'no' ? ui.tag('Rival', 'down', 'Not sold by Airtel') : ui.tag('Unknown', 'muted', 'Not on Airtel’s verified partner pages');
    const r = st !== 'own' && p.route && ROUTE_L[p.route] ? ui.tag(ROUTE_L[p.route][0], ROUTE_L[p.route][1], [ROUTE_L[p.route][2], p.pack || ''].filter(Boolean).join(' · ')) : '';
    const v = o && o.verified && p.verified === false ? ui.tag('unverified', 'warn', 'Not confirmed on Airtel’s partner pages') : '';
    return `<span class="pb-tags">${s}${r}${v}</span>`;
  }

  /* ================================================================== share-of-search maths (from the cached result) */
  function shareSeries(brands) {
    const days = Array.from(new Set(brands.flatMap(b => arr(b.trend).map(p => p.date)))).filter(Boolean).sort();
    const val = {};
    brands.forEach(b => { const m = val[b.name] = {}; arr(b.trend).forEach(p => { if (isNum(p.value)) m[p.date] = p.value; }); });
    const tot = days.map(d => sum(brands.map(b => val[b.name][d])));
    const share = {}, index = {};
    brands.forEach(b => {
      index[b.name] = days.map(d => isNum(val[b.name][d]) ? val[b.name][d] : null);
      share[b.name] = days.map((d, i) => isNum(val[b.name][d]) && tot[i] ? val[b.name][d] / tot[i] * 100 : null);
    });
    return { days, share, index };
  }
  const ma7 = v => v.map((_, i) => mean(v.slice(Math.max(0, i - 6), i + 1)));
  // rank by the last 30 days vs rank by the 60 before (both straight from the server's recent / prior shares)
  function rankShift(brands, name) {
    const rk = key => { const s = brands.filter(b => isNum(b[key])).sort((a, b) => b[key] - a[key]); const i = s.findIndex(b => b.name === name); return i < 0 ? null : i + 1; };
    const now = rk('recent_share_pct'), was = rk('prior_share_pct');
    return isNum(now) && isNum(was) ? { now, was, delta: was - now } : null;
  }
  function divBars(rows) {
    const list = rows.filter(r => isNum(r.v));
    if (!list.length) return ui.empty('No change measured');
    const mx = Math.max(...list.map(r => Math.abs(r.v))) || 1;
    return `<div class="pb-div">${list.map(r => {
      const w = Math.min(50, Math.abs(r.v) / mx * 50);
      return `<div class="pb-div-r${r.go ? ' go' : ''}"${r.go ? ` data-go="${esc(r.go[0])}" data-params="${jattr(r.go[1] || {})}"` : ''}${r.tip ? ` data-tip="${esc(r.tip)}"` : ''}><span class="lb">${r.html || esc(r.label)}</span><span class="tr"><i class="${r.v >= 0 ? 'p' : 'n'}" style="${r.v >= 0 ? 'left:50%' : 'right:50%'};width:${w.toFixed(1)}%"></i></span><span class="vl ${r.v > 0 ? 'up' : r.v < 0 ? 'down' : ''}">${esc(fmt.signed(r.v, ' pp', 1))}</span></div>`;
    }).join('')}</div>`;
  }

  /* ================================================================== SHARE OF SEARCH */
  OV.actions.sosRefresh = (arg, el) => OV.arm(el, `Spend ${el.getAttribute('data-cost') || 'paid'}? Click again`, async () => {
    el.disabled = true; el.innerHTML = OV.icon('clock') + 'Refreshing…';
    try {
      const r = await OV.api.post('/api/live/competitor/refresh', {});
      OV.toast('Share of search refreshed' + (r && isNum(r.cost_usd) ? ' · ' + fmt.usd(r.cost_usd, 3) : ''));
    } catch (e) {
      const spent = e.body && isNum(e.body.cost_usd) && e.body.cost_usd > 0 ? ' · spent ' + fmt.usd(e.body.cost_usd, 3) : '';
      OV.toast((e.status === 409 ? 'Refreshed recently' : (e.detail || 'Refresh failed')) + spent, 'down');
    }
    OV.api.clear('/api/live/'); OV.api.clear('/api/ott/');
    OV.refresh();
  });
  function refreshBtn(comp) {
    const rf = (comp && comp.refresh) || {};
    const cost = isNum(rf.estimate_usd) ? '≈' + fmt.usd(rf.estimate_usd, 3) : 'paid';
    const ok = rf.configured !== false && rf.allowed !== false;
    const tip = rf.configured === false ? 'DataForSEO is not configured' : rf.allowed === false ? 'Next refresh allowed ' + (rf.next_allowed_at_ist || fmt.ist(rf.next_allowed_at)) + (isNum(rf.gap_days) ? ` (one per ${fmt.num(rf.gap_days)} days)` : '')
      : `Paid: ${isNum(rf.tasks) ? rf.tasks + ' ' : ''}DataForSEO Google Trends tasks · ${cost} · click twice`;
    return `<button class="ov-btn sm${ok ? ' pri' : ''}" data-act="sosRefresh" data-cost="${esc(cost)}" data-tip="${esc(tip)}"${ok ? '' : ' disabled'}>${OV.icon('run')}Refresh · ${esc(cost)}</button>`;
  }
  const compFresh = comp => OV.fresh.competitor(comp);
  const compDot = comp => { const fr = compFresh(comp); return fr ? ui.freshDot(fr, 'Google Trends via DataForSEO') : ''; };
  function sosStrip(comp) {
    const w = comp.window || {}, an = comp.anchor || {};

    return `<div class="ov-strip">
      <span class="it">${compDot(comp)}<b>${esc(fmt.ago(comp.fetched_at))}</b><span data-tip="${esc(comp.fetched_at_ist || '')}">since refresh</span>${fr && w.to ? ui.asOf(fr, { text: 'data to ' + fmt.day(w.to), tip: 'Last day in the window' }) : ''}</span>
      <span class="it" data-tip="What the last refresh cost (tracker ledger)">Cost <b>${esc(isNum(comp.cost_usd) ? fmt.usd(comp.cost_usd, 3) : '—')}</b></span>
      <span class="it" data-tip="Every task repeats the anchor so all tasks share one scale">Anchor <b>${esc(an.brand || '—')}</b></span>
      <span class="it" data-tip="${esc((w.label || '') + ' · Δ = last 30 days vs the 60 before')}">Window <b>${esc(w.from ? fmt.day(w.from) + ' – ' + fmt.day(w.to) : (w.label || '—'))}</b></span>
      <span class="sp"></span>${refreshBtn(comp)}</div>`;
  }

        { label: 'Top gainer', value: g0 ? g0.brand : null, delta: g0 ? g0.delta_pp : null, deltaUnit: 'pp', sub: g0 && isNum(g0.recent_share_pct) ? `${pct1(g0.prior_share_pct)} → ${pct1(g0.recent_share_pct)}` : '', tip: 'Largest share gain: last 30 days vs the 60 before.', unkTip: 'No brand gained share', go: g0 ? ['platform', { name: g0.brand }] : null },
        { label: 'Top loser', value: l0 ? l0.brand : null, delta: l0 ? l0.delta_pp : null, deltaUnit: 'pp', sub: l0 && isNum(l0.recent_share_pct) ? `${pct1(l0.prior_share_pct)} → ${pct1(l0.recent_share_pct)}` : '', tip: 'Largest share loss: last 30 days vs the 60 before.', unkTip: 'No brand lost share', go: l0 ? ['platform', { name: l0.brand }] : null },

        body: ui.line({ series, x: S.days, time: true, h: 260, fmt: yf, tipFmt: mode === 'index' ? (v => fmt.dec(v, 1)) : pct1, pins: w.split ? [{ x: w.split, label: 'Δ window starts (last 30 days)', kind: 'window_end' }] : [] }) });
      const donutCard = ui.card({ title: '90-day share', icon: 'sos', tip: 'Average index ÷ sum, past 90 days. Δ: last 30 days vs the 60 before.',
        body: ui.donut(brands.map(b => ({ label: b.name, value: b.share_pct, highlight: isX(b.name), color: brandColor(b.name), go: ['platform', { name: b.name }],
          extra: isNum(b.delta_pp) ? ' ' + ui.delta(b.delta_pp, { unit: 'pp', chip: false, title: `${pct1(b.prior_share_pct)} → ${pct1(b.recent_share_pct)}` }) : '' })),
        { size: 150, hasHighlight: !!xs, center: xs ? pct1(xs.share_pct) : pct1(top.share_pct), centerSub: xs ? 'Xstream' : top.name, fmt: pct1 }) });
      const chgCard = ui.card({ title: 'Share change', icon: 'up', tip: 'Last 30 days vs the 60 before, percentage points.',
        body: divBars(brands.slice().sort((a, b) => (b.delta_pp || 0) - (a.delta_pp || 0)).map(b => ({ label: b.name, html: `<i class="pb-sw" style="background:${brandColor(b.name)}"></i>${esc(b.name)}`, v: b.delta_pp, go: ['platform', { name: b.name }], tip: `${b.name}: ${pct1(b.prior_share_pct)} → ${pct1(b.recent_share_pct)}` }))) });
      const mv = {};
      leaders.forEach(l => { mv[l.geo] = { v: l.value, lines: [`Leader: ${l.brand}`, isNum(l.value) ? `${fmt.dec(l.value, 1)}% of the brands’ interest` : '', l.complete === false ? 'Not every brand had a value' : ''].filter(Boolean) }; });
      const mapCard = ui.card({ title: 'State leaders', icon: 'regions', tip: 'Leading brand per state; colour = the leader’s share of the brands’ interest there.',
        badge: ledBrands.length ? ui.tag(ledBrands[0] + ' ' + led[ledBrands[0]] + '/' + leaders.length, 'muted', 'States led') : '',
        body: leaders.length ? ui.map(mv, { mini: true, legendLabel: 'leader share %', label: 'Leading OTT brand by state' })
          + `<div class="ov-legend" style="margin-top:6px">${ledBrands.map(b => `<span><i style="background:${brandColor(b)}"></i>${esc(b)} <b>${esc(led[b])}</b></span>`).join('')}</div>` : ui.empty('No state map in this refresh') });
      const volCard = ui.card({ title: 'Searches / month', icon: 'search', tip: 'Google Ads monthly searches for each brand term, India (weekly task). — = not fetched yet, never 0.',

      const cTrust = ui.card({ title: 'Trust marks', icon: 'question', tip: 'How the screens say what they know.',
        body: `<dl class="ov-kv"><dt>${ui.unk((om && om.unknown) || 'Unknown')}</dt><dd data-tip="No figure from the source: shown as —, never as 0">No figure · never 0</dd>
          <dt>${ui.sourceDot({ name: 'ok', state: 'ok' })}</dt><dd>Fresh</dd><dt>${ui.sourceDot({ name: 'warn', state: 'warn' })}</dt><dd data-tip="Past its amber age limit">Ageing</dd><dt>${ui.sourceDot({ name: 'bad', state: 'bad' })}</dt><dd data-tip="Past its red age limit, or the last call failed">Stale / failed</dd><dt>${ui.sourceDot({ name: 'off', state: 'off' })}</dt><dd>Not configured</dd>

      const stDot = s => s.status === 'ok' ? 'ok' : s.status === 'not_configured' || s.status === 'never' ? 'off' :['cooling', 'stale', 'partial'].includes(s.status) ? 'warn' : 'bad';

          { id: 'calls', label: 'Calls', num: true, tip: 'Calls this month', value: s => s.m.calls, render: s => isNum(s.m.calls) ? esc(fmt.num(s.m.calls)) : ui.unk() },

/* =====================================================================================================
   OTTVerse Trends — the free refresh (docs/OTTVERSE_SPEC.md §5 "Free refresh"): the header button, the Search Trends
   "fresh as of" strip with "Refresh now · Free", and the LIVE strip (Overview + Search Trends) during a big match.
   Free only: Google's official Trending-now RSS (/api/ott/free/*). It never spends, so it has no confirm step —
   and it never looks like the paid "Run scan" (red, confirm, "n of 2 today").
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  const D = OV.data;
  D.freeStatus = force => OV.api.get('/api/ott/free/status', null, { ttl: 20, force: !!force });
  D.live = () => OV.api.get('/api/ott/free/live', { scope: OV.state.market || 'IN' }, { ttl: 60 });
  let ST = null, timer = null, mine = false, wasRunning = false;
  const hhmm = ts => isNum(ts) ? fmt.time(ts) : '—';
  const PAGES = ['overview', 'charts'];

  /* ---------------- header button (beside the "Last scan" pill) */
  function headBtn() {
    let b = document.getElementById('ov-free');
    if (b || OV.offline) return b;
    const live = document.getElementById('ov-live');
    if (!live) return null;
    live.insertAdjacentHTML('afterend', '<button class="ov-freebtn hd" id="ov-free" data-act="freeRefresh" aria-label="Free refresh"></button>');
    return document.getElementById('ov-free');
  }
  function tipOf(s) {
    if (!s) return 'Free refresh · Google’s official Trending-now RSS';
    const l = s.last;
    return [s.running ? 'Refreshing now…' : l ? `Fresh as of ${l.finished_ist || '—'}` : 'No free refresh yet',
      l ? `${l.geos_ok}/${l.geos_total} lists · ${fmt.plural(l.calls || 0, 'free call')}` : '',
      s.enabled ? `Next: ${s.next_due_ist || '—'}${s.live_mode ? ' (live match: every 15 min)' : ' (hourly)'}` : 'Hourly job off (XST_FREE_REFRESH=0)',
      s.next_allowed_at ? `Refresh now: after ${hhmm(s.next_allowed_at)} (10-min cooldown)` : 'Click: refresh now · free, no confirm',
      s.backoff_until ? `Google’s feeds failed · retry after ${hhmm(s.backoff_until)}` : '',
      s.deferred ? 'Waiting: ' + s.deferred.reason : '',
      'Never SerpApi or DataForSEO · never one of the 2 daily scans'].filter(Boolean).join('\n');
  }
  function btnHtml(s) {
    const run = s && s.running, l = s && s.last;
    return `<span class="ic${run ? ' spin' : ''}">${OV.icon('run')}</span><span>${run ? 'Refreshing' : l ? hhmm(l.finished_at) : 'Refresh'}</span><span class="ov-free-tag">FREE</span>`;
  }
  function paint() {
    if (ABSENT) return;
    const b = headBtn();
    if (b) { b.innerHTML = btnHtml(ST); b.setAttribute('data-tip', tipOf(ST)); b.disabled = !!(ST && ST.running); b.classList.toggle('live', !!(ST && ST.live_mode)); }
    document.querySelectorAll('.ov-freebtn.st').forEach(x => { x.innerHTML = `<span class="ic${ST && ST.running ? ' spin' : ''}">${OV.icon('run')}</span>${ST && ST.running ? 'Refreshing…' : 'Refresh now'}<span class="ov-free-tag">FREE</span>`; x.disabled = !!(ST && ST.running); x.setAttribute('data-tip', tipOf(ST)); });
  }
  let ABSENT = false;           // a server without /api/ott/free (not restarted yet): no button, no strips
  async function poll(force) {
    clearTimeout(timer);
    try { ST = await D.freeStatus(force); } catch (e) {
      if (e.status === 404 || e.status === 405) { ABSENT = true; const b = document.getElementById('ov-free'); if (b) b.remove(); document.querySelectorAll('.ov-fx').forEach(n => n.remove()); return; }
      ST = ST || null;
    }
    paint();
    const running = !!(ST && ST.running);
    if (wasRunning && !running) finished();
    wasRunning = running;
    timer = setTimeout(() => poll(true), running ? 3000 : 60000);
  }
  function finished() {
    OV.api.clear('/api/ott/');
    const l = ST && ST.last;
    if (mine) OV.toast(l ? `Fresh as of ${hhmm(l.finished_at)} · ${l.geos_ok}/${l.geos_total} lists · free` : 'Free refresh finished');
    if (mine && OV.ctx && PAGES.includes(OV.ctx.id)) OV.refresh();
    mine = false;
  }
  OV.actions.freeRefresh = async (arg, el) => {
    if (el) el.disabled = true;
    let r;
    try { r = await OV.api.post('/api/ott/free/refresh'); }
    catch (e) { OV.toast((e.body && e.body.note) || e.detail || 'Refresh not started', 'down'); if (el) el.disabled = false; poll(true); return; }
    if (r.status === 'fresh') { OV.toast(`${r.note || 'Fresh'} · next refresh after ${r.next_allowed_ist ? r.next_allowed_ist.split(', ')[1].replace(' IST', '') : '10 min'}`); if (el) el.disabled = false; }
    else { mine = true; OV.toast(r.status === 'running' ? 'A free refresh is already running · joined it' : 'Free refresh started · Google RSS, about a minute'); }
    poll(true);
  };

  /* ---------------- LIVE strip (Overview, Search Trends): hidden when no big match is in its window */
  // compact: the time only; what it means (source time vs the usual start) is on hover
  const WIN_TXT = m => m.basis === 'source' ? `${hhmm(m.start_ts)}–≈${hhmm(m.est_end_ts)}` : m.basis === 'typical' ? `≈${hhmm(m.start_ts)}` : 'Today';
  const WIN_TIP = m => (m.basis === 'source' ? `Starts ${hhmm(m.start_ts)} IST · ends ≈${hhmm(m.est_end_ts)}` : m.basis === 'typical' ? `Match day · usual start ${hhmm(m.start_ts)} IST` : 'Match day');
  function liveStrip(L) {
    const ms = arr(L && L.matches);
    if (!ms.length) return '';
    const one = m => {
      const pts = arr(m.points), hs = pts.map(p => p.heat);
      const sparkTip = 'Heat of its trends at each free refresh\n' + pts.map(p => `${p.hhmm}: ${isNum(p.heat) ? fmt.dec(p.heat, 0) : 'not on the lists'}`).join('\n');
      const sp = hs.some(isNum) ? ui.spark(hs, { w: 84, h: 22, color: 'var(--teal)', area: true, tip: sparkTip }) : ui.unk('Not on Google’s lists yet at any free refresh in this window');
      const st = arr(m.states), shown = st.slice(0, 5);
      const statesTip = st.length ? 'Trending in (latest free refresh)\n' + st.map(g => fmt.geo(g)).join('\n') : 'On no state list at the latest free refresh';
      const top = arr(m.trends)[0];
      const open = top ? `data-title-key="${esc(top.key)}"` : `data-go="title" data-params="${esc(JSON.stringify({ q: m.title }))}"`;
      return `<div class="lm" ${open} tabindex="0">
        ${ui.thumb(Object.assign({}, m, { name: m.title, type: 'sports_event' }))}<span class="nm" data-tip="${esc(m.title)}">${esc((m.teams || []).length === 2 ? m.teams.join(' v ') : m.title)}</span>
        ${ui.tag(m.reason || 'Big match', 'teal', m.title)}
        <span class="win" data-tip="${esc(WIN_TIP(m) + '\n' + (m.basis_note || '') + '\nWindow ' + (m.from_ist || '') + ' → ' + (m.to_ist || ''))}">${OV.icon('clock')}${esc(WIN_TXT(m))}</span>
        ${m.rights ? ui.platform(m.rights, { short: true, noVia: true }) : ui.unk('Rights not on the calendar')}
        ${sp}<span class="ht" data-tip="Heat 0–100 of its trends at the latest free refresh (no growth: the RSS has none)">${isNum(m.heat) ? fmt.dec(m.heat, 0) : '—'}</span>
        <span class="sts" data-tip="${esc(statesTip)}">${st.length ? `<b>${esc(st.length)}</b> states` : '<b>0</b> states'}</span>
      </div>`;
    };
    return `<div class="ov-livestrip ov-fx" role="status"><span class="ov-livebadge" data-tip="${esc((L.rule || '') + '\nRefreshing every 15 min (free RSS) · no score source is used')}"><i></i>LIVE</span>${ms.map(one).join('')}</div>`;
  }

  /* ---------------- Search Trends "fresh as of" strip */
  // counted as the table shows rows: a match's extra spellings / players mirroring it fold into one row
  const isSpelling = it => !!(it.fold_lead || (it.fixture && it.fixture.is_primary === false));
  function freeStrip(fr, scan, items) {
    const one = arr(items).filter(it => !isSpelling(it));
    const nOn = one.filter(it => it.now && it.now.on).length, nAdd = one.filter(it => it.source === 'free-rss').length;
    const btn = '<button class="ov-freebtn st" data-act="freeRefresh"></button>';
    if (!fr) return `<div class="ov-strip ov-fx ov-freestrip"><span class="it" data-tip="No free refresh yet"><span class="ov-fdot off"></span><b>Google RSS</b> —</span><span class="sp"></span>${btn}</div>`;
    const sid = scan && scan.id ? 'scan #' + scan.id : 'the scan';
    if (!fr.newer_than_scan) return `<div class="ov-strip ov-fx ov-freestrip"><span class="it" data-tip="${esc('Free refresh ' + (fr.finished_ist || '') + ' is older than ' + sid + ': the table is the scan')}"><span class="ov-fdot"></span><b>Google RSS</b> ${esc(hhmm(fr.finished_at))}</span>${ui.tag(sid + ' newer', 'muted', 'The table is the scan')}<span class="sp"></span>${btn}</div>`;
    const failed = arr(fr.geos_failed);
    return `<div class="ov-strip ov-fx ov-freestrip">
      <span class="it" data-tip="${esc('Free refresh ' + (fr.finished_ist || '') + ' · Google’s official Trending-now RSS (about 10 per list)')}"><span class="ov-fdot ok"></span><b>Google RSS</b> <b>${esc(hhmm(fr.finished_at))}</b></span>
      <span class="it" data-tip="${esc(failed.length ? 'Lists that failed: ' + failed.join(', ') : 'India + 36 states')}">${esc(fr.geos_ok)}/${esc(fr.geos_total)} lists</span>
      <button class="it lk" data-set='${esc(JSON.stringify({ onnow: '1' }))}' data-tip="${esc('Rows of ' + sid + ' still on a Google list now, plus rows that reached the lists after it')}"><b>${esc(fmt.num(nOn))}</b> on lists</button>
      <span class="it" data-tip="${esc('Trends on Google’s lists now that were not on ' + sid + ' · marked RSS in the table · scan-only fields (growth) —')}"><b>+${esc(fmt.num(nAdd))}</b> new</span>
      <span class="sp"></span>${btn}</div>`;
  }

  OV.on('rendered', async ctx => {
    if (!PAGES.includes(ctx.id) || OV.offline || ABSENT) return;
    const nowTab = ctx.id === 'charts' && !ctx.params.win;
    const cat = ['entertainment', 'sports'].includes(ctx.params.cat) ? ctx.params.cat : 'all';
    const [L, C] = await Promise.all([D.live().catch(() => null), nowTab ? D.charts({ cat }).catch(() => null) : null]);
    if (!ctx.alive()) return;
    const view = document.getElementById('ov-view');
    const ph = view && view.querySelector('.ov-ph');
    if (!ph) return;
    view.querySelectorAll('.ov-fx').forEach(n => n.remove());
    const html = liveStrip(L) + (nowTab && C ? freeStrip(C.free, C.scan, C.items) : '');
    if (html) ph.insertAdjacentHTML('afterend', html);
    paint();
  });
  OV.on('scan', () => { OV.api.clear('/api/ott/free/'); });

  if (!OV.offline) setTimeout(() => poll(false), 300);
})();

</script>
<script>
/* ---- pages_reading.js ---- */
/* =====================================================================================================
   OTTVerse Trends — Wikipedia Attention (TRENDS · #/reading). Built only from window.OV
   (docs/OTTVERSE_COMPONENTS.md) on /api/ott/reading* (ott/reading.py).

   The method is the ETCC "This Morning" board's: Indian-language reads (7 Indic Wikipedia editions) rank the rows;
   English from India is a separate ceiling (per-country list); English worldwide is shown and kept out. "≥" = a floor
   from the daily most-read lists (no 60-day curve yet). Stage, zone, agreement and confidence come from the server.

   House rules kept here: header → filters → KPIs → main visual (movers + two ladders) → dense table (CSV). No paragraph;
   definitions live in tooltips. Every server string goes through esc() or a ui.* component. Unknown is "—" with the
   reason on hover. The refresh is free (Wikimedia + Wikidata) and gated server-side to once per 6 h; Google Trends in
   the drawer is STORED data only — this page never spends.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  OV.icons.reading = '<path d="M3 5.5c3-1.2 6-1 9 1 3-2 6-2.2 9-1v13c-3-1.2-6-1-9 1-3-2-6-2.2-9-1z"/><path d="M12 6.5v13"/>';

  const ED = { en: 'English', hi: 'Hindi', ta: 'Tamil', te: 'Telugu', kn: 'Kannada', ml: 'Malayalam', mr: 'Marathi', bn: 'Bengali', gu: 'Gujarati', pa: 'Punjabi', or: 'Odia', as: 'Assamese', bh: 'Bhojpuri' };
  const INDIC = ['hi', 'ta', 'te', 'kn', 'ml', 'mr', 'bn', 'gu', 'pa', 'or', 'as', 'bh'];
  const ED_C = { hi: 'var(--orange)', ta: 'var(--teal)', te: 'var(--cyan)', kn: 'var(--lime)', ml: 'var(--blue)', mr: 'var(--violet)', bn: 'var(--pink)', gu: 'var(--amber)', pa: 'var(--down)', or: 'var(--up)', as: 'var(--teal-ink)', bh: 'var(--violet-ink)', en: 'var(--slate)' };
  let LENS = {};                     // d.lens: the language list, the picked edition's honesty note, the Google chip's window
  const STAGE_T = { 'At peak': 'violet', Building: 'up', Cooling: 'down', Elevated: 'up', Steady: 'info', Faded: 'muted', New: 'new', 'Floor only': 'muted', 'No stage word': 'muted' };
  const ZONE_T = { south: 'teal', hindi: 'warn', both: 'violet', marathi: 'info', bengali: 'pink', low: 'muted', en: 'muted' };
  const CONF_T = { High: 'up', Med: 'info', Low: 'muted' };
  const LANES = [['', 'Both'], ['entertainment', 'Entertainment'], ['sports', 'Sport']];
  const API = '/api/ott/reading';
  let RULES = {};
  let AUTO_TRIED = false, POLL = null, DAYS = [], LANG = '';

  /* ------------------------------------------------------------------ small cells */
  const num = (r, v, floor) => isNum(v) ? `${floor ? '<small class="rd-ge">≥</small>' : ''}${esc(fmt.num(v))}` : ui.unk('No figure');
  /* the language lens: with an edition picked, reads / change / stage / trend come from THAT edition (r.ed) */
  const EV = r => (LANG && r.ed) ? r.ed : null;
  const reads = r => { const e = EV(r); return e ? num(r, e.reads, e.floor) : num(r, r.ind7, r.ind_floor); };
  const stageTag = r => { const e = EV(r), s = e ? e.stage : r.stage, w = e ? e.stage_why : r.stage_why; return ui.tag(s, STAGE_T[s] || 'muted', s + ': ' + (w || '')); };
  const gChip = r => {
    const g = r.google_home; if (!g || !arr(g.states).length) return '';
    const st = arr(g.states), lab = st.length <= 2 ? st.map(s => s.geo.slice(3) + (isNum(s.rank) ? ' #' + s.rank : '')).join(' · ') : `${st.length} of ${g.of} states`;
    const tip = [`On Google in ${ED[LANG] || ''} home states · last 24 h`].concat(st.map(s => `${s.name}${isNum(s.rank) ? ' #' + s.rank : ''} · ${s.hhmm} IST`)).concat(g.elsewhere ? [`also on ${g.elsewhere} other state list${g.elsewhere > 1 ? 's' : ''}`] : []).concat([((LENS.rules || {}).google || '')]).join('\n');
    return `<span class="rd-gchip" data-tip="${esc(tip)}">G · ${esc(lab)}</span>`;
  };
  const gHomeCsv = r => arr((r.google_home || {}).states).map(s => `${s.geo.slice(3)}${isNum(s.rank) ? ' #' + s.rank : ''} ${s.hhmm}`).join('; ');
  const zoneTag = r => ui.tag(r.zone_word || '—', ZONE_T[r.zone] || 'muted', (RULES.zone || '') + (r.share_ok ? `\nSouth ${Math.round((r.south_share || 0) * 100)}% · Hindi ${Math.round((r.hindi_share || 0) * 100)}%` : ''));
  const confTag = r => ui.tag(r.conf, CONF_T[r.conf] || 'muted', 'Reading confidence: ' + r.conf + '\n' + (r.conf_why || '') + '\n' + (RULES.confidence || ''));
  // short = the ladder's compact form ("1/2 rising"); the full sentence is on hover either way
  const agreeTxt = (r, short) => { const a = r.agreement || {}; return `<span class="rd-agree${a.n ? ' on' : ''}" data-tip="${esc((a.text || 'quiet') + '\n' + (RULES.agreement || ''))}">${a.n ? esc(a.n + (short ? '/' : ' of ') + a.of + ' rising') : 'quiet'}</span>`; };
  /* English from India: '≤ x' only when on India's list every stored day; on some days only it is a RANGE (a day off
   *  the list is unknown, 0 up to that day's cutoff), never a ceiling (audit 3 Oct: '≤ 1,500' for 1 of 7 days) */
  const enIn = r => {
    if (r.en_in7 == null) return ui.unk('No English article');
    const known = isNum(r.en_in_known) ? r.en_in_known : 7;
    if (!r.en_in7) return `<span class="rd-off" data-tip="${esc('Not on India’s per-country top list on any of the ' + known + ' days' + (isNum(r.en_in_hi) && r.en_in_hi > 0 ? ': under ' + fmt.num(r.en_in_hi) + ' in total (the days’ cutoffs)' : '') + '\n' + (RULES.en_in || ''))}">off list</span>`;
    if (isNum(r.en_in_hi) && r.en_in_hi > r.en_in7) return `<span data-tip="${esc(`On India’s list ${r.en_in_days} of ${known} days: ${fmt.num(r.en_in7)} on the listed days, up to ${fmt.num(r.en_in_hi)} with the days off it\n` + (RULES.en_in || ''))}">${esc(fmt.compact(r.en_in7))}–${esc(fmt.compact(r.en_in_hi))}</span>`;
    return `<span data-tip="${esc(`On India’s list ${r.en_in_days} of ${known} days\n` + (RULES.en_in || ''))}">≤ ${esc(fmt.compact(r.en_in7))}</span>`;
  };
  const enWorld = r => r.en_world7 == null ? ui.unk('No English article') : r.en_world_floor && !r.en_world7 ? `<span class="rd-off" data-tip="${esc('An English article, never on English Wikipedia’s top 1,000 this week (no curve)\n' + (RULES.en_world || ''))}">below list</span>` : `<span class="rd-out" data-tip="${esc((r.en_world_floor ? 'Floor from the most-read lists\n' : '') + (RULES.en_world || ''))}">${r.en_world_floor && r.en_world7 ? '≥ ' : ''}${esc(fmt.compact(r.en_world7))}</span>`;
  const chg = r => {
    if (r.died) return ui.unk('Death reported: no change shown');
    const e = EV(r), c = e ? e.change_pct : r.change_pct, p = e ? e.prev7 : r.prev7;
    if (isNum(c)) return ui.delta(c, { chip: false, title: `${fmt.num(p)} ${e ? ED[LANG] + ' edition' : 'Indian-language'} reads the 7 days before` });
    if (e ? e.src !== 'curve' : r.ind_floor) return ui.unk(`Floor only: change needs a${e ? ' ' + ED[LANG] : ''} 60-day curve`);
    return ui.unk(isNum(p) && p === 0 ? 'From nil the week before' : 'No earlier week to compare');
  };
  /** the 7-day box strip: one box per UTC day, shaded by that day's Indian-language reads (hatched = a list floor);
   *  with an edition picked, that edition's curve (no strip without one) */
  const strip = r => {
    const e = EV(r);
    if (e && !(arr(e.spark14).length >= 7)) return '';
    const v = e ? e.spark14.slice(-7) : arr(r.daily7), mx = Math.max(1, ...v.filter(isNum));
    if (e) return `<span class="rd-strip">${v.map((x, i) => { const pct = isNum(x) && x > 0 ? Math.round(12 + 88 * x / mx) : 0; return `<i class="${pct ? '' : 'z'}" style="--p:${pct}%" data-tip="${esc(`${fmt.day(DAYS[i] || '')}: ${fmt.num(x)} ${ED[LANG]} edition reads`)}"></i>`; }).join('')}</span>`;
    return `<span class="rd-strip">${v.map((x, i) => {
      const d = DAYS[i] || '';
      const fl = arr(r.daily7_floor)[i];
      const pct = isNum(x) && x > 0 ? Math.round(12 + 88 * x / mx) : 0;
      return `<i class="${fl ? 'fl' : ''}${pct ? '' : ' z'}" style="--p:${pct}%" data-tip="${esc(`${fmt.day(d)}: ${fl ? '≥ ' : ''}${fmt.num(x)} Indian-language reads${fl ? ' (list floor)' : ''}`)}"></i>`;
    }).join('')}</span>`;
  };
  const spark = r => { const e = EV(r), s = e ? e.spark14 : r.spark14; return arr(s).length >= 2 ? ui.spark(s, { w: 84, h: 22, color: r.lane === 'sports' ? 'var(--teal)' : 'var(--pink)', tip: (e ? ED[LANG] + ' edition' : 'Indian-language') + ' reads, last 14 days (curve)' })
    : ui.noSpark(84, `Floor only: no ${e ? ED[LANG] + ' ' : ''}60-day curve yet (7-day floor from the most-read lists)`); };
  const native = r => arr(r.native).length ? `<span class="rd-nat">${arr(r.native).map(esc).join(' · ')}</span>` : '';
  const flags = r => (r.died ? ui.tag('death reported ' + fmt.day(r.died), 'muted', 'Deaths never get a stage word and are held out of the movers') : '')
    + (r.featured ? ui.tag('main page', 'muted', 'Featured on a Wikipedia main page this week: editorial, not demand') : '');
  /* the "consistent with …" event sentence lives in the name's tooltip (full name, native names, then the event) */
  const consistentTxt = r => r.consistent ? 'Consistent with ' + r.consistent : 'No dated event on file';
  /* THE ROW RULE: name + ONE meta line ("Film · Hindi", plus the reading zone when it says something else, a death, or
   *  the G · home-state chip as text in a language lens). Native script, class, the dated event, the main-page flag and
   *  the zone's shares ride the hover; the native script stays on the detail page header. */
  const gText = r => { const g = r.google_home, st = arr(g && g.states); return !LANG || !st.length ? '' : 'G · ' + (st.length <= 2 ? st.map(x => x.geo.slice(3) + (isNum(x.rank) ? ' #' + x.rank : '')).join(' ') : st.length + ' states'); };
  const rowMetaR = r => {
    const z = r.zone_word && r.zone !== 'low' && r.zone !== 'en' && r.zone_word !== fmt.langName(r.language) ? r.zone_word : '';
    return OV.rowMeta(r, [z, r.died ? 'died ' + fmt.day(r.died) : '', gText(r)].filter(Boolean).join(' · '));
  };
  const rowTip = r => [arr(r.native).join(' · '), (r.class_word || '') + (r.subclass ? ' · ' + r.subclass : ''), r.zone_word ? 'Reading zone: ' + r.zone_word : '',
    r.featured ? 'Featured on a Wikipedia main page this week: editorial, not demand' : '', r.died ? 'Death reported ' + fmt.day(r.died) + ': no stage word, held out of the movers' : '', consistentTxt(r)].filter(Boolean).join('\n');
  const nameCellR = r => ui.nameCell(r, { meta: rowMetaR(r), tip: rowTip(r) });

  /* ------------------------------------------------------------------ ladder + movers */
  function ladderRow(r, i) {
    return `<div class="rd-lr" data-act="readOpen" data-arg="${esc(r.qid)}" tabindex="0" role="button">
      <span class="rd-n">${i + 1}</span>${nameCellR(r)}
      <div class="rd-sig">${spark(r)}${strip(r)}</div>
      <div class="rd-v">${LANG ? `<b data-tip="${esc(ED[LANG] + ' Wikipedia readers: reads in 7 days\nAll Indian-language reads: ' + (isNum(r.ind7) ? (r.ind_floor ? '≥ ' : '') + fmt.num(r.ind7) : '—'))}">${reads(r)}</b>` : `<b data-tip="${esc(RULES.ind7 || '')}">${num(r, r.ind7, r.ind_floor)}</b>`}<span>${chg(r)}</span></div>

          { id: 'class_word', label: 'Type', hideBelow: 1300, tip: 'Wikidata class (P31 / P106) or the tracker registry', render: r => esc(r.class_word) },
          { id: 'lane', label: 'Lane', hide: true, render: r => esc(r.lane === 'sports' ? 'Sport' : 'Entertainment') },

          { id: 'zone', label: 'Zone', tip: RULES.zone, value: r => r.zone_word, render: zoneTag },
          { id: 'ind7', label: lang ? ED[lang] + ' 7d' : 'Indian 7d', csvLabel: lang ? ED[lang] + ' Wikipedia 7d' : 'Indian 7d', num: true, desc: true, tip: lang ? LR.lens : RULES.ind7, value: r => lang ? (r.ed || {}).reads : r.ind7, render: r => lang ? reads(r) + `<div class="rd-sub2">all ${num(r, r.ind7, r.ind_floor)}</div>` : num(r, r.ind7, r.ind_floor), csv: r => lang ? (r.ed || {}).reads : r.ind7 },
          { id: 'ind_all', label: 'Indian 7d', hide: true, csvAlways: !!lang, tip: RULES.ind7, value: r => r.ind7, render: r => num(r, r.ind7, r.ind_floor) },
          { id: 'floor', label: 'Floor?', hide: true, tip: 'yes = the 7-day number is a floor from the most-read lists', value: r => (lang ? (r.ed || {}).floor : r.ind_floor) ? 'yes' : 'no', render: r => esc((lang ? (r.ed || {}).floor : r.ind_floor) ? 'yes' : 'no') },
          { id: 'change_pct', label: 'Δ 7d', num: true, desc: true, tip: lang ? 'This edition’s reads vs the 7 days before (its own 60-day curve; — for a floor)' : RULES.change, value: r => (EV(r) || r).change_pct, render: chg },
          { id: 'strip', label: '7 days', sort: false, tip: lang ? 'One box per UTC day: this edition’s reads (curve rows only)' : 'One box per UTC day: Indian-language reads (hatched = list floor)', render: strip, csv: r => lang ? arr((r.ed || {}).spark14).slice(-7).join(' ') : arr(r.daily7).join(' ') },
          { id: 'spark', label: 'Trend', sort: false, hideBelow: 1200, tip: (lang ? ED[lang] + ' edition' : 'Indian-language') + ' reads, last 14 days (60-day curve rows only)', render: spark, csvSkip: true },
          { id: 'google_home', label: 'Google home', hide: true, csvAlways: !!lang, tip: LR.google, value: r => gHomeCsv(r), render: r => gChip(r) || ui.unk('Not on a home-state Google list in the last 24 h'), csv: gHomeCsv },
          { id: 'en_in7', label: 'en·IN', num: true, desc: true, tip: RULES.en_in, render: enIn, csv: r => r.en_in7 },
          { id: 'en_world7', label: 'EN world', num: true, desc: true, hideBelow: 1350, tip: RULES.en_world, render: enWorld },
          { id: 'ind_editions', label: 'Editions', num: true, desc: true, hideBelow: 1250, tip: RULES.editions, render: r => `${esc(r.ind_editions)}<small class="rd-of">/${INDIC.length}</small>` },
          { id: 'agree', label: 'Agreement', tip: RULES.agreement + (lang ? '\nG · = ' + (LR.google || '') : ''), value: r => (r.agreement || {}).n, render: r => agreeTxt(r) + (lang ? ' ' + gChip(r) : ''), csv: r => (r.agreement || {}).text },
          { id: 'conf', label: 'Confidence', tip: RULES.confidence, value: r => ({ High: 3, Med: 2, Low: 1 })[r.conf] || 0, render: confTag, csv: r => r.conf },
          { id: 'consistent', label: 'Consistent with', hide: true, cls: 'wrap', tip: RULES.consistent, value: r => r.consistent, render: r => esc(r.consistent || '—') },
          { id: 'qid', label: 'Wikidata', hide: true, tip: 'Wikidata id', render: r => esc(r.qid) },
        ],

      el.innerHTML = ui.page({

        tip: 'Article reads, not viewers or searches. Indian-language editions rank the rows; English from India is a ceiling shown apart; English worldwide is kept out.' + (lang ? '\n' + (LR.lens || '') : ''),
        strip: honest,

      if (/^Q\d+$/.test(P.qid || '')) OV.go('detail', { qid: P.qid }, { replace: true });   // deep link: #/reading?qid=Q123 opens its page

})();

<script>
/* ---- pages_platforms.js ---- */
/* =====================================================================================================
   OTTVerse Trends — Title Attention by Platform (TRENDS · #/platforms). Built only from window.OV (docs/OTTVERSE_COMPONENTS.md) on
   /api/ott/platform-charts* (ott/platform_charts.py).

   Which titles are trending on each OTT platform in India, from Wikipedia only: each platform's catalogue as Wikipedia
   records it (list pages, originals categories, TV channels → their app, film articles that name a streaming home),
   ranked by Wikipedia reading — "most-read on Wikipedia", never "most watched". Reads = Indian-language editions +
   English (from India where the per-country list knows it; worldwide for an Indian title, labelled). Netflix's official
   India Top 10 is a calibration check only, never a rank.

   House rules: header → filters → KPIs → main visual → dense table (CSV). No paragraph; definitions live in tooltips.
   Every server string goes through esc() or a ui.* component. Unknown is "—" with the reason (ui.unk). The refresh is
   free (Wikimedia + Wikidata) and gated server-side to once per 6 h; the Netflix download is a person's click, weekly.
   ===================================================================================================== */
(function () {
  'use strict';
  const OV = window.OV;
  if (!OV || !OV.ui) return;
  const { ui, fmt, esc, isNum, arr } = OV;
  OV.icons.platforms = '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 12V9M11 12V7M15 12v-2"/>';

  const API = '/api/ott/platform-charts';
  const KINDS = [['', 'All kinds'], ['film', 'Films'], ['series', 'Series & shows'], ['serial', 'TV serials']];
  const STAGE_T = { 'At peak': 'violet', Building: 'up', Cooling: 'down', Elevated: 'up', Steady: 'info', Faded: 'muted', New: 'new', 'Floor only': 'muted' };
  const REACH_T = { p99: 'teal', p279: 'violet', pack: 'info', prime: 'warn', free: 'muted', none: 'down' };
  const REACH_C = { p99: 'var(--teal)', p279: 'var(--violet)', pack: 'var(--blue)', prime: 'var(--amber)', free: 'var(--slate)', none: 'var(--flat)' };
  const SRC_T = { list: 'info', category: 'teal', channel: 'warn', filmlist: 'pink', article: 'violet', rights: 'brand' };
  const XS_API = '/api/ott/xstream-catalog';
  const BASIS = { world: ['EN world', 'English worldwide — an Indian title is read mostly in India, but the India share is unknown'], in: ['EN·IN', 'English from India: India’s per-country most-read list (each listed day a ceiling; a day off the list is unknown, up to that day’s cutoff)'], in_est: ['EN est.', 'English worldwide × the India share tuned on Netflix’s Top 10 (an estimate)'] };
  let RULES = {}, AUTO_TRIED = false, POLL = null, XSTAT = null;

  /* ------------------------------------------------------------------ cells */
  /** English from India: '≤ x' only when on India's list all 7 days; otherwise a range (off-list days unknown) */
  const enInTxt = r => {
    if (!isNum(r.en_in7)) return '—';
    const known = isNum(r.en_in_known) ? r.en_in_known : 7;
    if (r.en_in_days >= known || !isNum(r.en_in_hi)) return '≤ ' + fmt.num(r.en_in7) + ' (' + r.en_in_days + ' of 7 days on India’s list)';
    return fmt.num(r.en_in7) + '–' + fmt.num(r.en_in_hi) + ' (on India’s list ' + r.en_in_days + ' of ' + known + ' days; a day off it is unknown, up to its cutoff)';
  };
  const reads = r => {
    if (r.adult_trap) return ui.unk('Held: the title is a bare adult search word, so its reads are adult searches, not interest in the show (the reading page’s rule)');
    if (!isNum(r.reads)) return ui.unk('Below every most-read list and no 60-day curve yet');
    const b = BASIS[r.reads_basis] || ['', ''];
    const parts = [`Indian editions ${isNum(r.indic7) ? fmt.num(r.indic7) : '— (no Indian-language article)'}`,
      `English worldwide ${isNum(r.en_world7) ? fmt.num(r.en_world7) : '—'}${r.reads_basis === 'world' ? ' (counted here)' : ' (kept out)'}`, `English from India ${enInTxt(r)}`,
      'Basis: ' + b[1], r.reads_partial ? 'A range: English from India is off the list some days' + (r.range_wide ? ' — too wide to rank' : ' — ranked on the low end (top within 25%)') : r.reads_exact ? 'Exact (60-day curves)' : '≥ = a floor from the daily most-read lists'];
    if (r.reads_partial && isNum(r.reads_hi)) return `<span class="pc-r" data-tip="${esc(parts.join('\n'))}">${esc(fmt.compact(r.reads))}–${esc(fmt.compact(r.reads_hi))}</span><small class="pc-basis">${esc(b[0])}</small>`;
    return `<span class="pc-r" data-tip="${esc(parts.join('\n'))}">${r.reads_exact ? '' : '<small class="rd-ge">≥</small>'}${esc(fmt.num(r.reads))}</span><small class="pc-basis">${esc(b[0])}</small>`;
  };
  const EN_OUT = 'Read on English from India, which has no daily curve: the worldwide English curve is kept out';
  // one basis per row (audit round 2): a row read on English from India takes its Δ from the same EN·IN reads
  const EN_IN_D = 'Indian editions + English from India: these 7 days vs the 7 before, on the same basis as Reads 7d';
  const EN_IN_NA = 'Reads 7d count English from India; last week was not on that basis (or is a range), so no Δ';
  const chg = r => r.delta_basis === 'en_in' ? (isNum(r.change_pct) ? ui.delta(r.change_pct, { chip: false, title: EN_IN_D + ' (' + fmt.num(r.prev_reads) + ' the week before)' }) : ui.unk(EN_IN_NA))
    : isNum(r.change_pct) ? ui.delta(r.change_pct, { chip: false, title: 'All editions with a curve' + (r.en_out ? ' (worldwide English kept out)' : '') + ': these 7 days vs the 7 before' }) : ui.unk(r.en_out && !r.has_curve ? EN_OUT : r.has_curve ? 'No earlier week to compare' : 'Needs a 60-day curve');
  const stage = r => ui.tag(r.stage, STAGE_T[r.stage] || 'muted', r.stage + ': ' + (r.stage_why || r.stage_tip || ''));
  const move = r => {
    if (r.new && !isNum(r.move)) return `<span class="ov-d new" data-tip="${esc('Arrived on the platform in the last 7 days' + (r.arrived ? ': ' + ({ ott: 'OTT date', season: 'season start', premiere: 'premiere' }[r.arrived_basis] || 'date') + ' ' + fmt.day(r.arrived) : ''))}">New</span>`;
    if (!isNum(r.move)) return ui.unk(r.rank ? 'No 60-day curve: no earlier rank' : 'Not ranked');
    if (r.move === 0) return '<span class="ov-d flat" data-tip="Same rank as the 7 days before">=</span>';
    return `<span class="ov-d ${r.move > 0 ? 'up' : 'down'}" data-tip="${esc('#' + r.prev_rank + ' the 7 days before')}">${r.move > 0 ? '▲' : '▼'} ${esc(Math.abs(r.move))}</span>`;
  };
  const reach = rc => rc ? ui.tag(rc.label, REACH_T[rc.code] || 'muted', (rc.plans ? rc.plans + '\n' : '') + (RULES.reach || '')) : ui.unk('Unknown');
  const srcTag = (kind, word, tip) => ui.tag(word || kind, SRC_T[kind] || 'muted', tip || RULES.source || '');
  const platCell = r => {
    const list = arr(r.platforms).length ? r.platforms : [{ name: r.platform, source: r.source, source_word: r.source_word }];
    return `<span class="pc-plats">${list.map(p => `<span class="pc-plat">${ui.platform(p.name, { short: list.length > 1 })}${srcTag(p.source, p.source_word)}</span>`).join('')}</span>`;
  };
  const prem = r => {
    if (!r.premiere) return ui.unk('No premiere date on the list, category or Wikidata');
    const d = r.precision === 'year' ? r.premiere.slice(0, 4) : r.precision === 'month' ? fmt.month(r.premiere.slice(0, 7)) : fmt.day(r.premiere);
    const pd = isNum(r.premiere_days) ? r.premiere_days : null;
    return `<span data-tip="${esc((r.precision === 'day' && isNum(pd) ? pd + ' days since premiere' : 'Premiere ' + (r.precision || '')) + (r.arrived && r.arrived_basis !== 'premiere' ? '\nOn the platform since ' + fmt.day(r.arrived) + ' (' + r.arrived_basis + ')' : '') + (r.status ? '\nStatus: ' + r.status : '') + (r.season ? '\n' + r.season : ''))}">${esc(d)}</span>${r.precision === 'day' && isNum(pd) && pd >= 0 && pd <= 120 ? `<small class="pc-ds">${esc(pd)}d</small>` : ''}`;
  };
  const REL = { ott: ['OTT', 'up', 'Streaming date on this platform (article / rights map)'], theatrical: ['Theatres', 'warn', 'OTT date unknown: theatrical release (counts for 120 days when streaming or rights sold)'],
    season: ['Season', 'violet', 'Newest season / episode date (series article)'], premiere: ['Premiere', 'info', 'Premiere date (list page / Wikidata)'], airing: ['Airing', 'teal', 'A TV-channel serial running now (infobox: present)'] };
  const when = r => {
    const b = REL[r.rel_basis] || null;
    if (r.state === 'coming' || (!r.rel_date && r.rel_coming)) return `${ui.tag('Coming', 'info', 'Not on the platform yet: listed, never ranked')}<span class="pc-dt">${esc(fmt.day(r.rel_coming))}</span>`;
    if (!r.rel_date) return r.ott_status === 'rights' ? ui.tag('Rights sold', 'muted', 'Rights sold, no streaming date: listed, not ranked') : ui.unk('No date on the list, infobox, article or Wikidata');
    const d = r.rel_basis === 'airing' ? 'now' : fmt.day(r.rel_date);
    return `${b ? ui.tag(b[0], b[1], b[2]) : ''}<span class="pc-dt" data-tip="${esc((isNum(r.rel_days) ? r.rel_days + ' days ago' : '') + (r.premiere ? '\nFirst premiere ' + fmt.day(r.premiere) : '') + (r.status ? '\nStatus: ' + r.status : ''))}">${esc(d)}</span>`;
  };
  const official = r => r.official ? `<span class="pc-off" data-tip="${esc('Netflix India Top 10, week to ' + fmt.day(r.official.week) + ': ' + r.official.category + ' #' + r.official.rank + ' · ' + r.official.weeks + ' week(s) in the Top 10\n' + (RULES.official || ''))}">#${esc(r.official.rank)}<small>${esc(r.official.category === 'Films' ? 'F' : 'TV')}</small></span>` : ui.unk('Not in Netflix’s official India Top 10 that week');
  // On Xstream: the uploaded Xstream Play catalogue (ott/xstream_catalog.py) — ✓ partner / ✗ / — (none loaded)
  const xsAsOf = () => XSTAT && XSTAT.loaded ? `Xstream catalogue as of ${fmt.day(XSTAT.as_of)} · ${fmt.num(XSTAT.rows)} rows${XSTAT.source ? ' · ' + XSTAT.source : ''}` : '';
  const onXs = r => {
    const x = r.xstream || {};
    if (x.on_xstream === null || x.on_xstream === undefined) return ui.unk('No Xstream catalogue loaded · ⋯ › Xstream catalogue');
    const how = x.match === 'qid' ? 'matched by Wikidata id' : 'matched by title' + (r.language ? ' + language' : '');
    if (x.on_xstream) return `<span class="pc-xs y" data-tip="${esc('On Xstream Play' + (x.partner ? ' via ' + x.partner : '') + ' · ' + how + '\n' + xsAsOf())}">✓</span>${x.partner ? `<small class="pc-xsp">${esc(x.partner)}</small>` : ''}`;
    return `<span class="pc-xs n" data-tip="${esc((x.match === 'none' ? 'Not in the uploaded Xstream catalogue' : 'In the catalogue, outside its availability window' + (x.partner ? ' (' + x.partner + ')' : '')) + '\n' + xsAsOf())}">✗</span>`;
  };
  const xsCsv = r => { const x = r.xstream || {}; return x.on_xstream === null || x.on_xstream === undefined ? '' : x.on_xstream ? 'yes' + (x.partner ? ' (' + x.partner + ')' : '') : 'no'; };
  /* THE ROW RULE: name + ONE meta line ("Film · Hindi" or a short equivalent); native script, the TV channel and the
   *  source word ride the hover (the native script stays on the detail page header) */
  const nameTip = x => [arr(x.native).join(' · '), x.channel ? 'TV channel: ' + x.channel : ''].filter(Boolean).join('\n');
  const nameCellP = (x, meta, tip) => ui.nameCell(withQid(x), { meta: meta != null ? meta : OV.rowMeta(x), tip: [nameTip(x), tip].filter(Boolean).join('\n') });
  /** list items carry a Wikidata id as their key (no qid field): hand it to the picture lookup */
  const withQid = x => x && !x.qid && /^Q\d+$/.test(x.key || '') ? Object.assign({ qid: x.key }, x) : x;
  const spark = r => arr(r.spark14).length >= 2 ? ui.spark(r.spark14, { w: 84, h: 22, color: r.kind === 'film' ? 'var(--pink)' : 'var(--violet)', tip: r.delta_basis === 'en_in' ? 'Indian editions + English from India, last 14 days (all on India\'s list)' : 'Every edition with a curve' + (r.en_out ? ' (worldwide English kept out)' : '') + ', last 14 days' }) : ui.noSpark(84, r.delta_basis === 'en_in' ? 'English from India counts only on days on India\'s list; not 14 days in a row, so no daily curve on the Reads basis' : r.en_out ? EN_OUT : 'Floor only: no 60-day curve yet (7-day floor from the most-read lists)');

  /* ------------------------------------------------------------------ drawer */
  /** one Wikidata item joining two works: say so, and which editions were kept out */
  const conflictNote = d => { const c = (d.row || {}).qid_conflict; return c ? `<div class="pc-src warn">${ui.tag('Wikidata conflict', 'warn', c.note || '')}<q>${esc('Editions kept out: ' + arr(c.editions_off).join(', ') + ' (they belong to the other work)')}</q></div>` : ''; };
  function evidenceHtml(d) {
    const rows = arr(d.platforms);
    if (!rows.length) return '';
    return `<div class="pc-ev">${rows.map(p => {
      const srcs = arr(p.sources).map(s => {
        const ev = s.evidence || {};
        const link = s.url ? ui.extLink(s.url, s.kind === 'list' || s.kind === 'category' || s.kind === 'channel' ? (s.ref || '').replace(/^Category:/, 'Category: ') : 'Wikipedia', { tip: 'Open the source' }) : '';
        const list = s.kind === 'filmlist' && s.ref ? ui.extLink('https://en.wikipedia.org/wiki/' + encodeURIComponent(s.ref.replace(/ /g, '_')), 'year list', { tip: s.ref }) : '';
        const quote = ev.sentence ? `<q>${esc(ev.sentence)}</q>` : '';
        const when = ev.rev_ts ? `<small data-tip="Wikipedia revision the sentence was read from">rev ${esc(fmt.day(ev.rev_ts))}</small>` : '';
        const ott = s.ott_status ? ui.tag(s.ott_status === 'streaming' ? 'Streaming' + (s.ott_date ? ' since ' + fmt.day(s.ott_date) : '') : s.ott_status === 'coming' ? 'Coming ' + (s.ott_date ? fmt.day(s.ott_date) : '') : 'Rights sold', s.ott_status === 'streaming' ? 'up' : s.ott_status === 'coming' ? 'info' : 'muted') : '';
        return `<div class="pc-src">${srcTag(s.kind, s.word)}${s.heading ? `<small>${esc(s.heading)}</small>` : ''}${s.via ? `<small>${esc(s.via)}</small>` : ''}${ott}${link}${list}${when}${quote}</div>`;
      }).join('');
      const note = p.rights_note ? `<div class="pc-src warn">${ui.tag('Rights map differs', 'warn', 'The tracker’s rights map does not confirm this platform; both are shown')}<q>${esc(p.rights_note)}</q></div>` : '';
      const says = arr(p.wikipedia_says).map(w => `<div class="pc-src warn">${ui.tag('Wikipedia says ' + w.platform, 'warn', 'The rights map wins; both are shown')}${w.sentence ? `<q>${esc(w.sentence)}</q>` : ''}</div>`).join('');
      return `<div class="pc-evp"><div class="pc-evh">${ui.platform(p.platform)}${reach(p.reach)}${p.official ? official(p) : ''}<span class="sp"></span>${p.xstream ? `<span class="ov-note1">Xstream</span>${onXs(p)}` : ''}</div>${srcs}${says}${note}</div>`;
    }).join('')}</div>`;
  }
  async function openDrawer(key) {
    OV.drawer.open({ title: 'Title Attention by Platform', html: ui.skeleton('card') + ui.skeleton('card'), width: 780 });
    let d;
    try { d = await OV.api.get(API + '/title/' + encodeURIComponent(key), null, { ttl: 300 }); } catch (e) { OV.drawer.open({ title: 'Title Attention by Platform', html: ui.error(e), width: 780 }); return; }
    const p0 = arr(d.platforms)[0] || {};
    const line = `<div class="pc-rl" data-tip="${esc((RULES.reads || '') + (p0.reads_basis === 'world' ? '\nEnglish worldwide is COUNTED in this page’s reads (an Indian title); the reading page keeps it out of its Indian total.' : ''))}"><span class="ov-note1">This page · reads 7d</span>${reads(p0)}</div>`;
    const ev = `<div class="ov-sub-h">Where it streams · evidence${ui.tip(RULES.source || '')}</div>${line}${conflictNote(d)}${evidenceHtml(d)}`;
    if (OV.readingDrawer) { OV.readingDrawer(d, { prepend: ev, enWorldCounted: p0.reads_basis === 'world' }); return; }
    OV.drawer.open({ title: (d.row || {}).name || 'Title', html: ev, width: 780 });
  }
  OV.actions.pcOpen = key => { if (key) OV.go('detail', { pkey: key }); };

  /* ------------------------------------------------------------------ YouTube trailers (SerpApi) — a VIEW of this page */
  // What each platform is pushing in India this week: its own YouTube trailers and their views (ott/trailers.py).
  // India only; attention, not viewing. Daily inside the SerpApi budget; the 500-search sweep is an owner action.
  // 6 Oct review (business + QA): ONE ROW PER TITLE — a soap's daily promos fold into one row ('n videos'); ranked by
  // pace (views per day since upload), never by raw cumulative views; KPIs, chips and tabs count the rows on screen;
  // a column that is empty for every row is hidden; every row opens a drawer; Title 360 only where the match is real;
  // the SerpApi counters live in a status strip, not in KPIs; release news is cut to the window.
  const TR_API = '/api/ott/trailers';
  const KIND_T = { trailer: 'violet', teaser: 'info', 'first look': 'info', promo: 'teal', 'now streaming': 'up', recap: 'teal', 'daily promo': 'muted', episode: 'muted', song: 'pink', clip: 'muted' };
  const KIND_W = { trailer: 'Trailer', teaser: 'Teaser', 'first look': 'First look', promo: 'Promo', 'now streaming': 'Now streaming', recap: 'Recap', 'daily promo': 'Daily promo', episode: 'Episode preview', song: 'Song', clip: 'Clip' };
  // verdict codes the server sends (ott/trailer_signals.VERDICTS): two-signal verdicts rank above one-signal 'rising' notes
  const TR_V_ORDER = ['really_trending', 'searched_pushed', 'searched', 'pushed', 'reads_up', 'search_up', 'views_up', 'fading', 'steady'];
  // the tab order the Wikipedia view uses: the big five, Airtel's own app (always shown), then the apps inside Xstream Play
  const TR_ORDER = ['Netflix', 'JioHotstar', 'Prime Video', 'ZEE5', 'Sony LIV', 'Airtel Xstream Play'];
  const TR_PARTNERS = ['aha', 'Sun NXT', 'ETV Win', 'hoichoi', 'ManoramaMAX', 'Lionsgate Play', 'Chaupal'];
  const TR_V_RANK = { really_trending: 6, searched_pushed: 6, searched: 5, pushed: 4, reads_up: 3, search_up: 3, views_up: 3, fading: 2, steady: 1, unknown: 0, unjudged: 0 };
  const trNorm = s => (OV.norm ? OV.norm(s) : String(s == null ? '' : s).toLowerCase().trim());
  const trNow = () => Date.now() / 1000;
  /** A row name, not a YouTube caption: emoji, a leading #tag, @handles and a 'Ft. …' tail come off (the raw caption rides the hover). */
  const trClean = s => {
    const t = String(s || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/^\s*(?:#\S+\s*)+/, '').replace(/\s*@\S+/g, '')
      .replace(/\s+\b(?:ft|feat)\.?\s+.+$/i, '').replace(/[\s|·:,-]+$/, '').replace(/\s{2,}/g, ' ').trim();
    return t || String(s || '').trim();
  };
  /** Days since the first upload of a row (0.5 at least, so a same-day upload never divides by zero); null without a date. */
  const trAge = r => isNum(r.first_ts || r.published_ts) ? Math.max(0.5, (trNow() - (r.first_ts || r.published_ts)) / 86400) : null;
  /** Pace = views per day since the first upload: 4.9M in 3 days outranks 5.6M in 6 (the default sort). The server's
   *  own pace wins when it sends one. */
  const trPace = r => isNum(r.pace) ? r.pace : isNum(r.views) && isNum(trAge(r)) ? r.views / trAge(r) : null;
  /** One row per title and platform: the best video carries the row, views are summed, '+1 day' is summed over videos
   *  that have one, the newest upload dates the row, the first upload starts the pace clock. A server that already
   *  groups (rows with `clips` and a `videos` count, ott/trailers.py _group) is taken as it is, its clips as the list. */
  const trServerGrouped = r => Array.isArray(r.clips) || (isNum(r.videos) && !Array.isArray(r.videos));
  function trGroup(items) {
    items = arr(items);
    if (items.some(trServerGrouped)) return items.map(r => {
      const clips = arr(r.clips).map(c => Object.assign({ title: trClean(c.title_raw || r.title), platform: r.platform }, c));
      const dated = clips.filter(c => isNum(c.published_ts));
      return Object.assign({}, r, { title: trClean(r.title), videos: clips.length ? clips : [r], n_videos: isNum(r.videos) ? r.videos : (clips.length || 1),
        best_views: isNum(r.views_best) ? r.views_best : r.views, published_ts: isNum(r.newest_ts) ? r.newest_ts : r.published_ts,
        first_ts: dated.length ? Math.min(...dated.map(c => c.published_ts)) : r.published_ts });
    });
    const by = new Map();
    items.forEach(r => { const k = (r.platform || '') + '|' + trNorm(trClean(r.title)); const g = by.get(k); if (g) g.push(r); else by.set(k, [r]); });
    return Array.from(by.values()).map(vs => {
      vs.sort((a, b) => (b.views || 0) - (a.views || 0));
      const best = vs[0];
      const dated = vs.filter(v => isNum(v.published_ts));
      const newest = dated.length ? dated.reduce((a, v) => v.published_ts > a.published_ts ? v : a) : best;
      const first = dated.length ? dated.reduce((a, v) => v.published_ts < a.published_ts ? v : a) : best;
      const gains = vs.filter(v => isNum(v.gain_1d));
      const judged = vs.map(v => v.verdict).filter(Boolean).sort((a, b) => (TR_V_RANK[b.code] || 0) - (TR_V_RANK[a.code] || 0))[0] || best.verdict;
      const matched = vs.find(v => v.match_key) || {};
      return Object.assign({}, best, {
        title: trClean(best.title), videos: vs, n_videos: vs.length,
        views: vs.some(v => isNum(v.views)) ? vs.reduce((a, v) => a + (v.views || 0), 0) : null, best_views: best.views,
        gain_1d: gains.length ? gains.reduce((a, v) => a + v.gain_1d, 0) : null,
        days_seen: Math.max(...vs.map(v => v.days_seen || 1)),
        published_ts: newest.published_ts, published_text: newest.published_text, first_ts: first.published_ts,
        verdict: judged, google: vs.map(v => v.google).find(Boolean) || null, signals: (vs.find(v => v.signals && (v.signals.reads || {}).spark && v.signals.reads.spark.length) || best).signals,
        match_key: matched.match_key || null, match_label: matched.match_label || null, match_go: matched.match_go || null,
        language: vs.map(v => v.language).find(Boolean) || null,
      });
    });
  }
  /** Where Title 360 can open a row: the server's own route when it stored one (match_go), else a lookup by the matched
   *  name (the title page redirects to the real key when it knows the title); never a bare folded key. */
  const trGo = r => { const g = r && r.match_go; if (g && g.page) return [g.page, g.params || {}]; const q = r && (r.match_label || (r.match_key && !/^Q\d+$/.test(r.match_key) && !/^[a-z]{2}:/.test(r.match_key) ? r.match_key : '')); return q ? ['title', { q }] : null; };
  OV.trailers = { clean: trClean, group: trGroup, pace: trPace, age: trAge, go: trGo, kindWord: k => KIND_W[k] || (k ? String(k).charAt(0).toUpperCase() + String(k).slice(1) : '') };

  /* cells */
  const trViews = r => isNum(r.views) ? `<span data-tip="${esc(fmt.num(r.views) + ' views on YouTube when last searched' + (r.n_videos > 1 ? ' · ' + r.n_videos + ' videos summed · best ' + fmt.compact(r.best_views) : '') + (r.days_seen > 1 ? ' · seen on ' + r.days_seen + ' daily searches' : ''))}">${esc(fmt.compact(r.views))}</span>` : ui.unk('Views not shown by YouTube');
  const trPaceCell = r => { const p = trPace(r); return isNum(p) ? `<span data-tip="${esc(fmt.num(Math.round(p)) + ' views a day: views ÷ ' + fmt.dec(trAge(r), 1) + ' days since the ' + (r.n_videos > 1 ? 'first ' : '') + 'upload')}">${esc(fmt.compact(p))}<small class="pc-ds">/d</small></span>` : ui.unk(isNum(r.views) ? 'No upload date from YouTube, so no pace' : 'Views not shown by YouTube'); };
  const trGain = r => isNum(r.gain_1d) ? `<span class="ov-d ${r.gain_1d > 0 ? 'up' : 'flat'}" data-tip="${esc('Views gained since the day before (the same video found again)' + (r.n_videos > 1 ? ' · summed over the videos found again' : ''))}">${r.gain_1d > 0 ? '▲ ' : ''}${esc(fmt.compact(r.gain_1d))}</span>` : ui.unk('Needs two daily searches to show a gain');
  const trWatch = r => r.link ? ui.extLink(r.link, 'YouTube', { tip: 'Open the ' + (r.n_videos > 1 ? 'most-viewed video' : 'trailer') + ' on YouTube' }) : '';
  const trGoogle = r => { const g = r.google; return g ? `<span class="tr-g" data-tip="${esc('On Google now: #' + g.rank + ' on the Trending-now lists · heat ' + fmt.dec(g.heat, 1) + (g.verdict ? ' · ' + g.verdict : '') + '\n' + (RULES_G || ''))}">${esc('#' + g.rank)}<small> · ${esc(fmt.dec(g.heat, 0))}</small></span>` : ui.unk('Not on Google’s Trending-now lists right now (India or any state)'); };
  let RULES_G = '';
  const VT = { up: 'up', warn: 'warn', violet: 'violet', down: 'down', muted: 'muted', info: 'info' };
