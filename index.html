.ov-kpi.go:hover { border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); }
.ov-kpi-l { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); line-height: var(--lh-meta); font-weight: 500; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.ov-kpi-l .sd { margin-left: auto; }
.ov-kpi-r { display: flex; align-items: flex-end; gap: 8px; min-height: 32px; }
.ov-kpi-v { font-size: var(--fs-kpi); font-weight: 600; line-height: 32px; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 0 auto; max-width: 100%; }
.ov-kpi-v.txt { font-size: var(--fs-xl); flex: 0 1 auto; white-space: normal; overflow: visible; line-height: 26px; }   /* a word value (a state's name) is never cut: xl, wraps if it must */
.ov-kpi-v small { font-size: var(--fs-md); font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 2px; }
.ov-kpi-sp { margin-left: auto; flex: 0 1 76px; min-width: 28px; padding-bottom: 3px; display: flex; justify-content: flex-end; overflow: hidden; }
.ov-kpi-sp svg { max-width: 100%; height: auto; }
.ov-kpi-s { font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
.ov-kpi-s .ov-d { font-size: var(--fs-sm); }
.ov-kpi.unk .ov-kpi-v { color: var(--ink-3); }

.ov-grid { display: grid; gap: var(--sp-4); margin-bottom: var(--sp-4); align-items: stretch; }   /* equal card heights in a row */
.ov-grid.top { align-items: start; }
.ov-grid.stretch { align-items: stretch; }
.ov-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; }
.ov-card + .ov-card { margin-top: 0; }
.ov-stack > .ov-card + .ov-card, .ov-stack > * + * { margin-top: var(--sp-4); }
.ov-ch { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-4); height: var(--ch-h); min-height: var(--ch-h); flex: none; }
.ov-ch > .ov-ico { width: 16px; height: 16px; color: var(--ink-3); }
.ov-ch h3 { margin: 0; font-size: var(--fs-lg); line-height: 20px; font-weight: 600; letter-spacing: -.15px; white-space: nowrap; color: var(--ink); }
.ov-ch .acts { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; flex-wrap: nowrap; justify-content: flex-end; }
.ov-cb { padding: var(--sp-1) var(--sp-4) var(--sp-4); min-width: 0; flex: 1; }
.ov-cb.np { padding: 0; }
.ov-cf { border-top: 1px solid var(--line-2); padding: var(--sp-2) var(--sp-4); font-size: var(--fs-sm); color: var(--ink-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ov-section-t { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; margin: 2px 0 6px; }

/* ------------------------------------------------------------------ chips, badges, pills */
.ov-b { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 3px; border-radius: 4px; color: #fff; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .02em; flex: none; line-height: 1; }
.ov-b.w2 { min-width: 22px; }
.ov-b.lg { min-width: 26px; height: 26px; font-size: var(--fs-sm); border-radius: 6px; }
.ov-b.lg.w2 { min-width: 30px; }
.ov-vp { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap;
  background: color-mix(in srgb, var(--vc) 13%, transparent); color: var(--vt, var(--vc)); }
.ov-vp i { width: 6px; height: 6px; border-radius: 50%; background: var(--vc); flex: none; }
.ov-vp.lg { height: var(--pill-h); }   /* one pill height everywhere */
.ov-vp.lg i { width: 6px; height: 6px; }
.ov-lang { display: inline-flex; align-items: center; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; color: var(--ink-2); background: var(--field-2); white-space: nowrap; }
.ov-pc { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 100%; min-width: 0; }
.ov-pc .mono { width: 20px; height: 20px; border-radius: 5px; color: #fff; display: inline-grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; letter-spacing: -.2px; flex: none; }
.ov-pc .pn { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ov-pc .on { font-size: var(--fs-xs); font-weight: 600; width: 15px; text-align: center; flex: none; }
.ov-pc .on.yes, .ov-pc .on.partner { color: var(--up-ink); }
.ov-pc .on.no { color: var(--down-ink); }
.ov-pc .on.unknown { color: var(--ink-3); }
.ov-pc .via { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }
.ov-tag { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; background: var(--field-2); color: var(--ink-2); white-space: nowrap; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
.ov-tag.up { background: color-mix(in srgb, var(--up) 12%, transparent); color: var(--up-ink); }
.ov-tag.down { background: color-mix(in srgb, var(--down) 11%, transparent); color: var(--down-ink); }
.ov-tag.warn { background: color-mix(in srgb, var(--amber) 15%, transparent); color: color-mix(in srgb, var(--amber) 80%, var(--ink)); }
.ov-tag.info { background: color-mix(in srgb, var(--blue) 11%, transparent); color: var(--blue-ink); }
.ov-tag.violet { background: color-mix(in srgb, var(--violet) 12%, transparent); color: var(--violet-ink); }
.ov-tag.pink { background: color-mix(in srgb, var(--pink) 12%, transparent); color: var(--pink); }
.ov-tag.teal { background: color-mix(in srgb, var(--teal) 12%, transparent); color: var(--teal-ink); }
.ov-tag.muted { background: transparent; border-color: var(--line); color: var(--ink-3); }
.ov-tag.brand { background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--brand); }
.ov-tag.new { background: transparent; color: var(--blue-ink); padding: 0; font-weight: 600; }   /* "New" = blue text, not a pill */
.ov-d { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-md); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ov-d.up { color: var(--up-ink); }
.ov-d.down { color: var(--down-ink); }
.ov-d.flat { color: var(--ink-2); }
.ov-d.chip { height: auto; padding: 0; border-radius: 0; }   /* deltas are plain coloured text */
.ov-d.new { color: var(--blue-ink); font-weight: 600; }


.ov-sd { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--flat); cursor: help; }
.ov-sd.ok { background: var(--up); }
.ov-sd.warn { background: var(--amber); }
.ov-sd.off { background: var(--ink-4); }
.ov-sd.bad { background: var(--down); }
.ov-i { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1.3px solid var(--ink-4); color: var(--ink-4); font: italic 600 9px/1 Georgia, serif; cursor: help; flex: none; }   /* the (i) glyph: an icon, not text */
.ov-i:hover { border-color: var(--blue); color: var(--blue); }
.ov-unk { color: var(--ink-3); cursor: help; font-weight: 600; }
.ov-phase { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.ov-phase i { width: 8px; height: 8px; border-radius: 50%; background: var(--flat); }
.ov-phase.emerging i { background: var(--up); box-shadow: 0 0 0 2px color-mix(in srgb, var(--up) 25%, transparent); }
.ov-phase.peaking i { background: var(--amber); }
.ov-phase.cooling i { background: var(--blue); opacity: .55; }
.ov-phase.steady i { background: var(--slate); }
.ov-lights { display: inline-flex; gap: 3px; align-items: center; cursor: help; }
.ov-lights i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.ov-lights i.on { background: var(--up); }
.ov-lights i.off { background: color-mix(in srgb, var(--down) 45%, var(--line)); }
.ov-lights b { font-size: var(--fs-xs); color: var(--ink-3); margin-left: 4px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ov-heat { display: inline-flex; align-items: center; gap: 7px; justify-content: flex-end; width: 100%; }
.ov-heat b { font-weight: 600; min-width: 24px; text-align: right; }
.ov-heat i { width: 32px; height: 5px; border-radius: 3px; background: var(--line-2); position: relative; overflow: hidden; flex: none; }
.ov-heat i::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: var(--hc, var(--blue)); border-radius: 3px; }
.ov-meter { display: inline-block; width: 28px; height: 5px; border-radius: 3px; background: var(--line-2); position: relative; overflow: hidden; vertical-align: middle; }
.ov-meter::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: var(--teal); border-radius: 3px; }
.ov-kind { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; background: color-mix(in srgb, var(--kc) 11%, transparent); color: var(--kc); }

/* ------------------------------------------------------------------ buttons */
.ov-btn { height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); padding: 0 12px; font-weight: 500; font-size: var(--fs-md); display: inline-flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; text-decoration: none !important; }
.ov-btn:hover { background: var(--hover); }
.ov-btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.ov-btn.pri:hover { filter: brightness(.95); }
.ov-btn.sm { height: 28px; padding: 0 10px; font-size: var(--fs-md); border-radius: 8px; }
.ov-btn:disabled { opacity: .5; cursor: not-allowed; }
.ov-btn.armed { background: var(--amber); border-color: var(--amber); color: #fff; }
.ov-btn.on { background: var(--sel); color: var(--blue); border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); }
.ov-star.on .ov-ico { fill: var(--amber); stroke: var(--amber); }
.ov-lc { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); border-radius: 11px; padding: 0 8px; border: 1px dashed color-mix(in srgb, var(--amber) 60%, var(--line));
  background: color-mix(in srgb, var(--amber) 7%, var(--card)); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); font-weight: 500; font-size: var(--fs-md); white-space: nowrap; }
.ov-lc:hover { background: color-mix(in srgb, var(--amber) 14%, var(--card)); }
.ov-lc .ov-ico { width: 13px; height: 13px; }
.ov-lc.armed { border-style: solid; background: var(--amber); color: #fff; border-color: var(--amber); }
.ov-lc.busy { opacity: .7; cursor: progress; }
.ov-lc.done { border: 1px solid var(--line); background: var(--field-2); color: var(--ink-3); cursor: default; }
.ov-lc.done i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.ov-lc.off { border-style: solid; border-color: var(--line); background: var(--field-2); color: var(--ink-3); cursor: not-allowed; }
.ov-lc.err { border-color: var(--down); color: var(--down); background: color-mix(in srgb, var(--down) 6%, var(--card)); }
.ov-link { color: var(--blue); cursor: pointer; font-weight: 600; }

/* ------------------------------------------------------------------ table */
.ov-tw { position: relative; }
.ov-tbar { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-4); min-height: var(--ch-h); border-bottom: 1px solid var(--line-2); font-size: var(--fs-sm); color: var(--ink-3); flex-wrap: wrap; }
.ov-tbar .sp { flex: 1; }
.ov-tbar b { color: var(--ink); font-weight: 600; }
.ov-tbar .ov-tbt { font-size: var(--fs-lg); line-height: 20px; }   /* a table card's own title = a card title */
.ov-t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-md); }
.ov-t th { position: sticky; top: var(--top-h); z-index: 3; background: var(--card); text-align: left; font-size: var(--fs-xs); line-height: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 0 6px; height: var(--th-h); border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; vertical-align: middle; }
.ov-t th:first-child, .ov-t td:first-child { padding-left: var(--sp-4); }
.ov-t th:last-child, .ov-t td:last-child { padding-right: var(--sp-4); }
.ov-t th.s { cursor: pointer; }
.ov-t th.s:hover { color: var(--ink); }
.ov-th-b { all: unset; display: inline-flex; align-items: center; cursor: pointer; border-radius: 3px; }
.ov-th-b:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.ov-t th[aria-sort="ascending"], .ov-t th[aria-sort="descending"] { color: var(--ink); }
.ov-t th .ar { display: inline-block; width: 8px; color: var(--blue); font-size: var(--fs-xs); margin-left: 2px; }
.ov-t th .lbl { cursor: help; }
/* a table wider than its card scrolls inside it (sticky header off there), with a fade at the right edge */
.ov-tbody { min-width: 0; position: relative; }
.ov-tw.ovf > .ov-tbody { overflow-x: auto; }
.ov-tw.ovf .ov-t th { position: static; }
.ov-tw.ovf:not(.end)::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 28px; pointer-events: none; border-radius: 0 var(--r) var(--r) 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card) 92%, transparent)); }
.ov-t tbody tr:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.ov-t tbody tr:focus-visible td { background: var(--sel); }
.ov-t a.ov-tl { color: inherit; text-decoration: none; }
.ov-t a.ov-tl:hover { color: var(--blue); text-decoration: underline; }
[data-title-key]:focus-visible, [data-go]:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-radius: 5px; }
.ov-t th.r, .ov-t td.r { text-align: right; }
.ov-t th.c, .ov-t td.c { text-align: center; }
.ov-t td { padding: 0 6px; height: var(--row-h); border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; color: var(--ink-2); line-height: var(--lh-name); }
.ov-t.dense td { height: var(--row-h); }   /* one row height everywhere (the row rule) */
.ov-t tbody tr.click { cursor: pointer; }
.ov-t tbody tr:hover td { background: var(--hover); }
.ov-t tbody tr:last-child td { border-bottom: 0; }
.ov-t tr.sub td { background: color-mix(in srgb, var(--field-2) 60%, transparent); color: var(--ink-2); }
.ov-t tr.ov-off td .ov-heat, .ov-t tr.ov-off td .ov-spark { opacity: .6; }   /* this week: off the latest scan */
.ov-t tr.muted td { color: var(--ink-3); }
.ov-t td.wrap { white-space: normal; min-width: 160px; line-height: var(--lh-name); padding-top: 6px; padding-bottom: 6px; }
/* a long text cell clipped to its column with the full text in the tooltip */
.ov-t .clip { display: inline-block; max-width: var(--clip, 190px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.ov-t td.rk { font-weight: 500; font-size: var(--fs-md); color: var(--ink-3); width: 28px; min-width: 28px; text-align: right; padding-right: 4px; }
.ov-t td.dl { width: 44px; min-width: 44px; }
.ov-t div.tt { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 380px; }
.ov-t .tt .nm { font-weight: 600; font-size: var(--fs-base); color: var(--ink); min-width: 0; }
.ov-t .tt .sub2 { font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-t .tt .col { display: flex; flex-direction: column; min-width: 0; line-height: var(--lh-name); }
.ov-t span.why { max-width: 112px; display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; color: var(--ink-2); min-width: 0; }
.ov-t .why .ov-ico { width: 14px; height: 14px; color: var(--ink-3); }
.ov-t .why .wt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ov-tpg { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line-2); font-size: var(--fs-sm); color: var(--ink-3); }
.ov-tpg .sp { flex: 1; }
.ov-tpg button { height: 26px; min-width: 26px; border: 1px solid var(--line); background: var(--field); border-radius: 6px; font-weight: 600; color: var(--ink-2); font-size: var(--fs-sm); padding: 0 7px; }
.ov-tpg button.on { background: var(--sel); color: var(--blue-ink); border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); }
.ov-tpg button:disabled { opacity: .4; cursor: default; }
.ov-tpg select { height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); font-size: var(--fs-sm); padding: 0 4px; }
.ov-chooser { position: absolute; right: 10px; top: 40px; z-index: 20; background: var(--card); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow-2); padding: 8px; min-width: 200px; display: none; max-height: 340px; overflow: auto; }
.ov-chooser.on { display: block; }
.ov-chooser label { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 5px; font-size: var(--fs-md); cursor: pointer; }
.ov-chooser label:hover { background: var(--hover); }
.ov-mini { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.ov-mini th { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); text-align: left; height: var(--th-h); padding: 0; border-bottom: 1px solid var(--line); }
.ov-mini th.r, .ov-mini th.n { text-align: right; }
.ov-mini td { padding: 0; height: 40px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.ov-mini tr:last-child td { border-bottom: 0; }
.ov-mini td.r { text-align: right; font-variant-numeric: tabular-nums; }
.ov-mini tr.click { cursor: pointer; }
.ov-mini tr.click:hover td { background: var(--hover); }
.ov-mini .nm { font-size: var(--fs-base); line-height: var(--lh-name); font-weight: 600; display: block; max-width: 100%; }

/* ------------------------------------------------------------------ charts */
.ov-chart { position: relative; width: 100%; }
.ov-chart svg { overflow: visible; }
.ov-chart .gl { stroke: var(--line-2); stroke-width: 1; }
.ov-chart .ax { fill: var(--ink-3); font-size: var(--fs-xs); font-family: var(--font); font-variant-numeric: tabular-nums; }
.ov-chart .xh { stroke: var(--ink-4); stroke-width: 1; stroke-dasharray: 3 3; }
.ov-chart .pin line { stroke: var(--pc, var(--ink-3)); stroke-width: 1; stroke-dasharray: 2 3; }
.ov-chart .pin path { fill: var(--pc, var(--ink-3)); }
.ov-chart .pin { cursor: help; }
.ov-chart .pin.u { cursor: pointer; }
.ov-chart-empty { display: grid; place-items: center; color: var(--ink-3); font-size: var(--fs-sm); border: 1px dashed var(--line); border-radius: 8px; }
.ov-ctip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-2); padding: 7px 9px; font-size: var(--fs-sm); min-width: 120px; display: none; z-index: 5; white-space: nowrap; }
.ov-ctip .h { font-weight: 600; margin-bottom: 3px; color: var(--ink); }
.ov-ctip .r { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.ov-ctip .r b { margin-left: auto; padding-left: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
.ov-ctip .r i { width: 8px; height: 8px; border-radius: 2px; }
.ov-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ink-2); align-items: center; min-width: 0; max-width: 100%; }
.ov-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; max-width: 100%; }
.ov-donut .ov-legend > span { white-space: normal; }        /* a long brand line wraps inside the narrow donut card */
.ov-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.ov-legend i.ln { height: 2px; width: 12px; border-radius: 1px; }
.ov-spark { display: inline-block; vertical-align: middle; }
.ov-bl { display: flex; flex-direction: column; gap: 6px; }
.ov-bl-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: var(--fs-md); }
.ov-bl-r.go { cursor: pointer; border-radius: 6px; }
.ov-bl-r.go:hover .lb { color: var(--blue); }
.ov-bl-r .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.ov-bl-r .lb small { color: var(--ink-3); font-weight: 500; }
.ov-bl-r .vl { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.ov-bl-r .br { grid-column: 1 / -1; height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.ov-bl-r .br i { display: block; height: 100%; border-radius: 3px; background: var(--bc, var(--blue)); }
.ov-donut { display: flex; align-items: center; gap: 16px; }
.ov-donut svg { flex: none; }
.ov-donut .ct { font-weight: 600; fill: var(--ink); font-family: var(--font); }
.ov-donut .cs { fill: var(--ink-3); font-family: var(--font); font-size: var(--fs-xs); font-weight: 600; }
.ov-donut .ov-legend { flex-direction: column; align-items: stretch; gap: 5px; flex: 1; min-width: 0; }
.ov-donut .ov-legend > span { justify-content: flex-start; }
.ov-donut .ov-legend b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); }
.ov-donut .ov-legend > span.hl { font-weight: 600; color: var(--ink); }
.ov-stk { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); gap: 1px; }
.ov-stk i { display: block; height: 100%; min-width: 2px; }
.ov-stk.lg { height: 14px; border-radius: 4px; }
.ov-stk i.go { cursor: pointer; }
.ov-stk i.go:hover { filter: brightness(1.1); }
.ov-stk-l { margin-top: 6px; }
.ov-mix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 9px 14px 9px; }
.ov-mix .h { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; text-transform: uppercase; letter-spacing: .05em; }
.ov-mix .ov-legend { gap: 2px 9px; font-size: var(--fs-xs); }
.ov-mix .ov-stk-l { margin-top: 5px; }

/* ------------------------------------------------------------------ map */
.ov-map { position: relative; width: 100%; }
.ov-map svg { width: 100%; height: auto; max-height: 520px; }
.ov-map.mini svg { max-height: 290px; }
.ov-map path, .ov-map circle { stroke: var(--map-line); stroke-width: 1; fill: var(--map-hi); transition: fill-opacity .12s; }
.ov-map path.nd, .ov-map circle.nd { fill: var(--map-none); fill-opacity: 1 !important; }
.ov-map path.ck, .ov-map circle.ck { cursor: pointer; }
.ov-map path:hover, .ov-map circle:hover { stroke: var(--ink); stroke-width: 1.4; }
.ov-map path.sel, .ov-map circle.sel { stroke: var(--brand); stroke-width: 2; }
.ov-map-lg { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--ink-3); margin-top: 4px; }
.ov-map-lg .g { flex: 1; max-width: 120px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--map-hi) 15%, var(--card)), var(--map-hi)); }
.ov-map-lg .nd { width: 10px; height: 6px; border-radius: 2px; background: var(--map-none); }

/* ------------------------------------------------------------------ feedback */
.ov-empty { display: flex; align-items: center; gap: 10px; padding: 14px; color: var(--ink-3); font-size: var(--fs-md); justify-content: center; flex-wrap: wrap; text-align: center; }
.ov-empty.box { border: 1px dashed var(--line); border-radius: 8px; }
.ov-err { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--down) 7%, var(--card)); color: var(--down); font-size: var(--fs-md); border: 1px solid color-mix(in srgb, var(--down) 25%, var(--line)); }
.ov-sk { background: linear-gradient(90deg, var(--line-2) 0%, var(--hover) 50%, var(--line-2) 100%); background-size: 200% 100%; animation: ov-sh 1.2s infinite linear; border-radius: 6px; }
@keyframes ov-sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.ov-sk-kpi { height: 86px; border-radius: var(--r); }
.ov-sk-row { height: 14px; margin: 11px 12px; }
.ov-sk-card { height: 220px; border-radius: var(--r); }
.ov-offline { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--line)); background: color-mix(in srgb, var(--amber) 8%, var(--card)); border-radius: var(--r); margin-bottom: 12px; font-size: var(--fs-md); }
.ov-toast { position: fixed; z-index: 90; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 9px 14px; border-radius: 9px; font-weight: 600; font-size: var(--fs-md); box-shadow: var(--shadow-2); max-width: 80vw; }
.ov-toast.down { background: var(--down); color: #fff; }
.ov-tipbox { position: fixed; z-index: 100; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--card); font-size: var(--fs-sm); line-height: 1.45; padding: 7px 9px; border-radius: 7px; box-shadow: var(--shadow-2); white-space: pre-line; display: none; }
:root[data-theme="dark"] .ov-tipbox { background: #E6EAF0; color: #111821; }

/* ------------------------------------------------------------------ drawer + coach */
.ov-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(15, 20, 27, .28); display: none; }
.ov-scrim.on { display: block; }
.ov-drawer { position: fixed; z-index: 71; top: 0; right: 0; bottom: 0; width: min(560px, 96vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-2); transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.ov-drawer.on { transform: none; }
.ov-drawer-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.ov-drawer-h h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-drawer-b { flex: 1; overflow: auto; padding: 14px 16px 24px; }
.ov-coach { position: fixed; inset: 0; z-index: 95; display: none; pointer-events: none; }
.ov-coach.on { display: block; }
.ov-coach .dim { position: absolute; inset: 0; background: rgba(15, 20, 27, .52); }
.ov-coach .box { position: absolute; border: 2px solid #fff; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,0); pointer-events: none; }
.ov-coach .pin { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 600; box-shadow: 0 0 0 3px #fff, var(--shadow-2); }
.ov-coach .dim { background: rgba(15, 20, 27, .42); }
.ov-coach .leg { position: absolute; right: 22px; bottom: 22px; background: #fff; color: #1B2330; border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-2); width: 300px; pointer-events: auto; }
.ov-coach .leg .h { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #7A8494; margin-bottom: 6px; }
.ov-coach .leg ol { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ov-coach .leg li { display: flex; gap: 8px; align-items: center; font-size: var(--fs-md); font-weight: 600; }
.ov-coach .leg li b { width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: var(--fs-xs); flex: none; }
.ov-coach .leg li.off { opacity: .55; }
.ov-coach .leg .ft { display: flex; align-items: center; gap: 10px; }
.ov-coach .leg .done { flex: 1; justify-content: center; }
.ov-coach .leg .ft span { font-size: var(--fs-xs); color: #667085; white-space: nowrap; }
.ov-coach .leg kbd { font: 600 var(--fs-xs)/16px var(--font); border: 1px solid #D0D5DD; border-radius: 4px; padding: 0 5px; color: #1B2330; }

/* ------------------------------------------------------------------ page parts */
/* freshness: "as of" chips (grey fresh · amber ageing · red stale) and the one-line stale banner */
.ov-asof { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; cursor: help;
  border: 1px solid var(--line); color: var(--ink-3); background: transparent; vertical-align: middle; }
.ov-asof i { width: 6px; height: 6px; border-radius: 50%; background: var(--up); flex: none; }
.ov-asof.warn { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: color-mix(in srgb, var(--amber) 9%, transparent); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.ov-asof.warn i { background: var(--amber); }
.ov-asof.bad { border-color: color-mix(in srgb, var(--down) 40%, var(--line)); background: color-mix(in srgb, var(--down) 7%, transparent); color: var(--down-ink); }
.ov-asof.bad i { background: var(--down); }
.ov-asof.off i, .ov-asof.never i { background: var(--ink-4); }
.ov-stale { display: flex; align-items: center; gap: 8px; padding: 7px 12px; margin: 0 0 12px; border-radius: var(--r); font-size: var(--fs-md); cursor: help;
  border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--line)); background: color-mix(in srgb, var(--amber) 8%, var(--card)); color: var(--ink-2); }
.ov-stale .ov-ico { color: var(--amber); }
.ov-stale b { color: var(--ink); font-weight: 600; }
.ov-stale .rk { color: var(--ink-3); }
.ov-stale .rk::before { content: "· "; }
.ov-stale.bad { border-color: color-mix(in srgb, var(--down) 40%, var(--line)); background: color-mix(in srgb, var(--down) 6%, var(--card)); }
.ov-stale.bad .ov-ico { color: var(--down); }
.ov-stale .ov-btn { margin-left: auto; }
.ov-endot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-right: 5px; vertical-align: 0; box-sizing: border-box; }
.ov-strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 12px; font-size: var(--fs-sm); color: var(--ink-2); }
.ov-strip .it { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ov-strip .it b { color: var(--ink); font-weight: 600; }
.ov-strip .sep { width: 1px; height: 18px; background: var(--line); }
.ov-strip .sp { flex: 1; }
.ov-prog { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; width: 120px; }
.ov-prog i { display: block; height: 100%; background: var(--brand); }
.ov-mv { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.ov-mv h4 { margin: 0 0 4px; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.ov-mv h4.up { color: var(--up-ink); }
.ov-mv h4.down { color: var(--down); }
.ov-mvr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2); align-items: center; min-height: var(--row-h); border-bottom: 1px solid var(--line-2); cursor: pointer; font-size: var(--fs-md); }
.ov-mvr:last-child { border-bottom: 0; }
.ov-mvr:hover { background: var(--hover); }
.ov-mvr .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }

.ov-mvr .rk { color: var(--ink-3); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ov-act { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; min-height: var(--row-h); padding: 4px 0; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.ov-act:last-child { border-bottom: 0; }
.ov-act:hover { background: var(--hover); }
.ov-act .nm { font-weight: 600; }
.ov-act .meta { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow: hidden; }
.ov-act .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); white-space: nowrap; }
.ov-cu { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; min-height: var(--row-h); padding: 4px 0; border-bottom: 1px solid var(--line-2); font-size: var(--fs-md); }
.ov-cu:last-child { border-bottom: 0; }
.ov-cu .dt { font-weight: 600; font-size: var(--fs-sm); color: var(--ink); line-height: var(--lh-meta); font-variant-numeric: tabular-nums; }
.ov-cu .dt small { display: block; font-weight: 400; color: var(--ink-3); font-size: var(--fs-sm); }
.ov-cu .nm { font-weight: 600; }
.ov-cu .mt { display: flex; gap: 6px; align-items: center; }
.ov-cu .rt { text-align: right; font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ov-tc { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.ov-tc.nomap { grid-template-columns: minmax(0, 1fr); }
.ov-tc-side { position: sticky; top: calc(var(--top-h) + 12px); }
.ov-hero { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ov-big { font-size: var(--fs-kpi); font-weight: 600; letter-spacing: -.7px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ov-kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: var(--fs-md); align-items: center; }
.ov-kv dt { color: var(--ink-3); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; }
.ov-kv dd { margin: 0; min-width: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ov-why { display: flex; align-items: center; gap: 10px; }
.ov-why .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--blue) 10%, transparent); color: var(--blue); flex: none; }
.ov-why .ic .ov-ico { width: 18px; height: 18px; }
.ov-why b { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.2px; }
.ov-ev { display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
.ov-ev a, .ov-ev span.x { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); font-size: var(--fs-md); color: var(--ink); min-width: 0; }
.ov-ev a:last-child, .ov-ev span.x:last-child { border-bottom: 0; }
.ov-ev a .t, .ov-ev span.x .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.ov-ev small { color: var(--ink-3); white-space: nowrap; font-size: var(--fs-xs); }
.ov-dial { display: flex; align-items: stretch; gap: 3px; margin: 8px 0 6px; }
.ov-dial span { flex: 1; text-align: center; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); padding: 5px 0; border-radius: 5px; background: var(--field-2); text-transform: uppercase; letter-spacing: .04em; }
.ov-dial span.on { color: var(--on-fill); }
.ov-dial span.on.emerging { background: var(--fill-up); }
.ov-dial span.on.peaking { background: color-mix(in srgb, var(--amber) 12%, var(--card)); }
.ov-dial span.on.cooling { background: var(--fill-blue); }
.ov-dial span.on.steady { background: var(--fill-slate); }
.ov-sent { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--flat); flex: none; }
.ov-sent.pos { background: var(--up); }
.ov-sent.neg { background: var(--down); }
.ov-sent.neu { background: var(--amber); }
.ov-actcard ul { margin: 6px 0 0; padding: 0 0 0 16px; font-size: var(--fs-md); color: var(--ink-2); }
.ov-actcard li { margin: 2px 0; }
.ov-chan { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; background: var(--field-2); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); }
.ov-chan .ov-ico { width: 13px; height: 13px; }
.ov-avsteps { display: flex; flex-direction: column; gap: 0; }
.ov-avs { display: grid; grid-template-columns: 22px 86px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: var(--fs-md); cursor: help; }
.ov-avs:last-child { border-bottom: 0; }
.ov-avs .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; color: #fff; background: var(--ink-4); }
.ov-avs .st.ok { background: var(--up); }
.ov-avs .st.no { background: var(--down); }
.ov-avs .st.na { background: var(--line); color: var(--ink-2); }
.ov-avs .src { font-weight: 600; color: var(--ink-2); text-transform: capitalize; }
.ov-avs .dt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); min-width: 0; }
.ov-note1 { font-size: var(--fs-sm); color: var(--ink-3); }
.ov-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.ov-sub-h { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }

/* ------------------------------------------------------------------ responsive + print */
@media (max-width: 1280px) {
  .ov-tc { grid-template-columns: minmax(0, 1fr); }
  .ov-tc-side { position: static; }
  .ov-live .lbl { display: none; }
}
@media (max-width: 1100px) {
  .ov-grid { grid-template-columns: minmax(0, 1fr) !important; }
  .ov-split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  :root { --nav-w: 0px; }
  .ov-nav { width: 240px; transform: translateX(-100%); transition: transform .18s; box-shadow: var(--shadow-2); }
  body.nav-on .ov-nav { transform: none; }
  .ov-brand { width: auto; padding-left: 4px; }
  .ov-brand small { display: none; }
  .ov-burger { display: inline-flex; }
  .ov-main { padding: calc(var(--top-h) + 12px) 16px 40px; }
  .ov-ctl .ov-seg, .ov-ctl .ov-live, .ov-ctl .hide-m, #ov-help { display: none; }
  .ov-search kbd { display: none; }
  .ov-search { min-width: 0; }
  .ov-search input { padding-right: 10px; }
  .ov-top { gap: 6px; }
  .ov-ctl { gap: 6px; }
  .ov-sel { max-width: 112px; padding-right: 22px; }
  .ov-mv, .ov-mix { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print {
  :root { --bg: #fff; }
  .ov-top, .ov-nav, .ov-filters, .ov-tpg, .ov-tbar .ov-btn, .ov-lc, .ov-ph .acts, .ov-strip .ov-btn, .ov-toast, .ov-tipbox { display: none !important; }
  .ov-main { margin: 0; padding: 0; }
  .ov-card, .ov-kpi { box-shadow: none; break-inside: avoid; }
  .ov-t th { position: static; }
  body { font-size: var(--fs-xs); }
}

/* title overview: two independent stacks (no gaps between rows of unequal height) */
.ov-cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 12px; align-items: start; margin-bottom: 12px; }
.ov-cols > div > * + * { margin-top: 12px; }
@media (max-width: 1100px) { .ov-cols { grid-template-columns: minmax(0, 1fr); } }

/* ------------------------------------------------------------------ contrast (WCAG AA, QA UX-10)
   Type on a colour fill (type badges, platform monograms, evidence steps, armed buttons) uses the --fill-* tokens:
   30% darker than the palette with white type in the light theme (amber 2.8 → 5.2:1, teal 3.3 → 6.0:1); the dark
   theme keeps its lighter palette and puts dark type on it (≥ 5:1). Coloured TEXT on the page uses the -ink shades. */
.ov-b, .ov-pc .mono, .ov-avs .st, .ov-btn.armed, .ov-lc.armed { color: var(--on-fill); }
.ov-avs .st.ok { background: var(--fill-up); }
.ov-avs .st.no { background: var(--fill-down); }
.ov-avs .st:not(.ok):not(.no):not(.na) { background: var(--fill-slate); }

.ov-btn.armed, .ov-lc.armed { background: color-mix(in srgb, var(--amber) 12%, var(--card)); border-color: var(--fill-amber); }
.ov-kind { color: color-mix(in srgb, var(--kc) 62%, var(--ink)); }
:root[data-theme="dark"] .ov-kind { color: color-mix(in srgb, var(--kc) 70%, var(--ink)); }
.ov-d.up { color: var(--up-ink); }
.ov-d.down { color: var(--down-ink); }
.ov-lc { color: color-mix(in srgb, var(--amber) 55%, var(--ink)); }
:root[data-theme="dark"] .ov-btn.pri { background: #C42020; border-color: #C42020; }   /* white type ≥ 4.5:1 */

.ov-scan-now { gap: 6px; font-weight: 600; color: var(--accent-ink, #b4232c); border-color: currentColor; }
.ov-scan-now:disabled { opacity: .5; cursor: not-allowed; }

/* ---- thumbnails: OV.ui.thumb — one size per context (28 in rows, 72 on detail headers), no layout shift ---- */
.ov-th { --th: var(--thumb); width: var(--th); height: var(--th); flex: none; display: inline-grid; place-items: center; overflow: hidden; vertical-align: middle;
  border-radius: 6px; background: var(--field-2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 7%, transparent); }
.ov-th.lg { border-radius: 14px; }
.ov-th.circ { border-radius: 50%; }
.ov-th.logo { background: var(--card); }
.ov-th img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
.ov-th.logo img, .ov-th.circ img { object-fit: contain; padding: 8%; background: var(--card); }
/* monogram: a soft tint of the type colour, the type colour as ink (no saturated blocks) */
.ov-th.mono { --mc: var(--slate); background: color-mix(in srgb, var(--mc) 13%, var(--card)); color: color-mix(in srgb, var(--mc) 72%, var(--ink));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mc) 16%, transparent); }
.ov-th.mono b { font-size: calc(var(--th) * .38); font-weight: 600; letter-spacing: -.01em; line-height: 1; white-space: nowrap; }
/* a match: two circles overlapped, filling the 36 px thumb slot (22 + 22 − 8) */
.ov-thp { --th: var(--thumb); --tt: 22px; display: inline-flex; align-items: center; flex: none; width: calc(var(--tt) * 1.64); height: var(--th); vertical-align: middle; }
.ov-thp > .ov-th { box-shadow: 0 0 0 2px var(--card), inset 0 0 0 1px color-mix(in srgb, var(--ink) 7%, transparent); }
.ov-thp > .ov-th.mono { box-shadow: 0 0 0 2px var(--card), inset 0 0 0 1px color-mix(in srgb, var(--mc) 16%, transparent); }
.ov-thp > .ov-th + .ov-th { margin-left: calc(var(--tt) * -.36); }
.ov-thp > .ov-th.mono b { font-size: calc(var(--tt) * .34); }
.ov-pc .mono { --mc: var(--slate); background: color-mix(in srgb, var(--mc) 13%, var(--card)) !important; color: color-mix(in srgb, var(--mc) 72%, var(--ink)) !important; }
.ov-pc .mono.logo { background: var(--card) !important; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.ov-pc .mono.logo img { width: 100%; height: 100%; object-fit: contain; padding: 2px; display: block; }

/* ---- THE ROW RULE (OTTVERSE_DESIGN_SYSTEM.md §3): [thumb slot 36] [name 14/600 · meta 12/400] = two lines, 48 px rows.
   Names are complete (wrap, never "…"); when a name needs two lines core adds .n2 and the meta moves to the tooltip. */
.ov-tcell { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; }
.ov-tcell > .ov-th:not(.lg) { margin: 0 4px; }            /* a single 28 px tile is centred in the 36 px slot */
.ov-tcell > .tx { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.ov-tcell > .tx > .nm { font-size: var(--fs-base); line-height: var(--lh-name); font-weight: 600; color: var(--ink); overflow-wrap: break-word; white-space: normal; }
.ov-tcell > .tx > .nm a.ov-tl { color: inherit; text-decoration: none; }
.ov-tcell > .tx > .sb { font-size: var(--fs-sm); line-height: var(--lh-meta); font-weight: 400; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-tcell > .tx > .sb:empty { display: none; }
.ov-tcell.n2 > .tx > .sb { display: none; }
.ov-t td .ov-tcell { min-width: 190px; max-width: 320px; }
.ov-tw.wn .ov-t td .ov-tcell { max-width: 560px; }   /* a table with room: long fixture names stay on 2 lines */
.ov-tw.wn .ov-pc .pn { max-width: 140px; }            /* …and a long rights holder gives way (full name on hover) */
.ov-t td .ov-tcell, .ov-t td .ov-tcell .tx { white-space: normal; }
tr:hover .ov-tcell > .tx > .nm, .ov-mvr:hover .nm, .ov-act:hover .nm { color: var(--blue-ink); }
/* an empty trend cell: a dotted baseline, never "—" */
.ov-nospark { display: inline-block; width: var(--w, 64px); height: 0; border-top: 1px dotted var(--ink-4); vertical-align: middle; }

.ov-tw td, .ov-mini td, .ov-kpi-s, .ov-bl-r .vl, .ov-heat b, .ov-d { font-variant-numeric: tabular-nums; }
.ov-ch .ov-i { opacity: .9; }
.ov-cf { font-size: var(--fs-sm); }
.ov-mini .nm, .ov-bl-r .lb, .ov-mvr .nm, .ov-act .nm, .ov-cu .nm, .ov-t .tt .nm { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: break-word; line-height: var(--lh-name); }
.ov-card > .ov-cb:first-child { padding-top: var(--sp-4); }

/* card header: title + badges shrink before the actions do (actions never cut) */
.ov-ch { min-width: 0; }
.ov-ch > .ov-tag, .ov-ch > .ov-asof { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ov-ch .acts { flex: none; }
/* donut legend: name · value · change in fixed columns (numbers never wrap) */
.ov-donut .ov-legend > span { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto 44px; column-gap: 6px; align-items: center; }
.ov-donut .ov-legend b { margin-left: 0; white-space: nowrap; }
.ov-donut .ov-legend .ov-d { justify-self: end; white-space: nowrap; }
.ov-mvr .rk { min-width: 36px; }

/* tab labels never break onto two lines ("This week", "Deep-dive"); a tab bar too wide for its row scrolls sideways */
.ov-tab { white-space: nowrap; flex: none; }
.ov-tabs { overflow-x: auto; scrollbar-width: thin; }
.pa-ftabs { flex-wrap: nowrap; }

/* Read-only snapshot (window.OV_STATIC, tools/snapshot.py): a slim notice; the action buttons are hidden */
.ov-static-bar { position: sticky; top: 0; z-index: 60; background: color-mix(in srgb, var(--amber) 12%, var(--card)); color: var(--ink);
  border-bottom: 1px solid var(--line, #e5e7eb); font-size: var(--fs-sm); font-weight: 500; text-align: center;
  padding: 6px 16px; }
.ov-static #ov-scan-now, .ov-static .ov-freebtn { display: none !important; }
.ov-static-upd { color: var(--blue); font-weight: 600; text-decoration: underline; }

/* ---- pages_a.css ---- */
/* =====================================================================================================
   OTTVerse Trends — pages A (Trend Explorer · Regions & Languages · Title Gap · Fixtures · Calendar).
   Page-specific only; shared components (names, meta lines, pills, rows, thumbs) stay as ott.css draws them —
   design system v8 (docs/OTTVERSE_DESIGN_SYSTEM.md): sizes only via var(--fs-*), weights 400 / 500 / 600.
   Class prefix pa-.
   ===================================================================================================== */

/* ---------------------------------------------------------------- shared bits */
.pa-vsep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.pa-ftabs { border-bottom: 0; margin: 0; }
.pa-sw { display: inline-block; width: 4px; height: 28px; border-radius: 2px; flex: none; vertical-align: middle; margin-right: var(--sp-2); }
.pa-lead { display: inline-flex; align-items: center; gap: 0; font-weight: 600; }
.pa-lead .pa-sw { height: 16px; }
.pa-lk { color: var(--ink); font-weight: 500; cursor: pointer; }
.pa-lk:hover { color: var(--blue-ink); text-decoration: underline; }
.pa-ext { color: var(--ink-3); display: inline-flex; vertical-align: middle; margin-left: var(--sp-1); }
.pa-ext .ov-ico { width: 14px; height: 14px; }
.pa-ext:hover { color: var(--blue-ink); }
/* a date cell: the date (name line) + weekday · how far (meta line) — the same two-line anatomy as a name cell */
.pa-dt { display: inline-flex; flex-direction: column; vertical-align: middle; }
.pa-dt b { font-weight: 600; color: var(--ink); font-size: var(--fs-md); line-height: var(--lh-name); }
.pa-dt small { font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); font-weight: 400; }
.pa-trd { display: inline-flex; align-items: center; gap: var(--sp-2); }
.pa-langs { display: inline-flex; gap: var(--sp-1); align-items: center; }
.ov-t tr.pa-ind td.rk { box-shadow: inset 3px 0 0 var(--ink-2); }
.pa-cellbar { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 48px; }
.pa-cellbar i { display: block; height: 3px; border-radius: 2px; min-width: 1px; }
.pa-cellbar b { font-weight: 600; }
.pa-termc { display: flex; align-items: center; min-width: 0; }

/* ---------------------------------------------------------------- trend explorer */
.pa-terms { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; padding: var(--sp-3); margin-bottom: var(--sp-3); flex-direction: row; }
.pa-term { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 32px; padding: 0 4px 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); max-width: 100%; box-shadow: inset 0 -3px 0 var(--tc); }
.pa-term i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); flex: none; }
.pa-term .nm { font-weight: 600; font-size: var(--fs-base); overflow-wrap: anywhere; min-width: 0; line-height: var(--lh-name); }
.pa-term button { border: 0; background: none; color: var(--ink-3); width: 24px; height: 24px; border-radius: 6px; font-size: var(--fs-xs); flex: none; }
.pa-term button:hover { background: var(--hover); color: var(--down); }
.pa-addterm { height: 32px; border: 1px dashed var(--line); border-radius: 8px; background: var(--field); padding: 0 12px; width: 168px; outline: none; font-weight: 500; font-size: var(--fs-md); }
.pa-addterm:focus { border-style: solid; border-color: var(--blue); }
.pa-picks { display: inline-flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap; margin-left: auto; }
.pa-ins { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
/* an insight from the pull: the system pill (22 · 0 8 · r 11 · md / 500), tinted with the term's colour */
.pa-insc { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; color: var(--ink-2);
  background: color-mix(in srgb, var(--tc) 11%, transparent); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pa-insc .ov-ico { width: 12px; height: 12px; color: var(--tc); flex: none; }
.pa-exw { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-3); align-items: stretch; }
.pa-avg { display: flex; gap: 6px; align-items: flex-end; padding: 20px 12px 24px 0; border-right: 1px solid var(--line-2); position: relative; min-width: 64px; }
.pa-avg .c { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--sp-1); height: 100%; width: 16px; }
.pa-avg .b { display: block; width: 12px; border-radius: 3px 3px 0 0; }
.pa-avg b { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pa-avg small { position: absolute; bottom: 2px; left: 0; right: 12px; text-align: center; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.pa-pull { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); flex-wrap: wrap; height: 290px; border: 1px dashed var(--line); border-radius: 8px; color: var(--ink-3); font-size: var(--fs-md); }
.pa-pull > .ov-ico { width: 16px; height: 16px; }
.pa-pull b { color: var(--ink-2); font-weight: 600; }
.ov-lc[disabled] { opacity: .5; cursor: not-allowed; }
.pa-relg { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
.pa-relc .ov-ch h3 { overflow-wrap: anywhere; min-width: 0; }
.pa-relc .ov-ch .pa-sw { height: 16px; }
.pa-relc .ov-mini td + td { padding-left: var(--sp-2); }

/* ---------------------------------------------------------------- regions & languages */
.pa-lanegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3) var(--sp-4); }
.pa-lane { border-top: 3px solid var(--lc); padding-top: var(--sp-2); min-width: 0; }
.pa-lane .h { display: flex; align-items: center; gap: var(--sp-2); height: 28px; font-size: var(--fs-sm); color: var(--ink-3); }
.pa-lane .h i { display: none; }
.pa-lane .h b { font-weight: 600; font-size: var(--fs-lg); color: var(--ink); cursor: pointer; }
.pa-lane .h b:hover { color: var(--blue-ink); }
.pa-lane .h .r { margin-left: auto; }
.pa-lane .h .ov-note1 { display: inline-flex; align-items: center; gap: var(--sp-1); }
.pa-lane .h .ov-note1 .ov-ico, .pa-lane .it .r .ov-ico { width: 12px; height: 12px; }
/* a lane row = the row rule: thumb · name · one meta line | value, 48 px */
.pa-lane .it { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: var(--sp-2); align-items: center; min-height: var(--row-h); padding: 6px 0; border-bottom: 1px solid var(--line-2); cursor: pointer; font-size: var(--fs-md); }
.pa-lane .it:last-child { border-bottom: 0; }
.pa-lane .it:hover { background: var(--hover); }
.pa-lane .it:hover .ov-tcell .nm { color: var(--blue-ink); }
.pa-lane .it .r { display: inline-flex; align-items: center; justify-content: flex-end; gap: var(--sp-1); font-variant-numeric: tabular-nums; }
.pa-lane .it.none { cursor: default; grid-template-columns: 1fr; color: var(--ink-3); }

/* ---------------------------------------------------------------- fixtures: day strip (layout kept) */
.pa-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--sp-2); }
.pa-day { min-width: 0; display: flex; flex-direction: column; gap: 6px; border-radius: 8px; padding: 6px; background: var(--field-2); min-height: 96px; }
.pa-day.empty { background: color-mix(in srgb, var(--field-2) 45%, transparent); }
.pa-day.today { box-shadow: inset 0 2px 0 var(--blue); }
.pa-day .dh { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); padding: 0 2px 2px; }
.pa-day .dh b { color: var(--ink-2); font-weight: 600; }
.pa-fx { --fc: var(--flat); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line)); border-left: 3px solid var(--fc);
  background: var(--card); border-radius: 6px; padding: 6px; min-width: 0; font: inherit; color: inherit; cursor: pointer; }
.pa-fx:hover { border-color: var(--fc); background: color-mix(in srgb, var(--fc) 6%, var(--card)); }
.pa-fx.b-in_bundle { --fc: var(--up); }
.pa-fx.b-via_pack { --fc: var(--blue); }
.pa-fx.hot { box-shadow: 0 0 0 1px color-mix(in srgb, var(--down) 25%, transparent); }
.pa-fx .hd { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 2px; }
.pa-fx .t { font-size: var(--fs-md); line-height: var(--lh-meta); font-weight: 600; color: var(--ink); max-width: 100%; overflow-wrap: anywhere; }
.pa-fx .s { font-size: var(--fs-sm); line-height: var(--lh-meta); font-weight: 400; color: var(--ink-3); max-width: 100%; overflow-wrap: anywhere; }
.pa-fx .in, .pa-hotr .in { font-style: normal; font-size: var(--fs-xs); font-weight: 600; color: var(--card); background: var(--ink-2); border-radius: 3px; padding: 0 4px; line-height: 16px; flex: none; }
/* "on Search Trends now": plain coloured text with the bolt, never a second pill */
.pa-fx .tr, .pa-soon .tr { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); font-size: var(--fs-sm); line-height: var(--lh-meta); font-weight: 500; color: var(--down-ink); font-variant-numeric: tabular-nums; max-width: 100%; }
.pa-fx .tr .ov-ico, .pa-soon .tr .ov-ico { width: 12px; height: 12px; }
.pa-fx .tr.off, .pa-soon .tr.off { color: var(--ink-3); }
.pa-fxg { --fc: var(--flat); border: 1px dashed color-mix(in srgb, var(--fc) 45%, var(--line)); border-left: 3px solid var(--fc); border-radius: 6px; background: var(--card); padding: 6px; }
.pa-fxg.b-in_bundle { --fc: var(--up); } .pa-fxg.b-via_pack { --fc: var(--blue); }
.pa-fxg summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.pa-fxg summary::-webkit-details-marker { display: none; }
.pa-fxg summary .t { font-size: var(--fs-md); line-height: var(--lh-meta); font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.pa-fxg summary .s { font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); }
.pa-fxg[open] { display: flex; flex-direction: column; gap: var(--sp-1); }

/* fixtures: side lists follow the row rule (48 px · thumb · name · one meta line) */
.pa-hot { display: flex; flex-direction: column; }
.pa-hotr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: var(--sp-3); align-items: center; width: 100%; min-height: var(--row-h); padding: 6px 0; border-top: 1px solid var(--line-2); cursor: pointer; font-size: var(--fs-md); color: var(--ink-2); }
.pa-hotr:first-child { border-top: 0; }
.pa-hotr:hover { background: var(--hover); }
.pa-hotr:hover .ov-tcell .nm { color: var(--blue-ink); }
.pa-hotr .ov-heat { width: auto; }
.pa-hotr .ov-heat i { display: none; }   /* narrow side card: the heat number (the bar lives in the tables) */
.pa-hotr .vl { display: inline-flex; align-items: baseline; gap: var(--sp-1); font-weight: 600; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pa-hotr .vl small { color: var(--ink-3); font-size: var(--fs-sm); font-weight: 400; }
.pa-hotr .pl { display: inline-flex; gap: var(--sp-2); align-items: center; justify-content: flex-end; }
.pa-soon td { height: var(--row-h); vertical-align: middle; }
.pa-soon td.d { color: var(--ink-3); font-size: var(--fs-sm); white-space: nowrap; width: 44px; }
.pa-soon { table-layout: fixed; }   /* a long competition on the meta line ellipsizes instead of pushing the pills out */
.pa-soon td.r { padding-left: var(--sp-2); white-space: nowrap; width: 56px; }
.pa-soon td.r:last-child { width: 88px; }
.pa-soon .tr { flex-wrap: nowrap; }
.pa-soon tr:hover td { background: var(--hover); }
.pa-soon tr:hover .ov-tcell .nm { color: var(--blue-ink); }

/* ---------------------------------------------------------------- calendar: week columns */
.pa-wks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(40px, 1fr); gap: var(--sp-1); align-items: end; overflow-x: auto; padding-bottom: 2px; }
.pa-wk { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-1); border: 0; background: none; padding: 4px 2px; border-radius: 8px; min-width: 0; }
.pa-wk:hover { background: var(--hover); }
.pa-wk.on { background: var(--sel); }
.pa-wk.dim { opacity: .45; }
.pa-wk .n { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
.pa-wk .bar { height: 160px; display: flex; flex-direction: column-reverse; gap: 1px; border-radius: 4px; overflow: hidden; background: var(--line-2); }
.pa-wk .bar i { display: block; width: 100%; min-height: 2px; }
.pa-wk .l { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ov-t tr.pa-wkb1 td { background: color-mix(in srgb, var(--field-2) 55%, transparent); }
.ov-t tr.pa-wkb1:hover td { background: var(--hover); }

.pa-mapcard .ov-map svg { max-height: 430px; }

@media (max-width: 1100px) {
  .pa-lanegrid { grid-template-columns: minmax(0, 1fr); }
  .pa-picks { margin-left: 0; }
  .pa-exw { grid-template-columns: minmax(0, 1fr); }
  .pa-avg { display: none; }
}
@media print {
  .pa-terms button, .pa-addterm, .pa-picks { display: none !important; }
}
.pa-q { font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }   /* a related search query (a query, not a named thing) */

/* ---- pages_b.css ---- */
/* =====================================================================================================
   OTTVerse — pages B styles (Share of Search · Platform · Opportunities · Alerts · Reports · Watchlists · Method).
   Design system v8 (docs/OTTVERSE_DESIGN_SYSTEM.md): sizes only via var(--fs-*), weights 400 / 500 / 600; names,
   meta lines, rows, pills and thumbs come from ott.css (the row rule). Prefix pb-.
   ===================================================================================================== */

/* legal-gated pages are registered but never listed in the nav */
.ov-ni[data-nav="keyword"], .ov-ni[data-nav="serp"], .ov-ni[data-nav="ai"] { display: none; }

/* small shared bits */
.pb-tags { display: inline-flex; gap: var(--sp-1); align-items: center; flex-wrap: wrap; }
.pb-sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pb-num { display: inline-flex; gap: var(--sp-2); align-items: center; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.pb-num b { font-weight: 600; }
.pb-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line); vertical-align: middle; }
.pb-dot.on { background: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 16%, transparent); }
.pb-lock { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.pb-def { white-space: normal; display: block; max-width: 520px; color: var(--ink-2); line-height: var(--lh-name); padding: var(--sp-1) 0; }
.ov-tabs.pb-ftabs { border-bottom: 0; margin: 0; }
.ov-t tr.pb-hl td { background: color-mix(in srgb, var(--xs) 6%, transparent); }
.ov-t tr.pb-hl td.rk { box-shadow: inset 3px 0 0 var(--xs); }
/* a date cell: date (line 1) + how far (meta line) */
.pb-dt { display: inline-flex; flex-direction: column; vertical-align: middle; }
.pb-dt b { font-weight: 600; color: var(--ink); font-size: var(--fs-md); line-height: var(--lh-name); }
.pb-dt small { font-size: var(--fs-sm); line-height: var(--lh-meta); color: var(--ink-3); font-weight: 400; }

/* share change: diverging bars around zero */
.pb-div { display: flex; flex-direction: column; gap: var(--sp-1); }
.pb-div-r { display: grid; grid-template-columns: minmax(84px, 1fr) minmax(0, 1.4fr) 64px; gap: var(--sp-2); align-items: center; height: 28px; font-size: var(--fs-md); border-radius: 6px; }
.pb-div-r.go { cursor: pointer; }
.pb-div-r.go:hover .lb { color: var(--blue-ink); }
.pb-div-r .lb { display: flex; align-items: center; gap: var(--sp-2); font-weight: 600; color: var(--ink); white-space: nowrap; min-width: 0; }
.pb-div-r .tr { position: relative; height: 8px; background: var(--line-2); border-radius: 3px; }
.pb-div-r .tr::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-4); }
.pb-div-r .tr i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.pb-div-r .tr i.p { background: var(--up); }
.pb-div-r .tr i.n { background: var(--down); }
.pb-div-r .vl { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.pb-div-r .vl.up { color: var(--up-ink); }
.pb-div-r .vl.down { color: var(--down-ink); }

/* opportunities: pipeline, status pill + select, verdict squares, factor dots */
.pb-pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.pb-ps { border: 0; background: none; text-align: left; padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1); position: relative; border-right: 1px solid var(--line-2); color: var(--ink); }
.pb-ps:last-child { border-right: 0; }
.pb-ps.end { border-left: 2px solid var(--line); }
.pb-ps:hover { background: var(--hover); }
.pb-ps.on { background: color-mix(in srgb, var(--sc) 9%, transparent); }
.pb-ps.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--sc); }
.pb-ps .l { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.pb-ps .l i { width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
.pb-ps b { font-size: var(--fs-xl); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.pb-ps .ov-meter { width: 100%; }
.pb-ps .ov-meter::after { background: var(--sc); }
/* the system pill: 22 · 0 8 · r 11 · md / 500 · soft tint + 6 px dot */
.pb-st { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; font-size: var(--fs-md); font-weight: 500; line-height: 1; white-space: nowrap; color: var(--ink-2); background: color-mix(in srgb, var(--sc) 12%, transparent); }
.pb-st i { width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
/* the inline status select drawn as the same pill (22 px), a caret instead of the dot */
.pb-ssel { height: var(--pill-h); min-width: 112px; border: 0; border-radius: 11px; font: inherit; font-size: var(--fs-md); font-weight: 500; line-height: 1; padding: 0 22px 0 8px; color: var(--ink-2); cursor: pointer;
  appearance: none; -webkit-appearance: none; background-color: color-mix(in srgb, var(--sc) 12%, transparent);
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 12px) 9px, calc(100% - 8px) 9px; background-size: 4px 4px; background-repeat: no-repeat; }
.pb-ssel:hover { box-shadow: inset 0 0 0 1px var(--sc); }
.pb-ssel:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.pb-ssel:disabled { opacity: .5; }
.pb-vh { display: inline-flex; gap: 2px; align-items: center; }
.pb-vh i { width: 8px; height: 12px; border-radius: 2px; }
.pb-fac { display: inline-flex; gap: var(--sp-1); align-items: center; cursor: help; }
.pb-fac i { width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.pb-fac i.on { background: var(--violet); box-shadow: none; }
.pb-fac b { margin-left: var(--sp-1); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pb-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-2); }
.pb-step { height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 0 10px; font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.pb-step i { width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
.pb-step:hover { background: var(--hover); color: var(--ink); }
.pb-step.on { border-color: var(--sc); background: color-mix(in srgb, var(--sc) 12%, transparent); color: var(--ink); cursor: default; }
.pb-note { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); padding: var(--sp-2) var(--sp-3); font: inherit; font-size: var(--fs-md); outline: none; }
.pb-note:focus { border-color: var(--blue); }
.pb-factbl tr.miss td { color: var(--ink-3); }
.pb-log { display: flex; flex-direction: column; }
.pb-log > div { display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2) 0; border-bottom: 1px solid var(--line-2); font-size: var(--fs-md); }
.pb-log > div:last-child { border-bottom: 0; }
.pb-log small { color: var(--ink-3); font-size: var(--fs-sm); }

/* alerts */
.pb-sig { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.pb-sig b { color: var(--ink); font-weight: 600; }
.pb-sigw { display: inline-flex; align-items: center; gap: var(--sp-2); }
.pb-on { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: var(--fs-sm); font-weight: 600; background: var(--field-2); color: var(--ink-3); }
.pb-on.yes, .pb-on.partner { background: color-mix(in srgb, var(--up) 13%, transparent); color: var(--up-ink); }
.pb-on.no { background: color-mix(in srgb, var(--down) 11%, transparent); color: var(--down-ink); }

/* reports: side lists follow the row rule (48 px · thumb · name · one meta line | pills | number) */
.ov-act.pb-act { grid-template-columns: minmax(0, 1fr) auto auto auto; gap: var(--sp-2); padding: 6px 0; }
.ov-act.pb-act:hover .ov-tcell .nm, .ov-cu.pb-cu[data-go]:hover .ov-tcell .nm { color: var(--blue-ink); }
.ov-act.pb-act .ov-heat { width: auto; }
.pb-act .pl, .pb-cu .pl { display: inline-flex; gap: var(--sp-2); align-items: center; justify-content: flex-end; }
.ov-cu.pb-cu { grid-template-columns: 56px minmax(0, 1fr) auto; }
.pb-cu .pl, .pb-act .pl { flex-wrap: nowrap; white-space: nowrap; }
.ov-cu.pb-cu[data-go] { cursor: pointer; }
.ov-cu.pb-cu[data-go]:hover { background: var(--hover); }

/* watchlists */
.ov-fsearch.pb-in { padding-left: 10px; width: 168px; background-image: none; }
.ov-fsearch.pb-in.wide { width: min(420px, 100%); flex: 0 1 420px; }
.pb-addbar { margin-top: calc(var(--sp-1) * -1); }
.pb-addbar > .ov-ico { color: var(--amber); }
.ov-mini td.pb-rk { width: 28px; padding-right: var(--sp-3); font-weight: 500; color: var(--ink-3); }
.ov-mini td .ov-tcell { min-height: var(--row-h); }

/* data & method */
.pb-matrix { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.pb-matrix th { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); text-align: left; padding: 6px 4px; white-space: nowrap; cursor: help; text-transform: uppercase; letter-spacing: .04em; }
.pb-matrix tr:first-child th { text-align: center; border-bottom: 1px solid var(--line); }
.pb-matrix td { padding: 4px; height: 36px; border-bottom: 1px solid var(--line-2); text-align: center; }
.pb-matrix tr:last-child td { border-bottom: 0; }
.pb-chain { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); }
.pb-chain span { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px 0 3px; border-radius: 11px; background: var(--field-2); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); cursor: help; white-space: nowrap; }
.pb-chain span b { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); color: var(--card); font-size: var(--fs-xs); font-weight: 600; display: inline-grid; place-items: center; }
.pb-chain > i { color: var(--ink-4); font-style: normal; font-weight: 500; }
.pb-lights { display: flex; flex-wrap: wrap; gap: 6px; }
.pb-light { display: inline-flex; align-items: center; gap: 6px; height: var(--pill-h); padding: 0 8px; border-radius: 11px; background: var(--field-2); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); cursor: help; }
.pb-light b { font-weight: 500; }
.pb-crh { display: inline-flex; align-items: center; gap: 6px; }
.pb-crh .ov-ico { width: 16px; height: 16px; color: var(--ink-3); }
.pb-crh b { font-weight: 600; color: var(--ink); }
.pb-crimg { width: 28px; height: 28px; display: block; object-fit: cover; object-position: 50% 22%; border-radius: 6px; background: var(--field-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.pb-crau { display: block; max-width: 340px; overflow-wrap: anywhere; }

@media (max-width: 1100px) {
  .pb-pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pb-ps { border-bottom: 1px solid var(--line-2); }
  .pb-ps.end { border-left: 0; }
}
@media (max-width: 640px) {
  .pb-pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ov-fsearch.pb-in { width: 128px; }
}
.ov-act.pb-act .ov-heat i { display: none; }   /* narrow side card: the heat number only (the bar lives in the tables) */
.ov-mvr.pb-nx { grid-template-columns: minmax(0, 1fr); }
.ov-t .pb-tags { flex-wrap: nowrap; }                       /* status pills stay on one line: rows stay 48 px */
.ov-donut .ov-legend .ov-d { white-space: nowrap; }         /* "▲ 3.2 pp" never breaks inside the share legend */

/* ---- pages_cohorts.css ---- */
/* Cohorts (#/cohorts, pages_cohorts.js) + the drawer's History panel — tokens only, light default, dark via tokens.
   Name cells are the shared row rule (.ov-tcell from ott.css): no name / meta / thumb / pill sizes here. */
.ch-card .ov-cb { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
.ch-wrap { overflow-x: auto; }
.ch-grid { border-collapse: separate; border-spacing: 2px; width: 100%; table-layout: fixed; font-size: var(--fs-sm); }
.ch-grid th, .ch-grid td { padding: 0; }
.ch-grid th.wk { width: 64px; text-align: left; font-weight: 500; color: var(--ink-2); white-space: nowrap; padding-right: 4px; font-variant-numeric: tabular-nums; }
.ch-grid th.n, .ch-grid td.n { width: 24px; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-right: 4px; }
.ch-grid th.d { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; text-align: left; height: 16px; white-space: nowrap; overflow: visible; }
.ch-grid td.c { height: 20px; border-radius: 3px; background: color-mix(in srgb, var(--blue) var(--p), var(--line-2)); }
.ch-grid td.c.pk { box-shadow: inset 0 0 0 1.5px var(--ink); }
.ch-grid td.c.na { background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 6px); }
.ch-grid tr[data-set] { cursor: pointer; }
.ch-grid tr[data-set]:hover th.wk, .ch-grid tr[data-set]:focus-visible th.wk { color: var(--blue-ink); }
.ch-grid tr.on th.wk { color: var(--blue-ink); font-weight: 600; }
.ch-grid tr.on td.c { outline: 1.5px solid var(--blue); outline-offset: -1px; }
.ch-grid .pt, .ch-scale .pt { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-left: 4px; vertical-align: middle; }
.ch-scale { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-3); flex-wrap: wrap; }
.ch-scale > i { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--line-2), var(--blue)); }
.ch-scale .sp { flex: 1; }
.ch-scale span i.na { display: inline-block; width: 12px; height: 8px; margin-right: 4px; vertical-align: middle; background: repeating-linear-gradient(135deg, var(--line), transparent 2px 4px); }
.ch-wl { margin-top: var(--sp-4); }

/* fan-base bar lists: each label is a name cell (thumb · name · one meta line) */
.ch-fan .ov-bl-r .lb { white-space: normal; overflow: visible; }
.ch-fan .ov-bl { gap: var(--sp-2); }
.ch-pc b { font-weight: 600; font-variant-numeric: tabular-nums; }
.ch-pc small, .ch-of { color: var(--ink-3); font-size: var(--fs-sm); margin-left: 1px; }
.z { color: var(--ink-4); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }

.ch-valid .ov-cb { display: flex; flex-direction: column; gap: var(--sp-2); }
.ch-vr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 44px; align-items: baseline; gap: var(--sp-2); font-size: var(--fs-sm); }
.ch-vr b { font-size: var(--fs-xl); font-weight: 600; font-variant-numeric: tabular-nums; }
.ch-vr small { color: var(--ink-3); font-size: var(--fs-sm); }
.ch-vr .n { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.ch-vf { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: var(--fs-sm); color: var(--ink-2); border-top: 1px solid var(--line-2); padding-top: var(--sp-2); font-variant-numeric: tabular-nums; }
.ch-lt td, .ch-lt th { padding: 4px; }
.ch-lt tr.go { cursor: pointer; }
.ch-lt tr.go:hover td { background: var(--hover); }
.ch-lt .r { text-align: right; font-variant-numeric: tabular-nums; }

.ch-sec { margin-top: var(--sp-4); }
.ch-sub2 { margin-left: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-3); font-weight: 500; text-transform: none; letter-spacing: 0; }
.ch-gap { height: var(--sp-4); }
/* a new film's pull vs the star's median week: plain coloured text (deltas are text, not pills) */
.ch-pull { font-weight: 500; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ch-pull.up { color: var(--up-ink); }
.ch-pull.dn { color: var(--down-ink); }
.ch-sk { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-sm); color: var(--ink-2); margin-bottom: var(--sp-2); }
.ch-sk b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* the History panel (reading / platform drawers) */
.hx { margin-bottom: var(--sp-2); }
.hx-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-2); }
.hx-t { display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2); border: 1px solid var(--line-2); border-radius: 8px; min-width: 0; }
.hx-t > span { font-size: var(--fs-sm); color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.hx-t b { font-size: var(--fs-lg); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hx-t em { font-style: normal; font-size: var(--fs-sm); color: var(--ink-3); overflow-wrap: anywhere; }
.hx-svg { display: block; max-width: 100%; }
.hx-svg .gl { stroke: var(--line-2); stroke-width: 1; }
.hx-svg .ax { fill: var(--ink-3); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.hx-tb { margin-top: var(--sp-2); width: 100%; font-size: var(--fs-md); }
.hx-tb td, .hx-tb th { padding: 4px 8px; }
.hx-tb .r { text-align: right; font-variant-numeric: tabular-nums; }
.hx-seed { color: var(--ink-3); font-size: var(--fs-sm); }
.hx-f { display: flex; justify-content: flex-end; margin-top: 4px; }
@media (max-width: 700px) { .hx-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---- pages_core.css ---- */
/* OTTVerse core pages (pages_core.js): Overview · Search Trends (Now · This week · Tracked universe) · Title 360.
   Rows use the shared row rule (ui.nameCell, ott.css "THE ROW RULE"); nothing here resizes a name, a meta line, a
   pill or a thumbnail. Tokens only (docs/OTTVERSE_DESIGN_SYSTEM.md). */

.ov-ft.sh { font-variant-numeric: tabular-nums; }
.ov-t tr.sub .ov-tcell .ov-th, .ov-t tr.sub .ov-tcell .ov-thp { opacity: .55; }

/* Overview: movers · opportunities · coming up — the row rule inside cards */
.ov-mv h4 { letter-spacing: .04em; margin: 0 0 var(--sp-1); }
.cg-act .rt .cg-ch { display: inline-flex; gap: 6px; color: var(--ink-3); }
.cg-act .rt .cg-ch .ov-ico { width: 14px; height: 14px; }

/* Title 360 header: a 72 px picture beside the name */
.cg-ph360 { align-items: center; }
.cg-ph360 > .ov-th, .cg-ph360 > .ov-thp { box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 10%, transparent); }
